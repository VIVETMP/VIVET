<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Block - Ultimate Apple Glass UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ========================
           VARIABLES & ANIMACIONES BASE
           ======================== */
        :root {
            --apple-accent: #fa243c;
            --apple-text-main: #ffffff;
            --apple-text-muted: #8e8e93;
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Variables Glassmorphism */
            --glass-bg: rgba(30, 30, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--apple-font); }
        
        /* Fondo Animado Estilo Apple Music */
        body { 
            background-color: #000; 
            color: var(--apple-text-main); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            position: relative;
        }

        /* Esferas de luz de fondo para dar efecto al Glassmorphism */
        body::before, body::after {
            content: ''; position: absolute; width: 60vw; height: 60vw; border-radius: 50%;
            filter: blur(120px); z-index: -1; animation: floatLights 20s infinite alternate ease-in-out;
        }
        body::before { top: -10%; left: -10%; background: radial-gradient(circle, rgba(250, 36, 60, 0.15), transparent 60%); }
        body::after { bottom: -20%; right: -10%; background: radial-gradient(circle, rgba(100, 36, 250, 0.15), transparent 60%); animation-delay: -5s; }
        
        @keyframes floatLights {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.2); }
        }

        /* Contenedor principal ajustado para el reproductor flotante */
        .layout { display: flex; flex: 1; overflow: hidden; height: 100vh; padding-bottom: 120px; }

        /* ========================
           UI DE INICIO - GLASSMORPHISM
           ======================== */
        /* Sidebar Flotante de Cristal */
        .sidebar { 
            width: 260px; margin: 20px; margin-right: 0; border-radius: 24px;
            background: var(--glass-bg); backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight); border-left: 1px solid var(--glass-highlight);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 30px 20px; display: flex; flex-direction: column; gap: 30px; z-index: 10;
        }
        .search-bar { background: rgba(0,0,0,0.3); border: 1px inset rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; color: var(--apple-text-muted); font-size: 14px; box-shadow: inner 0 2px 5px rgba(0,0,0,0.5); }
        .menu-section { display: flex; flex-direction: column; gap: 10px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; color: var(--apple-text-main); font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.3s; }
        .menu-item:hover { background: rgba(255,255,255,0.1); color: var(--apple-accent); }
        .menu-item i { font-size: 18px; width: 20px; text-align: center; color: var(--apple-accent); }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; position: relative; padding: 20px; }
        .main-content::-webkit-scrollbar { display: none; }

        .artist-header { position: relative; height: 350px; display: flex; align-items: flex-end; padding: 40px; border-radius: 24px; overflow: hidden; margin-bottom: 30px; border: 1px solid var(--glass-border); }
        .artist-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.7; -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%); filter: blur(5px); transform: scale(1.05); }
        .artist-details { position: relative; z-index: 1; display: flex; align-items: center; gap: 30px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 20px; backdrop-filter: blur(20px); border: 1px solid var(--glass-border); }
        .artist-avatar { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.1);}
        .artist-text h1 { font-size: 55px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 10px; }
        
        .btn-play-all { background: var(--apple-accent); color: #fff; border: none; padding: 12px 30px; border-radius: 20px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(250, 36, 60, 0.3); }
        .btn-play-all:hover { transform: scale(1.05); filter: brightness(1.2); box-shadow: 0 10px 30px rgba(250, 36, 60, 0.5); }

        /* Lista de Canciones UI Cristalina */
        .songs-container { padding: 0 20px; }
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; padding-bottom: 10px; }
        .song-list { list-style: none; display: flex; flex-direction: column; }
        
        .song-item { 
            display: flex; align-items: center; padding: 10px 15px; border-radius: 16px; cursor: pointer; 
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.03); margin-bottom: 10px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); backdrop-filter: blur(10px);
        }
        .song-item:hover { 
            background: rgba(255, 255, 255, 0.06); border-color: rgba(255, 255, 255, 0.1); 
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }
        .song-item.active { 
            background: rgba(250, 36, 60, 0.15); border-color: rgba(250, 36, 60, 0.3); border-top: 1px solid rgba(250, 36, 60, 0.5);
            box-shadow: 0 10px 30px rgba(250, 36, 60, 0.1); 
        }
        
        .song-item.active .song-title-col h4 { color: var(--apple-accent); }
        .song-index { width: 35px; text-align: center; color: var(--apple-text-muted); font-size: 15px; font-weight: 600;}
        .song-item.active .song-index { color: var(--apple-accent); }
        .song-thumb { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; margin: 0 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .song-title-col { flex: 2; }
        .song-title-col h4 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .song-title-col p { font-size: 13px; color: var(--apple-text-muted); }
        .song-time { color: var(--apple-text-muted); font-size: 14px; margin-right: 15px; font-weight: 500;}

        /* ========================
           UI DE LETRAS (SIN TOCAR DISEÑO, SOLO MEJORA PROGRESIVA)
           ======================== */
        .lyrics-fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 120px); z-index: 50; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s; transform: translateY(100%); opacity: 0; visibility: hidden; background-color: #000; overflow: hidden; display: flex; border-radius: 0 0 40px 40px; }
        .lyrics-fullscreen.active { transform: translateY(0); opacity: 1; visibility: visible; }
        .lyrics-bg { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; object-fit: cover; z-index: 0; filter: blur(90px) saturate(200%); opacity: 0.6; transition: src 1s ease; }
        .lyrics-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 1; }
        .lyrics-container { position: relative; z-index: 2; width: 100%; height: 100%; display: flex; padding: 60px; gap: 80px; align-items: center;}
        .lyrics-left { flex: 1; display: flex; justify-content: flex-end; align-items: center; }
        .lyrics-cover { width: 450px; height: 450px; border-radius: 20px; object-fit: cover; box-shadow: 0 30px 60px rgba(0,0,0,0.6); transition: transform 0.5s; }
        .lyrics-fullscreen.active .lyrics-cover { animation: coverPop 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes coverPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .lyrics-right { flex: 1.2; height: 100%; overflow-y: auto; scroll-behavior: smooth; padding-right: 50px; mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); padding-top: 30vh; padding-bottom: 30vh; }
        .lyrics-right::-webkit-scrollbar { display: none; }
        .btn-close-lyrics { position: absolute; top: 40px; right: 50px; background: rgba(255,255,255,0.2); border: none; color: white; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; backdrop-filter: blur(10px); transition: 0.2s; }
        .btn-close-lyrics:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }

        /* MAGIA: Letras Progresivas (Karaoke Smooth Fill) */
        .lyric-line {
            font-size: 42px; font-weight: 800; margin-bottom: 25px; cursor: pointer;
            transform-origin: left center; line-height: 1.3; filter: blur(2px);
            transition: transform 0.4s ease-out, filter 0.4s ease-out;
            
            /* CSS Variables para el llenado progresivo */
            --fill-pct: 0%;
            background: linear-gradient(to right, #ffffff var(--fill-pct), rgba(255, 255, 255, 0.25) var(--fill-pct));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .lyric-line.active { 
            transform: scale(1.05); filter: blur(0px); 
            text-shadow: 0 0 30px rgba(255,255,255,0.1); 
        }
        .lyric-line.passed {
            background: linear-gradient(to right, #ffffff 100%, #ffffff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0.6; /* Atenuar sutilmente las letras que ya pasaron */
        }
        .lyric-line:hover { opacity: 1; transform: scale(1.02); }

        /* ========================
           REPRODUCTOR FLOTANTE (ISLA) - GLASSMORPHISM
           ======================== */
        .player { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 60px); max-width: 1400px; height: 90px; border-radius: 28px;
            background: rgba(20, 20, 20, 0.65); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); 
            border: 1px solid var(--glass-border); border-top: 1px solid rgba(255,255,255,0.2); border-left: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 100; 
        }
        
        .progress-bar { position: absolute; top: -1px; left: 40px; width: calc(100% - 80px); height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; overflow: visible;}
        .progress { width: 0%; height: 100%; background: var(--apple-accent); border-radius: 2px; position: relative; box-shadow: 0 0 10px rgba(250, 36, 60, 0.5);}
        .progress::after { content: ''; position: absolute; right: -5px; top: -4px; width: 12px; height: 12px; background: #fff; border-radius: 50%; opacity: 0; transition: opacity 0.2s; box-shadow: 0 0 8px rgba(0,0,0,0.8); }
        .progress-bar:hover .progress::after { opacity: 1; }

        .now-playing { display: flex; align-items: center; gap: 15px; width: 30%; }
        .now-playing img { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.5); cursor: pointer; transition: 0.3s;}
        .now-playing img:hover { filter: brightness(1.2); transform: scale(1.05);}
        .track-info h4 { font-size: 16px; margin-bottom: 2px; font-weight: 600; color: #fff;}
        .track-info p { font-size: 13px; color: var(--apple-text-muted); }

        .player-controls { display: flex; flex-direction: column; align-items: center; width: 40%; gap: 6px; }
        .buttons { display: flex; align-items: center; gap: 35px; color: var(--apple-text-main); font-size: 18px;}
        .buttons i { cursor: pointer; transition: 0.2s; color: var(--apple-text-muted); }
        .buttons i:hover { color: #fff; transform: scale(1.1);}
        
        /* Botón Play Hermoso de Cristal */
        .play-pause { 
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); border-top: 1px solid rgba(255,255,255,0.4);
            color: #fff; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
        }
        .play-pause:hover { 
            background: rgba(255,255,255,0.2); transform: scale(1.08); 
            box-shadow: 0 10px 30px rgba(250, 36, 60, 0.4); /* Brillo rojo */
            border-color: rgba(255,255,255,0.5); color: var(--apple-accent);
        }

        .time-display { display: flex; justify-content: space-between; width: 90%; font-size: 11px; color: var(--apple-text-muted); font-weight: 600; letter-spacing: 0.5px;}

        .player-actions { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 20px; color: var(--apple-text-muted); font-size: 16px;}
        .btn-lyrics-toggle { font-size: 18px; cursor: pointer; transition: 0.3s; padding: 8px; border-radius: 10px; border: 1px solid transparent;}
        .btn-lyrics-toggle:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .btn-lyrics-toggle.active { color: var(--apple-accent); background: rgba(250, 36, 60, 0.15); border: 1px solid rgba(250, 36, 60, 0.3); box-shadow: inset 0 0 10px rgba(250, 36, 60, 0.2);}
    </style>
</head>
<body>

    <div class="layout">
        <!-- Sidebar Flotante -->
        <nav class="sidebar">
            <div class="search-bar"><i class="fas fa-search"></i><span>Search</span></div>
            <div class="menu-section">
                <div class="menu-item"><i class="fas fa-play-circle"></i> Listen Now</div>
                <div class="menu-item"><i class="fas fa-th-large"></i> Browse</div>
                <div class="menu-item"><i class="fas fa-broadcast-tower"></i> Radio</div>
            </div>
            <div style="margin-top: auto;">
                <h4 style="color: var(--apple-text-muted); font-size: 12px; margin-bottom: 15px; text-transform: uppercase; font-weight: 700; padding-left: 5px;">Library</h4>
                <div class="menu-section">
                    <div class="menu-item"><i class="fas fa-clock"></i> Recently Added</div>
                    <div class="menu-item"><i class="fas fa-microphone"></i> Artists</div>
                    <div class="menu-item"><i class="fas fa-music"></i> Songs</div>
                </div>
            </div>
        </nav>

        <main class="main-content">
            <header class="artist-header">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" alt="Bg" class="artist-bg">
                <div class="artist-details">
                    <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" alt="Yan Block" class="artist-avatar">
                    <div class="artist-text">
                        <h1>Yan Block</h1>
                        <div class="artist-controls">
                            <button class="btn-play-all" onclick="playSong(0)"><i class="fas fa-play"></i> Play</button>
                            <button class="btn-play-all" style="background: rgba(255,255,255,0.15); box-shadow: none; backdrop-filter: blur(10px);"><i class="fas fa-random"></i> Shuffle</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="songs-container">
                <h2 class="section-title">Top Songs</h2>
                <ul class="song-list" id="song-list"></ul>
            </section>
        </main>
        
        <!-- PANTALLA DE LETRAS -->
        <div id="lyrics-fullscreen" class="lyrics-fullscreen">
            <img src="" id="lyrics-bg" class="lyrics-bg">
            <div class="lyrics-overlay"></div>
            <button class="btn-close-lyrics" onclick="toggleLyricsView()"><i class="fas fa-chevron-down"></i></button>

            <div class="lyrics-container">
                <div class="lyrics-left">
                    <img src="" id="lyrics-cover" class="lyrics-cover">
                </div>
                <div class="lyrics-right" id="lyrics-scroll-box">
                    <div id="lyrics-content">
                        <!-- Letras inyectadas -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reproductor Inferior (Isla Glassmorphism) -->
    <footer class="player">
        <div class="progress-bar" id="progress-bar"><div class="progress" id="progress"></div></div>

        <div class="now-playing">
            <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" alt="Cover" id="player-cover" onclick="toggleLyricsView()" title="Abrir Letras">
            <div class="track-info">
                <h4 id="player-title">Not Playing</h4>
                <p id="player-artist">Yan Block</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="buttons">
                <i class="fas fa-random" style="font-size: 15px;"></i>
                <i class="fas fa-backward-step" onclick="prevSong()"></i>
                <div class="play-pause" onclick="togglePlay()"><i class="fas fa-play" id="play-icon" style="margin-left: 3px;"></i></div>
                <i class="fas fa-forward-step" onclick="nextSong()"></i>
                <i class="fas fa-redo-alt" style="font-size: 15px;"></i>
            </div>
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="total-duration">--:--</span>
            </div>
        </div>

        <div class="player-actions">
            <i class="fas fa-quote-right btn-lyrics-toggle" id="btn-lyrics" onclick="toggleLyricsView()" title="Lyrics"></i>
            <i class="fas fa-list-ul"></i>
            <i class="fas fa-volume-up"></i>
        </div>
    </footer>

    <audio id="audio-player"></audio>

    <script>
        const imageArtistUrl = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg";
        
        const cancionesData =[
            { title: "YOGURCITO REMIX", artist: "Blessd, Anuel AA, Yan Block, Luar La L...", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007457/YOGURCITO_REMIX_Blessd_Anuel_AA_Yan_Block_Luar_La_L_Kris_R._ROA_ocxlgl.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/YOGURCITO_REMIX_wwua9w.lrc" },
            { title: "TALENTO", artist: "Yan Block, Panda Black", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007391/TALENTO_Yan_Block_Panda_Black_r4ugu2.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/TALENTO_s4qtf2.lrc" },
            { title: "444", artist: "Yan Block, Panda Black", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007376/444_Yan_Block_Panda_Black_upxnup.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/444_ie7e6d.lrc" },
            { title: "YO SE", artist: "Yan Block, TORRRES", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007440/YO_SE_Yan_Block_TORRRES_i8ianx.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/YO_SE_hiutok.lrc" },
            { title: "444 - REMIX", artist: "Yan Block, De La Rose, Hades66, Ñengo Flow", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007452/444_-_REMIX_Yan_Block_De_La_Rose_Hades66_%C3%91engo_Flow_lshzau.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/444_-_REMIX_t2qoid.lrc" },
            { title: "111", artist: "Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007415/111_Yan_Block_h3poua.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/111_adlg6f.lrc" },
            { title: "WYA REMIX RED", artist: "J Abdiel, De La Rose, Yan Block, iZaak, Jay Wheeler", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007447/WYA_REMIX_RED_J_Abdiel_De_La_Rose_Yan_Block_iZaak_Jay_Wheeler_mvfmrz.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/WYA_REMIX_RED_ic1sdd.lrc" },
            { title: "SECUESTRO", artist: "Slayter, Yan Block, NTG", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007396/SECUESTRO_Slayter_Yan_Block_NTG_bqszzh.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/SECUESTRO_m4absd.lrc" },
            { title: "VACILE", artist: "Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007402/VACILE_Yan_Block_ytkcf9.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/VACILE_qxdqxq.lrc" },
            { title: "EXPRESSO MARTINI", artist: "Rauw Alejandro, Marconi Impara, Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007397/EXPRESSO_MARTINI_Rauw_Alejandro_Marconi_Impara_Yan_Block_ac5x3j.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/EXPRESSO_MARTINI_nl8yas.lrc" }
        ];

        const songListElement = document.getElementById('song-list');
        const audioPlayer = document.getElementById('audio-player');
        const playIcon = document.getElementById('play-icon');
        const progress = document.getElementById('progress');
        
        let currentPlayingIndex = -1;
        let isLyricsViewOpen = false;
        let parsedLyrics =[]; 
        let currentActiveLyricIndex = -1;

        // INICIALIZAR
        function init() {
            cancionesData.forEach((songInfo, index) => {
                songInfo.cover = imageArtistUrl;
                const li = document.createElement('li');
                li.className = 'song-item';
                li.id = `song-${index}`;
                li.innerHTML = `
                    <div class="song-index">${index + 1}</div>
                    <img src="${imageArtistUrl}" id="thumb-${index}" class="song-thumb">
                    <div class="song-title-col">
                        <h4>${songInfo.title}</h4>
                        <p>${songInfo.artist}</p>
                    </div>
                    <div class="song-time" id="time-${index}">--:--</div>
                `;
                li.addEventListener('click', () => playSong(index));
                songListElement.appendChild(li);

                extraerPortadaMP3(songInfo.url, index);
            });

            // Iniciar Motor Gráfico de 60 FPS
            requestAnimationFrame(renderLoop);
        }

        function extraerPortadaMP3(url, index) {
            jsmediatags.read(url, {
                onSuccess: function(tag) {
                    const picture = tag.tags.picture;
                    if (picture) {
                        let base64String = "";
                        for (let i = 0; i < picture.data.length; i++) { base64String += String.fromCharCode(picture.data[i]); }
                        const imageUrl = `data:${picture.format};base64,${window.btoa(base64String)}`;
                        cancionesData[index].cover = imageUrl;
                        const thumb = document.getElementById(`thumb-${index}`);
                        if(thumb) thumb.src = imageUrl;
                        if(currentPlayingIndex === index) updatePlayerCovers(imageUrl);
                    }
                }
            });
        }

        function updatePlayerCovers(imageUrl) {
            document.getElementById('player-cover').src = imageUrl;
            document.getElementById('lyrics-cover').src = imageUrl;
            document.getElementById('lyrics-bg').src = imageUrl;
        }

        async function playSong(index) {
            if(index < 0 || index >= cancionesData.length) return;
            const song = cancionesData[index];
            
            if(currentPlayingIndex !== -1) document.getElementById(`song-${currentPlayingIndex}`).classList.remove('active');
            document.getElementById(`song-${index}`).classList.add('active');
            currentPlayingIndex = index;
            currentActiveLyricIndex = -1;

            updatePlayerCovers(song.cover);
            document.getElementById('player-title').innerText = song.title;
            document.getElementById('player-artist').innerText = song.artist;

            audioPlayer.src = song.url;
            audioPlayer.play();
            actualizarIconoPlay(true);

            await loadLyrics(song.lrc);
        }

        /* LÓGICA MATEMÁTICA LRC CON CÁLCULO DE DURACIÓN PARA PROGRESSIVE FILL */
        async function loadLyrics(lrcUrl) {
            const container = document.getElementById('lyrics-content');
            container.innerHTML = "<p style='color:#8e8e93; font-size:20px'>Cargando letras...</p>";
            parsedLyrics =[];

            try {
                const response = await fetch(lrcUrl);
                const text = await response.text();
                
                const lines = text.split('\n');
                const regex = /\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/;
                
                lines.forEach(line => {
                    const match = line.match(regex);
                    if(match) {
                        const min = parseInt(match[1]);
                        const sec = parseFloat(match[2]);
                        const time = (min * 60) + sec;
                        const txt = match[3].trim();
                        parsedLyrics.push({ time, text: txt, element: null, duration: 0 });
                    }
                });

                // Calcular duración de cada línea para el gradiente suave
                for(let i = 0; i < parsedLyrics.length; i++) {
                    if(i < parsedLyrics.length - 1) {
                        // Max cap of 5 seconds to avoid weird slow wipes on long breaks
                        parsedLyrics[i].duration = Math.min(5, parsedLyrics[i+1].time - parsedLyrics[i].time); 
                    } else {
                        parsedLyrics[i].duration = 5; 
                    }
                }
                
                renderLyrics();
            } catch (e) {
                container.innerHTML = "<p style='color:#8e8e93; font-size:20px'>Letras no disponibles.</p>";
            }
        }

        function renderLyrics() {
            const container = document.getElementById('lyrics-content');
            container.innerHTML = "";
            
            if(parsedLyrics.length === 0) return;

            parsedLyrics.forEach((lyric, idx) => {
                const div = document.createElement('div');
                div.className = `lyric-line ${lyric.text === "" ? "empty" : ""}`;
                div.innerText = lyric.text !== "" ? lyric.text : "♪";
                
                div.addEventListener('click', () => {
                    audioPlayer.currentTime = lyric.time;
                    audioPlayer.play();
                    actualizarIconoPlay(true);
                });

                lyric.element = div;
                container.appendChild(div);
            });
        }

        /* RENDER LOOP DE 60FPS: Contiene barra de progreso y el Karaoke Progresivo fluido */
        function renderLoop() {
            if(audioPlayer.duration) {
                const current = audioPlayer.currentTime;
                const duration = audioPlayer.duration;
                
                // Barra fluida
                progress.style.width = `${(current / duration) * 100}%`;
                
                // Textos
                document.getElementById('current-time').innerText = formatoTiempo(current);
                document.getElementById('total-duration').innerText = formatoTiempo(duration);
                const timeCell = document.getElementById(`time-${currentPlayingIndex}`);
                if(timeCell) timeCell.innerText = formatoTiempo(duration);
                
                // Letras Progresivas
                if(isLyricsViewOpen) syncLyricsFluid(current);
            }
            requestAnimationFrame(renderLoop);
        }

        function syncLyricsFluid(currentTime) {
            if(parsedLyrics.length === 0) return;

            let newActiveIndex = -1;
            for(let i = 0; i < parsedLyrics.length; i++) {
                if(currentTime >= parsedLyrics[i].time) newActiveIndex = i;
                else break;
            }

            // Si cambió la línea actual (cambiar clases y auto-scroll)
            if(newActiveIndex !== currentActiveLyricIndex) {
                parsedLyrics.forEach((lyric, idx) => {
                    if(!lyric.element) return;
                    
                    if(idx < newActiveIndex) {
                        lyric.element.className = 'lyric-line passed';
                        lyric.element.style.setProperty('--fill-pct', '100%');
                    } else if(idx > newActiveIndex) {
                        lyric.element.className = 'lyric-line';
                        lyric.element.style.setProperty('--fill-pct', '0%');
                    } else {
                        lyric.element.className = 'lyric-line active';
                        // Smooth Scroll al centro
                        const scrollBox = document.getElementById('lyrics-scroll-box');
                        const offset = lyric.element.offsetTop - (scrollBox.clientHeight / 2) + (lyric.element.clientHeight / 2);
                        scrollBox.scrollTo({ top: offset, behavior: 'smooth' });
                    }
                });
                currentActiveLyricIndex = newActiveIndex;
            }

            // Animación Progresiva del texto que se está cantando ahora mismo
            if(newActiveIndex !== -1) {
                const lyric = parsedLyrics[newActiveIndex];
                if(lyric.element && lyric.duration > 0) {
                    let elapsed = currentTime - lyric.time;
                    let pct = (elapsed / lyric.duration) * 100;
                    if(pct < 0) pct = 0;
                    if(pct > 100) pct = 100;
                    lyric.element.style.setProperty('--fill-pct', `${pct}%`);
                }
            }
        }

        audioPlayer.addEventListener('ended', nextSong);

        document.getElementById('progress-bar').addEventListener('click', function(e) {
            if(!audioPlayer.duration) return;
            const clickX = e.clientX - this.getBoundingClientRect().left;
            audioPlayer.currentTime = (clickX / this.getBoundingClientRect().width) * audioPlayer.duration;
        });

        function togglePlay() {
            if(!audioPlayer.src) { playSong(0); return; }
            if(audioPlayer.paused) { audioPlayer.play(); actualizarIconoPlay(true); } 
            else { audioPlayer.pause(); actualizarIconoPlay(false); }
        }

        function nextSong() { let next = currentPlayingIndex + 1; if(next >= cancionesData.length) next = 0; playSong(next); }
        function prevSong() { let prev = currentPlayingIndex - 1; if(prev < 0) prev = cancionesData.length - 1; playSong(prev); }

        function actualizarIconoPlay(isPlaying) {
            if(isPlaying) { playIcon.className = "fas fa-pause"; playIcon.style.marginLeft = "0"; } 
            else { playIcon.className = "fas fa-play"; playIcon.style.marginLeft = "3px"; }
        }

        function formatoTiempo(secs) {
            const min = Math.floor(secs / 60); const sec = Math.floor(secs % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        function toggleLyricsView() {
            const view = document.getElementById('lyrics-fullscreen');
            const btn = document.getElementById('btn-lyrics');
            isLyricsViewOpen = !isLyricsViewOpen;
            
            if(isLyricsViewOpen) {
                view.classList.add('active');
                btn.classList.add('active');
                if(audioPlayer.currentTime > 0) setTimeout(() => syncLyricsFluid(audioPlayer.currentTime), 100);
            } else {
                view.classList.remove('active');
                btn.classList.remove('active');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
