<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Iconos de Phosphor Icons (similares a los de Apple) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Fondo desenfocado -->
    <div class="background-blur" id="bgBlur"></div>

    <main class="player-container">
        <!-- Sección del Reproductor -->
        <section class="now-playing">
            <div class="artwork-container">
                <img id="artwork" src="https://4nemxki6k8.ucarecd.net/a2435185-eada-4f17-9a8b-41889c40fbe3/pieza.jpg" alt="Portada">
            </div>
            
            <div class="track-info">
                <h1 id="trackTitle">Pieza Exhibicion</h1>
                <h2 id="trackArtist">Luar La L, ROA & Blessd</h2>
            </div>

            <div class="progress-container">
                <input type="range" id="progressBar" value="0" min="0" max="100">
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">-:--</span>
                </div>
            </div>

            <div class="controls">
                <button id="prevBtn"><i class="ph-fill ph-skip-back"></i></button>
                <button id="playPauseBtn" class="play-btn"><i class="ph-fill ph-play"></i></button>
                <button id="nextBtn"><i class="ph-fill ph-skip-forward"></i></button>
            </div>
        </section>

        <!-- Sección de Letras Sincronizadas -->
        <section class="lyrics-container">
            <div id="lyricsContent" class="lyrics-scroll">
                <!-- Los lyrics se inyectarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
