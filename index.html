<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — Modo Oculto (Yan Block)</title>

  <!-- Fuentes Apple SF Pro / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos base de AMLL (Apple Music-like Lyrics) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core/dist/style.css">

  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --apple-blur: 50px;
      --text-main: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.35);
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent-color: #fa2d48; /* Rojo icónico de Apple Music */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0e12;
      font-family: var(--font-family);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       FONDO ANIMADO TIPO YOUTUBE MUSIC BEAUTIFIER
       ============================================================ */
    .beautifier-bg {
      position: fixed;
      inset: -20%;
      width: 140%;
      height: 140%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(85px) saturate(190%) brightness(0.65);
      transform-origin: center center;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Capa primaria: zoom lento y rotación suave */
    .bg-layer-1 {
      animation: ambientPan1 35s infinite alternate ease-in-out;
      opacity: 0.85;
    }

    /* Capa secundaria: movimiento en contraposición con mezcla */
    .bg-layer-2 {
      animation: ambientPan2 48s infinite alternate ease-in-out;
      mix-blend-mode: color-dodge;
      opacity: 0.35;
      filter: blur(110px) saturate(220%) brightness(0.8);
    }

    /* Esferas de luz sutil para mayor profundidad */
    .bg-orb {
      position: absolute;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 45, 72, 0.25) 0%, rgba(13, 14, 18, 0) 70%);
      animation: orbFloat 25s infinite alternate ease-in-out;
      mix-blend-mode: screen;
      filter: blur(60px);
    }

    /* Superposición de grano cinematográfico y viñeta Apple Music */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.65) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.6) 100%);
    }

    /* Control de pausa en animaciones de fondo */
    body.is-paused .bg-layer,
    body.is-paused .bg-orb {
      animation-play-state: paused !important;
    }

    @keyframes ambientPan1 {
      0% { transform: scale(1.2) translate(-3%, -2%) rotate(0deg); }
      50% { transform: scale(1.35) translate(4%, 3%) rotate(4deg); }
      100% { transform: scale(1.22) translate(-2%, 4%) rotate(-3deg); }
    }

    @keyframes ambientPan2 {
      0% { transform: scale(1.4) translate(4%, 3%) rotate(0deg); }
      50% { transform: scale(1.18) translate(-4%, -3%) rotate(-6deg); }
      100% { transform: scale(1.38) translate(2%, -4%) rotate(3deg); }
    }

    @keyframes orbFloat {
      0% { transform: translate(10vw, 15vh) scale(1); }
      100% { transform: translate(45vw, 40vh) scale(1.3); }
    }

    /* ============================================================
       CONTENEDOR PRINCIPAL: APPLE MUSIC DESKTOP FULLSCREEN
       ============================================================ */
    .apple-player-app {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Barra superior estilo macOS / Apple Music */
    .top-mac-bar {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mac-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .mac-dot:hover { opacity: 1; }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .now-playing-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
    }

    .apple-music-logo {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ============================================================
       CUERPO PRINCIPAL (PORTADA Y CONTROLES IZQ / LETRAS DER)
       ============================================================ */
    .player-main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 46% 54%;
      height: calc(100vh - 52px);
      padding: 40px 60px 50px 60px;
      gap: 40px;
      align-items: center;
      max-width: 1750px;
      margin: 0 auto;
      width: 100%;
    }

    /* Columna Izquierda: Portada + Info + Controles */
    .left-player-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      height: 100%;
      max-width: 480px;
      padding-bottom: 20px;
    }

    /* Portada estilo Apple Music */
    .cover-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      margin-bottom: 32px;
      border-radius: 18px;
      box-shadow: 
        0 24px 60px -10px rgba(0, 0, 0, 0.7),
        0 10px 25px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.45s ease;
    }

    .cover-wrapper:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 
        0 30px 70px -10px rgba(0, 0, 0, 0.85),
        0 14px 30px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      display: block;
    }

    /* Información de la pista */
    .track-details {
      width: 100%;
      margin-bottom: 22px;
    }

    .track-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .track-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      line-height: 1.2;
    }

    .lossless-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    .track-artist {
      font-size: 19px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s;
    }
    .track-artist:hover {
      color: #fff;
    }

    /* Barra de Progreso Apple Music */
    .scrubber-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar-rail {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .progress-bar-rail:hover {
      height: 8px;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .progress-bar-rail:hover .progress-thumb {
      transform: translateY(-50%) scale(1);
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controles de Reproducción */
    .playback-controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .play-pause-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      color: #0d0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.1, 1), background-color 0.2s;
    }

    .play-pause-circle:hover {
      transform: scale(1.06);
      background: #f5f5f7;
    }

    .play-pause-circle:active {
      transform: scale(0.95);
    }

    .play-pause-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .ctrl-secondary {
      color: rgba(255, 255, 255, 0.75);
    }
    .ctrl-secondary:hover {
      color: #ffffff;
    }

    .ctrl-secondary.active {
      color: var(--accent-color);
    }

    /* Fila de Volumen y Accesorios */
    .bottom-accessories {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .volume-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-rail {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .volume-rail:hover {
      height: 6px;
    }

    .volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 80%;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      pointer-events: none;
    }

    /* ============================================================
       COLUMNA DERECHA: MOTOR DE LETRAS ESTILO APPLE MUSIC (AMLL)
       ============================================================ */
    .right-lyrics-panel {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Máscara de desvanecimiento superior e inferior oficial de Apple */
      mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 12%, 
        rgba(0, 0, 0, 1) 85%, 
        transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 12%, 
        rgba(0, 0, 0, 1) 85%, 
        transparent 100%);
    }

    /* Contenedor de scroll para las letras */
    .lyrics-scroll-stage {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 120px 40px 240px 20px;
      scroll-behavior: smooth;
      scrollbar-width: none; /* Ocultar barra Firefox */
    }

    .lyrics-scroll-stage::-webkit-scrollbar {
      display: none; /* Ocultar barra Chrome/Safari */
    }

    /* Líneas de letra */
    .lyric-row {
      margin-bottom: 34px;
      font-size: clamp(30px, 3.1vw, 46px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.8px;
      color: var(--text-muted);
      filter: blur(1.8px);
      transform-origin: left center;
      transform: scale(0.97);
      transition: 
        color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.4s ease,
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.4s ease;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .lyric-row:hover {
      color: rgba(255, 255, 255, 0.65);
      filter: blur(0px);
    }

    /* Estado activo estilo Apple Music */
    .lyric-row.is-active {
      color: #ffffff;
      filter: blur(0px);
      transform: scale(1.04);
      font-weight: 800;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.35);
    }

    /* Palabra individual para sincronización karaoke */
    .lyric-word {
      display: inline-block;
      position: relative;
      transition: color 0.15s ease, transform 0.2s ease;
    }

    .lyric-row.is-active .lyric-word.word-passed {
      color: #ffffff;
    }

    .lyric-row.is-active .lyric-word.word-current {
      color: #ffffff;
      transform: translateY(-1px);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .lyric-row.is-active .lyric-word.word-future {
      color: rgba(255, 255, 255, 0.45);
    }

    /* ============================================================
       RESPONSIVIDAD Y DISPOSITIVOS
       ============================================================ */
    @media (max-width: 950px) {
      .player-main-content {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
        padding: 24px;
        gap: 28px;
      }
      .left-player-panel {
        max-width: 100%;
        align-items: center;
        text-align: center;
      }
      .cover-wrapper {
        max-width: 260px;
        margin-bottom: 20px;
      }
      .track-title-row {
        justify-content: center;
      }
      .right-lyrics-panel {
        height: 55vh;
      }
      .lyric-row {
        font-size: 26px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- ELEMENTO DE AUDIO OCULTO -->
  <audio id="audioElement" preload="metadata" crossorigin="anonymous">
    <source src="https://file.garden/aqbkhK4DJSCL_vig/Yan%20Block%20-%20Modo%20Oculto%20(Video%20Oficial)%20-%20Yan%20Block%20(youtube).mp3" type="audio/mpeg">
  </audio>

  <!-- FONDO ANIMADO TIPO YOUTUBE MUSIC BEAUTIFIER -->
  <div class="beautifier-bg" id="beautifierBg">
    <div class="bg-layer bg-layer-1" id="bgLayer1" style="background-image: url('https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg');"></div>
    <div class="bg-layer bg-layer-2" id="bgLayer2" style="background-image: url('https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg');"></div>
    <div class="bg-orb"></div>
  </div>
  <div class="vignette-overlay"></div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div class="apple-player-app">

    <!-- BARRA SUPERIOR MACOS -->
    <header class="top-mac-bar">
      <div class="mac-dots">
        <div class="mac-dot dot-red" title="Cerrar"></div>
        <div class="mac-dot dot-yellow" title="Minimizar"></div>
        <div class="mac-dot dot-green" id="zoomToggle" title="Pantalla Completa"></div>
      </div>

      <div class="now-playing-badge">
        <svg class="apple-music-logo" viewBox="0 0 170 170">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.69-7.85-12-14.44-6.19-9.45-11-20.28-14.42-32.51-3.42-12.22-5.13-23.77-5.13-34.64 0-14.78 3.59-27.18 10.77-37.21 7.18-10.02 16.32-15.17 27.42-15.44 5.33 0 10.89 1.34 16.68 4.02 5.79 2.68 9.53 4.08 11.22 4.2 1.48-.13 5.43-1.6 11.85-4.42 6.42-2.82 12.02-4.14 16.8-3.95 12.7.74 22.84 5.4 30.42 13.98-11.08 6.72-16.51 16.03-16.29 27.93.22 9.57 3.96 17.58 11.22 24.03 7.26 6.45 15.79 10.08 25.59 10.89-2.12 6.52-4.68 13.11-7.69 19.78zM119.22 31.05c0-7.39 2.66-14.38 7.98-20.97 5.32-6.59 11.93-10.42 19.83-11.48.21 1.06.32 2.01.32 2.85 0 7.39-2.77 14.59-8.31 21.6-5.54 7.01-12.24 11.03-20.1 12.06-.21-1.38-.32-2.74-.32-4.06z"/>
        </svg>
        <span>Modo Oculto — Yan Block</span>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="fullScreenBtn" title="Pantalla completa (F)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </header>

    <!-- ÁREA PRINCIPAL DIVIDIDA (APPLE MUSIC DESKTOP STYLE) -->
    <main class="player-main-content">

      <!-- COLUMNA IZQUIERDA: PORTADA, INFORMACIÓN Y CONTROLES -->
      <section class="left-player-panel">
        <div class="cover-wrapper" id="coverContainer">
          <img class="cover-img" id="trackCover" src="https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg" alt="Portada Modo Oculto">
        </div>

        <div class="track-details">
          <div class="track-title-row">
            <h1 class="track-title" id="trackTitle">Modo Oculto</h1>
            <span class="lossless-pill">Lossless</span>
          </div>
          <div class="track-artist" id="trackArtist">Yan Block</div>
        </div>

        <!-- Barra de progreso Apple -->
        <div class="scrubber-container">
          <div class="progress-bar-rail" id="progressRail">
            <div class="progress-bar-fill" id="progressFill">
              <div class="progress-thumb"></div>
            </div>
          </div>
          <div class="time-indicators">
            <span id="currentTime">0:00</span>
            <span id="remainingTime">-2:44</span>
          </div>
        </div>

        <!-- Controles de transporte -->
        <div class="playback-controls">
          <button class="icon-btn ctrl-secondary" id="shuffleBtn" title="Aleatorio">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary" id="prevBtn" title="Anterior">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button class="play-pause-circle" id="playPauseBtn" title="Reproducir / Pausa (Espacio)">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary" id="nextBtn" title="Siguiente">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary active" id="repeatBtn" title="Repetir">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
        </div>

        <!-- Fila de volumen -->
        <div class="bottom-accessories">

    let duration = 164; // Fallback ~2:44
    let parsedLyrics = [];
    let currentLineIndex = -1;
    let userScrolling = false;

    // --- PARSER DE TIEMPO TTML (Soporta mm:ss.ms, hh:mm:ss.ms, seg y ms) ---
    function parseTimeToMs(t) {
      if (!t) return 0;
      t = t.trim();
      if (t.endsWith('ms')) return parseFloat(t);
      if (t.endsWith('s')) return parseFloat(t) * 1000;
      const parts = t.split(':');
      if (parts.length === 3) {
        return (parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2])) * 1000;
      } else if (parts.length === 2) {
        return (parseFloat(parts[0]) * 60 + parseFloat(parts[1])) * 1000;
      }
      return parseFloat(t) * 1000;
    }

    // --- PARSER XML DE TTML (Compatible con spec AMLL) ---
    function parseTTML(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "application/xml");
      const pElements = xml.querySelectorAll('p');
      const lines = [];

      pElements.forEach((p, idx) => {
        const beginAttr = p.getAttribute('begin') || '0';
        const endAttr = p.getAttribute('end') || '0';
        const startMs = parseTimeToMs(beginAttr);
        const endMs = parseTimeToMs(endAttr);

        const spans = p.querySelectorAll('span');
        const words = [];

        if (spans.length > 0) {
          spans.forEach(span => {
            const spanBegin = span.getAttribute('begin') || beginAttr;
            const spanEnd = span.getAttribute('end') || endAttr;
            words.push({
              text: span.textContent,
              startTime: parseTimeToMs(spanBegin),
              endTime: parseTimeToMs(spanEnd)
            });
          });
        } else {
          // Si no tiene spans individuales, se crea la línea completa
          words.push({
            text: p.textContent.trim(),
            startTime: startMs,
            endTime: endMs
          });
        }

        lines.push({
          id: p.getAttribute('itunes:key') || `L_${idx}`,
          startTime: startMs,
          endTime: endMs,
          words: words
        });
      });

      return lines;
    }

    // --- RENDERIZADOR DE LETRAS ESTILO APPLE MUSIC ---
    function renderLyrics(lines) {
      lyricsStage.innerHTML = '';
      if (!lines || lines.length === 0) {
        lyricsStage.innerHTML = '<div class="lyric-row is-active">Letra instrumental o no disponible</div>';
        return;
      }

      lines.forEach((line, lineIdx) => {
        const row = document.createElement('div');
        row.className = 'lyric-row';
        row.dataset.index = lineIdx;

        // Inyectar palabras con spans para animación por sílaba/palabra
        line.words.forEach((w, wIdx) => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'lyric-word word-future';
          wordSpan.dataset.wordIndex = wIdx;
          wordSpan.textContent = w.text;
          row.appendChild(wordSpan);
        });

        // Clic en la línea: Salto instantáneo (Apple Music Seek)
        row.addEventListener('click', () => {
          const seekSec = (line.startTime / 1000);
          audio.currentTime = seekSec;
          if (!isPlaying) togglePlay();
          highlightLine(lineIdx, true);
        });

        lyricsStage.appendChild(row);
      });
    }

    // --- CARGAR LETRA (INTENTO RED Y FALLBACK INMEDIATO) ---
    async function initLyrics() {
      let ttmlText = '';
      try {
        const res = await fetch(TRACK_DATA.ttmlUrl, { mode: 'cors' });
        if (res.ok) {
          ttmlText = await res.text();
        } else {
          ttmlText = FALLBACK_TTML;
        }
      } catch (err) {
        console.warn("Utilizando motor de letras con TTML estructurado integrado.", err);
        ttmlText = FALLBACK_TTML;
      }

      parsedLyrics = parseTTML(ttmlText);
      renderLyrics(parsedLyrics);
    }

    // --- ACTUALIZACIÓN Y SINCRONIZACIÓN FLUIDA ---
    function updatePlayback(currentTimeSec) {
      const currentMs = currentTimeSec * 1000;

      // 1. Actualizar barra de progreso y tiempos
      const pct = (currentTimeSec / duration) * 100;
      progressFill.style.width = `${Math.min(pct, 100)}%`;
      currentTimeEl.textContent = formatTime(currentTimeSec);

      const remSec = Math.max(0, duration - currentTimeSec);
      remainingTimeEl.textContent = `-${formatTime(remSec)}`;

      // 2. Encontrar línea de letra activa
      if (parsedLyrics.length === 0) return;

      let activeIdx = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        const line = parsedLyrics[i];
        if (currentMs >= line.startTime && currentMs <= line.endTime + 400) {
          activeIdx = i;
          break;
        } else if (currentMs < line.startTime) {
          break;
        }
      }

      if (activeIdx !== -1 && activeIdx !== currentLineIndex) {
        highlightLine(activeIdx, false);
      }

      // 3. Sincronización de palabras en la línea activa
      if (currentLineIndex !== -1 && parsedLyrics[currentLineIndex]) {
        const activeLine = parsedLyrics[currentLineIndex];
        const lineElement = lyricsStage.children[currentLineIndex];
        if (lineElement) {
          const wordElements = lineElement.querySelectorAll('.lyric-word');
          activeLine.words.forEach((w, wIdx) => {
            const el = wordElements[wIdx];
            if (!el) return;
            if (currentMs >= w.endTime) {
              el.className = 'lyric-word word-passed';
            } else if (currentMs >= w.startTime && currentMs < w.endTime) {
              el.className = 'lyric-word word-current';
            } else {
              el.className = 'lyric-word word-future';
            }
          });
        }
      }
    }

    // Resaltar línea y centrado suave (Auto-Scroll Apple Music)
    function highlightLine(index, forceScroll = false) {
      currentLineIndex = index;
      const allRows = lyricsStage.querySelectorAll('.lyric-row');
      allRows.forEach((r, idx) => {
        if (idx === index) {
          r.classList.add('is-active');
        } else {
          r.classList.remove('is-active');
          // Limpiar clases de palabras en líneas inactivas
          r.querySelectorAll('.lyric-word').forEach(w => {
            w.className = 'lyric-word ' + (idx < index ? 'word-passed' : 'word-future');
          });
        }
      });

      // Auto-scroll si el usuario no está desplazando manualmente
      if (!userScrolling || forceScroll) {
        const activeRow = allRows[index];
        if (activeRow) {
          const stageHeight = lyricsStage.clientHeight;
          const rowTop = activeRow.offsetTop;
          const rowHeight = activeRow.clientHeight;
          // Enfoque a un tercio del panel (posición oficial de Apple Music)
          const scrollTarget = rowTop - (stageHeight * 0.35) + (rowHeight / 2);
          lyricsStage.scrollTo({
            top: Math.max(0, scrollTarget),
            behavior: 'smooth'
          });
        }
      }
    }

    // Pausa temporal de auto-scroll si el usuario desplaza las letras
    lyricsStage.addEventListener('wheel', () => {
      userScrolling = true;
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        userScrolling = false;
      }, 2600);
    });

    lyricsStage.addEventListener('touchstart', () => {
      userScrolling = true;
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        userScrolling = false;
      }, 2600);
    });

    // --- FORMATEO DE TIEMPO MM:SS ---
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // --- CONTROL DE REPRODUCCIÓN (PLAY / PAUSA) ---
    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          document.body.classList.remove('is-paused');
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => {
          console.warn("Interacción requerida por el navegador para reproducir audio:", err);
        });
      } else {
        audio.pause();
        isPlaying = false;
        document.body.classList.add('is-paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);

    // Click en la portada para reproducir / pausar
    document.getElementById('coverContainer').addEventListener('click', togglePlay);

    // Eventos del elemento de audio
    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration && !isNaN(audio.duration)) {
        duration = audio.duration;
        remainingTimeEl.textContent = `-${formatTime(duration)}`;
      }
    });

    audio.addEventListener('timeupdate', () => {
      updatePlayback(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      audio.play(); // Repetir por defecto
    });

    // --- SCRUBBING (BÚSQUEDA EN LA BARRA DE PROGRESO) ---
    let isScrubbing = false;

    function handleScrub(e) {
      const rect = progressRail.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const offsetX = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const percentage = offsetX / rect.width;
      audio.currentTime = percentage * duration;
      updatePlayback(audio.currentTime);
    }

    progressRail.addEventListener('mousedown', (e) => {
      isScrubbing = true;
      handleScrub(e);
      window.addEventListener('mousemove', handleScrub);
      window.addEventListener('mouseup', () => {
        isScrubbing = false;
        window.removeEventListener('mousemove', handleScrub);
      }, { once: true });
    });

    // --- CONTROL DE VOLUMEN ---
    function setVolume(pct) {
      pct = Math.max(0, Math.min(1, pct));
      audio.volume = pct;
      volumeFill.style.width = `${pct * 100}%`;
    }

    volumeRail.addEventListener('click', (e) => {
      const rect = volumeRail.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      setVolume(pct);
    });

    volumeMuteBtn.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        setVolume(0);
      } else {
        setVolume(parseFloat(audio.dataset.prevVol || 0.8));
      }
    });

    // --- PANTALLA COMPLETA ---
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    fullScreenBtn.addEventListener('click', toggleFullScreen);
    zoomToggle.addEventListener('click', toggleFullScreen);

    // --- ATAJOS DE TECLADO APPLE STYLE ---
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime = Math.min(duration, audio.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      } else if (e.code === 'ArrowUp') {
        setVolume(audio.volume + 0.05);
      } else if (e.code === 'ArrowDown') {
        setVolume(audio.volume - 0.05);
      }
    });

    // Iniciar carga de letra al iniciar
    initLyrics();
    document.body.classList.add('is-paused');
  </script>
</body>
</html>
