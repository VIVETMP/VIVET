<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVETMP</title>
    
    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ========================
           APPLE GLASSMORPHISM THEME
           ======================== */
        :root {
            --bg-base: #000000;
            --text-main: #ffffff;
            --text-muted: #999999;
            
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(30px) saturate(180%);
            
            --font-main: 'Inter', -apple-system, sans-serif;
            --spring: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body { 
            background-color: var(--bg-base); color: var(--text-main); 
            font-family: var(--font-main); height: 100vh; overflow: hidden; 
            position: relative;
        }

        /* --- FONDO AMBIENTAL --- */
        .ambient-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #141414;}
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.5; animation: float 20s infinite alternate ease-in-out; }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #7F49B4; }
        .orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #CFCFCF; animation-delay: -5s;}
        .orb-3 { top: 40%; left: 50%; width: 40vw; height: 40vw; background: #7F49B4; opacity: 0.3; animation-delay: -10s;}
        
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 10%) scale(1.1); } }

        /* --- NAVEGACIÓN SUPERIOR --- */
        .top-nav {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 100px;
            display: flex; align-items: center; gap: 8px; padding: 8px; z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .nav-item {
            padding: 10px 24px; border-radius: 100px; font-size: 14px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; transition: 0.3s;
        }
        .nav-item:hover { color: var(--text-main); }
        .nav-item.active { background: rgba(255,255,255,0.15); color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.2);}

        /* --- CONTENIDO PRINCIPAL --- */
        .main-container {
            width: 100%; height: 100%; overflow-y: auto; scroll-behavior: smooth;
            padding: 140px 5vw 150px 5vw; display: flex; flex-direction: column; align-items: center;
        }
        .main-container::-webkit-scrollbar { display: none; }

        .view-section { display: none; width: 100%; max-width: 1400px; flex-direction: column; animation: fadeIn 0.4s ease; }
        .view-section.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { width: 100%; margin-bottom: 40px; text-align: left; }
        .page-header h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
        .page-header p { font-size: 16px; color: var(--text-muted); margin-top: 5px; }

        /* HEADER DE ARTISTA */
        .btn-back { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--text-muted); cursor: pointer; margin-bottom: 20px; transition: 0.3s; width: fit-content; }
        .btn-back:hover { color: #fff; transform: translateX(-5px); }
        
        .artist-header-profile { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; }
        .artist-header-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); }
        
        /* GRID DE CARTAS */
        .card-grid {
            width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px;
        }
        
        .glass-card {
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 16px;
            cursor: pointer; transition: all 0.4s var(--spring); position: relative;
        }
        .glass-card:hover { transform: translateY(-8px) scale(1.02); background: var(--glass-hover); border-color: rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .glass-card.active { border-color: #fff; background: rgba(255,255,255,0.1); }
        
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 16px; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .card-img-wrapper.is-artist { border-radius: 50%; } 
        
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s var(--spring); }
        .glass-card:hover .card-img { transform: scale(1.05); }
        
        .card-play-btn {
            position: absolute; bottom: 12px; right: 12px; width: 44px; height: 44px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
            opacity: 0; transform: translateY(10px); transition: all 0.3s var(--spring); border: 1px solid rgba(255,255,255,0.2);
        }
        .glass-card:hover .card-play-btn { opacity: 1; transform: translateY(0); }
        .card-play-btn:hover { background: #fff; color: #000; transform: scale(1.1) !important; }
        
        .card-info { display: flex; flex-direction: column; gap: 4px; padding: 0 4px; }
        .is-artist-info { text-align: center; } 
        .card-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-artist { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- PÍLDORA REPRODUCTORA INFERIOR --- */
        .player-pill-wrapper {
            position: fixed; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 50;
            pointer-events: none; 
        }
        .player-pill {
            pointer-events: auto; width: 90%; max-width: 800px; height: 80px;
            background: rgba(20, 20, 20, 0.7); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 100px;
            display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 10px 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); transition: transform 0.3s var(--spring);
        }
        .player-pill:hover { transform: translateY(-5px); }

        .pill-info { display: flex; align-items: center; gap: 16px; width: 30%; cursor: pointer; }
        .pill-cover { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .pill-info:hover .pill-cover { transform: scale(1.05); }
        .pill-text { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .pill-text h4 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pill-text p { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .pill-controls { display: flex; align-items: center; gap: 24px; font-size: 24px; color: var(--text-main); }
        .pill-controls i { cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .pill-controls i:hover { color: #fff; transform: scale(1.1); }
        .btn-play-circle {
            width: 48px; height: 48px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000; transition: 0.2s; box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
        .btn-play-circle i { color: #000 !important; font-size: 22px; margin-left: 2px;}
        .btn-play-circle:hover { transform: scale(1.08); }

        .pill-right { display: flex; align-items: center; gap: 20px; width: 30%; justify-content: flex-end; }
        .pill-progress { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 150px;}
        .track-line { flex: 1; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; cursor: pointer; position: relative; }
        .fill-line { width: 0%; height: 100%; background: #fff; border-radius: 3px; transition: width 0.1s linear;}
        
        .btn-expand { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;}
        .btn-expand:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }


        /* ========================
           APPLE MUSIC NOW PLAYING UI
           ======================== */
        .now-playing-fs {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            transform: translateY(100%); opacity: 0; visibility: hidden;
            transition: transform 0.6s var(--spring), opacity 0.4s;
        }
        .now-playing-fs.active { transform: translateY(0); opacity: 1; visibility: visible; }

        .np-bg {
            position: absolute; inset: -10%; width: 120%; height: 120%;
            object-fit: cover; filter: blur(40px) brightness(0.3) saturate(180%);
            z-index: 0; transition: filter 0.5s ease;
        }
        .np-overlay {
            position: absolute; inset: 0; 
            background: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%); 
            z-index: 1;
        }

        .btn-close-np {
            position: absolute; top: 40px; left: 40px; width: 44px; height: 44px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
            cursor: pointer; z-index: 10; border: 1px solid var(--glass-border); transition: 0.2s;
        }
        .btn-close-np:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        .np-content {
            position: relative; z-index: 2; display: flex; flex-direction: row; align-items: center; 
            height: 100%; width: 100%; padding: 80px 8vw; gap: 6vw;
        }

        /* --- Lado Izquierdo --- */
        .np-left {
            flex: 1; max-width: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .np-large-cover {
            width: 100%; aspect-ratio: 1; border-radius: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); 
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; object-fit: cover;
        }

        .np-text-area { width: 100%; text-align: left; margin-bottom: 30px; }
        .np-text-area h2 { font-size: 28px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .np-text-area p { font-size: 18px; color: rgba(255,255,255,0.7); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .np-progress-area { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .np-progress-bar { display: flex; align-items: center; width: 100%; }
        .np-times { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; font-weight: 500; }

        .np-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 28px; color: rgba(255,255,255,0.8); margin-bottom: 40px;}
        .np-controls i { cursor: pointer; transition: 0.2s; }
        .np-controls i:hover { color: #fff; transform: scale(1.1); }
        .np-play { width: 72px; height: 72px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; transition: 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); cursor: pointer;}
        .np-play i { margin-left: 4px; }
        .np-play:hover { transform: scale(1.05); }

        /* Controles de Volumen Actualizados */
        .np-volume-area { display: flex; align-items: center; gap: 15px; width: 100%; color: rgba(255,255,255,0.6); font-size: 20px;}
        .np-volume-area i { cursor: pointer; transition: 0.2s; }
        .np-volume-area i:hover { color: #fff; transform: scale(1.1); }

        /* --- Lado Derecho (Letras) --- */
        .np-right {
            flex: 1.2; height: 85vh; display: flex; flex-direction: column; justify-content: center; position: relative;
        }

        .np-lyrics {
            height: 100%; overflow-y: auto; padding: 35vh 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            text-align: left; scroll-behavior: smooth;
        }
        .np-lyrics::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-size: 46px; font-weight: 800; line-height: 1.3; letter-spacing: -1.5px;
            margin-bottom: 30px; cursor: pointer; transform-origin: left center;
            transition: transform 0.5s var(--spring), filter 0.5s var(--spring), opacity 0.5s;
            opacity: 0.3; filter: blur(3px); transform: scale(0.95);
            
            --fill-pct: 0%;
            background: linear-gradient(to right, #ffffff var(--fill-pct), rgba(255, 255, 255, 0.3) var(--fill-pct));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .lyric-line.active { opacity: 1; filter: blur(0); transform: scale(1); }
        .lyric-line.passed { opacity: 0.15; filter: blur(1px); --fill-pct: 100%; transform: scale(0.95); }
        .lyric-line:hover { opacity: 0.8; filter: blur(0); }

    </style>
</head>
<body>

    <!-- Fondo de Esferas -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navegación Glass Superior -->
    <nav class="top-nav">
        <div class="nav-item active" id="nav-songs" onclick="switchTab('songs')">Songs</div>
        <div class="nav-item" id="nav-artists" onclick="switchTab('artists')">Artists</div>
        <div class="nav-item" id="nav-search">Search</div>
    </nav>

    <!-- Área Principal -->
    <main class="main-container">
        <!-- VISTA: CANCIONES -->
        <div id="view-songs" class="view-section active">
            <div class="page-header">
                <h1>Songs</h1>
                <p>All your favorite tracks in one place.</p>
            </div>
            <div class="card-grid" id="songs-grid"></div>
        </div>

        <!-- VISTA: ARTISTAS -->
        <div id="view-artists" class="view-section">
            <div class="page-header">
                <h1>Artists</h1>
                <p>Browse the catalog by top artists.</p>
            </div>
            <div class="card-grid" id="artists-grid"></div>
        </div>

        <!-- VISTA: DETALLE DE ARTISTA -->
        <div id="view-artist-detail" class="view-section">
            <div class="btn-back" onclick="switchTab('artists')"><i class="ph-bold ph-arrow-left"></i> Back</div>
            <div class="artist-header-profile">
                <img src="" id="detail-artist-img" class="artist-header-img">
                <div>
                    <h1 id="detail-artist-name" style="font-size: 52px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 5px;">Artist Name</h1>
                    <p style="font-size: 18px; color: var(--text-muted);">Top Songs</p>
                </div>
            </div>
            <div class="card-grid" id="artist-songs-grid"></div>
        </div>
    </main>

    <!-- Píldora Reproductora Inferior -->
    <div class="player-pill-wrapper">
        <div class="player-pill">
            <div class="pill-info" onclick="toggleNP()">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="pill-cover" id="pill-cover">
                <div class="pill-text">
                    <h4 id="pill-title">Not Playing</h4>
                    <p id="pill-artist">Yan Block</p>
                </div>
            </div>

            <div class="pill-controls">
                <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                <div class="btn-play-circle" onclick="togglePlay()"><i class="ph-fill ph-play" id="pill-play-icon"></i></div>
                <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
            </div>

            <div class="pill-right">
                <div class="pill-progress">
                    <div class="track-line" onclick="seek(event, this)"><div class="fill-line" id="pill-fill"></div></div>
                </div>
                <div class="btn-expand" onclick="toggleNP()"><i class="ph-bold ph-arrows-out-simple" style="color: white; font-size: 16px;"></i></div>
            </div>
        </div>
    </div>

    <!-- APPLE MUSIC NOW PLAYING UI (FULLSCREEN) -->
    <div class="now-playing-fs" id="np-screen">
        <img src="" class="np-bg" id="fs-bg">
        <div class="np-overlay"></div>
        <div class="btn-close-np" onclick="toggleNP()"><i class="ph-bold ph-caret-down"></i></div>

        <div class="np-content">
            <!-- Izquierda: Portada y Controles -->
            <div class="np-left">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="np-large-cover" id="fs-large-cover">
                
                <div class="np-text-area">
                    <h2 id="fs-title">Not Playing</h2>
                    <p id="fs-artist">Yan Block</p>
                </div>

                <div class="np-progress-area">
                    <div class="np-progress-bar track-line" onclick="seek(event, this)">
                        <div class="fill-line" id="fs-fill"></div>
                    </div>
                    <div class="np-times">
                        <span id="fs-time-curr">0:00</span>
                        <span id="fs-time-tot">0:00</span>
                    </div>
                </div>

                <div class="np-controls">
                    <i class="ph-fill ph-shuffle" style="font-size: 24px;"></i>
                    <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                    <div class="np-play" onclick="togglePlay()"><i class="ph-fill ph-play" id="fs-play-icon"></i></div>
                    <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
                    <i class="ph-bold ph-repeat" style="font-size: 24px;"></i>
                </div>

                <!-- BARRA DE VOLUMEN -->
                <div class="np-volume-area">
                    <i class="ph-fill ph-speaker-low" onclick="setVolumeLevel(0)"></i>
                    <div class="track-line" onclick="changeVolume(event, this)">
                        <div class="fill-line" id="volume-fill" style="width: 75%;"></div>
                    </div>
                    <i class="ph-fill ph-speaker-high" onclick="setVolumeLevel(1)"></i>
                </div>
            </div>

            <!-- Derecha: Letras Sincronizadas -->
            <div class="np-right">
                <div class="np-lyrics" id="lyrics-scroll">
                    <div id="lyrics-content"></div>
                </div>
            </div>
        </div>
    </div>

            { title: "Tiroteo - Remix", artist: "Marc Seguí, Rauw Alejandro, Pol Granch", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776204379/Tiroteo_-_Remix_Marc_Segu%C3%AD_Rauw_Alejandro_Pol_Granch_qpe93o.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776204785/Tiroteo_-_Remix_-_Marc_Segu%C3%AD_Rauw_Alejandro_Pol_Granch_prtn3b.lrc" },

        // Sistema de Sonido y Crossfade
        let audio1 = new Audio();
        let audio2 = new Audio();
        let activeAudio = audio1;
        let fadingAudio = null;
        let isCrossfading = false;
        
        let globalVolume = 0.75; 
        const CROSSFADE_DURATION = 12;

        let currentPlayingIndex = -1;
        let isNPOpen = false;
        let parsedLyrics =[]; 
        let activeLyricIndex = -1;

        function init() {
            renderSongs(cancionesData, 'songs-grid');
            renderArtists();
            
            document.getElementById('volume-fill').style.width = `${globalVolume * 100}%`;
            activeAudio.volume = globalVolume;

            // MOTOR DE AUDIO (Corre de fondo para el crossfade)
            setInterval(audioLoop, 50); 
            audio1.addEventListener('timeupdate', audioLoop);
            audio2.addEventListener('timeupdate', audioLoop);
            
            // MOTOR VISUAL (Corre a 60 FPS para animaciones suaves)
            requestAnimationFrame(renderLoop);
        }

        // --- SISTEMA DE VOLUMEN ---
        function changeVolume(e, el) {
            const rect = el.getBoundingClientRect();
            let vol = (e.clientX - rect.left) / rect.width;
            setVolumeLevel(vol);
        }

        function setVolumeLevel(vol) {
            if(vol < 0) vol = 0;
            if(vol > 1) vol = 1;
            
            globalVolume = vol;
            document.getElementById('volume-fill').style.width = `${globalVolume * 100}%`;
            
            if(!isCrossfading && activeAudio) {
                activeAudio.volume = globalVolume;
            }
        }

        // --- SISTEMA DE PESTAÑAS (TABS) ---
        function switchTab(tabId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if(tabId === 'songs') {
                document.getElementById('view-songs').classList.add('active');
                document.getElementById('nav-songs').classList.add('active');
            } else if(tabId === 'artists') {
                document.getElementById('view-artists').classList.add('active');
                document.getElementById('nav-artists').classList.add('active');
            }
        }

        function openArtistDetail(artistName, imgUrl) {
            document.getElementById('detail-artist-name').innerText = artistName;
            document.getElementById('detail-artist-img').src = imgUrl;
            
            const artistSongs = cancionesData.filter(s => s.artist.includes(artistName)).slice(0, 10);
            renderSongs(artistSongs, 'artist-songs-grid', true);

            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-artist-detail').classList.add('active');
        }

        // --- RENDERIZADO UI ---
        function renderSongs(songsArray, containerId, isFiltered = false) {
            const gridEl = document.getElementById(containerId);
            gridEl.innerHTML = '';
            
            songsArray.forEach((song) => {
                const realIndex = cancionesData.findIndex(s => s.title === song.title);
                if(!song.cover) song.cover = imageArtistUrl;

                const card = document.createElement('div');
                card.className = 'glass-card';
                if(!isFiltered) card.id = `card-${realIndex}`; 
                card.onclick = () => playSong(realIndex);
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${song.cover}" id="art-${containerId}-${realIndex}" class="card-img">
                        <div class="card-play-btn"><i class="ph-fill ph-play"></i></div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${song.title}</div>
                        <div class="card-artist">${song.artist}</div>
                    </div>
                `;
                gridEl.appendChild(card);

                if(!song.coverLoaded) {
                    jsmediatags.read(song.url, {
                        onSuccess: function(tag) {
                            if (tag.tags.picture) {
                                let b64 = "";
                                for (let j = 0; j < tag.tags.picture.data.length; j++) b64 += String.fromCharCode(tag.tags.picture.data[j]);
                                const imgUrl = `data:${tag.tags.picture.format};base64,${window.btoa(b64)}`;
                                song.cover = imgUrl;
                                song.coverLoaded = true;
                                const imgEl = document.getElementById(`art-${containerId}-${realIndex}`);
                                if(imgEl) imgEl.src = imgUrl;
                                if(currentPlayingIndex === realIndex) updateCovers(imgUrl);
                            }
                        }
                    });
                } else {
                    document.getElementById(`art-${containerId}-${realIndex}`).src = song.cover;
                }
            });
        }

        function renderArtists() {
            const gridEl = document.getElementById('artists-grid');
            gridEl.innerHTML = '';

            artistsData.forEach(artist => {
                const card = document.createElement('div');
                card.className = 'glass-card';
                card.onclick = () => openArtistDetail(artist.name, artist.img);
                
                card.innerHTML = `
                    <div class="card-img-wrapper is-artist">
                        <img src="${artist.img}" class="card-img">
                    </div>
                    <div class="card-info is-artist-info">
                        <div class="card-title" style="font-size: 18px;">${artist.name}</div>
                        <div class="card-artist">Artist</div>
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        // --- SISTEMA DE REPRODUCCIÓN ---
        function updateCovers(img) {
            document.getElementById('pill-cover').src = img;
            document.getElementById('fs-large-cover').src = img;
            document.getElementById('fs-bg').src = img;         
        }

        async function playSong(idx) {
            isCrossfading = false;
            if(fadingAudio) { fadingAudio.pause(); fadingAudio.src = ""; fadingAudio = null; }
            activeAudio.pause();
            
            activeAudio.volume = globalVolume;
            
            triggerUIForSong(idx);
            
            activeAudio.src = cancionesData[idx].url;
            activeAudio.play().catch(e=>console.log(e));
            setPlayIcon(true);
        }

        function triggerUIForSong(idx) {
            if(currentPlayingIndex !== -1) {
                const oldCard = document.getElementById(`card-${currentPlayingIndex}`);
                if(oldCard) oldCard.classList.remove('active');
            }
            
            const newCard = document.getElementById(`card-${idx}`);
            if(newCard) newCard.classList.add('active');
            
            currentPlayingIndex = idx;
            activeLyricIndex = -1;
            const song = cancionesData[idx];

            updateCovers(song.cover || imageArtistUrl);
            document.getElementById('pill-title').innerText = song.title;
            document.getElementById('pill-artist').innerText = song.artist;
            document.getElementById('fs-title').innerText = song.title;
            document.getElementById('fs-artist').innerText = song.artist;

            fetchLyrics(song.lrc);
        }

        function startCrossfade() {
            isCrossfading = true;
            fadingAudio = activeAudio;
            activeAudio = (activeAudio === audio1) ? audio2 : audio1;
            
            let nextIdx = (currentPlayingIndex + 1) % cancionesData.length;
            triggerUIForSong(nextIdx);
            
            activeAudio.src = cancionesData[nextIdx].url;
            activeAudio.volume = 0; 
            activeAudio.play().catch(e=>console.log(e));
        }

        // ============================================
        // MOTOR 1: AUDIO (Fondo, nunca se pausa)
        // ============================================
        function audioLoop() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                const curr = activeAudio.currentTime;
                const dur = activeAudio.duration;
                const remaining = dur - curr;
                
                if (remaining <= CROSSFADE_DURATION && !isCrossfading && remaining > 0.5) {
                    startCrossfade();
                }

                if (isCrossfading && fadingAudio && fadingAudio.duration) {
                    const fadeRemaining = fadingAudio.duration - fadingAudio.currentTime;
                    let ratio = fadeRemaining / CROSSFADE_DURATION;
                    if(ratio < 0) ratio = 0; if(ratio > 1) ratio = 1;
                    
                    fadingAudio.volume = ratio * globalVolume;         
                    activeAudio.volume = (1 - ratio) * globalVolume;   

                    if (ratio <= 0 || fadingAudio.ended) {
                        fadingAudio.pause(); fadingAudio.src = "";
                        isCrossfading = false; activeAudio.volume = globalVolume;
                    }
                }
            }
        }

        // ============================================
        // MOTOR 2: VISUAL (60 FPS, pausa si cambias de pestaña)
        // ============================================
        function renderLoop() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                const curr = activeAudio.currentTime;
                const dur = activeAudio.duration;
                
                const pct = (curr / dur) * 100;
                document.getElementById('pill-fill').style.width = `${pct}%`;
                document.getElementById('fs-fill').style.width = `${pct}%`;
                
                document.getElementById('fs-time-curr').innerText = fmt(curr);
                document.getElementById('fs-time-tot').innerText = "-" + fmt(dur - curr);
                
                if(isNPOpen) updateKaraoke(curr);
            }
            requestAnimationFrame(renderLoop);
        }


        // --- SISTEMA DE LETRAS ---
        async function fetchLyrics(url) {
            const container = document.getElementById('lyrics-content');
            parsedLyrics =[];

            if(!url) {
                container.innerHTML = "<div style='height:100%; display:flex; align-items:center;'><p style='color:rgba(255,255,255,0.4); font-size:24px; font-weight:600;'>Letras no disponibles.</p></div>";
                return;
            }

            container.innerHTML = "<p style='color:rgba(255,255,255,0.4); font-size:24px; font-weight:600;'>Cargando letras...</p>";

            try {
                const res = await fetch(url);
                const text = await res.text();
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    const match = line.match(/\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/);
                    if(match) {
                        parsedLyrics.push({ 
                            time: (parseInt(match[1]) * 60) + parseFloat(match[2]), 
                            text: match[3].trim(), 
                            element: null,
                            duration: 0
                        });
                    }
                });

                for(let i=0; i < parsedLyrics.length; i++) {
                    parsedLyrics[i].duration = (i < parsedLyrics.length - 1) ? Math.min(6, parsedLyrics[i+1].time - parsedLyrics[i].time) : 6;
                }
                
                container.innerHTML = "";
                if(parsedLyrics.length === 0) throw new Error();

                parsedLyrics.forEach(lyric => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.innerText = lyric.text || "♪";
                    div.onclick = () => { activeAudio.currentTime = lyric.time; activeAudio.play(); setPlayIcon(true); };
                    lyric.element = div;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<div style='height:100%; display:flex; align-items:center;'><p style='color:rgba(255,255,255,0.4); font-size:24px; font-weight:600;'>Letras no disponibles.</p></div>";
            }
        }

        function updateKaraoke(currTime) {
            if(!parsedLyrics.length) return;

            let newIdx = -1;
            for(let i=0; i<parsedLyrics.length; i++) {
                if(currTime >= parsedLyrics[i].time) newIdx = i; else break;
            }

            if(newIdx !== activeLyricIndex) {
                parsedLyrics.forEach((lyric, i) => {
                    if(!lyric.element) return;
                    if(i < newIdx) {
                        lyric.element.className = 'lyric-line passed';
                        lyric.element.style.setProperty('--fill-pct', '100%');
                    } else if(i > newIdx) {
                        lyric.element.className = 'lyric-line';
                        lyric.element.style.setProperty('--fill-pct', '0%');
                    } else {
                        lyric.element.className = 'lyric-line active';
                        const scrollEl = document.getElementById('lyrics-scroll');
                        scrollEl.scrollTo({ top: lyric.element.offsetTop - (scrollEl.clientHeight/2) + (lyric.element.clientHeight/2), behavior: 'smooth' });
                    }
                });
                activeLyricIndex = newIdx;
            }

            if(newIdx !== -1 && parsedLyrics[newIdx].duration > 0) {
                const activeLyric = parsedLyrics[newIdx];
                let pct = ((currTime - activeLyric.time) / activeLyric.duration) * 100;
                activeLyric.element.style.setProperty('--fill-pct', `${Math.max(0, Math.min(pct, 100))}%`);
            }
        }

        // --- CONTROLES AUXILIARES ---
        function togglePlay() {
            if(!activeAudio.src) return playSong(0);
            if(activeAudio.paused) { activeAudio.play(); setPlayIcon(true); } 
            else { activeAudio.pause(); setPlayIcon(false); }
        }

        function nextSong() { playSong((currentPlayingIndex + 1) % cancionesData.length); }
        function prevSong() { playSong((currentPlayingIndex - 1 + cancionesData.length) % cancionesData.length); }

        function setPlayIcon(playing) {
            document.getElementById('pill-play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
            document.getElementById('fs-play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
        }

        function seek(e, el) {
            if(!activeAudio.duration) return;
            const rect = el.getBoundingClientRect();
            activeAudio.currentTime = ((e.clientX - rect.left) / rect.width) * activeAudio.duration;
        }

        function toggleNP() {
            isNPOpen = !isNPOpen;
            document.getElementById('np-screen').classList.toggle('active');
            if(isNPOpen && activeAudio.currentTime > 0) setTimeout(() => updateKaraoke(activeAudio.currentTime), 100);
        }

        function fmt(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        window.onload = init;
    </script>
</body>
</html>
