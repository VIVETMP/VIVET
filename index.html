<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — Modo Oculto (AMLL Engine)</title>

  <!-- Fuentes Apple System / SF Pro Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos base de AMLL (Apple Music-like Lyrics) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core/dist/style.css">

  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --text-main: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.32);
      --accent-color: #fa2d48;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0d11;
      font-family: var(--font-family);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       FONDO ANIMADO TIPO YOUTUBE MUSIC BEAUTIFIER
       ============================================================ */
    .beautifier-bg {
      position: fixed;
      inset: -25%;
      width: 150%;
      height: 150%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(95px) saturate(210%) brightness(0.6);
      transform-origin: center center;
    }

    .bg-layer-1 {
      animation: ambientDrift1 30s infinite alternate ease-in-out;
      opacity: 0.85;
    }

    .bg-layer-2 {
      animation: ambientDrift2 42s infinite alternate ease-in-out;
      mix-blend-mode: color-dodge;
      opacity: 0.35;
      filter: blur(125px) saturate(240%) brightness(0.75);
    }

    .bg-orb {
      position: absolute;
      width: 55vw;
      height: 55vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 45, 72, 0.28) 0%, rgba(13, 14, 18, 0) 70%);
      animation: orbFloat 22s infinite alternate ease-in-out;
      mix-blend-mode: screen;
      filter: blur(65px);
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.75) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
    }

    body.is-paused .bg-layer,
    body.is-paused .bg-orb {
      animation-play-state: paused !important;
    }

    @keyframes ambientDrift1 {
      0% { transform: scale(1.2) translate(-3%, -2%) rotate(0deg); }
      50% { transform: scale(1.36) translate(4%, 3%) rotate(4deg); }
      100% { transform: scale(1.22) translate(-2%, 4%) rotate(-3deg); }
    }

    @keyframes ambientDrift2 {
      0% { transform: scale(1.38) translate(4%, 3%) rotate(0deg); }
      50% { transform: scale(1.16) translate(-4%, -3%) rotate(-5deg); }
      100% { transform: scale(1.35) translate(2%, -4%) rotate(3deg); }
    }

    @keyframes orbFloat {
      0% { transform: translate(10vw, 15vh) scale(1); }
      100% { transform: translate(45vw, 40vh) scale(1.3); }
    }

    /* ============================================================
       CONTENEDOR APPLE MUSIC DESKTOP FULLSCREEN
       ============================================================ */
    .apple-player-app {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Barra Superior macOS */
    .top-mac-bar {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .mac-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .mac-dot:hover { opacity: 1; }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .now-playing-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
    }

    .apple-music-logo {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .icon-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ============================================================
       COLUMNA IZQ: PORTADA Y CONTROLES | COLUMNA DER: LYRICS
       ============================================================ */
    .player-main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 46% 54%;
      height: calc(100vh - 52px);
      padding: 40px 60px 50px 60px;
      gap: 40px;
      align-items: center;
      max-width: 1750px;
      margin: 0 auto;
      width: 100%;
    }

    .left-player-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      height: 100%;
      max-width: 480px;
      padding-bottom: 20px;
    }

    .cover-wrapper {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      margin-bottom: 32px;
      border-radius: 18px;
      box-shadow: 
        0 24px 60px -10px rgba(0, 0, 0, 0.75),
        0 10px 25px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.12);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.45s ease;
      cursor: pointer;
    }

    .cover-wrapper:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 
        0 30px 70px -10px rgba(0, 0, 0, 0.85),
        0 14px 30px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      display: block;
    }

    .track-details {
      width: 100%;
      margin-bottom: 22px;
    }

    .track-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .track-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .lossless-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 3px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
    }

    .track-artist {
      font-size: 19px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Barra de Progreso */
    .scrubber-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar-rail {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .progress-bar-rail:hover {
      height: 8px;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .progress-bar-rail:hover .progress-thumb {
      transform: translateY(-50%) scale(1);
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .playback-controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .play-pause-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      color: #0d0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.1, 1), background-color 0.2s;
    }

    .play-pause-circle:hover {
      transform: scale(1.06);
      background: #f5f5f7;
    }

    .play-pause-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .ctrl-secondary {
      color: rgba(255, 255, 255, 0.75);
    }
    .ctrl-secondary:hover {
      color: #ffffff;
    }
    .ctrl-secondary.active {
      color: var(--accent-color);
    }

    .bottom-accessories {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .volume-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-rail {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .volume-rail:hover {
      height: 6px;
    }

    .volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 80%;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      pointer-events: none;
    }

    /* ============================================================
       MOTOR DE ANIMACIÓN DE LETRAS APPLE MUSIC & AMLL
       ============================================================ */
    .right-lyrics-panel {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Máscara de desvanecimiento superior e inferior oficial Apple Music */
      mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 12%, 
        rgba(0, 0, 0, 1) 85%, 
        transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 12%, 
        rgba(0, 0, 0, 1) 85%, 
        transparent 100%);
    }

    .lyrics-scroll-stage {
      flex: 1;
      overflow-y: scroll;
      overflow-x: hidden;
      padding: 180px 40px 300px 20px;
      scrollbar-width: none;
    }

    .lyrics-scroll-stage::-webkit-scrollbar {
      display: none;
    }

    /* Línea de letra AMLL */
    .amll-lyric-line {
      margin-bottom: 38px;
      font-size: clamp(32px, 3.2vw, 48px);
      font-weight: 700;
      line-height: 1.34;
      letter-spacing: -0.9px;
      color: var(--text-muted);
      transform-origin: left center;
      transition: 
        transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        filter 0.4s ease,
        opacity 0.4s ease;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 10px;
      will-change: transform, filter, opacity;
    }

    .amll-lyric-line:hover {
      filter: blur(0px) !important;
      opacity: 0.8 !important;
    }

    /* Barrido progresivo de cada palabra (Apple Music Karaoke Sweep) */
    .amll-lyric-word {
      display: inline-block;
      position: relative;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffffff var(--sweep-progress, 0%),
        rgba(255, 255, 255, 0.32) calc(var(--sweep-progress, 0%) + 1%),
        rgba(255, 255, 255, 0.32) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      will-change: background, filter, transform;
    }

    /* Palabra cantada al 100% */
    .amll-lyric-word.word-done {
      --sweep-progress: 100% !important;
      -webkit-text-fill-color: #ffffff;
    }

    /* Palabra que se está cantando en este instante con brillo */
    .amll-lyric-word.word-singing {
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.5));
    }

    /* Palabra no alcanzada */
    .amll-lyric-word.word-pending {
      --sweep-progress: 0% !important;
      -webkit-text-fill-color: rgba(255, 255, 255, 0.32);
    }

    /* Puntos de intermedio instrumental estilo AMLL */
    .amll-interlude-dots {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      margin-bottom: 30px;
      opacity: 0.35;
      transition: opacity 0.3s ease;
    }

    .amll-interlude-dots.is-active {
      opacity: 0.95;
    }

    .amll-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffffff;
      transform: scale(0.85);
    }

    .amll-interlude-dots.is-active .amll-dot {
      animation: amllDotPulse 1.4s infinite ease-in-out both;
    }

    .amll-interlude-dots.is-active .amll-dot:nth-child(1) { animation-delay: 0s; }
    .amll-interlude-dots.is-active .amll-dot:nth-child(2) { animation-delay: 0.25s; }
    .amll-interlude-dots.is-active .amll-dot:nth-child(3) { animation-delay: 0.5s; }

    @keyframes amllDotPulse {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.3;
      }
      40% {
        transform: scale(1.35);
        opacity: 1;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      }
    }

    @media (max-width: 950px) {
      .player-main-content {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
        padding: 24px;
        gap: 28px;
      }
      .left-player-panel {
        max-width: 100%;
        align-items: center;
        text-align: center;
      }
      .cover-wrapper {
        max-width: 260px;
        margin-bottom: 20px;
      }
      .track-title-row {
        justify-content: center;
      }
      .right-lyrics-panel {
        height: 55vh;
      }
      .amll-lyric-line {
        font-size: 26px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- ELEMENTO DE AUDIO -->
  <audio id="audioElement" preload="metadata" crossorigin="anonymous">
    <source src="https://file.garden/aqbkhK4DJSCL_vig/Yan%20Block%20-%20Modo%20Oculto%20(Video%20Oficial)%20-%20Yan%20Block%20(youtube).mp3" type="audio/mpeg">
  </audio>

  <!-- FONDO TIPO BEAUTIFIER -->
  <div class="beautifier-bg" id="beautifierBg">
    <div class="bg-layer bg-layer-1" style="background-image: url('https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg');"></div>
    <div class="bg-layer bg-layer-2" style="background-image: url('https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg');"></div>
    <div class="bg-orb"></div>
  </div>
  <div class="vignette-overlay"></div>

  <!-- APLICACIÓN -->
  <div class="apple-player-app">

    <header class="top-mac-bar">
      <div class="mac-dots">
        <div class="mac-dot dot-red" title="Cerrar"></div>
        <div class="mac-dot dot-yellow" title="Minimizar"></div>
        <div class="mac-dot dot-green" id="zoomToggle" title="Pantalla Completa"></div>
      </div>

      <div class="now-playing-badge">
        <svg class="apple-music-logo" viewBox="0 0 170 170">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.69-7.85-12-14.44-6.19-9.45-11-20.28-14.42-32.51-3.42-12.22-5.13-23.77-5.13-34.64 0-14.78 3.59-27.18 10.77-37.21 7.18-10.02 16.32-15.17 27.42-15.44 5.33 0 10.89 1.34 16.68 4.02 5.79 2.68 9.53 4.08 11.22 4.2 1.48-.13 5.43-1.6 11.85-4.42 6.42-2.82 12.02-4.14 16.8-3.95 12.7.74 22.84 5.4 30.42 13.98-11.08 6.72-16.51 16.03-16.29 27.93.22 9.57 3.96 17.58 11.22 24.03 7.26 6.45 15.79 10.08 25.59 10.89-2.12 6.52-4.68 13.11-7.69 19.78zM119.22 31.05c0-7.39 2.66-14.38 7.98-20.97 5.32-6.59 11.93-10.42 19.83-11.48.21 1.06.32 2.01.32 2.85 0 7.39-2.77 14.59-8.31 21.6-5.54 7.01-12.24 11.03-20.1 12.06-.21-1.38-.32-2.74-.32-4.06z"/>
        </svg>
        <span>Modo Oculto — Yan Block</span>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="fullScreenBtn" title="Pantalla completa (F)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </header>

    <main class="player-main-content">

      <!-- PORTADA Y CONTROLES (IZQUIERDA) -->
      <section class="left-player-panel">
        <div class="cover-wrapper" id="coverContainer">
          <img class="cover-img" id="trackCover" src="https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg" alt="Portada">
        </div>

        <div class="track-details">
          <div class="track-title-row">
            <h1 class="track-title">Modo Oculto</h1>
            <span class="lossless-pill">Lossless</span>
          </div>
          <div class="track-artist">Yan Block</div>
        </div>

        <div class="scrubber-container">
          <div class="progress-bar-rail" id="progressRail">
            <div class="progress-bar-fill" id="progressFill">
              <div class="progress-thumb"></div>
            </div>
          </div>
          <div class="time-indicators">
            <span id="currentTime">0:00</span>
            <span id="remainingTime">-0:00</span>
          </div>
        </div>

        <div class="playback-controls">
          <button class="icon-btn ctrl-secondary" id="shuffleBtn" title="Aleatorio">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary" id="prevBtn" title="Anterior">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>

          <button class="play-pause-circle" id="playPauseBtn" title="Reproducir / Pausa (Espacio)">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary" id="nextBtn" title="Siguiente">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary active" id="repeatBtn" title="Repetir">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
        </div>

        <div class="bottom-accessories">
          <div class="volume-box">
            <button class="icon-btn" id="volumeMuteBtn" title="Silenciar">
              <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="volume-rail" id="volumeRail">
              <div class="volume-fill" id="volumeFill"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- LYRICS ENGINE AMLL (DERECHA) -->
      <section class="right-lyrics-panel" id="lyricsContainer">
        <div class="lyrics-scroll-stage" id="lyricsStage">
          <!-- Cargado en tiempo real desde el TTML -->
        </div>
      </section>

    </main>
  </div>

  <script>
    // URL DIRECTA DEL TTML (CERO LETRAS ESCRITAS EN EL CÓDIGO)
    const TTML_URL = "https://file.garden/aqbkhK4DJSCL_vig/Modo%20Oculto.ttml";

    // Elementos DOM
    const audio = document.getElementById('audioElement');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressRail = document.getElementById('progressRail');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const remainingTimeEl = document.getElementById('remainingTime');
    const lyricsStage = document.getElementById('lyricsStage');
    const fullScreenBtn = document.getElementById('fullScreenBtn');
    const zoomToggle = document.getElementById('zoomToggle');
    const volumeRail = document.getElementById('volumeRail');
    const volumeFill = document.getElementById('volumeFill');
    const volumeMuteBtn = document.getElementById('volumeMuteBtn');

    let isPlaying = false;
    let duration = 0;
    let parsedLyrics = [];
    let activeLineIndex = -1;
    let userManualScroll = false;
    let userScrollTimer = null;

    // ============================================================
    // OSCILADOR DE RESORTE FÍSICO AMLL (SPRING PHYSICS SCROLL)
    // ============================================================
    class AMLLSpringScroller {
      constructor(container, stiffness = 140, damping = 22) {
        this.container = container;
        this.stiffness = stiffness; // Rigidez del resorte
        this.damping = damping;     // Amortiguación
        this.currentY = 0;
        this.targetY = 0;
        this.velocity = 0;
        this.lastTime = performance.now();
      }

      setTarget(y) {
        this.targetY = y;
      }

      step(now) {
        const dt = Math.min((now - this.lastTime) / 1000, 0.064);
        this.lastTime = now;

        if (userManualScroll) {
          this.currentY = this.container.scrollTop;
          this.velocity = 0;
          return;
        }

        // Ecuación de resorte amortiguado de Hooke
        const displacement = this.currentY - this.targetY;
        const springForce = -this.stiffness * displacement;
        const dampingForce = -this.damping * this.velocity;
        const acceleration = springForce + dampingForce;

        this.velocity += acceleration * dt;
        this.currentY += this.velocity * dt;

        if (Math.abs(displacement) < 0.2 && Math.abs(this.velocity) < 0.2) {
          this.currentY = this.targetY;
          this.velocity = 0;
        }

        this.container.scrollTop = this.currentY;
      }
    }

    const springScroller = new AMLLSpringScroller(lyricsStage);

    // ============================================================
    // PARSER TTML ESPECIFICACIÓN AMLL / ITUNES
    // ============================================================
    function parseTimeToMs(t) {
      if (!t) return 0;
      t = t.trim();
      if (t.endsWith('ms')) return parseFloat(t);
      if (t.endsWith('s')) return parseFloat(t) * 1000;
      const parts = t.split(':');
      if (parts.length === 3) {
        return (parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2])) * 1000;
      } else if (parts.length === 2) {
        return (parseFloat(parts[0]) * 60 + parseFloat(parts[1])) * 1000;
      }
      return parseFloat(t) * 1000 || 0;
    }

    function parseTTML(xmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "application/xml");
      const pElements = xmlDoc.querySelectorAll('p');
      const lines = [];

      pElements.forEach((p, idx) => {
        const beginAttr = p.getAttribute('begin') || p.getAttribute('itunes:begin') || '0';
        const endAttr = p.getAttribute('end') || p.getAttribute('itunes:end') || '0';
        const startMs = parseTimeToMs(beginAttr);
        const endMs = parseTimeToMs(endAttr);

        const spans = p.querySelectorAll('span');
        const words = [];

        if (spans.length > 0) {
          spans.forEach(span => {
            const spanBegin = span.getAttribute('begin') || beginAttr;
            const spanEnd = span.getAttribute('end') || endAttr;
            words.push({
              text: span.textContent,
              startTime: parseTimeToMs(spanBegin),
              endTime: parseTimeToMs(spanEnd)
            });
          });
        } else {
          words.push({
            text: p.textContent.trim(),
            startTime: startMs,
            endTime: endMs
          });
        }

        lines.push({
          id: p.getAttribute('itunes:key') || `line_${idx}`,
          startTime: startMs,
          endTime: endMs,
          words: words,
          domElement: null
        });
      });

      return lines;
    }

    // ============================================================
    // CONSTRUCCIÓN DEL DOM ESTILO APPLE MUSIC & AMLL
    // ============================================================
    function buildLyricDOM(lines) {
      lyricsStage.innerHTML = '';
      if (!lines || lines.length === 0) {
        lyricsStage.innerHTML = '<div class="amll-lyric-line is-active">Letra no disponible</div>';
        return;
      }

      lines.forEach((line, idx) => {
        // Interludio instrumental previo si el espacio con el verso anterior es mayor a 4.5s
        if (idx > 0) {
          const prevLine = lines[idx - 1];
          if (line.startTime - prevLine.endTime > 4500) {
            const dots = document.createElement('div');
            dots.className = 'amll-interlude-dots';
            dots.dataset.interludeStart = prevLine.endTime;
            dots.dataset.interludeEnd = line.startTime;
            dots.innerHTML = `
              <div class="amll-dot"></div>
              <div class="amll-dot"></div>
              <div class="amll-dot"></div>
            `;
            lyricsStage.appendChild(dots);
          }
        }

        const lineEl = document.createElement('div');
        lineEl.className = 'amll-lyric-line';
        lineEl.dataset.index = idx;

        // Inyectar spans con soporte para barrido de gradiente AMLL
        line.words.forEach((w, wIdx) => {
          const wordEl = document.createElement('span');
          wordEl.className = 'amll-lyric-word word-pending';
          wordEl.dataset.wordIndex = wIdx;
          wordEl.textContent = w.text;
          lineEl.appendChild(wordEl);
        });

        // Al hacer clic: salto exacto con física inmediata
        lineEl.addEventListener('click', () => {
          audio.currentTime = (line.startTime / 1000);
          if (!isPlaying) togglePlay();
          snapToLine(idx);
        });

        lyricsStage.appendChild(lineEl);
        line.domElement = lineEl;
      });
    }

    // ============================================================
    // CARGA REMOTA DE LA LETRA (TTML)
    // ============================================================
    async function fetchTTMLLyrics() {
      lyricsStage.innerHTML = '<div class="amll-lyric-line is-active">Cargando letra...</div>';
      try {
        let response;
        try {
          response = await fetch(TTML_URL);
        } catch (e) {
          // Fallback a proxy CORS si se abre desde archivo local file://
          response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(TTML_URL)}`);
        }
        const xmlText = await response.text();
        parsedLyrics = parseTTML(xmlText);
        buildLyricDOM(parsedLyrics);
      } catch (err) {
        console.error("Error al cargar TTML:", err);
        lyricsStage.innerHTML = '<div class="amll-lyric-line is-active">No se pudo cargar la letra desde el servidor.</div>';
      }
    }

    // ============================================================
    // LOOP DE ANIMACIÓN Y RENDERIZADO 60FPS (AMLL CORE ENGINE)
    // ============================================================
    function renderFrame(now) {
      // 1. Paso del resorte físico de scroll
      springScroller.step(now);

      const currentMs = audio.currentTime * 1000;

      // 2. Localizar verso activo en este milisegundo
      let currentIdx = -1;
      for (let i = 0; i < parsedLyrics.length; i++) {
        const line = parsedLyrics[i];
        if (currentMs >= line.startTime && currentMs <= line.endTime + 350) {
          currentIdx = i;
          break;
        } else if (currentMs < line.startTime) {
          break;
        }
      }

      if (currentIdx !== activeLineIndex) {
        activeLineIndex = currentIdx;
        if (activeLineIndex !== -1) {
          snapToLine(activeLineIndex);
        }
      }

      // 3. Efectos de profundidad de campo (Blur & Scale según distancia)
      if (parsedLyrics.length > 0) {
        parsedLyrics.forEach((line, i) => {
          if (!line.domElement) return;
          if (activeLineIndex === -1) {
            line.domElement.style.filter = 'blur(1.5px)';
            line.domElement.style.opacity = '0.35';
            line.domElement.style.transform = 'scale(0.96)';
          } else {
            const distance = Math.abs(i - activeLineIndex);
            if (distance === 0) {
              line.domElement.style.filter = 'blur(0px)';
              line.domElement.style.opacity = '1';
              line.domElement.style.transform = 'scale(1.05)';
            } else if (distance === 1) {
              line.domElement.style.filter = 'blur(1.6px)';
              line.domElement.style.opacity = '0.52';
              line.domElement.style.transform = 'scale(0.98)';
            } else if (distance === 2) {
              line.domElement.style.filter = 'blur(2.8px)';
              line.domElement.style.opacity = '0.32';
              line.domElement.style.transform = 'scale(0.95)';
            } else {
              line.domElement.style.filter = 'blur(4px)';
              line.domElement.style.opacity = '0.18';
              line.domElement.style.transform = 'scale(0.92)';
            }
          }
        });
      }

      // 4. Barrido de gradiente palabra por palabra (Apple Music Sweep)
      if (activeLineIndex !== -1 && parsedLyrics[activeLineIndex]) {
        const activeLine = parsedLyrics[activeLineIndex];
        const lineEl = activeLine.domElement;
        if (lineEl) {
          const wordSpans = lineEl.querySelectorAll('.amll-lyric-word');
          activeLine.words.forEach((w, wIdx) => {
            const span = wordSpans[wIdx];
            if (!span) return;

            if (currentMs >= w.endTime) {
              span.className = 'amll-lyric-word word-done';
              span.style.setProperty('--sweep-progress', '100%');
            } else if (currentMs >= w.startTime && currentMs < w.endTime) {
              span.className = 'amll-lyric-word word-singing';
              const progress = Math.max(0, Math.min(1, (currentMs - w.startTime) / (w.endTime - w.startTime)));
              span.style.setProperty('--sweep-progress', `${(progress * 100).toFixed(1)}%`);
            } else {
              span.className = 'amll-lyric-word word-pending';
              span.style.setProperty('--sweep-progress', '0%');
            }
          });
        }
      }

      // 5. Animación de los puntos de interludio
      const interludeEls = lyricsStage.querySelectorAll('.amll-interlude-dots');
      interludeEls.forEach(el => {
        const start = parseFloat(el.dataset.interludeStart);
        const end = parseFloat(el.dataset.interludeEnd);
        if (currentMs >= start && currentMs < end) {
          el.classList.add('is-active');
        } else {
          el.classList.remove('is-active');
        }
      });

      requestAnimationFrame(renderFrame);
    }

    // Calcula la posición focal y asigna el destino al oscilador de resorte
    function snapToLine(index) {
      const line = parsedLyrics[index];
      if (!line || !line.domElement) return;

      const stageHeight = lyricsStage.clientHeight;
      const rowTop = line.domElement.offsetTop;
      const rowHeight = line.domElement.clientHeight;

      // Posición focal Apple Music (~32% desde la parte superior)
      const targetScroll = rowTop - (stageHeight * 0.32) + (rowHeight / 2);
      springScroller.setTarget(Math.max(0, targetScroll));
    }

    // Control de scroll manual
    function markUserScrolling() {
      userManualScroll = true;
      clearTimeout(userScrollTimer);
      userScrollTimer = setTimeout(() => {
        userManualScroll = false;
        if (activeLineIndex !== -1) snapToLine(activeLineIndex);
      }, 2800);
    }

    lyricsStage.addEventListener('wheel', markUserScrolling, { passive: true });
    lyricsStage.addEventListener('touchstart', markUserScrolling, { passive: true });

    // ============================================================
    // CONTROLES DE REPRODUCCIÓN Y EVENTOS
    // ============================================================
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          document.body.classList.remove('is-paused');
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(err => console.warn(err));
      } else {
        audio.pause();
        isPlaying = false;
        document.body.classList.add('is-paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    document.getElementById('coverContainer').addEventListener('click', togglePlay);

    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration && !isNaN(audio.duration)) {
        duration = audio.duration;
        remainingTimeEl.textContent = `-${formatTime(duration)}`;
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (duration > 0) {
        const pct = (audio.currentTime / duration) * 100;
        progressFill.style.width = `${Math.min(pct, 100)}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        const remSec = Math.max(0, duration - audio.currentTime);
        remainingTimeEl.textContent = `-${formatTime(remSec)}`;
      }
    });

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      audio.play();
    });

    // Scrubber
    function handleScrub(e) {
      const rect = progressRail.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const offsetX = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const percentage = offsetX / rect.width;
      audio.currentTime = percentage * duration;
    }

    progressRail.addEventListener('mousedown', (e) => {
      handleScrub(e);
      window.addEventListener('mousemove', handleScrub);
      window.addEventListener('mouseup', () => {
        window.removeEventListener('mousemove', handleScrub);
      }, { once: true });
    });

    // Volumen
    function setVolume(pct) {
      pct = Math.max(0, Math.min(1, pct));
      audio.volume = pct;
      volumeFill.style.width = `${pct * 100}%`;
    }

    volumeRail.addEventListener('click', (e) => {
      const rect = volumeRail.getBoundingClientRect();
      setVolume((e.clientX - rect.left) / rect.width);
    });

    volumeMuteBtn.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        setVolume(0);
      } else {
        setVolume(parseFloat(audio.dataset.prevVol || 0.8));
      }
    });

    // Pantalla completa
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    fullScreenBtn.addEventListener('click', toggleFullScreen);
    zoomToggle.addEventListener('click', toggleFullScreen);

    // Atajos de teclado
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime = Math.min(duration, audio.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      } else if (e.code === 'ArrowUp') {
        setVolume(audio.volume + 0.05);
      } else if (e.code === 'ArrowDown') {
        setVolume(audio.volume - 0.05);
      }
    });

    // Iniciar carga del TTML y loop de animación a 60 FPS
    document.body.classList.add('is-paused');
    fetchTTMLLyrics();
    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
