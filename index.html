<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SAIKO - COSAS QUE NO TE DIJE | Apple Music AMLL</title>
  
  <!-- Tipografía Apple SF Pro / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      --ease-apple: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
      
      --color-bg-dark: #050508;
      --color-inactive-text: rgba(255, 255, 255, 0.30);
      --color-active-glow: rgba(255, 255, 255, 0.90);
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--color-bg-dark);
      font-family: var(--font-display);
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================================================
       1. AMBIENT GLOW FLUIDO (CANVAS + TEXTURA DE GRANO)
       ======================================================== */
    #ambient-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #ambient-canvas {
      position: absolute;
      inset: -25%;
      width: 150%;
      height: 150%;
      filter: blur(85px) saturate(180%);
      transform: translateZ(0);
      will-change: transform;
    }

    .grain-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.038;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 45% 50%, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.72) 100%);
    }

    /* ========================================================
       ESTRUCTURA PRINCIPAL (SPLIT VIEW APPLE MUSIC)
       ======================================================== */
    .apple-music-app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1500px;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(360px, 440px) 1fr;
      padding: clamp(20px, 4vh, 48px);
      gap: clamp(28px, 4vw, 72px);
    }

    /* Panel Izquierdo: Artwork y Reproductor */
    .player-deck {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      z-index: 2;
    }

    .album-cover-wrapper {
      position: relative;
      width: min(100%, 380px);
      aspect-ratio: 1;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--glass-border);
      transition: transform 0.6s var(--ease-apple), box-shadow 0.6s ease;
      cursor: pointer;
    }

    .album-cover-wrapper:hover {
      transform: scale(1.025);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.25);
    }

    .album-cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-meta {
      width: 100%;
      max-width: 380px;
      margin-top: 28px;
    }

    .track-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .track-title {
      font-size: clamp(22px, 2.2vw, 28px);
      font-weight: 800;
      letter-spacing: -0.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }

    .track-artist {
      font-size: 17px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 4px;
      letter-spacing: -0.01em;
    }

    /* Controles de Reproducción */
    .playback-controls {
      width: 100%;
      max-width: 380px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .scrubber-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      transition: height 0.2s ease;
    }

    .scrubber-container:hover {
      height: 8px;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 4px;
      pointer-events: none;
      transition: width 0.08s linear;
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-text);
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-top: 8px;
    }

    .control-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s var(--ease-spring), color 0.2s ease;
    }

    .control-btn:hover {
      color: #fff;
      transform: scale(1.15);
    }

    .btn-play-pause {
      background: #ffffff;
      border: none;
      color: #000000;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.25);
      transition: transform 0.2s var(--ease-spring), box-shadow 0.2s ease;
    }

    .btn-play-pause:hover {
      transform: scale(1.08);
      box-shadow: 0 14px 40px rgba(255, 255, 255, 0.4);
    }

    .btn-play-pause:active {
      transform: scale(0.95);
    }

    /* ========================================================
       2. CONTENEDOR AMLL (APPLE MUSIC LIKE LYRICS)
       ======================================================== */
    .lyrics-deck {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    }

    .lyrics-scroll-container {
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      padding: 38vh 0 52vh 0;
      scroll-behavior: auto;
      scrollbar-width: none;
    }

    .lyrics-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .lyrics-content {
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 3.8vh, 40px);
      width: 100%;
      will-change: transform;
    }

    /* Estado Inactivo de Línea */
    .amll-line {
      position: relative;
      font-size: clamp(30px, 3.4vw, 50px);
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: -0.03em;
      color: var(--color-inactive-text);
      cursor: pointer;
      opacity: 0.32;
      filter: blur(2px);
      transform-origin: left center;
      transform: scale(0.94) translateZ(0);
      transition: 
        transform 0.6s var(--ease-apple), 
        filter 0.5s var(--ease-apple), 
        opacity 0.5s var(--ease-apple);
    }

    .amll-line:hover {
      opacity: 0.65;
      filter: blur(0px);
    }

    /* Estado Activo de Línea */
    .amll-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1) translateZ(0);
      color: #ffffff;
    }

    /* ========================================================
       BARRIDO PROGRESIVO DE PALABRAS / SÍLABAS
       ======================================================== */
    .amll-word {
      display: inline-block;
      white-space: pre-wrap;
      position: relative;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffffff var(--word-progress, 0%),
        rgba(255, 255, 255, 0.35) var(--word-progress, 0%),
        rgba(255, 255, 255, 0.35) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform-origin: center bottom;
      transition: transform 0.25s var(--ease-apple);
    }

    .amll-line.active .amll-word.current-word {
      transform: scale(1.03);
      filter: drop-shadow(0 0 16px var(--color-active-glow));
    }

    /* Loader */
    .lyrics-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
    }

    /* ========================================================
       ADAPTATIVIDAD MOBILE
       ======================================================== */
    @media (max-width: 960px) {
      .apple-music-app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        padding: 16px;
        gap: 16px;
      }

      .player-deck {
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        background: var(--glass-surface);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        height: auto;
      }

      .album-cover-wrapper {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        flex-shrink: 0;
      }

      .track-meta {
        margin-top: 0;
        flex: 1;
      }

      .track-badge { display: none; }
      .track-title { font-size: 16px; }
      .track-artist { font-size: 13px; }

      .playback-controls { display: none; }

      .amll-line {
        font-size: clamp(26px, 6.8vw, 36px);
      }
    }
  </style>
</head>
<body>

  <!-- Fondo Ambiental Reactivo a 60 FPS -->
  <div id="ambient-container">
    <canvas id="ambient-canvas"></canvas>
    <div class="grain-overlay"></div>
    <div class="vignette-overlay"></div>
  </div>

  <!-- Audio Nativo -->
  <audio id="audio-engine" preload="auto" crossorigin="anonymous">
    <source src="https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_spotdown.org.mp3" type="audio/mp3">
  </audio>

  <!-- Aplicación Principal -->
  <div class="apple-music-app">
    
    <!-- Lado Izquierdo: Reproductor & Portada -->
    <aside class="player-deck">
      <div class="album-cover-wrapper" id="cover-btn">
        <img id="cover-image" src="https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_640x640.jpg" alt="Portada Saiko" crossorigin="anonymous" />
      </div>

      <div class="track-meta">
        <div class="track-badge">Lossless &bull; Apple Digital Master</div>
        <h1 class="track-title">COSAS QUE NO TE DIJE</h1>
        <h2 class="track-artist">SAIKO</h2>
      </div>

      <div class="playback-controls">
        <div class="scrubber-container" id="scrubber">
          <div class="scrubber-fill" id="scrubber-fill"></div>
        </div>
        <div class="time-indicators">
          <span id="time-current">0:00</span>
          <span id="time-total">-0:00</span>
        </div>
        
        <div class="controls-row">
          <button class="control-btn" id="btn-rewind" title="Retroceder 10s">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          
          <button class="btn-play-pause" id="btn-play-pause" aria-label="Reproducir/Pausar">
            <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <button class="control-btn" id="btn-forward" title="Adelantar 10s">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Lado Derecho: Motor de Letras AMLL -->
    <main class="lyrics-deck">
      <div class="lyrics-scroll-container" id="lyrics-scroller">
        <div class="lyrics-content" id="lyrics-mount">
          <div class="lyrics-loader">Cargando letras sincronizadas...</div>
        </div>
      </div>
    </main>

  </div>

  <script>
    /**
     * MÓDULO 1: Extractor de Color & Fondo Fluido Apple Music 2026
     */
    class AmbientEngine {
      constructor(canvasId, imageElement) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.img = imageElement;
        
        // Paleta base de respaldo
        this.colors = ['#1a2a6c', '#b21f1f', '#fdbb2d', '#130f40'];
        this.orbs = [];
        this.time = 0;

        this.initCanvas();
        this.bindEvents();
      }

      initCanvas() {
        this.width = this.canvas.width = window.innerWidth * 0.45;
        this.height = this.canvas.height = window.innerHeight * 0.45;

        this.orbs = [
          { x: this.width * 0.2, y: this.height * 0.3, r: this.width * 0.5, vx: 0.002, vy: 0.003, color: this.colors[0] },
          { x: this.width * 0.8, y: this.height * 0.25, r: this.width * 0.55, vx: -0.003, vy: 0.0025, color: this.colors[1] },
          { x: this.width * 0.35, y: this.height * 0.75, r: this.width * 0.45, vx: 0.0025, vy: -0.0035, color: this.colors[2] },
          { x: this.width * 0.75, y: this.height * 0.8, r: this.width * 0.6, vx: -0.002, vy: -0.002, color: this.colors[3] }
        ];

        this.extractColors();
      }

      extractColors() {
        const process = () => {
          try {
            const off = document.createElement('canvas');
            const oCtx = off.getContext('2d');
            off.width = 40;
            off.height = 40;
            oCtx.drawImage(this.img, 0, 0, 40, 40);
            
            const data1 = oCtx.getImageData(8, 8, 1, 1).data;
            const data2 = oCtx.getImageData(32, 8, 1, 1).data;
            const data3 = oCtx.getImageData(8, 32, 1, 1).data;
            const data4 = oCtx.getImageData(32, 32, 1, 1).data;

            const rgb = (d) => `rgb(${d[0]}, ${d[1]}, ${d[2]})`;
            this.colors = [rgb(data1), rgb(data2), rgb(data3), rgb(data4)];
            this.orbs.forEach((orb, i) => orb.color = this.colors[i]);
          } catch (e) {
            console.warn("Extracción pixel fallida por CORS, usando paleta armónica.");
          }
        };

        if (this.img.complete) process();
        else this.img.onload = process;
      }

      bindEvents() {
        window.addEventListener('resize', () => {
          this.width = this.canvas.width = window.innerWidth * 0.45;
          this.height = this.canvas.height = window.innerHeight * 0.45;
        });
      }

      render() {
        this.time += 0.012;
        this.ctx.fillStyle = '#06070a';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.orbs.forEach((orb, i) => {
          const ox = Math.sin(this.time * 18 * orb.vx + i) * (this.width * 0.18);
          const oy = Math.cos(this.time * 18 * orb.vy + i) * (this.height * 0.18);
          const cx = orb.x + ox;
          const cy = orb.y + oy;

          const grad = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, orb.r);
          grad.addColorStop(0, orb.color);
          grad.addColorStop(1, 'rgba(6, 7, 10, 0)');

          this.ctx.globalCompositeOperation = 'screen';
          this.ctx.fillStyle = grad;
          this.ctx.beginPath();
          this.ctx.arc(cx, cy, orb.r, 0, Math.PI * 2);
          this.ctx.fill();
        });

        requestAnimationFrame(() => this.render());
      }
    }

    /**
     * MÓDULO 2: Parser de TTML para Apple Music Like Lyrics
     */
    class TTMLParser {
      static parseTime(timeStr) {
        if (!timeStr) return 0;
        timeStr = timeStr.trim();
        if (timeStr.endsWith('ms')) return parseFloat(timeStr) / 1000;
        if (timeStr.endsWith('s')) timeStr = timeStr.slice(0, -1);
        
        const parts = timeStr.split(':');
        if (parts.length === 3) {
          return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
        } else if (parts.length === 2) {
          return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
        }
        return parseFloat(timeStr) || 0;
      }

      static async fetchAndParse(url) {
        const response = await fetch(url);
        const xmlString = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlString, "application/xml");
        const paragraphs = Array.from(doc.querySelectorAll('p'));

        return paragraphs.map((p, pIndex) => {
          const lineStart = TTMLParser.parseTime(p.getAttribute('begin'));
          const lineEnd = TTMLParser.parseTime(p.getAttribute('end'));
          
          const spans = Array.from(p.querySelectorAll('span'));
          let words = [];

          if (spans.length > 0) {
            words = spans.map((span, wIndex) => ({
              id: `w-${pIndex}-${wIndex}`,
              text: span.textContent,
              start: TTMLParser.parseTime(span.getAttribute('begin') || p.getAttribute('begin')),
              end: TTMLParser.parseTime(span.getAttribute('end') || p.getAttribute('end'))
            }));
          } else {
            // Si la línea no tiene spans, dividir por palabras
            const rawWords = (p.textContent || "").split(" ");
            const step = (lineEnd - lineStart) / Math.max(1, rawWords.length);
            words = rawWords.map((txt, wIndex) => ({
              id: `w-${pIndex}-${wIndex}`,
              text: txt + " ",
              start: lineStart + wIndex * step,
              end: lineStart + (wIndex + 1) * step
            }));
          }

          return {
            id: `l-${pIndex}`,
            start: lineStart,
            end: lineEnd,
            words
          };
        });
      }
    }

    /**
     * MÓDULO 3: Motor de Renderizado AMLL & Física de Scroll
     */
    class AMLLPlayer {
      constructor(lines, containerElement, scrollerElement) {
        this.lines = lines;
        this.container = containerElement;
        this.scroller = scrollerElement;
        
        this.activeLineIndex = -1;
        this.userScrolling = false;
        this.userScrollTimeout = null;

        // Física de resorte (Spring)
        this.targetScrollTop = 0;
        this.currentScrollTop = 0;
        this.springStiffness = 0.085;
        this.springDamping = 0.78;
        this.springVelocity = 0;

        this.onSeekCallback = null;

        this.buildDOM();
        this.bindEvents();
        this.startSpringLoop();
      }

      buildDOM() {
        this.container.innerHTML = '';
        this.lineElements = [];

        this.lines.forEach((line, lIndex) => {
          const lineDiv = document.createElement('div');
          lineDiv.className = 'amll-line';
          lineDiv.dataset.index = lIndex;

          line.words.forEach((w) => {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'amll-word';
            wordSpan.id = w.id;
            wordSpan.textContent = w.text;
            lineDiv.appendChild(wordSpan);
          });

          // Seek interactivo al hacer click en cualquier verso
          lineDiv.addEventListener('click', () => {
            if (this.onSeekCallback) {
              this.onSeekCallback(line.start);
            }
          });

          this.container.appendChild(lineDiv);
          this.lineElements.push(lineDiv);
        });
      }

      bindEvents() {
        const handleUserScroll = () => {
          this.userScrolling = true;
          this.currentScrollTop = this.scroller.scrollTop;
          this.targetScrollTop = this.scroller.scrollTop;

          clearTimeout(this.userScrollTimeout);
          // Cooldown de 3 segundos para retomar el auto-scroll
          this.userScrollTimeout = setTimeout(() => {
            this.userScrolling = false;
            this.scrollToActiveLine();
          }, 3000);
        };

        this.scroller.addEventListener('wheel', handleUserScroll, { passive: true });
        this.scroller.addEventListener('touchmove', handleUserScroll, { passive: true });
      }

      scrollToActiveLine() {
        if (this.activeLineIndex === -1 || this.userScrolling) return;

        const activeElement = this.lineElements[this.activeLineIndex];
        if (!activeElement) return;

        const scrollerRect = this.scroller.getBoundingClientRect();
        const elementRect = activeElement.getBoundingClientRect();

        // Centrado áureo vertical (~38% desde arriba)
        const targetOffset = (elementRect.top - scrollerRect.top) + this.scroller.scrollTop - (scrollerRect.height * 0.38);
        this.targetScrollTop = Math.max(0, targetOffset);
      }

      startSpringLoop() {
        const updatePhysics = () => {
          if (!this.userScrolling) {
            const force = (this.targetScrollTop - this.currentScrollTop) * this.springStiffness;
            this.springVelocity = (this.springVelocity + force) * this.springDamping;
            this.currentScrollTop += this.springVelocity;

            if (Math.abs(this.targetScrollTop - this.currentScrollTop) > 0.1 || Math.abs(this.springVelocity) > 0.05) {
              this.scroller.scrollTop = this.currentScrollTop;
            }
          }
          requestAnimationFrame(updatePhysics);
        };
        requestAnimationFrame(updatePhysics);
      }

      update(currentTime) {
        let currentLineIdx = -1;

        for (let i = 0; i < this.lines.length; i++) {
          const line = this.lines[i];
          if (currentTime >= line.start && currentTime <= line.end + 0.3) {
            currentLineIdx = i;
            break;
          } else if (currentTime > line.end && (i === this.lines.length - 1 || currentTime < this.lines[i+1].start)) {
            currentLineIdx = i;
            break;
          }
        }

        if (currentLineIdx !== this.activeLineIndex) {
          if (this.activeLineIndex !== -1 && this.lineElements[this.activeLineIndex]) {
            this.lineElements[this.activeLineIndex].classList.remove('active');
          }

          this.activeLineIndex = currentLineIdx;

          if (this.activeLineIndex !== -1) {
            const activeEl = this.lineElements[this.activeLineIndex];
            activeEl.classList.add('active');
            this.scrollToActiveLine();
          }
        }

        // Progreso de palabra a nivel de sub-píxel
        if (this.activeLineIndex !== -1) {
          const lineData = this.lines[this.activeLineIndex];

          lineData.words.forEach(word => {
            const wordEl = document.getElementById(word.id);
            if (!wordEl) return;

            if (currentTime < word.start) {
              wordEl.style.setProperty('--word-progress', `0%`);
              wordEl.classList.remove('current-word');
            } else if (currentTime >= word.end) {
              wordEl.style.setProperty('--word-progress', `100%`);
              wordEl.classList.remove('current-word');
            } else {
              const progress = ((currentTime - word.start) / (word.end - word.start)) * 100;
              wordEl.style.setProperty('--word-progress', `${progress.toFixed(2)}%`);
              wordEl.classList.add('current-word');
            }
          });
        }
      }
    }

    /**
     * MÓDULO 4: Inicialización y Controlador de Audio Real
     */
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Iniciar Ambient Engine
      const ambient = new AmbientEngine('ambient-canvas', document.getElementById('cover-image'));
      ambient.render();

      // 2. Elementos del DOM y Audio
      const audio = document.getElementById('audio-engine');
      const scrubber = document.getElementById('scrubber');
      const scrubberFill = document.getElementById('scrubber-fill');
      const timeCurrent = document.getElementById('time-current');
      const timeTotal = document.getElementById('time-total');
      const btnPlayPause = document.getElementById('btn-play-pause');
      const playIcon = document.getElementById('play-icon');
      const btnRewind = document.getElementById('btn-rewind');
      const btnForward = document.getElementById('btn-forward');
      const coverBtn = document.getElementById('cover-btn');

      const formatTime = (sec) => {
        if (isNaN(sec) || sec < 0) return "0:00";
        const mins = Math.floor(sec / 60);
        const secs = Math.floor(sec % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      // 3. Descargar y procesar TTML de SAIKO
      const TTML_URL = 'https://file.garden/alq0ENqplE9QfqJV/SAIKO%20-%20COSAS%20QUE%20NO%20TE%20DIJE.ttml';
      let amll = null;

      try {
        const parsedLines = await TTMLParser.fetchAndParse(TTML_URL);
        const lyricsScroller = document.getElementById('lyrics-scroller');
        const lyricsMount = document.getElementById('lyrics-mount');
        
        amll = new AMLLPlayer(parsedLines, lyricsMount, lyricsScroller);
        amll.onSeekCallback = (seekTime) => {
          audio.currentTime = seekTime;
          if (audio.paused) audio.play();
        };
      } catch (err) {
        console.error("Error al cargar TTML:", err);
        document.getElementById('lyrics-mount').innerHTML = '<div class="lyrics-loader">No se pudieron cargar las letras.</div>';
      }

      // 4. Controles de Reproducción
      const togglePlayback = () => {
        if (audio.paused) {
          audio.play().catch(e => console.log("Interacción requerida"));
        } else {
          audio.pause();
        }
      };

      btnPlayPause.addEventListener('click', togglePlayback);
      coverBtn.addEventListener('click', togglePlayback);

      audio.addEventListener('play', () => {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      });

      audio.addEventListener('pause', () => {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      });

      btnRewind.addEventListener('click', () => {
        audio.currentTime = Math.max(0, audio.currentTime - 10);
      });

      btnForward.addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
      });

      scrubber.addEventListener('click', (e) => {
        const rect = scrubber.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        if (audio.duration) {
          audio.currentTime = pct * audio.duration;
        }
      });

      // Atajos de Teclado Apple (Barra espaciadora y Flechas)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayback();
        } else if (e.code === 'ArrowLeft') {
          audio.currentTime = Math.max(0, audio.currentTime - 5);
        } else if (e.code === 'ArrowRight') {
          audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
        }
      });

      // 5. Loop Maestro de Sincronización (60 FPS)
      function masterLoop() {
        const curTime = audio.currentTime;
        const dur = audio.duration || 0;

        if (amll) {
          amll.update(curTime);
        }

        if (dur > 0) {
          const pct = (curTime / dur) * 100;
          scrubberFill.style.width = `${pct}%`;
          timeCurrent.textContent = formatTime(curTime);
          timeTotal.textContent = `-${formatTime(dur - curTime)}`;
        }

        requestAnimationFrame(masterLoop);
      }

      requestAnimationFrame(masterLoop);
    });
  </script>
</body>
