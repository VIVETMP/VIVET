<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Block - Flow</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería para extraer portadas (con fallback para Drive) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ========================
           ESTILOS CSS
           ======================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #000; color: #fff; height: 100vh; overflow: hidden; }

        .layout {
            display: grid;
            grid-template-columns: 70px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar { background-color: #000; display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid #181818; }
        .logo { color: #1DB954; font-size: 30px; margin-bottom: 40px; }
        .menu-icons { display: flex; flex-direction: column; gap: 30px; color: #A7A7A7; font-size: 20px; align-items: center; }
        .menu-icons i:hover { color: #fff; cursor: pointer; }
        .user-avatar-small { width: 35px; height: 35px; border-radius: 50%; background: #282828; display: flex; align-items: center; justify-content: center; color: #1DB954; }

        /* Main Content & Topbar */
        .main-content { background: linear-gradient(to right, #1a1a1a 0%, #080808 60%); position: relative; overflow-y: auto; }
        .topbar { display: flex; padding: 20px 40px; align-items: center; gap: 30px; position: absolute; top: 0; width: 100%; z-index: 10; }
        .nav-arrows { display: flex; gap: 15px; color: #A7A7A7; font-size: 18px; cursor: pointer; }
        .top-tabs { display: flex; gap: 10px; }
        .tab { background: rgba(255, 255, 255, 0.05); padding: 8px 16px; border-radius: 6px; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .tab.active { background: rgba(255, 255, 255, 0.15); border-bottom: 2px solid #1DB954; }
        .tab .label { font-size: 9px; color: #A7A7A7; }
        .tab .value { font-size: 13px; font-weight: bold; margin-top: 2px; }
        .wave-icon { position: absolute; right: 10px; top: 15px; color: #1DB954; font-size: 14px; }

        /* Artist Section */
        .artist-section { display: flex; height: 100%; padding-top: 100px; }
        .artist-info { flex: 1.2; position: relative; display: flex; flex-direction: column; justify-content: center; padding-left: 40px; }

        /* Efecto de difuminado sobre la imagen de Yan Block */
        .artist-bg {
            position: absolute; top: 0; left: 0; width: 130%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.9;
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 95%);
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 95%);
        }

        .artist-details { position: relative; z-index: 1; }
        .listeners { font-size: 12px; color: #A7A7A7; letter-spacing: 1px; }
        .artist-name { font-size: 85px; font-weight: 900; letter-spacing: -2px; margin: 5px 0; }
        .following { font-size: 12px; color: #A7A7A7; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }

        /* Right Section - Canciones */
        .artist-content { flex: 1; padding: 0 40px; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 30px; margin-top: 20px;}
        h3 { font-size: 12px; color: #A7A7A7; letter-spacing: 1px; margin-bottom: 15px; font-weight: normal; }

        .release-card { display: flex; align-items: center; gap: 15px; }
        .release-card img { width: 70px; height: 70px; border-radius: 4px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .release-info h4 { font-size: 16px; margin-bottom: 5px; }
        .release-info p { font-size: 13px; color: #A7A7A7; }

        .song-list { list-style: none; display: flex; flex-direction: column; gap: 5px; padding-bottom: 20px; }
        .song-item { display: flex; align-items: center; padding: 10px; border-radius: 5px; cursor: pointer; transition: background 0.2s; }
        .song-item:hover { background: rgba(255,255,255,0.1); }
        .song-item.active .song-title-col h4 { color: #1DB954; }

        .song-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; margin-right: 15px; }
        .song-title-col { flex: 2; }
        .song-title-col h4 { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
        .song-title-col p { font-size: 12px; color: #A7A7A7; }
        .song-plays { flex: 1; color: #A7A7A7; font-size: 13px; text-align: right; }
        .song-time { flex: 1; color: #A7A7A7; font-size: 13px; text-align: right; }
        .song-heart { color: #1DB954; margin-left: 20px; font-size: 14px; }

        /* Reproductor Bottom */
        .player { grid-column: 1 / -1; background-color: #181818; border-top: 1px solid #282828; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 20;}
        .now-playing { display: flex; align-items: center; gap: 15px; width: 30%; }
        .now-playing img { width: 56px; height: 56px; border-radius: 4px; object-fit: cover; }
        .track-info h4 { font-size: 14px; margin-bottom: 4px; }
        .track-info p { font-size: 12px; color: #A7A7A7; }

        .player-controls { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .buttons { display: flex; align-items: center; gap: 20px; color: #A7A7A7; margin-bottom: 8px; font-size: 14px;}
        .buttons i:hover { color: #fff; cursor: pointer; }
        .play-pause { width: 32px; height: 32px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }

        .progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; color: #A7A7A7; }
        .progress-bar { flex: 1; height: 4px; background: #535353; border-radius: 2px; cursor: pointer; display: flex; }
        .progress { width: 0%; background: #fff; border-radius: 2px; }
        .progress-bar:hover .progress { background: #1DB954; }

        .player-actions { width: 30%; display: flex; justify-content: flex-end; gap: 15px; color: #A7A7A7; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- Barra Lateral Izquierda -->
        <nav class="sidebar">
            <div class="logo"><i class="fab fa-spotify"></i></div>
            <div class="menu-icons">
                <div class="user-avatar-small"><i class="fas fa-user"></i></div>
                <i class="fas fa-search"></i>
                <i class="fas fa-compact-disc"></i>
                <i class="fas fa-swatchbook"></i>
                <i class="fas fa-microphone"></i>
                <i class="fas fa-music"></i>
            </div>
        </nav>

        <!-- Contenido Principal -->
        <main class="main-content">
            <!-- Menú Superior -->
            <header class="topbar">
                <div class="nav-arrows">
                    <i class="fas fa-chevron-left"></i>
                    <i class="fas fa-chevron-right"></i>
                </div>
                <div class="top-tabs">
                    <div class="tab active">
                        <span class="label">ARTIST</span>
                        <span class="value">YAN BLOCK</span>
                        <i class="fas fa-chart-bar wave-icon"></i>
                    </div>
                    <div class="tab">
                        <span class="label">PLAYLIST</span>
                        <span class="value">YAN BLOCK'S GOLD</span>
                    </div>
                    <div class="tab">
                        <span class="label">PARTY</span>
                        <span class="value">Remote Play</span>
                    </div>
                    <div class="tab user-tab">
                        <span class="label">USER</span>
                        <span class="value">Tu Perfil</span>
                    </div>
                </div>
            </header>

            <div class="artist-section">
                <!-- Foto e info de Yan Block conectada a Drive -->
                <div class="artist-info">
                    <img src="https://drive.google.com/uc?export=download&id=14f4pd3End-vTeHdVWPnHes0S5uaXkAtT" alt="Yan Block" class="artist-bg">
                    <div class="artist-details">
                        <p class="listeners">89,293,201 MONTHLY LISTENERS</p>
                        <h1 class="artist-name">Yan Block</h1>
                        <p class="following">FOLLOWING <i class="fas fa-check"></i></p>
                    </div>
                </div>

                <!-- Lado Derecho: Canciones -->
                <div class="artist-content">
                    <div class="new-release">
                        <h3>NEW RELEASE</h3>
                        <div class="release-card">
                            <img src="" alt="Release Cover" id="new-release-cover" style="background:#282828;">
                            <div class="release-info">
                                <h4 id="new-release-title">Cargando...</h4>
                                <p>Yan Block</p>
                            </div>
                        </div>
                    </div>

                    <div class="popular-songs">
                        <h3>POPULAR SONGS</h3>
                        <ul class="song-list" id="song-list">
                            <!-- JS inyectará las canciones aquí dinámicamente -->
                        </ul>
                    </div>
                </div>
            </div>
        </main>

        <!-- Reproductor Inferior -->
        <footer class="player">
            <div class="now-playing">
                <img src="" alt="Now Playing" id="player-cover" style="background:#282828;">
                <div class="track-info">
                    <h4 id="player-title">Selecciona una canción</h4>
                    <p id="player-artist">Yan Block</p>
                </div>
            </div>
            <div class="player-controls">
                <div class="buttons">
                    <i class="fas fa-random"></i>
                    <i class="fas fa-step-backward"></i>
                    <div class="play-pause" onclick="togglePlay()">
                        <i class="fas fa-play" id="play-icon"></i>
                    </div>
                    <i class="fas fa-step-forward"></i>
                    <i class="fas fa-redo"></i>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="total-duration">0:00</span>
                </div>
            </div>
            <div class="player-actions">
                <i class="fas fa-desktop"></i>
                <i class="fas fa-volume-up"></i>
            </div>
        </footer>
    </div>
    
    <audio id="audio-player"></audio>

    <script>
        /* ========================
           LÓGICA JAVASCRIPT
           ======================== */
           
        // Datos extraídos de tu carpeta de Google Drive
        const imageDriveUrl = "https://drive.google.com/uc?export=download&id=14f4pd3End-vTeHdVWPnHes0S5uaXkAtT";
        
        const cancionesDrive =[
            { title: "111", artist: "Yan Block", url: "https://drive.google.com/uc?export=download&id=1v2R-KJcu2OAkqc2gply0EcLt0mVunCfO" },
            { title: "444 - REMIX", artist: "Yan Block, De La Rose, Hades66, Ñengo Flow", url: "https://drive.google.com/uc?export=download&id=1tjcWVFrapFCgPfHq-rac5ezioFpQyFtJ" },
            { title: "444", artist: "Yan Block, Panda Black", url: "https://drive.google.com/uc?export=download&id=1zwvN7BgdwuxO75UXgzPTG2GdH3Pm-o0q" },
            { title: "EXPRESSO MARTINI", artist: "Rauw Alejandro, Marconi Impara, Yan Block", url: "https://drive.google.com/uc?export=download&id=1koK5jbrjNKHHY9PXUfowTiZWpf8pzKLF" },
            { title: "SECUESTRO", artist: "Slayter, Yan Block, NTG", url: "https://drive.google.com/uc?export=download&id=173xRcmCjG7OqYm2Av5G2-wkzTHZL13vI" },
            { title: "TALENTO", artist: "Yan Block, Panda Black", url: "https://drive.google.com/uc?export=download&id=1Ps1f_wdDKV-OMmUT7N-bgRPA3ThDEOwg" },
            { title: "VACILE", artist: "Yan Block", url: "https://drive.google.com/uc?export=download&id=1AYMlk78a7TSd786led3A87q5mDSIyC_U" },
            { title: "WYA REMIX RED", artist: "J Abdiel, De La Rose, Yan Block, iZaak, Jay Wheeler", url: "https://drive.google.com/uc?export=download&id=1usmf9P4THWLKoKly91dpYvF3YJstuDiG" },
            { title: "YO SE", artist: "Yan Block, TORRRES", url: "https://drive.google.com/uc?export=download&id=1Xl-ad7swVn6iHMR4M-HuUCZk2BYpQePQ" },
            { title: "YOGURCITO REMIX", artist: "Blessd, Anuel AA, Yan Block, Luar La L, Kris R., ROA", url: "https://drive.google.com/uc?export=download&id=1I_f9OAOW1-OM_P_BfSpsepT4inpZeNF1" }
        ];

        const songListElement = document.getElementById('song-list');
        const audioPlayer = document.getElementById('audio-player');
        const playIcon = document.getElementById('play-icon');
        const progress = document.getElementById('progress');
        let currentPlayingIndex = -1;
        let songsData =[];

        // 1. INICIALIZAR LA LISTA
        function init() {
            cancionesDrive.forEach((songInfo, index) => {
                songsData.push({ 
                    id: index, 
                    url: songInfo.url, 
                    title: songInfo.title, 
                    artist: songInfo.artist, 
                    cover: '' 
                });

                // Vistas simuladas para el diseño
                const plays = (Math.floor(Math.random() * 9000000) + 100000).toLocaleString('en-US');

                const li = document.createElement('li');
                li.className = 'song-item';
                li.id = `song-${index}`;
                li.innerHTML = `
                    <img src="" id="thumb-${index}" class="song-thumb" style="display:none;">
                    <div class="song-title-col">
                        <h4>${songInfo.title}</h4>
                        <p>${songInfo.artist}</p>
                    </div>
                    <div class="song-plays">${plays}</div>
                    <div class="song-time" id="time-${index}">--:--</div>
                    <i class="fas fa-heart song-heart"></i>
                `;
                li.addEventListener('click', () => playSong(index));
                songListElement.appendChild(li);

                // Asignar portadas
                extraerPortadaMP3(songInfo.url, index);
            });
        }

        // 2. LÓGICA DE PORTADAS (Con fallback para Google Drive)
        function extraerPortadaMP3(url, index) {
            jsmediatags.read(url, {
                onSuccess: function(tag) {
                    const picture = tag.tags.picture;
                    if (picture) {
                        let base64String = "";
                        for (let i = 0; i < picture.data.length; i++) {
                            base64String += String.fromCharCode(picture.data[i]);
                        }
                        const imageUrl = `data:${picture.format};base64,${window.btoa(base64String)}`;
                        setCover(index, imageUrl);
                    } else {
                        setCover(index, imageDriveUrl); // Fallback imagen de drive
                    }
                },
                onError: function(error) {
                    // Google Drive bloquea peticiones de metadatos mediante CORS.
                    // Así que inyectamos directamente la imagen del artista como portada.
                    setCover(index, imageDriveUrl);
                }
            });
        }

        function setCover(index, imageUrl) {
            songsData[index].cover = imageUrl;
            const thumb = document.getElementById(`thumb-${index}`);
            if(thumb) {
                thumb.src = imageUrl;
                thumb.style.display = "block";
            }
            if(index === 0) {
                document.getElementById('new-release-cover').src = imageUrl;
                document.getElementById('new-release-title').innerText = songsData[index].title;
            }
        }

        // 3. CONTROLADOR DEL REPRODUCTOR
        function playSong(index) {
            const song = songsData[index];
            
            if(currentPlayingIndex !== -1) {
                const prevSong = document.getElementById(`song-${currentPlayingIndex}`);
                if(prevSong) prevSong.classList.remove('active');
            }
            const currentSong = document.getElementById(`song-${index}`);
            if(currentSong) currentSong.classList.add('active');
            
            currentPlayingIndex = index;

            document.getElementById('player-cover').src = song.cover || imageDriveUrl;
            document.getElementById('player-title').innerText = song.title;
            document.getElementById('player-artist').innerText = song.artist;

            audioPlayer.src = song.url;
            audioPlayer.play();
            playIcon.className = "fas fa-pause";
        }

        function togglePlay() {
            if(!audioPlayer.src) return;
            if (audioPlayer.paused) {
                audioPlayer.play();
                playIcon.className = "fas fa-pause";
            } else {
                audioPlayer.pause();
                playIcon.className = "fas fa-play";
            }
        }

        // Barra de progreso
        audioPlayer.addEventListener('timeupdate', () => {
            const current = audioPlayer.currentTime;
            const duration = audioPlayer.duration;
            if(duration) {
                progress.style.width = `${(current / duration) * 100}%`;
                document.getElementById('current-time').innerText = formatoTiempo(current);
                document.getElementById('total-duration').innerText = formatoTiempo(duration);
                const timeCell = document.getElementById(`time-${currentPlayingIndex}`);
                if(timeCell) timeCell.innerText = formatoTiempo(duration);
            }
        });

        // Siguiente canción automática
        audioPlayer.addEventListener('ended', () => {
            let next = currentPlayingIndex + 1;
            if(next >= songsData.length) next = 0;
            playSong(next);
        });

        function formatoTiempo(secs) {
            const min = Math.floor(secs / 60);
            const sec = Math.floor(secs % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        document.getElementById('progress-bar').addEventListener('click', function(e) {
            if(!audioPlayer.duration) return;
            const clickX = e.clientX - this.getBoundingClientRect().left;
            audioPlayer.currentTime = (clickX / this.getBoundingClientRect().width) * audioPlayer.duration;
        });

        window.onload = init;
    </script>
</body>
</html>
