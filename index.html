<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIVETMP Music - Sharp Canvas Edition</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons & Tools -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ==================================================================
           DESIGN SYSTEM & VARIABLES
           ================================================================== */
        :root {
            --bg-dark: #030305;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --border-subtle: rgba(255, 255, 255, 0.08);
            
            --accent-1: #ffffff;
            --accent-2: rgba(255, 255, 255, 0.2);
            
            --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            
            --ease-cinematic: cubic-bezier(0.25, 1, 0.5, 1);
            --sidebar-width: 90px;
            --player-height: 88px;
            --nav-height-mob: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ==================================================================
           FULL SCREEN SHARP BACKGROUND LAYER (NO BLUR)
           ================================================================== */
        #global-bg {
            position: fixed; inset: 0; z-index: 1;
            background-size: cover; background-position: center;
            transition: background-image 0.8s var(--ease-cinematic);
            pointer-events: none;
        }
        /* Gradiente para mantener legible la tipografía sin desenfocar el fondo */
        #global-bg-overlay {
            position: fixed; inset: 0; z-index: 2;
            background: linear-gradient(135deg, rgba(3, 3, 5, 0.9) 0%, rgba(3, 3, 5, 0.3) 50%, rgba(3, 3, 5, 0.75) 100%);
            pointer-events: none;
        }
        .noise-overlay {
            position: fixed; inset: 0; z-index: 3; opacity: 0.025; mix-blend-mode: overlay; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .explicit-badge {
            display: inline-flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.15); color: #fff;
            font-size: 8px; font-weight: 800; width: 12px; height: 12px;
            border-radius: 2px; text-transform: uppercase; margin-left: 6px;
            vertical-align: middle; flex-shrink: 0;
        }

        /* ==================================================================
           APP LAYOUT
           ================================================================== */
        #app-wrapper {
            display: flex; width: 100vw; height: 100vh; position: relative; z-index: 10; background: transparent;
            transition: transform 0.8s var(--ease-cinematic), opacity 0.5s;
        }
        #app-wrapper.scaled {
            transform: scale(0.96); opacity: 0.4; pointer-events: none;
        }

        /* SIDEBAR (INTEGRATED MINIMALIST BORDERLESS LINE) */
        #sidebar {
            width: var(--sidebar-width); height: 100vh;
            padding: 40px 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            border-right: 1px solid var(--border-subtle); background: rgba(3, 3, 5, 0.3);
            flex-shrink: 0; z-index: 20; position: relative;
        }
        
        .brand i { font-size: 24px; color: #fff; }
        
        .nav-menu { display: flex; flex-direction: column; gap: 36px; flex: 1; justify-content: center; width: 100%; align-items: center; }
        .nav-item {
            display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
            color: var(--text-secondary); cursor: pointer; transition: all 0.3s ease;
        }
        .nav-item i { font-size: 22px; transition: transform 0.3s ease; }
        .nav-item:hover { color: #fff; }
        .nav-item.active { color: #fff; position: relative; }
        .nav-item.active::after {
            content: ''; position: absolute; left: 0; width: 3px; height: 16px; background: #fff; border-radius: 0 4px 4px 0;
        }

        /* SCROLL CONTENT AREA */
        #main-content {
            flex: 1; height: 100%; position: relative; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;
            padding: 60px 5vw calc(var(--player-height) + 40px);
        }
        #main-content::-webkit-scrollbar { display: none; }
        
        .view-section { display: none; flex-direction: column; width: 100%; max-width: 1200px; margin: 0 auto; }
        .view-section.active { display: flex; animation: viewEnter 0.5s var(--ease-cinematic) forwards; }
        @keyframes viewEnter { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }

        .page-header { margin-bottom: 40px; }
        .page-header h1 { font-family: var(--font-display); font-size: 42px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; color: #fff; }
        .page-header p { font-size: 14px; color: var(--text-secondary); }
        .section-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 32px 0 20px; }

        .search-container { position: relative; width: 100%; max-width: 450px; margin-top: 16px; }
        .search-input { width: 100%; padding: 12px 16px 12px 44px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle); border-radius: 6px; font-family: var(--font-main); font-size: 14px; color: #fff; outline: none; transition: all 0.3s; }
        .search-input:focus { border-color: rgba(255, 255, 255, 0.25); background: rgba(255, 255, 255, 0.08); }
        .search-container i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text-secondary); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 32px; width: 100%; }
        
        /* CLEAN SINGLE CARD */
        .card { 
            background: transparent; border: none; padding: 0; cursor: pointer; transition: all 0.3s var(--ease-cinematic); position: relative; display: flex; flex-direction: column; gap: 12px;
        }
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid transparent; transition: all 0.3s var(--ease-cinematic); }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        
        .card:hover .card-img-wrapper {
            transform: translateY(-4px);
            border-color: var(--card-border, #fff);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), 0 0 15px var(--card-glow);
        }
        .card:active { transform: scale(0.97); }
        
        .card-play-btn { position: absolute; bottom: 10px; right: 10px; width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; opacity: 0; transform: scale(0.8); transition: all 0.25s var(--ease-cinematic); z-index: 3; }
        .card-play-btn i { margin-left: 1px; }
        .card:hover .card-play-btn { opacity: 1; transform: scale(1); }
        .card.active .card-play-btn { opacity: 1; transform: scale(1); background: #fff; color: #000; }

        .card-info { padding: 0 2px; }
        .card-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); margin-bottom: 2px; display: flex; align-items: center; justify-content: space-between; }
        .card-subtitle { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .card-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; font-size: 8px; font-weight: 800; padding: 4px 6px; border-radius: 3px; z-index: 3; }

        /* ==================================================================
           IMPROVED IMMERSIVE ALBUMS VIEW (NO BLUR, LUXURY EDITORIAL STYLE)
           ================================================================== */
        .immersive-album-container {
            position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; gap: 32px; z-index: 2;
        }

        /* Luxury Editorial Switcher */
        .immersive-album-selector {
            display: flex; gap: 40px; align-self: flex-start; z-index: 10; margin-bottom: 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); width: 100%; padding-bottom: 16px;
        }
        .selector-pill {
            font-family: var(--font-display); font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); cursor: pointer; transition: all 0.4s var(--ease-cinematic); position: relative; display: flex; align-items: center; gap: 8px;
        }
        .selector-pill span { font-size: 10px; font-weight: 300; opacity: 0.5; font-feature-settings: "tnum"; }
        .selector-pill:hover { color: #fff; }
        .selector-pill.active { color: #fff; font-weight: 700; }
        .selector-pill::after {
            content: ''; position: absolute; bottom: -17px; left: 0; width: 0; height: 2px; background: #fff; transition: width 0.4s var(--ease-cinematic);
        }
        .selector-pill.active::after { width: 100%; }

        /* Capa de fondo del álbum sin blur y con alta nitidez */
        .immersive-bg-layer {
            position: absolute; inset: -40px;
            background-size: cover; background-position: center 25%;
            z-index: -1; opacity: 0.85; border-radius: 20px;
            transition: background-image 1s var(--ease-cinematic);
        }
        /* Viñeta interna multidireccional refinada para asegurar legibilidad */
        .immersive-bg-layer::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(3,3,5,0.95) 0%, rgba(3,3,5,0.45) 55%, rgba(3,3,5,0.85) 100%),
                        linear-gradient(to bottom, rgba(3,3,5,0.1) 0%, rgba(3,3,5,0.7) 100%);
        }

        /* Two column flat presentation */
        .immersive-album-layout {
            display: grid; grid-template-columns: 320px 1fr; gap: 80px; width: 100%; margin: 0 auto;
        }

        .panel-left {
            display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 28px;
            border-right: 1px solid rgba(255, 255, 255, 0.05); padding-right: 60px;
        }
        .panel-left .album-cover-small {
            width: 180px; height: 180px; border-radius: 12px; object-fit: cover; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s var(--ease-cinematic);
        }
        .panel-left:hover .album-cover-small { transform: translateY(-4px) scale(1.02); }
        .panel-left .album-meta { display: flex; flex-direction: column; gap: 8px; }
        .panel-left .album-title { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.15; color: #fff; letter-spacing: -0.02em; }
        .panel-left .album-artist { font-size: 15px; font-weight: 600; color: var(--text-secondary); }
        .panel-left .album-stats { font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
        .panel-left .btn-play-album {
            margin-top: 8px; background: #fff; color: #000; font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 12px 32px; border-radius: 100px; border: none; cursor: pointer; transition: all 0.3s var(--ease-cinematic); display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }
        .panel-left .btn-play-album:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(255,255,255,0.2); }

        .panel-right { display: flex; flex-direction: column; overflow: hidden; height: 100%; max-height: 440px; }
        .panel-right-scroll { flex: 1; overflow-y: auto; padding-right: 16px; }
        .panel-right-scroll::-webkit-scrollbar { width: 2px; }
        .panel-right-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); }

        /* Minimal text track row */
        .immersive-track-row {
            display: flex; align-items: center; gap: 20px; padding: 14px 16px; border-radius: 8px; cursor: pointer; transition: all 0.25s var(--ease-cinematic);
            font-size: 14px; font-weight: 300; color: rgba(255, 255, 255, 0.7); border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .immersive-track-row:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
        .immersive-track-row.active { background: rgba(255, 255, 255, 0.06); color: #fff; font-weight: 600; }
        .immersive-track-num { width: 24px; color: var(--text-tertiary); font-size: 11px; font-weight: 600; font-family: var(--font-display); }
        .immersive-track-row.active .immersive-track-num { color: #fff; }
        .immersive-track-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
        .immersive-track-artist { color: var(--text-secondary); font-size: 13px; font-weight: 300; margin-right: 20px; }
        .immersive-track-duration { font-size: 12px; color: var(--text-tertiary); font-feature-settings: "tnum"; font-weight: 400; width: 35px; text-align: right; }

        /* ==================================================================
           PERSISTENT FULL-WIDTH BOTTOM PLAYER
           ================================================================== */
        .player-wrapper { position: fixed; bottom: 0; left: var(--sidebar-width); right: 0; height: var(--player-height); z-index: 50; }
        .player-pill { 
            width: 100%; height: 100%; background: rgba(3, 3, 5, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); 
            border-top: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; padding: 12px 40px; position: relative; overflow: hidden; 
        }
        .progress-mini-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.03); }
        .progress-mini-fill { height: 100%; width: 0%; background: #fff; transition: width 0.1s linear; }

        .player-info { display: flex; align-items: center; gap: 12px; width: 30%; cursor: pointer; }
        .player-img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; }
        .player-meta { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .player-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-controls { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 40%; gap: 8px; }
        .controls-buttons { display: flex; align-items: center; gap: 28px; font-size: 18px; color: var(--text-secondary); }
        .controls-buttons i { cursor: pointer; transition: all 0.2s; }
        .controls-buttons i:hover { color: #fff; }
        .btn-play-circle { width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.2s; }
        .btn-play-circle i { margin-left: 1px; }

        .scrubber-container { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 420px; font-size: 10px; color: rgba(255,255,255,0.4); font-variant-numeric: tabular-nums; }
        .scrubber-bg { flex: 1; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; }
        .scrubber-fill { width: 0%; height: 100%; background: #fff; border-radius: 2px; transition: width 0.1s linear; }

        .player-actions { display: flex; align-items: center; justify-content: flex-end; width: 30%; gap: 16px; color: var(--text-secondary); font-size: 18px; }
        .player-actions i { cursor: pointer; }
        .vol-slider { width: 70px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative;}
        .vol-fill { width: 75%; height: 100%; background: #fff; border-radius: 2px; }
        .btn-fullscreen { width: 30px; height: 30px; border-radius: 4px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-fullscreen:hover { background: rgba(255,255,255,0.08); color: #fff; }

        /* ==================================================================
           FULLSCREEN NOW PLAYING
           ================================================================== */
        #np-fs {
            position: fixed; inset: 0; z-index: 100; transform: translateY(100%); opacity: 0; visibility: hidden;
            transition: transform 0.8s var(--ease-cinematic), opacity 0.5s; display: flex; 
            overflow: hidden; background: #030305;
            font-family: var(--font-display); align-items: flex-end; justify-content: flex-start; padding: 80px;
            box-shadow: none; /* Se elimina cualquier sombra del contenedor principal */
        }
        #np-fs.active { transform: translateY(0); opacity: 1; visibility: visible; }

        /* Se desactiva la sombra/máscara oscura de la parte inferior para mostrar el fondo nítido */
        .np-bg-overlay { display: none; }
        
        .np-grain { position: absolute; inset: 0; z-index: 2; opacity: 0.02; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency = '0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); pointer-events: none;}

        .btn-collapse {
            position: absolute; top: 40px; right: 40px; width: 44px; height: 44px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); cursor: pointer; z-index: 10;
            display: flex; align-items: center; justify-content: center; font-size: 18px; 
            color: rgba(255,255,255,0.5); border-radius: 50%; transition: all 0.3s; outline: none;
        }
        .btn-collapse:hover { color: #fff; background: rgba(255,255,255,0.08); transform: scale(1.05); }
        .btn-collapse-mob { display: none; }

        .np-minimal-container { position: relative; z-index: 10; display: flex; align-items: center; gap: 32px; }
        
        .np-art-wrap { 
            width: 140px; height: 140px; border-radius: 6px; 
            box-shadow: none; /* Se elimina la sombra de la portada en pantalla completa */
            overflow: hidden; transition: transform 0.5s var(--ease-snappy); 
            background: transparent; cursor: pointer; flex-shrink: 0; 
        }
        .np-art-wrap:hover { transform: scale(1.02); }
        .np-art { width: 100%; height: 100%; object-fit: cover; }

        .np-metadata-wrap { display: flex; flex-direction: column; gap: 6px; }
        .np-track-title { font-size: clamp(26px, 3.5vw, 42px); font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1.1; margin: 0; display: flex; align-items: center; }
        .np-track-artist { font-size: clamp(15px, 1.5vw, 18px); color: rgba(255,255,255,0.6); font-weight: 500; margin: 0; }

        /* ==================================================================
           MOBILE RESPONSIVE
           ================================================================== */
        .mobile-nav { display: none; }
        
        @media (max-width: 1024px) {
            #sidebar { display: none; }
            #main-content { padding: 32px 5vw calc(var(--player-height) + var(--nav-height-mob) + 16px); margin-left: 0; }
            
            .mobile-nav {
                display: flex; position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height-mob);
                background: rgba(3, 3, 5, 0.95); border-top: 1px solid var(--border-subtle); z-index: 60;
                justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
            }
            .nav-item-mob { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 44px; color: var(--text-secondary); cursor: pointer; border-radius: 50%; transition: 0.3s; }
            .nav-item-mob i { font-size: 22px; transition: 0.3s var(--ease-snappy); }
            .nav-item-mob.active { color: #fff; background: rgba(255, 255, 255, 0.04); }

            .player-wrapper { bottom: calc(var(--nav-height-mob)); left: 0; }
            .player-pill { height: 64px; padding: 8px 20px; border-top: 1px solid var(--border-subtle); background: rgba(3, 3, 5, 0.98); }
            .player-img { width: 36px; height: 36px; border-radius: 4px; }
            .player-controls, .player-actions { display: none; }
            .player-info { width: 85%; }
            .mobile-play-btn { display: flex; position: absolute; right: 20px; width: 36px; height: 36px; background: #fff; color: #000; border-radius: 50%; align-items: center; justify-content: center; font-size: 16px; }
            .mobile-play-btn i { margin-left: 1px; }

            .page-header h1 { font-size: 32px; }
            
            /* Immersive Album Mobile */
            .immersive-album-selector { gap: 20px; overflow-x: auto; width: 100%; white-space: nowrap; padding-bottom: 8px; }
            .immersive-album-selector::-webkit-scrollbar { display: none; }
            .immersive-album-layout { grid-template-columns: 1fr; gap: 40px; padding: 0; }
            .panel-left { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-right: 0; padding-bottom: 24px; align-items: center; text-align: center; }
            .panel-left .album-cover-small { width: 130px; height: 130px; }
            .panel-right { max-height: 320px; }

            #np-fs { padding: 40px 24px; align-items: center; justify-content: center; } 
            .btn-collapse { display: none; }
            .btn-collapse-mob { 
                position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
                width: 48px; height: 4px; border-radius: 2px;
                background: rgba(255,255,255,0.4); border: none; cursor: pointer; z-index: 10;
                display: block; transition: 0.3s;
            }
            .np-minimal-container { flex-direction: column; text-align: center; gap: 16px; }
            .np-art-wrap { width: 180px; height: 180px; }
            .np-metadata-wrap { align-items: center; }
            .np-track-title { font-size: 24px; justify-content: center; }
            .np-track-artist { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- SHARP GLOBAL BACKGROUND -->
    <div id="global-bg"></div>
    <div id="global-bg-overlay"></div>
    <div class="noise-overlay"></div>

    <!-- MAIN APP SHELL -->
    <div id="app-wrapper">
        <!-- SIDEBAR (DESKTOP) -->
        <aside id="sidebar">
            <div class="brand"><i class="ph-fill ph-waveform"></i></div>
            <nav class="nav-menu">
                <div class="nav-item active" onclick="navTo('songs')"><i class="ph-fill ph-house"></i></div>

        function addAlbumTracks(albumId, cover, bg, palette, artistDefault, tracksRaw) {
            tracksRaw.forEach((t, idx) => {
                cancionesData.push({
                    title: t[0],

        }

        // Carga de álbumes activos en el backend
        addAlbumTracks("nadie-sabe-album", nadieSabeCover, nadieSabeBg, nadieSabePalette, "Bad Bunny", nadieSabeTracksRaw);
        addAlbumTracks("private-suite-complete", roaCover, roaBg, roaPalette, "ROA", roaTracksRaw);
        addAlbumTracks("por-si-manana", moonlightCover, moonlightBg, moonlightPalette, "Omar Courtz", moonlightTracksRaw);

        /* ==================================================================
           CORE STATE & AUDIO ENGINE
           ================================================================== */
        let currentPlayingIndex = 0;
        let isNPOpen = false;
        let activeViewTab = 'songs';

        const audio1 = new Audio(); audio1.crossOrigin = "anonymous";
        const audio2 = new Audio(); audio2.crossOrigin = "anonymous";
        let activeAudio = audio1, fadingAudio = null, isCrossfading = false, mixTimingHumanized = 0;
        let audioCtx, masterGain, masterCompressor, analyser, deck1, deck2, activeDeck;
        let globalVolume = 0.75;
        let lastAudioTime = 0, lastTimeUpdate = 0;

        const trackAnalysis = {};
        let analysisQueue = [];

        function initAudioEngine() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            masterCompressor = audioCtx.createDynamicsCompressor(); masterCompressor.threshold.value = -3; masterCompressor.knee.value = 10; masterCompressor.ratio.value = 5; masterCompressor.attack.value = 0.003; masterCompressor.release.value = 0.25;
            masterGain = audioCtx.createGain(); masterGain.gain.value = globalVolume;
            analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
            
            masterCompressor.connect(masterGain); masterGain.connect(analyser); analyser.connect(audioCtx.destination);
            deck1 = createDeck(audio1); deck2 = createDeck(audio2); activeDeck = deck1;
        }

        function createDeck(audioEl) {
            const source = audioCtx.createMediaElementSource(audioEl);
            const highpass = audioCtx.createBiquadFilter(); highpass.type = 'highpass'; highpass.frequency.value = 0;
            const lowpass = audioCtx.createBiquadFilter(); lowpass.type = 'lowpass'; lowpass.frequency.value = 22000;
            const bass = audioCtx.createBiquadFilter(); bass.type = 'lowshelf'; bass.frequency.value = 200; bass.gain.value = 0;
            const delay = audioCtx.createDelay(5.0); delay.delayTime.value = 0.45;
            const feedback = audioCtx.createGain(); feedback.gain.value = 0; delay.connect(feedback); feedback.connect(delay);
            const delayOut = audioCtx.createGain(); delayOut.gain.value = 0; delay.connect(delayOut);
            const deckGain = audioCtx.createGain(); deckGain.gain.value = 1;
            
            source.connect(highpass); highpass.connect(lowpass); lowpass.connect(bass); bass.connect(deckGain); bass.connect(delay);
            deckGain.connect(masterCompressor); delayOut.connect(masterCompressor);
            return { source, highpass, lowpass, bass, delay, feedback, delayOut, deckGain };
        }

        function resetDeckFX(deck) {
            if(!audioCtx) return; const now = audioCtx.currentTime;
            deck.highpass.frequency.cancelScheduledValues(now); deck.highpass.frequency.setValueAtTime(0, now);
            deck.lowpass.frequency.cancelScheduledValues(now); deck.lowpass.frequency.setValueAtTime(22000, now);
            deck.bass.gain.cancelScheduledValues(now); deck.bass.gain.setValueAtTime(0, now);
            deck.deckGain.gain.cancelScheduledValues(now); deck.deckGain.gain.setValueAtTime(1, now);
            deck.delayOut.gain.cancelScheduledValues(now); deck.delayOut.gain.setValueAtTime(0, now);
            deck.feedback.gain.cancelScheduledValues(now); deck.feedback.gain.setValueAtTime(0, now);
        }

        function ensureAudioContext() {
            initAudioEngine();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function haptic() { if (navigator.vibrate) navigator.vibrate(10); }

        function applyAccentFromPalette(palette) {
            if (!palette || !palette.length) return;
            let bestIdx = 0, bestScore = -1;
            palette.forEach((c, i) => {
                const max = Math.max(c.r, c.g, c.b), min = Math.min(c.r, c.g, c.b);
                const sat = max === 0 ? 0 : (max - min) / max;
                const lum = (c.r * 299 + c.g * 587 + c.b * 114) / 1000;
                const score = sat * 0.7 + (1 - Math.abs(lum - 150) / 150) * 0.3;
                if (score > bestScore) { bestScore = score; bestIdx = i; }
            });
            const a = palette[bestIdx], b = palette[(bestIdx + 2) % palette.length] || palette[0];
            document.documentElement.style.setProperty('--accent-1', `rgb(${a.r},${a.g},${a.b})`);
            document.documentElement.style.setProperty('--accent-2', `rgb(${b.r},${b.g},${b.b})`);
        }

        function updateCovers(imgUrl) {
            document.getElementById('player-img').src = imgUrl;
            document.getElementById('np-img-large').src = imgUrl;

        function loadSongCover(song, i) {

            if (currentPlayingIndex === i) updateCovers(song.cover);

        /* ==================================================================
           BACKGROUND LAYER DYNAMIC TRANSITIONS
           ================================================================== */
        function updateGlobalBackground(url) {
            const bg = document.getElementById('global-bg');
            if (bg && url) {
                bg.style.backgroundImage = `url('${url}')`;
            }
        }

        function syncBackgroundToView() {
            if (activeViewTab === 'songs') {
                // Sincronizar con el sencillo en reproducción o el primero por defecto
                const activeSong = cancionesData[currentPlayingIndex];
                if (activeSong && activeSong.bgImage) updateGlobalBackground(activeSong.bgImage);
            } else if (activeViewTab === 'albums') {
                const activeAlbum = albumsData[activeImmersiveAlbumIndex];
                if (activeAlbum) {
                    let bgUrl = '';
                    if (activeAlbum.id === "nadie-sabe-album") bgUrl = nadieSabeBg;
                    else if (activeAlbum.id === "private-suite-complete") bgUrl = roaBg;
                    else if (activeAlbum.id === "por-si-manana") bgUrl = moonlightBg;
                    updateGlobalBackground(bgUrl);
                }
            } else {
                updateGlobalBackground(nadieSabeBg);
            }
        }

        /* ==================================================================
           BACKGROUND ANALYSIS & AUTOMIX
           ================================================================== */
        async function runAnalysisQueue() {
            if (!analysisQueue.length) return;
            const song = analysisQueue.shift();
            if (!trackAnalysis[song.url]) await analyzeTrack(song);
            setTimeout(runAnalysisQueue, 1500);
        }

        async function analyzeTrack(song) {
            if (trackAnalysis[song.url]) return trackAnalysis[song.url];
            try {
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const res = await fetch(song.url);
                const buf = await tempCtx.decodeAudioData(await res.arrayBuffer());
                const data = buf.getChannelData(0); const sr = buf.sampleRate; const len = data.length;
                let tot = 0, rmsArr = [];
                for(let i=0; i<len; i+=sr) {
                    let sum = 0, count = 0;
                    for(let j=0; j<sr && (i+j)<len; j+=100) { sum += data[i+j]*data[i+j]; count++; }
                    const rms = Math.sqrt(sum/count); rmsArr.push(rms); tot += rms;
                }
                const avg = tot / rmsArr.length;
                let outro = 6;
                for(let i = rmsArr.length-1; i >= Math.max(0, rmsArr.length-30); i--) {
                    if(rmsArr[i] > avg * 0.4) { outro = (rmsArr.length-1-i); break; }
                }
                outro = Math.max(4, Math.min(15, outro));
                trackAnalysis[song.url] = { bpm: 110, energy: avg, outroDuration: outro };
                tempCtx.close(); return trackAnalysis[song.url];
            } catch(e) {
                trackAnalysis[song.url] = { bpm: 110, energy: 0.1, outroDuration: 8 };
                return trackAnalysis[song.url];
            }
        }

        function getBestNextTrack(currIdx) { return (currIdx + 1) % cancionesData.length; }

        function renderGrid(dataArray, containerId, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            dataArray.forEach((item, index) => {
                if(!item) return;
                const realIndex = (type === 'song') ? cancionesData.findIndex(s => s.title === item.title) : index;
                if(type === 'song' && realIndex === -1) return;
                
                const card = document.createElement('div');

                    card.style.setProperty('--card-border', item.borderColor || 'rgba(255, 255, 255, 0.15)');

                if (type === 'song' && currentPlayingIndex === realIndex) card.classList.add('active');
                
                if (type === 'song') {
                    card.onclick = () => playSong(realIndex);
                    
                    // Interactividad: El cursor cambia dinámicamente la imagen de fondo nítida de la pantalla sin blur
                    card.onmouseenter = () => {
                        updateGlobalBackground(item.bgImage);
                    };
                    card.onmouseleave = () => {

                    };
                } else if (type === 'album') {
                    card.onclick = () => openAlbumDetail(item.id);
                }

                let badge = '';
                if (type === 'song' && currentPlayingIndex === realIndex) badge = `<div class="card-badge">PLAYING</div>`;
                
                const imgTag = `<img src="${item.cover || item.img}" loading="lazy" class="card-img ${type==='song'?`cover-song-${realIndex}`:''}" alt="${item.title || item.name}">`;

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        ${badge}

        /* ==================================================================

            // Duraciones deterministas realistas basadas en la longitud del título

            tracks.forEach(song => {

                if(currentPlayingIndex === realIndex) row.classList.add('active');
                row.onclick = () => playSong(realIndex);

                const duration = getMockDuration(song.title);

                row.innerHTML = `
                    <div class="immersive-track-num">${song.trackNum.toString().padStart(2, '0')}</div>
                    <div class="immersive-track-title">${song.title} <span class="explicit-badge">E</span></div>
                    <div class="immersive-track-artist">${song.artist}</div>
                    <div class="immersive-track-duration">${duration}</div>
                `;
                trackContainer.appendChild(row);
            });
        }

        function playImmersiveAlbum() {
            const album = albumsData[activeImmersiveAlbumIndex];
            if (!album) return;
            const albumTracks = cancionesData.filter(s => s.album === album.id).sort((a,b) => a.trackNum - b.trackNum);
            if (albumTracks.length > 0) {
                const targetIndex = cancionesData.findIndex(s => s.title === albumTracks[0].title);
                if (targetIndex !== -1) playSong(targetIndex);
            }
        }

        function openAlbumDetail(albumId) {
            const albIdx = albumsData.findIndex(a => a.id === albumId);
            if (albIdx !== -1) {
                switchImmersiveAlbum(albIdx);
                navTo('albums');
            }
        }

        function handleSearch(e) {
            const q = e.target.value.toLowerCase().trim();
            const hide = (id) => { const el = document.getElementById(id); if(el) el.style.display = 'none'; };
            const show = (id) => { const el = document.getElementById(id); if(el) el.style.display = 'flex'; };
            
            if(!q) { ['title-search-albums', 'title-search-songs'].forEach(hide); ['grid-search-albums', 'grid-search-songs'].forEach(el => document.getElementById(el).innerHTML = ''); return; }
            
            const resSongs = cancionesData.filter(s => s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q));
            const resAlbs = albumsData.filter(a => a.title.toLowerCase().includes(q) || a.artist.toLowerCase().includes(q));

            resSongs.length ? show('title-search-songs') : hide('title-search-songs');
            resAlbs.length ? show('title-search-albums') : hide('title-search-albums');

            renderGrid(resSongs, 'grid-search-songs', 'song');
            renderGrid(resAlbs, 'grid-search-albums', 'album');
        }

        /* ==================================================================
           PLAYBACK CONTROLS
           ================================================================== */
        function playSong(idx) {
            ensureAudioContext(); haptic();
            if(isCrossfading && fadingAudio) { fadingAudio.pause(); fadingAudio.src = ""; fadingAudio = null; isCrossfading = false; }
            activeAudio.pause();
            
            resetDeckFX(activeDeck); triggerUIForSong(idx);
            
            activeAudio.src = cancionesData[idx].url;
            activeAudio.play().catch(e=>{}); setPlayIcon(true);
        }

        function triggerUIForSong(idx) {
            document.querySelectorAll('.card.active').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`.card-song-${idx}`).forEach(el => el.classList.add('active'));
            
            // Sincronizar tracklist del álbum inmersivo
            document.querySelectorAll('.immersive-track-row.active').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`.imm-track-row-${idx}`).forEach(el => el.classList.add('active'));
            
            currentPlayingIndex = idx; const song = cancionesData[idx];
            updateCovers(song.cover);
            
            document.getElementById('player-title').innerHTML = `${song.title} <span class="explicit-badge">E</span>`;
            document.getElementById('player-artist').innerText = song.artist;
            document.getElementById('np-title-large').innerHTML = `${song.title} <span class="explicit-badge" style="font-size: 14px; width: 20px; height: 20px; margin-left: 10px;">E</span>`;
            
            const alb = albumsData.find(a => a.id === song.album);
            const albumName = alb ? alb.title : "Single";
            document.getElementById('np-artist-large').innerText = `${song.artist} — ${albumName}`;

            const npFs = document.getElementById('np-fs');
            if (song.bgImage) {
                npFs.style.backgroundImage = `url('${song.bgImage}')`;
                npFs.style.backgroundSize = 'cover'; npFs.style.backgroundPosition = 'center'; npFs.style.backgroundRepeat = 'no-repeat';
            }

            if (song.palette && song.palette.length > 0) {
                applyAccentFromPalette(song.palette);
            }
            
            // Sincronizar la imagen de fondo clara
            syncBackgroundToView();
        }

        function togglePlay() {
            ensureAudioContext(); haptic();
            if (!activeAudio.src) return playSong(0);
            if (activeAudio.paused) { activeAudio.play(); setPlayIcon(true); } 
            else { activeAudio.pause(); setPlayIcon(false); }
        }

        function nextSong() { haptic(); playSong((currentPlayingIndex + 1) % cancionesData.length); }
        function prevSong() { haptic(); playSong((currentPlayingIndex - 1 + cancionesData.length) % cancionesData.length); }
        
        function setPlayIcon(playing) {
            const icon = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
            document.getElementById('icon-play-mob').className = icon;
            document.getElementById('icon-play-desk').className = icon;
        }

        function seek(e, el) { 
            if(!activeAudio.duration) return; 
            const r = el.getBoundingClientRect(); 
            activeAudio.currentTime = ((e.clientX - r.left) / r.width) * activeAudio.duration; 
        }
        
        function changeVolume(e, el) {
            const r = el.getBoundingClientRect(); let vol = (e.clientX - r.left) / r.width;
            setVolumeLevel(vol);
        }
        
        function setVolumeLevel(vol) {
            if(vol < 0) vol = 0; if(vol > 1) vol = 1; globalVolume = vol;
            document.getElementById('vol-fill-desk').style.width = `${vol*100}%`;
            if(audioCtx && masterGain) masterGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.1); else activeAudio.volume = vol;
        }

        function toggleNP() {
            haptic(); isNPOpen = !isNPOpen;
            const np = document.getElementById('np-fs'); const app = document.getElementById('app-wrapper');
            if (isNPOpen) { np.classList.add('active'); app.classList.add('scaled'); } 
            else { np.classList.remove('active'); app.classList.remove('scaled'); }
        }

        function fmt(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        function checkAutoMix() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                const rem = activeAudio.duration - activeAudio.currentTime;
                const analyserInfo = trackAnalysis[cancionesData[currentPlayingIndex]?.url];
                let out = analyserInfo && analyserInfo.outroDuration ? analyserInfo.outroDuration : 8;
                if(mixTimingHumanized === 0) mixTimingHumanized = (Math.random()-0.5)*1.5;
                if(rem <= (out + mixTimingHumanized) && !isCrossfading && rem > 0.5) { startAutoMix(); mixTimingHumanized = 0; }
            }
        }

        function renderLoop() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                let cur = activeAudio.currentTime; 
                const now = performance.now();
                if (cur !== lastAudioTime) { lastAudioTime = cur; lastTimeUpdate = now; } 
                else if (!activeAudio.paused) {
                    let extrapolated = lastAudioTime + (now - lastTimeUpdate) / 1000;
                    if (extrapolated - lastAudioTime < 0.3) cur = extrapolated;
                }
                const dur = activeAudio.duration; const pct = (cur/dur)*100;
                document.getElementById('bar-fill-mini').style.width = `${pct}%`;
                document.getElementById('bar-fill-desk').style.width = `${pct}%`;
                document.getElementById('time-curr-desk').innerText = fmt(cur);
                document.getElementById('time-tot-desk').innerText = "-" + fmt(dur-cur);
                checkAutoMix();
            }
            requestAnimationFrame(renderLoop);
        }

        /* ==================================================================
           GESTURES (SWIPE DOWN TO CLOSE NP)
           ================================================================== */
        function setupGestures() {
            let sY=0, cY=0; const np = document.getElementById('np-fs'), app = document.getElementById('app-wrapper');
            np.addEventListener('touchstart', e => {
                if(np.scrollTop > 0) return; 
                sY = e.touches[0].clientY; np.style.transition = 'none'; app.style.transition = 'none';
            }, {passive:true});
            np.addEventListener('touchmove', e => {
                if(!isNPOpen || sY===0) return;
                cY = e.touches[0].clientY; let d = cY - sY;
                if(d > 0 && np.scrollTop <= 0) { 
                    np.style.transform = `translateY(${d}px)`;
                    app.style.transform = `scale(${Math.min(1, 0.96 + (d/window.innerHeight)*0.04)})`;
                }
            }, {passive:true});
            np.addEventListener('touchend', e => {
                if(!isNPOpen || sY===0) return;
                let d = cY - sY; sY = 0;
                np.style.transition = ''; app.style.transition = '';
                if(d > 120) toggleNP(); else { np.style.transform = ''; app.style.transform = 'scale(0.96) translateY(-1.5vh)'; }
            }, {passive:true});
        }

        /* ==================================================================
           INITIALIZATION
           ================================================================== */
        function init() {
            // Renderizar los sencillos del Home en su contenedor
            const singles = cancionesData.filter(song => !song.album || song.album === "");
            renderGrid(singles, 'grid-songs', 'song');

            // Cargar por defecto el primer álbum en la vista inmersiva
            switchImmersiveAlbum(0);
            
            document.getElementById('search-input').addEventListener('input', handleSearch);
            document.body.addEventListener('click', ensureAudioContext, { once: true });
            document.body.addEventListener('touchstart', ensureAudioContext, { once: true });

            requestAnimationFrame(renderLoop);
            
            analysisQueue = [...cancionesData]; 
            setTimeout(runAnalysisQueue, 1000);
            
            setupGestures();
            document.getElementById('vol-fill-desk').style.width = `${globalVolume*100}%`;
            
            // Cargar primera pista en el reproductor
            triggerUIForSong(0);
        }

        window.onload = init;
    </script>
</body>
</html>
