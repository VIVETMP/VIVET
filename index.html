<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Apple Music — Lyrics Player</title>

  <!-- Tipografía Apple SF Pro Rounded & Fallbacks Oficiales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos oficiales de AMLL Core (Apple Music Like Lyrics) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.5.2/dist/style.css">

  <!-- Cargador de módulos AMLL Core con soporte multi-CDN de reserva -->
  <script>
    window.__AMLLResolver = null;
    window.__AMLLReady = new Promise((resolve) => {
      window.__AMLLResolver = resolve;
    });
  </script>
  <script type="module">
    async function loadAMLL() {
      const sources = [
        "https://esm.sh/@applemusic-like-lyrics/core@0.5.2",
        "https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.5.2/+esm",
        "https://esm.sh/@applemusic-like-lyrics/core@0.5.1"
      ];
      for (const src of sources) {
        try {
          const mod = await import(src);
          if (mod && mod.LyricPlayer) {
            if (window.__AMLLResolver) window.__AMLLResolver(mod.LyricPlayer);
            else window.__AMLLReady = Promise.resolve(mod.LyricPlayer);
            return;
          }
        } catch (e) {
          console.warn("Reintentando fuente AMLL:", src);
        }
      }
    }
    loadAMLL();
  </script>

  <style>
    /* DEFINICIÓN DE LA FUENTE SF PRO ROUNDED IDÉNTICA A LA IMAGEN */
    @font-face {
      font-family: 'SF Pro Rounded';
      src: url('https://cdn.jsdelivr.net/gh/explicamarcos/font@main/SF-Pro-Rounded-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'SF Pro Rounded';
      src: url('https://cdn.jsdelivr.net/gh/explicamarcos/font@main/SF-Pro-Rounded-Black.ttf') format('truetype');
      font-weight: 800 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      /* Fuente de letras redondeada 100% fiel a iOS Apple Music */
      --lyrics-font: "SF Pro Rounded", ui-rounded, "SF Pro Rounded Heavy", "SF Pro Rounded Bold", "Nunito", "Arial Rounded MT Bold", -apple-system-rounded, system-ui, sans-serif;

      --text-main: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.70);
      --text-muted: rgba(255, 255, 255, 0.45);

      --cover-c1: rgb(35, 45, 60);
      --cover-c2: rgb(65, 88, 125);
      --cover-c3: rgb(18, 24, 35);
      --cover-c4: rgb(85, 115, 155);
      --app-bg-dark: #0a0e14;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--app-bg-dark);
      font-family: var(--ui-font);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      transition: background-color 1.2s ease;
    }

    /* ============================================================
       FONDO AMBIENTAL FLUIDO REACTIVO A LA PORTADA
       ============================================================ */
    .beautifier-bg {
      position: fixed;
      inset: -30%;
      width: 160%;
      height: 160%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(95px) saturate(185%) brightness(0.65);
      transform-origin: center center;
      transition: opacity 1.2s ease, background-image 1.2s ease;
    }

    .bg-layer-1 {
      animation: ambientDrift1 34s infinite alternate ease-in-out;
      opacity: 0.85;
    }

    .bg-layer-2 {
      animation: ambientDrift2 48s infinite alternate ease-in-out;
      mix-blend-mode: color-dodge;
      opacity: 0.42;
      filter: blur(130px) saturate(210%) brightness(0.7);
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      filter: blur(85px);
      will-change: transform;
      transition: background 1.5s ease;
    }

    .bg-orb-1 {
      width: 65vw;
      height: 65vw;
      top: -10%;
      left: -5%;
      animation: orbFloat1 26s infinite alternate ease-in-out;
    }

    .bg-orb-2 {
      width: 70vw;
      height: 70vw;
      bottom: -15%;
      right: -10%;
      animation: orbFloat2 32s infinite alternate ease-in-out;
    }

    .bg-orb-3 {
      width: 55vw;
      height: 55vw;
      top: 30%;
      right: 25%;
      animation: orbFloat3 38s infinite alternate ease-in-out;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.05) 0%, rgba(0, 0, 0, 0.72) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 40%, rgba(0,0,0,0.80) 100%);
    }

    body.is-paused .bg-layer,
    body.is-paused .bg-orb {
      animation-play-state: paused !important;
    }

    @keyframes ambientDrift1 {
      0% { transform: scale(1.2) translate(-3%, -2%) rotate(0deg); }
      50% { transform: scale(1.36) translate(4%, 3%) rotate(4deg); }
      100% { transform: scale(1.22) translate(-2%, 4%) rotate(-3deg); }
    }

    @keyframes ambientDrift2 {
      0% { transform: scale(1.38) translate(4%, 3%) rotate(0deg); }
      50% { transform: scale(1.18) translate(-4%, -3%) rotate(-5deg); }
      100% { transform: scale(1.35) translate(2%, -4%) rotate(3deg); }
    }

    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(14vw, 12vh) scale(1.2); }
    }

    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-16vw, -14vh) scale(1.15); }
    }

    @keyframes orbFloat3 {
      0% { transform: translate(0, 0) scale(0.95); }
      100% { transform: translate(-10vw, 15vh) scale(1.25); }
    }

    /* ============================================================
       APLICACIÓN DESKTOP & RESPONSIVE MÓVIL
       ============================================================ */
    .apple-player-app {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .top-mac-bar {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .mac-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.15s;
    }
    .mac-dot:hover { opacity: 1; transform: scale(1.1); }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .now-playing-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(25px);
      max-width: 60%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .apple-music-logo {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }
    .icon-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .player-main-content {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(360px, 440px) 1fr;
      height: calc(100vh - 52px);
      padding: clamp(24px, 3vh, 44px) clamp(32px, 4vw, 70px);
      gap: clamp(32px, 4vw, 70px);
      align-items: center;
      max-width: 1750px;
      margin: 0 auto;
      width: 100%;
      overflow: hidden;
    }

    .left-player-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }

    .cover-wrapper {
      position: relative;
      width: min(100%, 350px);
      aspect-ratio: 1 / 1;
      margin-bottom: 24px;
      border-radius: 18px;
      box-shadow: 
        0 24px 60px -10px rgba(0, 0, 0, 0.75),
        0 10px 25px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.16);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .cover-wrapper:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 30px 75px -10px rgba(0, 0, 0, 0.85),
        0 14px 30px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.28);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-details {
      width: 100%;
      margin-bottom: 18px;
    }

    .track-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .track-title {
      font-size: clamp(22px, 2.2vw, 28px);
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lossless-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .track-artist {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Scrubber de audio */
    .scrubber-container {
      width: 100%;
      margin-bottom: 18px;
      touch-action: none;
    }

    .progress-bar-rail {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .progress-bar-rail:hover,
    .progress-bar-rail.is-dragging {
      height: 8px;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #ffffff;
      border-radius: 10px;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .progress-bar-rail:hover .progress-thumb,
    .progress-bar-rail.is-dragging .progress-thumb {
      transform: translateY(-50%) scale(1);
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .playback-controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .play-pause-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ffffff;
      color: #0c0e14;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      transition: transform 0.18s ease, background-color 0.2s;
    }

    .play-pause-circle:hover {
      transform: scale(1.07);
      background: #f4f5f7;
    }

    .play-pause-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .bottom-accessories {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .volume-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      touch-action: none;
    }

    .volume-rail {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .volume-rail:hover {
      height: 6px;
    }

    .volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 80%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      pointer-events: none;
    }

    /* ============================================================
       PANEL DE LETRAS Y TIPOGRAFÍA IDÉNTICA A LA IMAGEN (iOS SF ROUNDED)
       ============================================================ */
    .right-lyrics-panel {
      position: relative;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 12%, 
        rgba(0, 0, 0, 1) 88%, 
        transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 12%, 
        rgba(0, 0, 0, 1) 88%, 
        transparent 100%);
    }

    #lyricsStage {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .lyrics-loader-msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.5);
      font-family: var(--lyrics-font);
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .lyrics-loader-msg.hidden {
      opacity: 0;
    }

    /* APLICACIÓN FORZADA DE SF PRO ROUNDED EN EL MOTOR AMLL */
    #lyricsStage,
    #lyricsStage .amll-lyric-player,
    #lyricsStage .amll-lyric-player * {
      font-family: var(--lyrics-font) !important;
    }

    #lyricsStage .amll-lyric-player {
      --amll-lp-font-family: var(--lyrics-font) !important;
      --amll-lp-font-size: clamp(28px, 2.75vw, 46px) !important;
      --amll-lp-color: rgba(255, 255, 255, 0.42) !important;
      --amll-lp-active-color: #ffffff !important;
      --amll-lp-hover-bg-color: rgba(255, 255, 255, 0.08);
      --amll-lp-bg-color: transparent !important;
      font-weight: 800 !important;
      letter-spacing: -0.028em !important;
      line-height: 1.28 !important;
      width: 100%;
      height: 100%;
    }

    /* Líneas normales: desenfoque sutil y profundidad exacta a la captura */
    #lyricsStage .amll-lyric-player .amll-lyric-line {
      font-weight: 800 !important;
      letter-spacing: -0.028em !important;
      line-height: 1.28 !important;
      margin-bottom: clamp(22px, 2.8vh, 36px) !important;
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.4s ease, filter 0.4s ease !important;
    }

    #lyricsStage .amll-lyric-player .amll-lyric-line:not(.active):not([data-active="true"]) {
      filter: blur(1.8px) !important;
      opacity: 0.38 !important;
    }

    /* Línea activa cantada: Blanca, nítida con resplandor sutil Apple */
    #lyricsStage .amll-lyric-player .amll-lyric-line.active,
    #lyricsStage .amll-lyric-player .amll-lyric-line[data-active="true"] {
      color: #ffffff !important;
      opacity: 1 !important;
      filter: blur(0px) drop-shadow(0 2px 14px rgba(255, 255, 255, 0.35)) !important;
    }

    /* Alineación a la derecha para voces secundarias (Backing vocals / Duetos) igual a la imagen */
    #lyricsStage .amll-lyric-player .amll-lyric-line[data-duet="true"],
    #lyricsStage .amll-lyric-player .amll-lyric-line.duet,
    #lyricsStage .amll-lyric-player .amll-lyric-line.is-bg {
      text-align: right !important;
      justify-content: flex-end !important;
    }

    /* ============================================================
       RESPONSIVE EN MÓVILES
       ============================================================ */
    @media (max-width: 950px) {
      .player-main-content {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
        padding: 20px;
        gap: 24px;
      }
      .left-player-panel {
        max-width: 100%;
      }
      .cover-wrapper {
        max-width: 220px;
        margin-bottom: 16px;
      }
      .right-lyrics-panel {
        height: 60vh;
      }
      #lyricsStage .amll-lyric-player {
        --amll-lp-font-size: 26px !important;
      }
    }
  </style>
</head>
<body>

  <!-- ELEMENTO DE AUDIO NATIVO -->
  <audio id="audioElement" preload="metadata" crossorigin="anonymous"></audio>

  <!-- FONDO CONFORMADO POR LA PORTADA -->
  <div class="beautifier-bg" id="beautifierBg">
    <div class="bg-layer bg-layer-1" id="bgLayer1"></div>
    <div class="bg-layer bg-layer-2" id="bgLayer2"></div>
    <div class="bg-orb bg-orb-1" id="bgOrb1"></div>
    <div class="bg-orb bg-orb-2" id="bgOrb2"></div>
    <div class="bg-orb bg-orb-3" id="bgOrb3"></div>
  </div>
  <div class="vignette-overlay"></div>

  <!-- APLICACIÓN APPLE MUSIC -->
  <div class="apple-player-app">

    <header class="top-mac-bar">
      <div class="mac-dots">
        <div class="mac-dot dot-red" title="Cerrar"></div>
        <div class="mac-dot dot-yellow" title="Minimizar"></div>
        <div class="mac-dot dot-green" id="zoomToggle" title="Pantalla Completa"></div>
      </div>

      <div class="now-playing-badge">
        <svg class="apple-music-logo" viewBox="0 0 170 170">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.69-7.85-12-14.44-6.19-9.45-11-20.28-14.42-32.51-3.42-12.22-5.13-23.77-5.13-34.64 0-14.78 3.59-27.18 10.77-37.21 7.18-10.02 16.32-15.17 27.42-15.44 5.33 0 10.89 1.34 16.68 4.02 5.79 2.68 9.53 4.08 11.22 4.2 1.48-.13 5.43-1.6 11.85-4.42 6.42-2.82 12.02-4.14 16.8-3.95 12.7.74 22.84 5.4 30.42 13.98-11.08 6.72-16.51 16.03-16.29 27.93.22 9.57 3.96 17.58 11.22 24.03 7.26 6.45 15.79 10.08 25.59 10.89-2.12 6.52-4.68 13.11-7.69 19.78zM119.22 31.05c0-7.39 2.66-14.38 7.98-20.97 5.32-6.59 11.93-10.42 19.83-11.48.21 1.06.32 2.01.32 2.85 0 7.39-2.77 14.59-8.31 21.6-5.54 7.01-12.24 11.03-20.1 12.06-.21-1.38-.32-2.74-.32-4.06z"/>
        </svg>
        <span id="nowPlayingText">CAPCANA COCOA — Blessd & Anuel AA</span>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="fullScreenBtn" title="Pantalla completa (F)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </header>

    <main class="player-main-content">

      <!-- PANEL IZQUIERDO -->
      <section class="left-player-panel">
        <div class="cover-wrapper" id="coverContainer">
          <img class="cover-img" id="trackCover" src="" alt="Portada" crossorigin="anonymous">
        </div>

        <div class="track-details">
          <div class="track-title-row">
            <h1 class="track-title" id="trackTitle">CAPCANA COCOA</h1>
            <span class="lossless-pill">Lossless</span>
          </div>
          <div class="track-artist" id="trackArtist">Blessd & Anuel AA</div>
        </div>

        <div class="scrubber-container">
          <div class="progress-bar-rail" id="progressRail">
            <div class="progress-bar-fill" id="progressFill">

    // ============================================================
    // 1. EXTRACTOR DE COLOR DE PORTADA CON FALLBACKS FIABLES
    // ============================================================
    function extractCoverPalette(imgUrl, fallbackColors) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const size = 64;
            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;

            const bins = new Map();
            for (let i = 0; i < data.length; i += 16) {
              const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
              if (a < 128) continue;
              const lum = 0.299 * r + 0.587 * g + 0.114 * b;
              if (lum < 15 || lum > 245) continue; // Descartar negros o blancos puros

              const qr = (r >> 4) << 4;
              const qg = (g >> 4) << 4;
              const qb = (b >> 4) << 4;
              const key = (qr << 16) | (qg << 8) | qb;

              let bin = bins.get(key);
              if (!bin) {
                bin = { r: 0, g: 0, b: 0, count: 0 };
                bins.set(key, bin);
              }
              bin.r += r;
              bin.g += g;
              bin.b += b;
              bin.count++;
            }

            const clusters = Array.from(bins.values()).map(b => ({
              r: Math.round(b.r / b.count),
              g: Math.round(b.g / b.count),
              b: Math.round(b.b / b.count),
              count: b.count
            })).sort((a, b) => b.count - a.count);

            if (clusters.length === 0) return resolve(fallbackColors);

            const palette = [clusters[0]];
            for (let i = 1; i < clusters.length && palette.length < 5; i++) {
              const c = clusters[i];
              const isDistinct = palette.every(p => Math.hypot(c.r - p.r, c.g - p.g, c.b - p.b) > 28);
              if (isDistinct) palette.push(c);
            }
            while (palette.length < 5) {
              palette.push(palette[palette.length - 1] || fallbackColors[0]);
            }
            resolve(palette);
          } catch (e) {
            resolve(fallbackColors);
          }
        };
        img.onerror = () => resolve(fallbackColors);
        img.src = imgUrl;
      });
    }

    function applyCoverColors(palette) {
      const root = document.documentElement;
      const c1 = palette[0], c2 = palette[1], c3 = palette[2], c4 = palette[3];

      root.style.setProperty('--cover-c1', `rgb(${c1.r}, ${c1.g}, ${c1.b})`);
      root.style.setProperty('--cover-c2', `rgb(${c2.r}, ${c2.g}, ${c2.b})`);
      root.style.setProperty('--cover-c3', `rgb(${c3.r}, ${c3.g}, ${c3.b})`);
      root.style.setProperty('--cover-c4', `rgb(${c4.r}, ${c4.g}, ${c4.b})`);

      const darkR = Math.max(5, Math.min(18, Math.round(c1.r * 0.1)));

    }

    // ============================================================
    // 2. PARSER TTML CON DETECCIÓN DE SEGUNDAS VOCES / DUETOS
    // ============================================================
    function parseTTMLTime(str) {
      if (!str) return 0;
      str = str.toString().trim();
      if (str.endsWith('ms')) return parseFloat(str.replace('ms', '')) / 1000;
      str = str.replace(/s$/, '');
      const parts = str.split(':');
      if (parts.length === 3) return parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + parseFloat(parts[2].replace(',', '.'));
      if (parts.length === 2) return parseInt(parts[0], 10) * 60 + parseFloat(parts[1].replace(',', '.'));
      return parseFloat(str.replace(',', '.')) || 0;
    }

    function parseTTMLToAMLL(xmlText) {
      const rawLines = [];
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      let pTags = xmlDoc.getElementsByTagNameNS ? xmlDoc.getElementsByTagNameNS('*', 'p') : [];
      if (pTags.length === 0) pTags = xmlDoc.getElementsByTagName('p');

      Array.from(pTags).forEach(p => {
        const beginAttr = p.getAttribute('begin') || p.getAttribute('itunes:begin') || p.getAttribute('t');
        if (!beginAttr) return;

        const pBegin = parseTTMLTime(beginAttr);
        const pEnd = p.getAttribute('end') || p.getAttribute('itunes:end') ? parseTTMLTime(p.getAttribute('end') || p.getAttribute('itunes:end')) : 0;

        // Detección de duetos y voces de fondo para alineación tipo imagen
        const role = p.getAttribute('ttm:role') || p.getAttribute('role') || '';
        const agent = p.getAttribute('ttm:agent') || p.getAttribute('agent') || '';
        const songPart = p.getAttribute('itunes:songPart') || p.getAttribute('songPart') || '';
        const isBG = role.includes('bg') || songPart.includes('backing');
        const isDuet = agent === 'v2' || agent === '2' || isBG;

        let rawWords = [];
        Array.from(p.childNodes).forEach(node => {
          const localName = node.localName ? node.localName.toLowerCase() : (node.nodeName ? node.nodeName.toLowerCase() : '');

          if (node.nodeType === Node.TEXT_NODE) {
            let val = (node.nodeValue || '').replace(/[\r\n\t]+/g, ' ');
            if (val.trim() !== '') {
              rawWords.push({ time: pBegin, dur: 0, text: val });
            }
          } else if (node.nodeType === Node.ELEMENT_NODE && (localName === 'span' || localName === 's' || localName.endsWith(':span') || localName.endsWith(':s'))) {
            const sBegin = node.getAttribute('begin') ? parseTTMLTime(node.getAttribute('begin')) : pBegin;
            const sEnd = node.getAttribute('end') ? parseTTMLTime(node.getAttribute('end')) : 0;
            const sDur = node.getAttribute('dur') ? parseTTMLTime(node.getAttribute('dur')) : (sEnd > sBegin ? sEnd - sBegin : 0);
            
            let spanText = node.textContent || '';
            if (spanText) {
              rawWords.push({ time: sBegin, dur: sDur, text: spanText });
            }
          }
        });

        if (rawWords.length === 0) {
          const clean = (p.textContent || '').trim();
          if (clean) {
            const splitWords = clean.split(/\s+/);
            const step = (pEnd > pBegin && splitWords.length > 1) ? (pEnd - pBegin) / splitWords.length : 0.35;
            splitWords.forEach((sw, idx) => {
              rawWords.push({ time: pBegin + idx * step, dur: step, text: sw });
            });
          }
        }

        if (rawWords.length > 0) {
          for (let i = 0; i < rawWords.length - 1; i++) {
            let cur = rawWords[i];
            let next = rawWords[i + 1];
            if (!/\s$/.test(cur.text) && !/^\s/.test(next.text) && !/^[.,!?:;)’'\]}]/.test(next.text.trim())) {
              cur.text = cur.text + " ";
            }
          }
          rawLines.push({ 
            time: pBegin, 
            words: rawWords, 
            dur: pEnd > pBegin ? pEnd - pBegin : 0,
            isDuet,
            isBG
          });
        }
      });

      rawLines.forEach((l, i) => {
        const nTime = (i < rawLines.length - 1) ? rawLines[i + 1].time : l.time + 6;
        if (!l.dur) l.dur = Math.max(0, nTime - l.time);
        for (let j = 0; j < l.words.length; j++) {
          if (!l.words[j].dur || l.words[j].dur <= 0) {
            l.words[j].dur = (j < l.words.length - 1) ? Math.max(0.05, l.words[j + 1].time - l.words[j].time) : Math.min(2.0, nTime - l.words[j].time);
          }
        }
      });

      return rawLines.map(l => ({
        words: l.words.map(w => ({
          startTime: Math.round(w.time * 1000),
          endTime: Math.round((w.time + w.dur) * 1000),
          word: w.text
        })),
        text: l.words.map(w => w.text).join('').trim(),
        translatedLyric: '',
        romanLyric: '',
        startTime: Math.round(l.time * 1000),
        endTime: Math.round((l.time + l.dur) * 1000),
        isBG: l.isBG,
        isDuet: l.isDuet
      }));
    }

    // ============================================================
    // 3. INICIALIZACIÓN DE AMLL SIN DESTRUCCIÓN DE DOM
    // ============================================================
    async function getLyricPlayer() {
      if (!lyricPlayer) {
        const LyricPlayerCtor = await window.__AMLLReady;
        if (!LyricPlayerCtor) return null;

        lyricPlayer = new LyricPlayerCtor();
        lyricPlayer.setEnableSpring(true);
        lyricPlayer.setEnableBlur(true);
        lyricPlayer.setEnableScale(true);

        if (typeof lyricPlayer.setWordFadeWidth === 'function') {
          lyricPlayer.setWordFadeWidth(0.5);
        }

        lyricPlayer.addEventListener('line-click', (evt) => {
          const lines = lyricPlayer.getLyricLines();
          const line = lines[evt.lineIndex];
          if (line) {
            audio.currentTime = line.startTime / 1000;
            if (audio.paused) togglePlay();
          }
        });

        window.addEventListener('resize', () => {
          if (lyricPlayer) lyricPlayer.calcLayout(true, true);
        });
      }

      // Asegurar que el elemento siempre esté presente en el escenario
      const el = lyricPlayer.getElement();
      if (!lyricsStage.contains(el)) {
        lyricsStage.innerHTML = '';
        lyricsStage.appendChild(el);
      }

      return lyricPlayer;
    }

    async function loadLyricsForTrack(ttmlUrl) {
      lyricsLoader.classList.remove('hidden');
      let xmlText = '';

      if (ttmlUrl.startsWith('data:')) {
        xmlText = decodeURIComponent(ttmlUrl.split(',')[1]);
      } else {
        try {
          const res = await fetch(ttmlUrl);
          if (!res.ok) throw new Error("HTTP error " + res.status);
          xmlText = await res.text();
        } catch (e) {
          try {
            const proxyRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(ttmlUrl)}`);
            xmlText = await proxyRes.text();
          } catch (err) {
            console.error("No se pudieron descargar las letras:", err);
          }
        }
      }

      if (xmlText) {
        const parsedLines = parseTTMLToAMLL(xmlText);
        const player = await getLyricPlayer();
        if (player) {
          player.setLyricLines(parsedLines, audio.currentTime * 1000);
          player.setCurrentTime(audio.currentTime * 1000, true);
          player.calcLayout(true, true);
          player.update(0);
        }
      }
      lyricsLoader.classList.add('hidden');
    }

    // ============================================================
    // 4. CONTROL DE REPRODUCCIÓN Y CAMBIO DE CANCIÓN
    // ============================================================
    async function loadTrack(index, autoPlay = false) {
      currentTrackIndex = (index + playlist.length) % playlist.length;
      const track = playlist[currentTrackIndex];

      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
      nowPlayingText.textContent = `${track.title} — ${track.artist}`;
      trackCover.src = track.cover;
      bgLayer1.style.backgroundImage = `url('${track.cover}')`;
      bgLayer2.style.backgroundImage = `url('${track.cover}')`;

      audio.src = track.audio;
      audio.load();
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      remainingTimeEl.textContent = '-0:00';

      const palette = await extractCoverPalette(track.cover, track.fallbackColors);
      applyCoverColors(palette);

      await loadLyricsForTrack(track.ttml);

      if (autoPlay) {
        audio.play().then(() => {
          isPlaying = true;
          document.body.classList.remove('is-paused');
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(() => {});
      } else {
        isPlaying = false;
        document.body.classList.add('is-paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function nextTrack() {
      if (isShuffle && playlist.length > 1) {
        let randIdx;
        do {
          randIdx = Math.floor(Math.random() * playlist.length);
        } while (randIdx === currentTrackIndex);
        loadTrack(randIdx, isPlaying);
      } else {
        loadTrack(currentTrackIndex + 1, isPlaying);
      }
    }

    function prevTrack() {
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        loadTrack(currentTrackIndex - 1, isPlaying);
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          document.body.classList.remove('is-paused');
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(() => {});
      } else {
        audio.pause();
        isPlaying = false;
        document.body.classList.add('is-paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    document.getElementById('coverContainer').addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevTrack);
    nextBtn.addEventListener('click', nextTrack);

    // Botones Shuffle y Repeat
    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    });

    repeatBtn.addEventListener('click', () => {
      isRepeat = !isRepeat;
      repeatBtn.classList.toggle('active', isRepeat);
    });

    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration && !isNaN(audio.duration)) {
        duration = audio.duration;
        remainingTimeEl.textContent = `-${formatTime(duration)}`;
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (duration > 0 && !isScrubbing) {
        const pct = (audio.currentTime / duration) * 100;
        progressFill.style.width = `${Math.min(pct, 100)}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        const remSec = Math.max(0, duration - audio.currentTime);
        remainingTimeEl.textContent = `-${formatTime(remSec)}`;
      }
    });

    audio.addEventListener('ended', () => {
      if (isRepeat) {
        nextTrack();
      } else {
        if (currentTrackIndex < playlist.length - 1) {
          nextTrack();
        } else {
          audio.pause();
          isPlaying = false;
          document.body.classList.add('is-paused');
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
        }
      }
    });

    // ============================================================
    // 5. SCRUBBER FLUIDO (MOUSE & TOUCH) SIN CRUJIDOS DE AUDIO
    // ============================================================
    function initScrubber() {
      let scrubPct = 0;

      function updateScrubUI(pct) {
        pct = Math.max(0, Math.min(1, pct));
        scrubPct = pct;
        progressFill.style.width = `${pct * 100}%`;
        const seekTime = pct * (duration || 0);
        currentTimeEl.textContent = formatTime(seekTime);
        remainingTimeEl.textContent = `-${formatTime(Math.max(0, (duration || 0) - seekTime))}`;
        if (lyricPlayer) {
          lyricPlayer.setCurrentTime(seekTime * 1000, true);
        }
      }

      function startDrag(e) {
        if (!duration) return;
        isScrubbing = true;
        progressRail.classList.add('is-dragging');
        const rect = progressRail.getBoundingClientRect();

        const getPct = (evt) => {
          const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
          return (clientX - rect.left) / rect.width;
        };

        updateScrubUI(getPct(e));

        const onMove = (evt) => updateScrubUI(getPct(evt));
        const onEnd = () => {
          audio.currentTime = scrubPct * duration;
          isScrubbing = false;
          progressRail.classList.remove('is-dragging');
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onEnd);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onEnd);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd);
      }

      progressRail.addEventListener('mousedown', startDrag);
      progressRail.addEventListener('touchstart', startDrag, { passive: true });
    }

    // ============================================================
    // 6. CONTROL DE VOLUMEN (MOUSE & TOUCH)
    // ============================================================
    function setVolume(pct) {
      pct = Math.max(0, Math.min(1, pct));
      audio.volume = pct;
      volumeFill.style.width = `${pct * 100}%`;
    }

    function initVolumeControl() {
      function handleVolDrag(e) {
        const rect = volumeRail.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        setVolume((clientX - rect.left) / rect.width);
      }

      function startVol(e) {
        handleVolDrag(e);
        const onMove = (evt) => handleVolDrag(evt);
        const onEnd = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onEnd);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onEnd);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onEnd);
      }

      volumeRail.addEventListener('mousedown', startVol);
      volumeRail.addEventListener('touchstart', startVol, { passive: true });

      volumeMuteBtn.addEventListener('click', () => {
        if (audio.volume > 0) {
          audio.dataset.prevVol = audio.volume;
          setVolume(0);
        } else {
          setVolume(parseFloat(audio.dataset.prevVol || 0.8));
        }
      });
    }

    // ============================================================
    // 7. PANTALLA COMPLETA & ACCESOS RÁPIDOS DE TECLADO
    // ============================================================
    function toggleFullScreen() {
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    fullScreenBtn.addEventListener('click', toggleFullScreen);
    zoomToggle.addEventListener('click', toggleFullScreen);

    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime = Math.min(duration, audio.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      } else if (e.code === 'KeyN') {
        nextTrack();
      } else if (e.code === 'KeyP') {
        prevTrack();
      } else if (e.code === 'ArrowUp') {
        setVolume(audio.volume + 0.05);
      } else if (e.code === 'ArrowDown') {
        setVolume(audio.volume - 0.05);
      }
    });

    // ============================================================
    // 8. BUCLE DE ANIMACIÓN CONTINUO (RESUELVE SPRINGS EN PAUSA)
    // ============================================================
    function animationLoop(now) {
      if (!lastFrameMs) lastFrameMs = now;
      const deltaMs = Math.min(100, now - lastFrameMs);
      lastFrameMs = now;

      if (lyricPlayer) {
        if (!audio.paused && !isScrubbing) {
          lyricPlayer.setCurrentTime(audio.currentTime * 1000);
        }
        // Se ejecuta siempre para resolver las físicas elásticas suavemente
        lyricPlayer.update(deltaMs);
      }

      requestAnimationFrame(animationLoop);
    }

    async function init() {
      initScrubber();
      initVolumeControl();
      document.body.classList.add('is-paused');
      await loadTrack(0, false);
      requestAnimationFrame(animationLoop);
    }

    window.onload = init;
  </script>
</body>
</html>
