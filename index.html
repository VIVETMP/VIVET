<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YeYe · Yan Block</title>
<style>
/* ─── SF Pro / Apple System Font ─── */
:root {
  --c-bg: #000;
  --c-text: #fff;
  --c-text-dim: rgba(255,255,255,0.38);
  --c-text-mid: rgba(255,255,255,0.55);
  --c-border: rgba(255,255,255,0.1);
  --c-surface: rgba(255,255,255,0.07);
  --c-surface2: rgba(255,255,255,0.13);

  /* Lyrics-specific */
  --lyric-active: #ffffff;
  --lyric-unlit: rgba(255,255,255,0.28);
  --lyric-past: rgba(255,255,255,0.18);
  --lyric-future: rgba(255,255,255,0.22);

  --radius-art: 20px;
  --t-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --t-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-apple: cubic-bezier(0.25, 0.1, 0.25, 1);

  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
button { background: none; border: none; cursor: pointer; color: inherit; -webkit-tap-highlight-color: transparent; }
img { display: block; }
audio { display: none; }

/* ═══════════════════════════════════════
   APP SHELL
═══════════════════════════════════════ */
#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   DYNAMIC BACKGROUND
═══════════════════════════════════════ */
#dynamic-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: #000;
  transition: opacity 1.2s ease;
}

#bg-canvas {
  position: absolute;
  inset: -40%;
  width: 180%;
  height: 180%;
  object-fit: cover;
  filter: blur(90px) saturate(1.6) brightness(0.32);
  animation: bgDrift 40s ease-in-out infinite alternate;
  will-change: transform;
  transform-origin: center;
}

@keyframes bgDrift {
  0%   { transform: scale(1.0)  rotate(0deg)   translate(0%,    0%   ); }
  25%  { transform: scale(1.12) rotate(8deg)   translate(-3%,   2%   ); }
  50%  { transform: scale(1.08) rotate(-6deg)  translate(2%,    -3%  ); }
  75%  { transform: scale(1.15) rotate(12deg)  translate(-2%,   3%   ); }
  100% { transform: scale(1.0)  rotate(-10deg) translate(3%,    -2%  ); }
}

.bg-vignette {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.7) 80%),
    linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.6) 100%);
}

/* ═══════════════════════════════════════
   LIBRARY VIEW
═══════════════════════════════════════ */
#view-library {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #111217 0%, #000 100%);
  transition: opacity 0.55s var(--t-ease-out), transform 0.55s var(--t-ease-out);
}
#app.playing-view #view-library {
  opacity: 0;
  transform: translateY(-24px) scale(0.98);
  pointer-events: none;
}

/* Nav */
.lib-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--c-border);
}
.lib-nav-logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: #fc3c44;
}
.lib-nav-icons { display: flex; gap: 6px; }
.lib-nav-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.lib-nav-btn:hover { background: var(--c-surface2); }
.lib-nav-btn svg { width: 19px; height: 19px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.lib-scroll {
  flex: 1; overflow-y: auto; padding: 24px 20px 0;
  scrollbar-width: none;
}
.lib-scroll::-webkit-scrollbar { display: none; }
.lib-section-title {
  font-size: 22px; font-weight: 700; letter-spacing: -0.4px;
  margin-bottom: 16px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}
.card {
  cursor: pointer;
  transition: transform 0.25s var(--t-spring), opacity 0.2s;
  border-radius: 12px;
}
.card:hover  { transform: scale(1.04); }
.card:active { transform: scale(0.96); opacity: 0.85; }
.card-art {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.6);
  will-change: transform;
}
.card-info  { padding: 8px 2px 0; }
.card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-artist{ font-size: 12px; color: var(--c-text-dim); margin-top: 2px; }

/* Mini player */
.mini-player {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px 10px;
  height: 72px;
  background: rgba(20,20,22,0.88);
  backdrop-filter: blur(32px) saturate(1.8);
  -webkit-backdrop-filter: blur(32px) saturate(1.8);
  border-top: 1px solid var(--c-border);
  flex-shrink: 0;
}
.mini-art {
  width: 46px; height: 46px; border-radius: 8px; object-fit: cover;
  box-shadow: 0 3px 12px rgba(0,0,0,0.55); flex-shrink: 0;
  transition: transform 0.3s var(--t-spring);
}
.mini-art:hover { transform: scale(1.06); }
.mini-info { flex: 1; min-width: 0; }
.mini-title  { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-artist { font-size: 12px; color: var(--c-text-dim); margin-top: 1px; }
.mini-ctrls  { display: flex; align-items: center; gap: 4px; }
.mini-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.12s;
}
.mini-btn:hover  { background: var(--c-surface2); }
.mini-btn:active { transform: scale(0.88); }
.mini-btn svg { width: 18px; height: 18px; fill: #fff; }
.mini-btn.play {
  background: #fff;
  width: 34px; height: 34px;
}
.mini-btn.play svg { fill: #000; width: 16px; height: 16px; }
.mini-btn.play:hover { background: rgba(255,255,255,0.88); }

.mini-wave {
  display: flex; align-items: center; gap: 2.5px; height: 18px; flex-shrink: 0;
}
.mini-wave-bar {
  width: 2.5px; border-radius: 2px; background: #fc3c44;
  animation: waveA 0.8s ease-in-out infinite alternate;
  will-change: height;
}
.mini-wave-bar:nth-child(1){ height:5px;  animation-duration:0.65s; animation-delay:0s; }
.mini-wave-bar:nth-child(2){ height:12px; animation-duration:0.85s; animation-delay:0.1s; }
.mini-wave-bar:nth-child(3){ height:8px;  animation-duration:0.72s; animation-delay:0.22s; }
.mini-wave-bar:nth-child(4){ height:14px; animation-duration:0.9s;  animation-delay:0.08s; }
.mini-wave-bar:nth-child(5){ height:6px;  animation-duration:0.68s; animation-delay:0.18s; }
@keyframes waveA {
  from { transform: scaleY(0.5); }
  to   { transform: scaleY(1.8); }
}
.mini-wave.paused .mini-wave-bar { animation-play-state: paused; transform: scaleY(0.5); }

.btn-expand {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 18px;
  background: var(--c-surface2); border: 1px solid var(--c-border);
  font-size: 12.5px; font-weight: 500;
  transition: background 0.15s, transform 0.12s;
  white-space: nowrap; flex-shrink: 0;
}
.btn-expand:hover { background: rgba(255,255,255,0.2); }
.btn-expand:active{ transform: scale(0.94); }
.btn-expand svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ═══════════════════════════════════════
   NOW PLAYING VIEW (fullscreen)
═══════════════════════════════════════ */
#view-now-playing {
  position: absolute;
  inset: 0;
  z-index: 20;
  opacity: 0;
  pointer-events: none;
  transform: translateY(20px) scale(0.99);
  transition: opacity 0.6s var(--t-ease-out), transform 0.6s var(--t-ease-out);
  overflow: hidden;
}
#app.playing-view #view-now-playing {
  opacity: 1;
  pointer-events: all;
  transform: translateY(0) scale(1);
}

/* ── Top bar ── */
.np-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px 12px;
}
.np-topbar-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.np-topbar-actions { display: flex; gap: 8px; align-items: center; }
.np-pill-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 18px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 12.5px; font-weight: 500;
  transition: background 0.15s, transform 0.12s;
  white-space: nowrap;
}
.np-pill-btn:hover  { background: rgba(255,255,255,0.18); }
.np-pill-btn:active { transform: scale(0.94); }
.np-pill-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* ── Main layout ── */
.np-content {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  grid-template-columns: 420px 1fr;
  grid-template-rows: 1fr;
  padding: 64px 56px 44px 56px;
  gap: 48px;
  align-items: start;
}
#app.lyrics-off .np-content {
  grid-template-columns: 1fr 0fr;
}

/* ── Left panel ── */
.np-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  gap: 0;
  transition: transform 0.6s var(--t-ease-out);
}
#app.lyrics-off .np-left { transform: translateX(calc(50% + 28px)); }

/* Album art */
.np-art-wrap {
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1;
  border-radius: var(--radius-art);
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 24px 80px rgba(0,0,0,0.75),
    0 8px 24px rgba(0,0,0,0.5);
  margin-bottom: 24px;
  will-change: transform;
  transition: transform 0.5s var(--t-spring), box-shadow 0.5s ease;
}
.np-art-wrap.pulsing {
  animation: artPulse 0.4s var(--t-spring);
}
@keyframes artPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(0.96); }
  100% { transform: scale(1); }
}
#np-art {
  width: 100%; height: 100%; object-fit: cover;
  transition: opacity 0.4s ease;
}

/* Song info */
.np-song-info {
  width: 100%; max-width: 360px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.np-song-texts { flex: 1; min-width: 0; }
.np-title {
  font-size: clamp(20px, 2.2vw, 26px);
  font-weight: 800;
  letter-spacing: -0.6px;
  line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.np-artist {
  font-size: 15px;
  color: rgba(255,255,255,0.55);
  margin-top: 4px;
  font-weight: 500;
}
.np-heart-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  flex-shrink: 0; margin-left: 8px;
  transition: transform 0.2s var(--t-spring), opacity 0.15s;
}
.np-heart-btn:hover  { transform: scale(1.15); opacity: 0.85; }
.np-heart-btn:active { transform: scale(0.88); }
.np-heart-btn svg { width: 22px; height: 22px; fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 1.8; }
.np-heart-btn.liked svg { fill: #fc3c44; stroke: #fc3c44; }

/* Progress */
.np-progress-wrap {
  width: 100%; max-width: 360px; margin-top: 16px;
}
.np-scrubber {
  position: relative;
  height: 4px;
  border-radius: 3px;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  transition: height 0.12s, background 0.15s;
  overflow: visible;
}
.np-scrubber:hover { height: 6px; }
.np-scrubber::after {
  content: '';
  position: absolute;
  right: calc(var(--pct, 0%) * -1);
  top: 50%;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity 0.15s;
  left: calc(var(--pct, 0%) - 6px);
}
.np-scrubber:hover::after { opacity: 1; }
.np-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: #fff; border-radius: inherit;
  width: 0%;
  pointer-events: none;
}
.np-times {
  display: flex; justify-content: space-between;
  margin-top: 5px;
  font-size: 11px; color: rgba(255,255,255,0.45);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.1px;
}

/* Transport controls */
.np-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%; max-width: 360px;
  margin-top: 18px;
}
.np-ctrl-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: transform 0.15s var(--t-spring), background 0.15s, opacity 0.15s;
}
.np-ctrl-btn:hover  { transform: scale(1.08); background: rgba(255,255,255,0.08); }
.np-ctrl-btn:active { transform: scale(0.88); opacity: 0.7; }
.np-ctrl-btn svg { width: 22px; height: 22px; fill: #fff; }
.np-ctrl-btn.play-btn {
  width: 58px; height: 58px;
  background: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.45);
}
.np-ctrl-btn.play-btn svg { fill: #000; width: 26px; height: 26px; }
.np-ctrl-btn.play-btn:hover { background: rgba(255,255,255,0.9); }
.np-ctrl-btn.play-btn:active { transform: scale(0.92); }

/* Volume row */
.np-volume-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%; max-width: 360px;
  margin-top: 14px;
}
.vol-icon { flex-shrink: 0; }
.vol-icon svg { width: 16px; height: 16px; fill: rgba(255,255,255,0.4); }
.vol-slider {
  flex: 1;
  height: 3px;
  border-radius: 3px;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  position: relative;
  transition: height 0.12s;
}
.vol-slider:hover { height: 5px; }
.vol-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: rgba(255,255,255,0.6); border-radius: inherit;
  width: 100%;
  pointer-events: none;
}

/* ── Right panel: LYRICS ── */
.np-lyrics-panel {
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: opacity 0.55s var(--t-ease-out), transform 0.55s var(--t-ease-out);
  will-change: opacity, transform;
}
#app.lyrics-off .np-lyrics-panel {
  opacity: 0;
  transform: translateX(40px);
  pointer-events: none;
}

/* Lyrics header */
.lyrics-header {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 14px; flex-shrink: 0;
}
.lyrics-header-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: rgba(255,255,255,0.35);
}
.lyrics-source-btn {
  font-size: 11px; color: rgba(255,255,255,0.35);
  padding: 4px 8px; border-radius: 6px;
  transition: background 0.15s, color 0.15s;
}
.lyrics-source-btn:hover { background: var(--c-surface2); color: rgba(255,255,255,0.6); }

/* Lyrics viewport */
.lyrics-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
  -webkit-mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    black 12%,
    black 82%,
    transparent 100%
  );
  mask-image: linear-gradient(
    to bottom,
    transparent 0%,
    black 12%,
    black 82%,
    transparent 100%
  );
}

/* ════════════════════════════════════════════════
   LYRICS TRACK — Apple Music word-fill style
════════════════════════════════════════════════ */
#lyrics-track {
  position: absolute;
  left: 0; right: 0;
  top: 48%;
  will-change: transform;
  transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  padding-bottom: 60%;
}

/* Each line */
.lyric-line {
  padding: 11px 0;
  cursor: pointer;
  user-select: none;
  transition:
    transform  0.5s cubic-bezier(0.16, 1, 0.3, 1),
    opacity    0.45s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, opacity;
  transform-origin: left center;
}

/* Line states */
.lyric-line            { opacity: 0.22; transform: scale(1) translateX(0px); }
.lyric-line.past       { opacity: 0.15; transform: scale(0.98) translateX(-2px); }
.lyric-line.upcoming   { opacity: 0.28; }
.lyric-line.active     { opacity: 1;    transform: scale(1) translateX(0); }

/* Spacer lines (instrumental) */
.lyric-line.spacer {
  padding: 8px 0;
  min-height: 28px;
  opacity: 0;
}
.lyric-line.spacer.active {
  opacity: 1;
}
.lyric-spacer-dot {
  display: inline-flex;
  gap: 7px;
  align-items: center;
  padding: 6px 0;
}
.lyric-spacer-dot span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
  display: inline-block;
  animation: dotPulse 1.4s ease-in-out infinite;
  will-change: transform, opacity;
}
.lyric-spacer-dot span:nth-child(2) { animation-delay: 0.2s; }
.lyric-spacer-dot span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%, 100% { transform: scale(1);    opacity: 0.5; }
  50%       { transform: scale(1.5); opacity: 1;   }
}
.lyric-line.active  .lyric-spacer-dot span { opacity: 1; }
.lyric-line:not(.active) .lyric-spacer-dot span { animation-play-state: paused; }

/* ════════════════════════════════════════════
   WORD-BY-WORD FILL — The Apple Music magic
════════════════════════════════════════════ */
.lyric-word {
  display: inline;
  position: relative;
  white-space: pre-wrap;
}

/* Background (unlit) layer */
.lyric-word .word-bg {
  color: var(--lyric-unlit);
  font-size: inherit;
  font-weight: inherit;
  line-height: inherit;
  transition: color 0.3s ease;
}

/* Active line unlit words */
.lyric-line.active .lyric-word .word-bg {
  color: rgba(255,255,255,0.3);
}

/* Lit = filled word */
.lyric-word.lit .word-bg {
  color: var(--lyric-active);
  text-shadow:
    0 0 18px rgba(255,255,255,0.55),
    0 0 40px rgba(255,255,255,0.22);
}

/* Line font size — Apple Music uses larger bold text for lyrics */
.lyric-line {
  font-size: clamp(22px, 2.6vw, 32px);
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.35;
  color: rgba(255,255,255,0.22);
}

/* Active line font size stays same but gets brighter */
.lyric-line.active {
  font-size: clamp(22px, 2.6vw, 32px);
}

/* ── Word fill clip animation ── */
/*
  Apple Music renders each word with a "fill" that sweeps left-to-right
  over the course of the word's duration.  We replicate this using a
  clip-path on an overlay span that matches the word text.
*/
.lyric-word {
  display: inline;
  position: relative;
  cursor: pointer;
}

/* Wrapper that holds both bg and fill spans, keeps them inline */
.lyric-word-inner {
  display: inline;
  position: relative;
  white-space: pre;
}

/* Base dim layer */
.lyric-word .w-base {
  color: rgba(255,255,255,0.22);
  transition: color 0.35s ease;
}
.lyric-line.active .lyric-word .w-base {
  color: rgba(255,255,255,0.28);
}
.lyric-line.past .lyric-word .w-base {
  color: rgba(255,255,255,0.16);
}

/* Bright fill overlay — clipped with a width-based reveal */
.lyric-word .w-fill {
  position: absolute;
  left: 0; top: 0;
  color: #ffffff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  white-space: pre;
  overflow: hidden;
  width: 0%;
  transition: width 0ms linear, color 0.2s ease; /* width transition set via JS */
  pointer-events: none;
}

/* When a word is "lit" (already fully passed) */
.lyric-word.lit .w-fill {
  width: 100% !important;
  transition: width 0.12s ease-out !important;
  text-shadow: 0 0 22px rgba(255,255,255,0.55), 0 0 45px rgba(255,255,255,0.2);
}

/* ── Past line words — all lit ── */
.lyric-line.past .lyric-word .w-fill {
  width: 100% !important;
  text-shadow: none;

}

/* ── Line click hint ── */
.lyric-line:hover { opacity: 0.72 !important; }
.lyric-line.active:hover { opacity: 1 !important; }

/* ═══════════════════════════════════════
   MISC
═══════════════════════════════════════ */
.hidden { display: none !important; }

/* ═══════════════════════════════════════

@media (max-width: 860px) {

}

<script>
"use strict";

/* ══════════════════════════════════════════
   1. PLAYLIST
══════════════════════════════════════════ */
const PLAYLIST = [
  {
    id: 1,
    title: "YeYe",
    artist: "Yan Block",
    album: "YeYe",
    album_art: "https://res.cloudinary.com/ddcbl694n/image/upload/v1779472989/YEYE_Yan_block_m6n1ee.jpg",
    audio_url:  "https://res.cloudinary.com/ddcbl694n/video/upload/v1779472988/YeYe_spotdown.org_sfs0oj.mp3",
    lyrics_url: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1779473062/YeYe_spotdown.org_eqsrsv.ttml"
  }
];

const LATENCY = -0.10; // seconds ahead to trigger
const CROSSFADE_S = 10;

/* ══════════════════════════════════════════
   2. STATE
══════════════════════════════════════════ */
const S = {
  idx: 0,
  playing: false,
  volume: 1.0,
  engine: 'A',       // 'A' | 'B'
  xfading: false,
  xfadeTimer: null,
  xfadeStart: null,
  lyrics: [],        // parsed lines
  activeLine: -1,
  rafLyrics: null,
  rafProgress: null,
  liked: false,
};

/* ══════════════════════════════════════════
   3. DOM REFS
══════════════════════════════════════════ */
const engA = document.getElementById('eng-a');
const engB = document.getElementById('eng-b');
const $app = document.getElementById('app');
const bgImg = document.getElementById('bg-canvas');

// Library
const cardGrid   = document.getElementById('card-grid');
const miniArt    = document.getElementById('mini-art');
const miniTitle  = document.getElementById('mini-title');
const miniArtist = document.getElementById('mini-artist');
const miniWave   = document.getElementById('mini-wave');
const miniPlay   = document.getElementById('mini-play');
const miniIPlay  = document.getElementById('mini-icon-play');
const miniIPause = document.getElementById('mini-icon-pause');
const miniPrev   = document.getElementById('mini-prev');
const miniNext   = document.getElementById('mini-next');
const btnExpand  = document.getElementById('btn-expand');

// Now Playing
const btnCollapse    = document.getElementById('btn-collapse');
const btnLyricsToggle= document.getElementById('btn-lyrics-toggle');
const lyricsToggleLbl= document.getElementById('lyrics-toggle-lbl');
const npArt          = document.getElementById('np-art');
const npArtWrap      = document.getElementById('np-art-wrap');
const npTitle        = document.getElementById('np-title');
const npArtist       = document.getElementById('np-artist');
const npHeart        = document.getElementById('np-heart');
const npPlay         = document.getElementById('np-play');
const npIPlay        = document.getElementById('np-icon-play');
const npIPause       = document.getElementById('np-icon-pause');
const npPrev         = document.getElementById('np-prev');
const npNext         = document.getElementById('np-next');
const npScrubber     = document.getElementById('np-scrubber');
const npFill         = document.getElementById('np-fill');
const npTimeCur      = document.getElementById('np-time-cur');
const npTimeTot      = document.getElementById('np-time-tot');
const volSlider      = document.getElementById('vol-slider');
const volFill        = document.getElementById('vol-fill');
const lyricsTrack    = document.getElementById('lyrics-track');

/* ══════════════════════════════════════════
   4. HELPERS
══════════════════════════════════════════ */
function fmt(s) {
  if (!isFinite(s) || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sc = Math.floor(s % 60);
  return `${m}:${sc.toString().padStart(2,'0')}`;
}
function engines() {
  return S.engine === 'A'
    ? { active: engA, inactive: engB }
    : { active: engB, inactive: engA };
}
function setPlayIcons(playing) {
  [miniIPlay, miniIPause].forEach((el, i) => el.classList.toggle('hidden', playing ? i===0 : i===1));
  [npIPlay,   npIPause  ].forEach((el, i) => el.classList.toggle('hidden', playing ? i===0 : i===1));
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/* ══════════════════════════════════════════
   5. TTML PARSER
══════════════════════════════════════════ */
function parseSecs(t) {
  if (!t) return 0;
  const s = t.trim().replace(/s$/,'');
  const p = s.split(':');
  if (p.length === 3) return +p[0]*3600 + +p[1]*60 + parseFloat(p[2]);
  if (p.length === 2) return +p[0]*60 + parseFloat(p[1]);
  return parseFloat(s);
}
function getTags(doc, tag) {
  let els = doc.getElementsByTagName(tag);
  if (!els.length) els = doc.getElementsByTagNameNS('*', tag);
  return els;
}
function parseTTML(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const lines = [];
  const ps = getTags(doc, 'p');
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    const ls = parseSecs(p.getAttribute('begin'));
    const le = parseSecs(p.getAttribute('end'));
    const text = p.textContent.trim();
    const isSpacer = text === '♪' || text === '' || text === '​';
    const words = [];
    const spans = getTags(p, 'span');
    if (spans.length) {
      for (let j = 0; j < spans.length; j++) {
        const sp = spans[j];
        const w = sp.textContent; // preserve spaces
        if (!w) continue;
        words.push({
          text: w,
          start: parseSecs(sp.getAttribute('begin')),
          end:   parseSecs(sp.getAttribute('end'))
        });
      }
    } else if (!isSpacer) {
      const ws = text.split(/\s+/);
      const dur = le - ls;
      const wd  = dur / Math.max(ws.length, 1);
      ws.forEach((wt, k) => {
        words.push({ text: wt, start: ls + k*wd, end: ls + (k+1)*wd });
      });
    }
    lines.push({ ls, le, words, isSpacer, text });
  }
  return lines;
}

/* ══════════════════════════════════════════
   6. INJECT LYRICS INTO DOM
══════════════════════════════════════════ */
function injectLyrics(lines) {
  lyricsTrack.innerHTML = '';
  lines.forEach((line, li) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.dataset.li = li;

    if (line.isSpacer) {
      div.classList.add('spacer');
      const dotWrap = document.createElement('div');
      dotWrap.className = 'lyric-spacer-dot';
      dotWrap.innerHTML = '<span></span><span></span><span></span>';
      div.appendChild(dotWrap);
    } else {
      line.words.forEach((w, wi) => {
        // word wrapper
        const wspan = document.createElement('span');
        wspan.className = 'lyric-word';
        wspan.dataset.li = li;
        wspan.dataset.wi = wi;

        // base (dim) layer
        const base = document.createElement('span');
        base.className = 'w-base';
        base.textContent = w.text;

        // fill (bright) overlay
        const fill = document.createElement('span');
        fill.className = 'w-fill';
        fill.textContent = w.text;
        fill.style.width = '0%';
        fill.style.transition = 'none';

        wspan.appendChild(base);
        wspan.appendChild(fill);
        div.appendChild(wspan);

        // space between words
        if (wi < line.words.length - 1) {
          div.appendChild(document.createTextNode(' '));
        }
      });
    }

    div.addEventListener('click', () => {
      engines().active.currentTime = line.ls;
    });

    lyricsTrack.appendChild(div);
  });
}

/* ══════════════════════════════════════════
   7. LYRICS SYNC LOOP
══════════════════════════════════════════ */
function startLyrics() {
  if (S.rafLyrics) cancelAnimationFrame(S.rafLyrics);
  const tick = () => {
    tickLyrics(engines().active.currentTime + LATENCY);
    S.rafLyrics = requestAnimationFrame(tick);
  };
  S.rafLyrics = requestAnimationFrame(tick);
}
function stopLyrics() {
  if (S.rafLyrics) { cancelAnimationFrame(S.rafLyrics); S.rafLyrics = null; }
}

function tickLyrics(t) {
  const lines = S.lyrics;
  if (!lines.length) return;

  // Find active line
  let ai = -1;
  for (let i = lines.length-1; i >= 0; i--) {
    if (t >= lines[i].ls) { ai = i; break; }
  }

  const lineEls = lyricsTrack.querySelectorAll('.lyric-line');

  // Rebuild classes only when line changes
  if (ai !== S.activeLine) {
    S.activeLine = ai;
    lineEls.forEach((el, i) => {
      el.classList.remove('active','past','upcoming');
      if      (i < ai)  el.classList.add('past');
      else if (i === ai) el.classList.add('active');
      else if (i <= ai + 3) el.classList.add('upcoming');
    });

    // Scroll
    if (ai >= 0 && lineEls[ai]) {
      const el = lineEls[ai];
      const translateY = -(el.offsetTop + el.offsetHeight / 2);
      lyricsTrack.style.transform = `translateY(${translateY}px)`;
    }

    // Art pulse on line change
    npArtWrap.classList.remove('pulsing');
    void npArtWrap.offsetWidth; // reflow
    // Don't pulse every line — only every few for subtlety
  }

  // Word-by-word fill
  if (ai >= 0 && !lines[ai].isSpacer && lineEls[ai]) {
    const activeEl = lineEls[ai];
    const words    = lines[ai].words;
    const wEls     = activeEl.querySelectorAll('.lyric-word');

    wEls.forEach((wEl, wi) => {
      const w = words[wi];
      if (!w) return;

      const fillEl = wEl.querySelector('.w-fill');
      if (!fillEl) return;

      if (t >= w.end) {
        // Word fully sung — snap to 100%
        wEl.classList.add('lit');
        fillEl.style.transition = 'width 0.1s ease-out';
        fillEl.style.width = '100%';
      } else if (t >= w.start) {
        // Word in progress — animate fill proportionally
        wEl.classList.remove('lit');
        const dur  = w.end - w.start;
        const prog = clamp((t - w.start) / dur, 0, 1);
        const pct  = (prog * 100).toFixed(1) + '%';
        // Set transition duration to remaining time for ultra-smooth fill
        const remMs = ((1 - prog) * dur * 1000).toFixed(0);
        fillEl.style.transition = `width ${remMs}ms linear`;
        fillEl.style.width = pct;
      } else {
        // Word hasn't started yet
        wEl.classList.remove('lit');
        fillEl.style.transition = 'none';
        fillEl.style.width = '0%';
      }
    });
  }

  // Clear fill on non-active lines (handled by CSS .past, but ensure JS state is clean)
}

/* ══════════════════════════════════════════
   8. PROGRESS LOOP
══════════════════════════════════════════ */
function startProgress() {
  if (S.rafProgress) cancelAnimationFrame(S.rafProgress);
  const tick = () => {
    const { active } = engines();
    const cur = active.currentTime || 0;
    const dur = active.duration    || 0;
    const pct = dur > 0 ? (cur / dur) * 100 : 0;
    npFill.style.width = pct + '%';
    npScrubber.style.setProperty('--pct', pct + '%');
    npTimeCur.textContent = fmt(cur);
    npTimeTot.textContent = fmt(dur);
    S.rafProgress = requestAnimationFrame(tick);
  };
  S.rafProgress = requestAnimationFrame(tick);
}
function stopProgress() {
  if (S.rafProgress) { cancelAnimationFrame(S.rafProgress); S.rafProgress = null; }
}

/* ══════════════════════════════════════════
   9. CROSSFADE ENGINE
══════════════════════════════════════════ */
function loadInEngine(eng, song) {
  eng.src = song.audio_url;
  eng.volume = 0;
  eng.load();
}
function startXfade() {
  if (S.xfading) return;
  S.xfading = true;
  S.xfadeStart = performance.now();
  const { active, inactive } = engines();
  inactive.volume = 0;
  inactive.play().catch(()=>{});
  const durMs = CROSSFADE_S * 1000;
  function step(now) {
    const p = Math.min((now - S.xfadeStart) / durMs, 1);
    active.volume   = Math.max(0, (1-p) * S.volume);
    inactive.volume = Math.min(S.volume, p * S.volume);
    if (p < 1) {
      S.xfadeTimer = requestAnimationFrame(step);
    } else {
      active.pause(); active.src = ''; active.load();
      S.engine = S.engine === 'A' ? 'B' : 'A';
      S.xfading = false;
      updateUI();
    }
  }
  S.xfadeTimer = requestAnimationFrame(step);
}
function monitorXfade() {
  const { active } = engines();
  active.addEventListener('timeupdate', function ontu() {
    if (!S.playing || S.xfading) return;
    const rem = active.duration - active.currentTime;
    if (isFinite(rem) && rem <= CROSSFADE_S && rem > 0) {
      const ni = (S.idx + 1) % PLAYLIST.length;
      S.idx = ni;
      const { inactive } = engines();
      loadInEngine(inactive, PLAYLIST[ni]);
      inactive.addEventListener('canplay', function ocp() {
        inactive.removeEventListener('canplay', ocp);
        startXfade();
      }, { once: true });
    }
  });
  active.addEventListener('ended', () => { if (!S.xfading) nextSong(); });
}

/* ══════════════════════════════════════════
   10. PLAYBACK
══════════════════════════════════════════ */
async function updateUI() {
  const song = PLAYLIST[S.idx];
  miniArt.src  = song.album_art;
  miniTitle.textContent  = song.title;
  miniArtist.textContent = song.artist;
  npArt.src    = song.album_art;
  bgImg.src    = song.album_art;
  npTitle.textContent  = song.title;
  npArtist.textContent = song.artist;

  // Load lyrics
  lyricsTrack.innerHTML = '<div class="lyric-line active" style="font-size:18px;opacity:0.4">Cargando letras...</div>';
  S.lyrics = [];
  S.activeLine = -1;

  try {
    const r = await fetch(song.lyrics_url);
    if (!r.ok) throw new Error('fetch');
    const xml = await r.text();
    S.lyrics = parseTTML(xml);
    injectLyrics(S.lyrics);
    lyricsTrack.style.transform = 'translateY(0)';
  } catch (e) {
    console.warn('Lyrics error:', e);
    lyricsTrack.innerHTML = '<div class="lyric-line active" style="opacity:0.35;font-size:18px">Letras no disponibles.</div>';
  }
}

function playSong(idx) {
  if (S.xfadeTimer) { cancelAnimationFrame(S.xfadeTimer); S.xfadeTimer = null; }
  S.xfading = false;
  engA.pause(); engA.src=''; engA.load();
  engB.pause(); engB.src=''; engB.load();
  S.idx = idx; S.engine = 'A'; S.activeLine = -1;
  const song = PLAYLIST[idx];
  engA.src = song.audio_url;
  engA.volume = S.volume;
  engA.load();
  engA.addEventListener('canplay', function oncp() {
    engA.removeEventListener('canplay', oncp);
    engA.play().then(() => {
      S.playing = true;
      setPlayIcons(true);
      miniWave.classList.remove('paused');
      updateUI();
      startProgress();
      startLyrics();
      monitorXfade();
    }).catch(e => console.warn('Autoplay blocked:', e));
  }, { once: true });
}

function togglePlay() {
  const { active } = engines();
  if (S.playing) {
    active.pause();
    S.playing = false;
    setPlayIcons(false);
    miniWave.classList.add('paused');
    stopProgress();
    stopLyrics();
  } else {
    active.play().then(() => {
      S.playing = true;
      setPlayIcons(true);
      miniWave.classList.remove('paused');
      startProgress();
      startLyrics();
    }).catch(console.warn);
  }
}

function nextSong() { playSong((S.idx + 1) % PLAYLIST.length); }
function prevSong() {
  const { active } = engines();
  if (active.currentTime > 3) { active.currentTime = 0; }
  else { playSong((S.idx - 1 + PLAYLIST.length) % PLAYLIST.length); }
}

/* ══════════════════════════════════════════
   11. SCRUBBER
══════════════════════════════════════════ */
let scrubbing = false;
npScrubber.addEventListener('mousedown', e => { scrubbing = true; doScrub(e); });
document.addEventListener('mousemove',  e => { if (scrubbing) doScrub(e); });
document.addEventListener('mouseup',    ()  => { scrubbing = false; });
npScrubber.addEventListener('touchstart', e => { scrubbing = true; doScrub(e.touches[0]); }, {passive:true});
document.addEventListener('touchmove',   e => { if (scrubbing) doScrub(e.touches[0]); }, {passive:true});
document.addEventListener('touchend',    ()  => { scrubbing = false; });

function doScrub(e) {
  const { active } = engines();
  if (!active.duration) return;
  const r   = npScrubber.getBoundingClientRect();
  const pct = clamp((e.clientX - r.left) / r.width, 0, 1);
  active.currentTime = pct * active.duration;
}

/* ══════════════════════════════════════════
   12. VOLUME SLIDER
══════════════════════════════════════════ */
let volScrubbing = false;
volSlider.addEventListener('mousedown', e => { volScrubbing = true; doVol(e); });
document.addEventListener('mousemove',  e => { if (volScrubbing) doVol(e); });
document.addEventListener('mouseup',    ()  => { volScrubbing = false; });

function doVol(e) {
  const r = volSlider.getBoundingClientRect();
  const v = clamp((e.clientX - r.left) / r.width, 0, 1);
  S.volume = v;
  volFill.style.width = (v * 100) + '%';
  engines().active.volume = v;
}

/* ══════════════════════════════════════════
   13. VIEW SWITCHING
══════════════════════════════════════════ */
btnExpand.addEventListener('click', () => {
  $app.classList.add('playing-view');
});
btnCollapse.addEventListener('click', () => {
  $app.classList.remove('playing-view');
});
btnLyricsToggle.addEventListener('click', () => {
  const off = $app.classList.toggle('lyrics-off');
  lyricsToggleLbl.textContent = off ? 'Mostrar Letras' : 'Ocultar Letras';
});
npHeart.addEventListener('click', () => {
  S.liked = !S.liked;
  npHeart.classList.toggle('liked', S.liked);
});

/* ══════════════════════════════════════════
   14. TRANSPORT BUTTONS
══════════════════════════════════════════ */
miniPlay.addEventListener('click', togglePlay);
npPlay.addEventListener('click',   togglePlay);
miniPrev.addEventListener('click', prevSong);
npPrev.addEventListener('click',   prevSong);
miniNext.addEventListener('click', nextSong);
npNext.addEventListener('click',   nextSong);

/* ══════════════════════════════════════════
   15. KEYBOARD
══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space')      { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') { const a = engines().active; a.currentTime = Math.min(a.duration||0, a.currentTime+5); }
  if (e.code === 'ArrowLeft')  { const a = engines().active; a.currentTime = Math.max(0, a.currentTime-5); }
});

/* ══════════════════════════════════════════
   16. CARD GRID
══════════════════════════════════════════ */
function buildGrid() {
  cardGrid.innerHTML = '';
  PLAYLIST.forEach((song, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');
    div.setAttribute('aria-label', `${song.title} por ${song.artist}`);
    div.innerHTML = `
      <img class="card-art" src="${song.album_art}" alt="${song.title}" loading="lazy" />
      <div class="card-info">
        <div class="card-title">${song.title}</div>
        <div class="card-artist">${song.artist}</div>
      </div>`;
    div.addEventListener('click', () => {
      playSong(i);
      $app.classList.add('playing-view');
    });
    div.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playSong(i); $app.classList.add('playing-view'); }
    });
    cardGrid.appendChild(div);
  });
}

/* ══════════════════════════════════════════
   17. INIT
══════════════════════════════════════════ */
(function init() {
  buildGrid();
  updateUI();
  setPlayIcons(false);
  volFill.style.width = '100%';
})();
</script>
</body>
</html>
