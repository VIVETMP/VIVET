<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music - Web Player</title>
  <!-- Fuente del sistema -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #060608;
      --bg-card: rgba(28, 28, 30, 0.45);
      --apple-red: #fc3c44;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.55);
      --glass-bg: rgba(20, 20, 20, 0.55);
      --glass-border: rgba(255, 255, 255, 0.08);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fluid: 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #app-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* FONDO DE VIDEO DINÁMICO (YOUTUBE) */
    #youtube-bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
      background: #000;
      transition: opacity 1s ease;
      opacity: 0;
      pointer-events: none;
    }

    body.layout-fullscreen #youtube-bg-container {
      opacity: 1;
    }

    #youtube-bg-player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%) scale(1.15);
      pointer-events: none;
      filter: brightness(0.22) saturate(1.3) blur(20px);
      will-change: filter, transform;
    }

    #youtube-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%), rgba(5, 5, 5, 0.35);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: -1;
    }

    /* SISTEMA DE PANTALLAS (TRANSICIONES) */
    #home-screen, #fullscreen-player-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity var(--transition-fluid), transform var(--transition-fluid), visibility var(--transition-fluid);
      will-change: opacity, transform;
    }

    body.layout-selection #home-screen {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      pointer-events: auto;
    }

    body.layout-selection #fullscreen-player-screen {
      opacity: 0;
      transform: scale(1.05);
      visibility: hidden;
      pointer-events: none;
    }

    body.layout-fullscreen #home-screen {
      opacity: 0;
      transform: scale(0.95);
      visibility: hidden;
      pointer-events: none;
    }

    body.layout-fullscreen #fullscreen-player-screen {
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      pointer-events: auto;
    }

    /* --- ESTILOS MODO SELECCIÓN --- */
    #home-screen {
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
      background: var(--bg-primary);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(8, 8, 10, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--apple-red);
    }

    .logo svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .nav-links {
      display: flex;
      gap: 1.2rem;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .nav-btn:hover, .nav-btn.active {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }

    .content-area {
      padding: 3rem;
      overflow-y: auto;
      flex: 1;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }

    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 2rem;
    }

    .song-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.2rem;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .song-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .song-card-art-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }

    .song-card-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--transition-fluid);
    }

    .song-card-details {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .song-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .song-card-artist {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* MINI-PLAYER */
    .mini-player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 85px;
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid var(--glass-border);
      z-index: 100;
    }

    .mini-player-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      padding: 0 2rem;
    }

    .mini-song-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 30%;
    }

    .mini-album-art {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .mini-metadata {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .mini-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .mini-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .mini-controls {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .control-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      border-radius: 50%;
      transition: background 0.2s, transform 0.1s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .control-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .play-pause-btn {
      background: #ffffff;
      color: #000000;
      width: 44px;
      height: 44px;
    }

    .mini-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      width: 30%;
      justify-content: flex-end;
    }

    .fullscreen-toggle-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .fullscreen-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .fullscreen-toggle-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* ONDA DE AUDIO */
    .audio-wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      width: 25px;
    }

    .audio-wave .bar {
      width: 3px;
      height: 100%;
      background: var(--apple-red);
      border-radius: 2px;
      transform: scaleY(0.25);
      transform-origin: bottom;
      transition: transform 0.3s ease;
    }

    .audio-wave.playing .bar {
      animation: bounce 0.8s ease-in-out infinite alternate;
    }

    .audio-wave.playing .bar:nth-child(2) { animation-delay: 0.15s; }
    .audio-wave.playing .bar:nth-child(3) { animation-delay: 0.3s; }
    .audio-wave.playing .bar:nth-child(4) { animation-delay: 0.45s; }
    .audio-wave.playing .bar:nth-child(5) { animation-delay: 0.6s; }

    @keyframes bounce {
      0% { transform: scaleY(0.2); }
      100% { transform: scaleY(1); }
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      position: relative;
      transition: height 0.2s ease;
    }

    .progress-bar-container:hover {
      height: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--apple-red);
      width: 0%;
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .progress-bar-container:hover .progress-bar-fill::after {
      transform: translateY(-50%) scale(1);
    }

    .mini-progress {
      position: absolute;
      top: -4px;
      left: 0;
      width: 100%;
    }


    /* --- ESTILOS MODO PANTALLA COMPLETA --- */
    #fullscreen-player-screen {
      background: transparent;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      padding: 6rem;
      box-sizing: border-box;
      gap: 5rem;
      align-items: center;
    }

    .exit-fullscreen-btn {
      position: absolute;
      top: 2rem;
      right: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: background 0.3s, transform 0.2s;
      z-index: 1100;
    }

    .exit-fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .exit-fullscreen-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Panel Izquierdo */
    .fs-left-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem;
      height: 100%;
    }

    .fs-art-container {
      width: 320px;
      height: 320px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0,0,0,0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .fs-album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .fs-song-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .fs-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1px;
    }

    .fs-artist {
      font-size: 1.35rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .fs-playback-controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .fs-progress {
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
    }

    .fs-progress .progress-bar-fill {
      border-radius: 3px;
      background: #ffffff;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .fs-control-buttons {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-top: 0.5rem;
    }

    .fs-play-btn {
      background: #ffffff;
      color: #000000;
      width: 58px;
      height: 58px;
    }

    .fs-play-btn svg {
      width: 28px;
      height: 28px;
    }

    /* NUEVOS AJUSTES DE CALIBRACIÓN Y CONFIGURACIÓN */
    .settings-panel {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .setting-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .setting-group label span {
      color: var(--apple-red);
    }

    .setting-group input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      outline: none;
    }

    .setting-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .input-row input[type="text"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .input-row button {
      background: var(--apple-red);
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .input-row button:hover {
      opacity: 0.9;
    }

    /* Panel Derecho: Letras Sincronizadas */
    .fs-lyrics-panel {
      display: flex;
      align-items: center;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #lyrics-container {
      width: 100%;
      height: 80%;
      overflow: hidden;
      position: relative;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,1) 25%,
        rgba(0,0,0,1) 75%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,1) 25%,
        rgba(0,0,0,1) 75%,
        transparent 100%
      );
    }

    #lyrics-scroller {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2.2rem;
      padding: 40% 0;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .lyric-line {
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: -0.5px;
      transform-origin: left center;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease, filter 0.5s ease;
      will-change: transform, opacity, filter;
      cursor: pointer;
      filter: blur(0.5px);
    }

    .lyric-line.active {
      color: #ffffff;
      opacity: 1;
      transform: scale(1.06);
      filter: blur(0px);
    }

    .lyric-line.inactive {
      opacity: 0.3;
      transform: scale(1);
      filter: blur(1px);
    }

    .lyric-word {
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.15s ease-out, text-shadow 0.15s ease-out;
      will-change: color, text-shadow;
      display: inline-block;
      margin-right: 0.35rem;
    }

    .lyric-line.active .lyric-word.word-active {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    @media (max-width: 900px) {
      #fullscreen-player-screen {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        padding: 3rem 2rem 2rem;
        gap: 2rem;
      }

      .fs-left-panel {
        align-items: center;
        gap: 1.2rem;
      }

      .fs-art-container {
        width: 180px;
        height: 180px;
      }

      .fs-title {
        font-size: 1.8rem;
        text-align: center;
      }

      .fs-artist {
        font-size: 1rem;
        text-align: center;
      }

      .fs-playback-controls, .settings-panel {
        max-width: 100%;
      }

      .fs-lyrics-panel {
        height: 45vh;
      }

      .lyric-line {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body class="layout-selection">

  <div style="display: none;">
    <audio id="audioEngineA" crossorigin="anonymous"></audio>
    <audio id="audioEngineB" crossorigin="anonymous"></audio>
  </div>

  <div id="app-container">

    <!-- REPRODUCTOR DE YOUTUBE PARA EL FONDO -->
    <div id="youtube-bg-container">
      <div id="youtube-bg-player"></div>
      <div id="youtube-overlay"></div>
    </div>

    <!-- MODO SELECCIÓN -->
    <div id="home-screen">
      <header class="top-nav">
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.5H9v-6h2v6zm4 0h-2V7h2v10.5z"/>
          </svg>
          <span>Music</span>
        </div>
        <nav class="nav-links">
          <button class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Inicio
          </button>
          <button class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5c0-3.59-2.91-6.5-6.5-6.5S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Buscar
          </button>
          <button class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            Biblioteca
          </button>
        </nav>
      </header>

      <main class="content-area">
        <h1 class="section-title">Escuchar ahora</h1>
        <div class="songs-grid" id="songs-grid">
          <!-- Portadas inyectadas mediante JS -->
        </div>
      </main>

      <!-- Barra Mini-Player Fija -->
      <footer class="mini-player">
        <div class="progress-bar-container mini-progress">
          <div class="progress-bar-fill" id="mini-progress-fill"></div>
        </div>
        
        <div class="mini-player-content">
          <div class="mini-song-info">
            <img src="" alt="" class="mini-album-art" id="mini-album-art">
            <div class="mini-metadata">
              <span class="mini-title" id="mini-title">Cargando canción...</span>
              <span class="mini-artist" id="mini-artist">-</span>
            </div>
          </div>

          <div class="mini-controls">
            <button class="control-btn" onclick="prevSong()">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="control-btn play-pause-btn" onclick="togglePlay()">
              <svg id="mini-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="control-btn" onclick="nextSong()">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
            </button>
          </div>

          <div class="mini-right">
            <div class="audio-wave" id="mini-wave">
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
              <div class="bar"></div>
            </div>
            <button class="fullscreen-toggle-btn" onclick="enterFullscreen()">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>
      </footer>
    </div>


    <!-- MODO PANTALLA COMPLETA (INMERSIVO) -->
    <div id="fullscreen-player-screen">
      <button class="exit-fullscreen-btn" onclick="exitFullscreen()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>

      <!-- Panel Izquierdo: Álbum, Controles y Calibración -->
      <div class="fs-left-panel">
        <div class="fs-art-container">
          <img src="" alt="" class="fs-album-art" id="fs-album-art">
        </div>
        <div class="fs-song-details">
          <h1 class="fs-title" id="fs-title">-</h1>
          <p class="fs-artist" id="fs-artist">-</p>
        </div>
        
        <div class="fs-playback-controls">
          <div class="progress-bar-container fs-progress">
            <div class="progress-bar-fill" id="fs-progress-fill"></div>
          </div>
          <div class="time-labels">
            <span id="fs-current-time">0:00</span>
            <span id="fs-duration">0:00</span>
          </div>
          
          <div class="fs-control-buttons">
            <button class="control-btn" onclick="prevSong()">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="control-btn play-pause-btn fs-play-btn" onclick="togglePlay()">
              <svg id="fs-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="control-btn" onclick="nextSong()">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12h2v12h-2z"/></svg>
            </button>
          </div>
        </div>

        <!-- PANEL DE CALIBRACIÓN Y CONFIGURACIÓN -->
        <div class="settings-panel">
          <div class="setting-group">
            <label for="offset-slider">Calibración de Letras: <span id="offset-value">0.0s</span></label>
            <input type="range" id="offset-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
          </div>
          <div class="setting-group">
            <label for="yt-id-input">ID de Video de YouTube (Fondo):</label>
            <div class="input-row">
              <input type="text" id="yt-id-input" value="dQw4w9WgXcQ" placeholder="Ej: dQw4w9WgXcQ">
              <button onclick="updateYoutubeVideo()">Aplicar</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Panel Derecho: Letras dinámicas -->
      <div class="fs-lyrics-panel">
        <div id="lyrics-container">
          <div id="lyrics-scroller">
            <!-- Cargando letras... -->
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 1. MODELO DE DATOS - Únicamente la canción del usuario
    const PLAYLIST = [
      {
        id: 1,
        title: "YeYe",
        artist: "Yan Block",
        album_art: "https://res.cloudinary.com/ddcbl694n/image/upload/v1779472989/YEYE_Yan_block_m6n1ee.jpg",
        audio_url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1779472988/YeYe_spotdown.org_sfs0oj.mp3",
        youtube_id: "dQw4w9WgXcQ", // ID editable de YouTube para el fondo (por defecto Rick Astley, cámbialo en la interfaz)
        lyrics_url: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1779473062/YeYe_spotdown.org_eqsrsv.ttml"
      }
    ];

    // Motores de audio duales ocultos
    const audioEngineA = document.getElementById('audioEngineA');
    const audioEngineB = document.getElementById('audioEngineB');
    
    let activeEngine = audioEngineA;
    let inactiveEngine = audioEngineB;
    
    let currentSongIndex = 0;
    let isPlaying = false;
    let crossfadeTriggered = false;
    const CROSSFADE_LIMIT = 12; // segundos
    
    let currentParsedLyrics = [];
    let youtubePlayer;
    let animationFrameId;

    // Configuración de calibración (Offset manual de desfase)
    let lyricOffset = 0.0;
    const offsetSlider = document.getElementById('offset-slider');
    const offsetValueDisplay = document.getElementById('offset-value');

    offsetSlider.addEventListener('input', (e) => {
      lyricOffset = parseFloat(e.target.value);
      offsetValueDisplay.textContent = (lyricOffset >= 0 ? "+" : "") + lyricOffset.toFixed(1) + "s";
    });

    window.addEventListener('DOMContentLoaded', () => {
      initPlayer();
    });

    function initPlayer() {
      const grid = document.getElementById('songs-grid');
      grid.innerHTML = '';
      
      PLAYLIST.forEach((song, index) => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `
          <div class="song-card-art-container">
            <img src="${song.album_art}" alt="${song.title}" class="song-card-art">
          </div>
          <div class="song-card-details">
            <span class="song-card-title">${song.title}</span>
            <span class="song-card-artist">${song.artist}</span>
          </div>
        `;
        card.addEventListener('click', () => playSong(index));
        grid.appendChild(card);
      });

      setupProgressBars();
      loadSongState(0);

      audioEngineA.addEventListener('ended', onSongEnded);
      audioEngineB.addEventListener('ended', onSongEnded);
    }

    function loadSongState(index) {
      currentSongIndex = index;
      crossfadeTriggered = false;
      
      const song = PLAYLIST[index];
      activeEngine.src = song.audio_url;
      activeEngine.volume = 1.0;
      inactiveEngine.volume = 0.0;
      
      document.getElementById('yt-id-input').value = song.youtube_id;
      
      updateSongDetailsUI();
      loadLyricsForSong(song);
    }

    function playSong(index, seekTime = 0) {
      currentSongIndex = index;
      crossfadeTriggered = false;
      
      audioEngineA.pause();
      audioEngineB.pause();
      
      activeEngine = audioEngineA;
      inactiveEngine = audioEngineB;
      
      activeEngine.volume = 1.0;
      inactiveEngine.volume = 0.0;
      
      const song = PLAYLIST[currentSongIndex];
      activeEngine.src = song.audio_url;
      activeEngine.currentTime = seekTime;
      
      activeEngine.play()
        .then(() => {
          isPlaying = true;
          updatePlayPauseUI();
          updateSongDetailsUI();
          loadLyricsForSong(song);
          syncYouTubeVideo(song.youtube_id, seekTime);
        })
        .catch(err => {
          console.log("Autoplay bloqueado temporalmente por el navegador: ", err);
        });

      cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(updateAudioLoop);
    }

    function togglePlay() {
      if (isPlaying) {
        activeEngine.pause();
        if (crossfadeTriggered) {
          inactiveEngine.pause();
        }
        if (youtubePlayer && typeof youtubePlayer.pauseVideo === 'function') {
          youtubePlayer.pauseVideo();
        }
        isPlaying = false;
      } else {
        activeEngine.play()
          .then(() => {
            if (crossfadeTriggered) {
              inactiveEngine.play();
            }
            if (youtubePlayer && typeof youtubePlayer.playVideo === 'function') {
              youtubePlayer.playVideo();
            }
            isPlaying = true;
          })
          .catch(err => console.log(err));
      }
      updatePlayPauseUI();
    }

    function updatePlayPauseUI() {
      const playIconHTML = `<path d="M8 5v14l11-7z"/>`;
      const pauseIconHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      
      const miniPlayBtn = document.getElementById('mini-play-icon');
      const fsPlayBtn = document.getElementById('fs-play-icon');
      const wave = document.getElementById('mini-wave');
      
      if (isPlaying) {
        miniPlayBtn.innerHTML = pauseIconHTML;
        fsPlayBtn.innerHTML = pauseIconHTML;
        wave.classList.add('playing');
      } else {
        miniPlayBtn.innerHTML = playIconHTML;
        fsPlayBtn.innerHTML = playIconHTML;
        wave.classList.remove('playing');
      }
    }

    function nextSong() {
      // Al ser solo 1 canción, volverá a reproducirse en bucle
      const nextIndex = (currentSongIndex + 1) % PLAYLIST.length;
      playSong(nextIndex);
    }

    function prevSong() {
      const prevIndex = (currentSongIndex - 1 + PLAYLIST.length) % PLAYLIST.length;
      playSong(prevIndex);
    }

    function onSongEnded() {
      if (!crossfadeTriggered) {
        nextSong();
      }
    }

    function updateSongDetailsUI() {
      const song = PLAYLIST[currentSongIndex];
      
      document.getElementById('mini-album-art').src = song.album_art;
      document.getElementById('mini-title').textContent = song.title;
      document.getElementById('mini-artist').textContent = song.artist;
      
      document.getElementById('fs-album-art').src = song.album_art;
      document.getElementById('fs-title').textContent = song.title;
      document.getElementById('fs-artist').textContent = song.artist;
    }

    function setupProgressBars() {
      const progressContainers = document.querySelectorAll('.progress-bar-container');
      progressContainers.forEach(container => {
        container.addEventListener('click', (e) => {
          const rect = container.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const width = rect.width;
          const percentage = clickX / width;
          
          const duration = activeEngine.duration;
          if (duration) {
            const targetTime = percentage * duration;
            
            if (crossfadeTriggered) {
              cancelCrossfadeAndSeek(targetTime);
            } else {
              activeEngine.currentTime = targetTime;
            }
            
            if (youtubePlayer && typeof youtubePlayer.seekTo === 'function') {
              youtubePlayer.seekTo(targetTime, true);
            }
          }
        });
      });
    }

    function cancelCrossfadeAndSeek(targetTime) {
      crossfadeTriggered = false;
      inactiveEngine.pause();
      inactiveEngine.volume = 0.0;
      activeEngine.volume = 1.0;
      activeEngine.currentTime = targetTime;
    }

    // 2. MOTOR DE COMPROBACIÓN Y TRANSICIÓN DE DJ (CROSSFADE)
    function updateAudioLoop() {
      if (!isPlaying) {
        animationFrameId = requestAnimationFrame(updateAudioLoop);
        return;
      }

      const curTime = activeEngine.currentTime;
      const duration = activeEngine.duration;

      // Evaluar la aproximación de los últimos 12 segundos para arrancar crossfade
      if (duration && (duration > CROSSFADE_LIMIT * 2) && (curTime >= duration - CROSSFADE_LIMIT) && !crossfadeTriggered) {
        triggerCrossfade();
      }

      if (crossfadeTriggered) {
        const elapsed = curTime - (duration - CROSSFADE_LIMIT);
        let progress = elapsed / CROSSFADE_LIMIT;
        
        if (progress < 0) progress = 0;
        if (progress > 1) progress = 1;
        
        activeEngine.volume = 1 - progress;
        inactiveEngine.volume = progress;

        if (progress >= 1 || activeEngine.ended) {
          completeCrossfade();
        }
      }

      // Actualizar barras de estado de tiempo
      if (!crossfadeTriggered) {
        updateProgressUI(curTime, duration);
      } else {
        updateProgressUI(inactiveEngine.currentTime, inactiveEngine.duration || duration);
      }

      // Sincronizar las líneas del visor
      updateLyricsSync();

      animationFrameId = requestAnimationFrame(updateAudioLoop);
    }

    function triggerCrossfade() {
      crossfadeTriggered = true;
      const nextIndex = (currentSongIndex + 1) % PLAYLIST.length;
      const nextSong = PLAYLIST[nextIndex];

      inactiveEngine.src = nextSong.audio_url;
      inactiveEngine.volume = 0.0;
      inactiveEngine.currentTime = 0;

      inactiveEngine.play()
        .then(() => {
          if (youtubePlayer && typeof youtubePlayer.loadVideoById === 'function') {
            youtubePlayer.loadVideoById({
              videoId: nextSong.youtube_id,
              startSeconds: 0
            });
            youtubePlayer.mute();
          }
        })
        .catch(err => console.log("Fallo al reproducir el motor cruzado de entrada:", err));
    }

    function completeCrossfade() {
      crossfadeTriggered = false;
      activeEngine.pause();
      activeEngine.volume = 1.0;

      const temp = activeEngine;
      activeEngine = inactiveEngine;
      inactiveEngine = temp;

      currentSongIndex = (currentSongIndex + 1) % PLAYLIST.length;
      const currentSong = PLAYLIST[currentSongIndex];

      updateSongDetailsUI();
      loadLyricsForSong(currentSong);
    }

    function updateProgressUI(currentTime, duration) {
      if (!duration) return;
      const progressPercent = (currentTime / duration) * 100;

      document.getElementById('mini-progress-fill').style.width = `${progressPercent}%`;
      document.getElementById('fs-progress-fill').style.width = `${progressPercent}%`;

      document.getElementById('fs-current-time').textContent = formatTime(currentTime);
      document.getElementById('fs-duration').textContent = formatTime(duration);
    }

    function formatTime(secs) {
      const minutes = Math.floor(secs / 60);
      const seconds = Math.floor(secs % 60);
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }


    // 3. PARSER SENSORIAL Y CARGA DINÁMICA DE ARCHIVO TTML DESDE CLOUDINARY
    function parseTimeToSeconds(timeStr) {
      if (!timeStr) return 0;
      let cleanStr = timeStr.trim().replace('s', '');
      const parts = cleanStr.split(':');
      let seconds = 0;
      if (parts.length === 3) {
        seconds = parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
      } else if (parts.length === 2) {
        seconds = parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
      } else {
        seconds = parseFloat(cleanStr);
      }
      return seconds;
    }

    function parseTTML(ttmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(ttmlText, "text/xml");
      const lines = [];

      const pElements = xmlDoc.getElementsByTagName("p");
      for (let i = 0; i < pElements.length; i++) {
        const p = pElements[i];
        const lineBegin = parseTimeToSeconds(p.getAttribute("begin"));
        const lineEnd = parseTimeToSeconds(p.getAttribute("end"));
        
        const words = [];
        const spanElements = p.getElementsByTagName("span");

        if (spanElements.length > 0) {
          for (let j = 0; j < spanElements.length; j++) {
            const span = spanElements[j];
            words.push({
              text: span.textContent.trim(),
              begin: parseTimeToSeconds(span.getAttribute("begin")),
              end: parseTimeToSeconds(span.getAttribute("end"))
            });
          }
        } else {
          // Si no tiene spans internos de sílabas, autocalcular progresión uniforme
          const textWords = p.textContent.trim().split(/\s+/);
          const duration = lineEnd - lineBegin;
          const wordDuration = duration / Math.max(textWords.length, 1);
          textWords.forEach((wordText, index) => {
            words.push({
              text: wordText,
              begin: lineBegin + (index * wordDuration),
              end: lineBegin + ((index + 1) * wordDuration)
            });
          });
        }

        lines.push({
          begin: lineBegin,
          end: lineEnd,
          words: words,
          text: p.textContent.trim()
        });
      }
      return lines;
    }

    // Petición HTTP directa al archivo que proporcionó el usuario para evitar el copiado estático
    async function loadLyricsForSong(song) {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '<div style="color: var(--text-muted); font-size: 1.2rem; text-align: center; padding-top: 2rem;">Cargando letras desde Cloudinary...</div>';
      
      try {
        const response = await fetch(song.lyrics_url);
        if (!response.ok) throw new Error("No se pudo obtener las letras desde la nube");
        const xmlText = await response.text();
        currentParsedLyrics = parseTTML(xmlText);
        renderLyricsDOM();
      } catch (error) {
        console.error("Error al obtener las letras:", error);
        scroller.innerHTML = '<div style="color: var(--apple-red); font-size: 1rem; text-align: center; padding-top: 2rem;">No se pudieron cargar las letras. Verifica tu conexión de red o configuraciones CORS en el origen.</div>';
      }
    }

    function renderLyricsDOM() {
      const scroller = document.getElementById('lyrics-scroller');
      scroller.innerHTML = '';

      currentParsedLyrics.forEach((line, index) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'lyric-line inactive';
        lineDiv.dataset.index = index;

        lineDiv.addEventListener('click', () => {
          seekToTime(line.begin);
        });

        line.words.forEach(word => {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'lyric-word';
          wordSpan.textContent = word.text;
          lineDiv.appendChild(wordSpan);
        });

        scroller.appendChild(lineDiv);
      });
    }

    // Visualización y realce aplicando el offset de desfase configurado
    function updateLyricsSync() {
      // Ajuste de desfase mediante calibrador manual en tiempo real
      const curTime = activeEngine.currentTime + lyricOffset;
      const lines = currentParsedLyrics;
      if (!lines || lines.length === 0) return;

      let activeIndex = -1;

      for (let i = 0; i < lines.length; i++) {
        if (curTime >= lines[i].begin && curTime <= lines[i].end) {
          activeIndex = i;
          break;
        }
      }

      if (activeIndex === -1) {
        for (let i = lines.length - 1; i >= 0; i--) {
          if (curTime >= lines[i].begin) {
            activeIndex = i;
            break;
          }
        }
      }

      const lineElements = document.querySelectorAll('.lyric-line');
      if (lineElements.length === 0) return;

      lineElements.forEach((el, index) => {
        if (index === activeIndex) {
          el.classList.add('active');
          el.classList.remove('inactive');

          const wordElements = el.querySelectorAll('.lyric-word');
          const wordsData = lines[index].words;
          wordElements.forEach((wordEl, wIndex) => {
            const wordData = wordsData[wIndex];
            if (wordData) {
              if (curTime >= wordData.begin) {
                wordEl.classList.add('word-active');
              } else {
                wordEl.classList.remove('word-active');
              }
            }
          });
        } else {
          el.classList.remove('active');
          el.classList.add('inactive');
          el.querySelectorAll('.lyric-word').forEach(wordEl => {
            wordEl.classList.remove('word-active');
          });
        }
      });

      // Efecto de centrado dinámico (Scroll Elevable)
      if (activeIndex !== -1) {
        const activeEl = lineElements[activeIndex];
        const container = document.getElementById('lyrics-container');
        const scroller = document.getElementById('lyrics-scroller');

        if (container && scroller && activeEl) {
          const containerHeight = container.clientHeight;
          const activeOffsetTop = activeEl.offsetTop;
          const activeHeight = activeEl.clientHeight;

          const targetY = (containerHeight / 2) - activeOffsetTop - (activeHeight / 2);
          scroller.style.transform = `translateY(${targetY}px)`;
        }
      } else {
        const scroller = document.getElementById('lyrics-scroller');
        if (scroller) {
          scroller.style.transform = 'translateY(0px)';
        }
      }
    }


    // 4. INTEGRACIÓN DINÁMICA DE LA API DE IFRAME DE YOUTUBE
    function enterFullscreen() {
      document.body.className = "layout-fullscreen";
      if (isPlaying && youtubePlayer && typeof youtubePlayer.playVideo === 'function') {
        youtubePlayer.playVideo();
      }
    }

    function exitFullscreen() {
      document.body.className = "layout-selection";
    }

    function updateYoutubeVideo() {
      const inputVal = document.getElementById('yt-id-input').value.trim();
      if (inputVal) {
        PLAYLIST[currentSongIndex].youtube_id = inputVal;
        syncYouTubeVideo(inputVal, activeEngine.currentTime);
      }
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    window.onYouTubeIframeAPIReady = function() {
      const song = PLAYLIST[currentSongIndex];
      youtubePlayer = new YT.Player('youtube-bg-player', {
        height: '100%',
        width: '100%',
        videoId: song.youtube_id,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          mute: 1,
          loop: 1,
          playlist: song.youtube_id
        },
        events: {
          onReady: (event) => {
            event.target.mute();
            if (isPlaying) {
              event.target.playVideo();
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.ENDED) {
              event.target.playVideo();
            }
          }
        }
      });
    };

    function syncYouTubeVideo(videoId, seconds) {
      if (youtubePlayer && typeof youtubePlayer.loadVideoById === 'function') {
        const currentUrl = youtubePlayer.getVideoUrl();
        const isSame = currentUrl && currentUrl.includes(videoId);
        
        if (!isSame) {
          youtubePlayer.loadVideoById({
            videoId: videoId,
            startSeconds: seconds
          });
          youtubePlayer.mute();
        } else {
          youtubePlayer.seekTo(seconds, true);
        }
      }
    }
  </script>
