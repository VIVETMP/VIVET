<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VIVETMP Music - Apple Music Edition</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Apple Music-like Lyrics Engine -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.5.1/dist/style.css">
    <script>
        window.__AMLLResolver = null;
        window.__AMLLReady = new Promise((resolve) => {
            window.__AMLLResolver = resolve;
        });
    </script>
    <script type="module">
        import { LyricPlayer } from "https://esm.sh/@applemusic-like-lyrics/core@0.5.1";
        if (window.__AMLLResolver) {
            window.__AMLLResolver(LyricPlayer);
        } else {
            window.__AMLLReady = Promise.resolve(LyricPlayer);
        }
    </script>
    
    <style>
        /* ==================================================================
           SISTEMA DE DISEÑO ESTILO APPLE MUSIC & TONOS NATURALES
           ================================================================== */
        :root {
            --theme-accent: #ffffff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.45);

            --bg-glass-card: rgba(255, 255, 255, 0.06);
            --bg-glass-player: rgba(20, 20, 25, 0.78);
            --border-glass: rgba(255, 255, 255, 0.12);

            --font-display: -apple-system, BlinkMacSystemFont, 'Outfit', 'Helvetica Neue', sans-serif;
            --font-main: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Helvetica Neue', sans-serif;

            --ease-fluid: cubic-bezier(0.25, 1, 0.5, 1);
            --ease-snappy: cubic-bezier(0.3, 1.2, 0.4, 1);
            --player-height: 84px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: var(--font-main);
            background-color: #000;
            color: var(--text-primary);
            height: 100vh; height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ==================================================================
           FONDO DINÁMICO FIEL AL TONO (Glassy Music Style)
           ================================================================== */
        #ambient-bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            background: #000;
        }

        /* La imagen de portada desenfocada directamente, conservando sus colores reales */
        .ambient-cover-layer {
            position: absolute;
            inset: -35%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(80px);
            -webkit-filter: blur(80px);
            transform: scale(1.25);
            animation: ambientFloat 60s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes ambientFloat {
            0% { transform: scale(1.25) translate(0%, 0%) rotate(0deg); }
            50% { transform: scale(1.38) translate(-2%, 2%) rotate(2deg); }
            100% { transform: scale(1.28) translate(2%, -2%) rotate(-1.5deg); }
        }

        /* Capa ligera de atenuación para lectura de texto blanco sin alterar los tonos de la portada */
        .ambient-darken {
            position: absolute; inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        .noise-overlay {
            position: absolute; inset: 0; z-index: 2; opacity: 0.035; mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* ==================================================================
           UI 1: HOME REDISEÑADO (APPLE MUSIC HERO SHOWCASE)
           ================================================================== */
        #app-wrapper {
            display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh;
            position: relative; z-index: 10;
            opacity: 1; visibility: visible;
            transition: transform 0.65s var(--ease-fluid), opacity 0.35s ease, visibility 0.35s;
        }

        #app-wrapper.scaled {
            transform: scale(0.92) translateY(-2vh);
            opacity: 0 !important; visibility: hidden !important;
            pointer-events: none;
        }

        .home-topbar {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: clamp(16px, 3.5vh, 36px) clamp(20px, 4vw, 64px);
            z-index: 20;
        }
        .brand {
            font-family: var(--font-display); font-size: clamp(20px, 2vw, 26px); font-weight: 800;
            display: flex; align-items: center; gap: 10px; color: #fff; letter-spacing: -0.02em;
        }
        .brand i { font-size: 28px; }

        .audio-quality-tag {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-glass);
            border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
        }

        .home-hero-container {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 0 clamp(16px, 4vw, 40px) calc(var(--player-height) + 20px);
        }

        .showcase-card {
            display: flex; align-items: center; gap: clamp(28px, 4.5vw, 60px);
            background: var(--bg-glass-card); border: 1px solid var(--border-glass);
            border-radius: clamp(24px, 3vw, 40px); padding: clamp(24px, 3.5vw, 48px);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5); max-width: 960px; width: 100%;
        }

        .showcase-art-wrap {
            width: clamp(200px, 28vw, 340px); height: clamp(200px, 28vw, 340px);
            aspect-ratio: 1; border-radius: clamp(16px, 2vw, 24px);
            overflow: hidden; flex-shrink: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
        }
        .showcase-art { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s var(--ease-fluid); }
        .showcase-art-wrap:hover .showcase-art { transform: scale(1.04); }

        .showcase-info { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
        .meta-subtitle { font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--text-tertiary); }
        .showcase-title {
            font-family: var(--font-display); font-size: clamp(28px, 4vw, 48px); font-weight: 900;
            letter-spacing: -0.03em; line-height: 1.1; color: #fff; word-break: break-word;
        }
        .showcase-artist {
            font-size: clamp(16px, 1.6vw, 22px); font-weight: 600; color: var(--text-secondary);
        }

        .showcase-actions { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
        .btn-play-hero {
            display: inline-flex; align-items: center; gap: 10px; padding: 14px 34px;
            border-radius: 100px; background: #ffffff; color: #000; border: none;
            font-family: var(--font-display); font-size: 15px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2); transition: all 0.3s var(--ease-snappy);
        }
        .btn-play-hero:hover { transform: scale(1.04); box-shadow: 0 15px 35px rgba(255, 255, 255, 0.3); }
        
        .btn-lyrics-hero {
            display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px;
            border-radius: 100px; background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border-glass);
            font-size: 14px; font-weight: 700; cursor: pointer; backdrop-filter: blur(20px); transition: all 0.3s var(--ease-snappy);
        }
        .btn-lyrics-hero:hover { background: rgba(255, 255, 255, 0.16); transform: scale(1.02); }

        /* Barra flotante inferior de reproducción */
        .player-wrapper {
            position: fixed; bottom: clamp(12px, 2.5vh, 28px); left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 50; pointer-events: none;
            padding: 0 clamp(16px, 3vw, 32px);
            transition: transform 0.4s var(--ease-fluid), opacity 0.3s;
        }
        body.np-active .player-wrapper { opacity: 0; pointer-events: none; transform: translateY(40px); }

        .player-pill {
            pointer-events: auto; width: 100%; max-width: 980px; height: var(--player-height);
            background: var(--bg-glass-player); backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--border-glass); border-radius: 24px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); gap: 16px;
        }

        .pill-info { display: flex; align-items: center; gap: 14px; width: 30%; cursor: pointer; min-width: 140px; }
        .pill-img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
        .pill-meta { display: flex; flex-direction: column; overflow: hidden; }
        .pill-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pill-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .pill-controls { display: flex; flex-direction: column; align-items: center; width: 40%; gap: 6px; }
        .pill-buttons { display: flex; align-items: center; gap: 24px; font-size: 20px; color: var(--text-secondary); }
        .pill-buttons i { cursor: pointer; transition: 0.2s; }
        .pill-buttons i:hover { color: #fff; transform: scale(1.15); }
        .pill-play-btn {
            width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
            transition: transform 0.25s var(--ease-snappy);
        }
        .pill-play-btn i { margin-left: 2px; }
        .pill-play-btn:hover { transform: scale(1.1); }

        .scrubber-wrap { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 11px; font-weight: 700; color: var(--text-tertiary); }
        .scrubber-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.15); border-radius: 100px; cursor: pointer; position: relative; }
        .scrubber-fill { width: 0%; height: 100%; background: #fff; border-radius: 100px; }

        .pill-actions { display: flex; align-items: center; justify-content: flex-end; width: 30%; gap: 16px; color: var(--text-secondary); font-size: 18px; }
        .vol-slider { width: 75px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 100px; cursor: pointer; position: relative; }
        .vol-fill { width: 75%; height: 100%; background: #fff; border-radius: 100px; }
        .btn-expand { cursor: pointer; transition: 0.2s; }
        .btn-expand:hover { color: #fff; transform: scale(1.15); }

        /* ==================================================================
           UI 2: FULLSCREEN NOW PLAYING (APPLE MUSIC DESKTOP REPLICA)
           ================================================================== */
        #np-fs {
            position: fixed; inset: 0; z-index: 100; transform: translateY(100%);
            opacity: 0; visibility: hidden;
            transition: transform 0.65s var(--ease-fluid), opacity 0.35s ease, visibility 0.35s;
            display: flex; flex-direction: column; overflow: hidden;
            background: transparent; font-family: var(--font-display);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        #np-fs.active { transform: translateY(0); opacity: 1; visibility: visible; }

        .np-header {
            position: absolute; top: clamp(16px, 3vh, 32px); left: 0; width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 clamp(20px, 4vw, 64px); z-index: 30;
        }
        .btn-close-fs {
            width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass); display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 20px; cursor: pointer; backdrop-filter: blur(25px);
            transition: all 0.3s var(--ease-snappy);
        }
        .btn-close-fs:hover { background: rgba(255, 255, 255, 0.18); transform: scale(1.08); }

        .fs-layout {
            display: grid; grid-template-columns: minmax(360px, 44%) 1fr;
            width: 100%; height: 100%; max-width: 1600px; margin: 0 auto;
            padding: clamp(60px, 9vh, 90px) clamp(24px, 4vw, 64px) clamp(20px, 3.5vh, 40px);
            gap: clamp(32px, 5vw, 72px); align-items: center; box-sizing: border-box;
        }

        /* Panel Izquierdo: Carátula Apple Music + Controles */
        .fs-left-pane {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 440px; margin: 0 auto;
        }

        .fs-art-wrap {
            width: min(100%, min(380px, 40vh)); height: min(100%, min(380px, 40vh));
            aspect-ratio: 1; border-radius: clamp(16px, 2vw, 24px);
            overflow: hidden; position: relative;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer; transition: transform 0.4s var(--ease-fluid);
        }
        .fs-art-wrap:hover { transform: scale(1.02); }
        .fs-art { width: 100%; height: 100%; object-fit: cover; }

        .fs-info-block { width: 100%; margin-top: clamp(18px, 2.5vh, 26px); display: flex; flex-direction: column; gap: 4px; }
        .fs-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .fs-title { font-size: clamp(22px, 2.2vw, 30px); font-weight: 800; color: #fff; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fs-artist { font-size: clamp(15px, 1.2vw, 18px); color: var(--text-secondary); font-weight: 500; }
        .fs-heart-btn { font-size: 22px; color: rgba(255,255,255,0.35); cursor: pointer; transition: 0.25s; }
        .fs-heart-btn.active { color: #FF2E93; transform: scale(1.15); }

        /* Scrubber estilo Apple Music */
        .fs-scrubber { width: 100%; margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
        .fs-progress-track {
            width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 100px;
            cursor: pointer; position: relative; transition: height 0.2s;
        }
        .fs-progress-track:hover { height: 7px; }
        .fs-progress-fill { width: 0%; height: 100%; border-radius: 100px; background: #ffffff; }
        .fs-time-row { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

        /* Controles multimedia estilo Apple Music */
        .fs-controls {
            display: flex; align-items: center; justify-content: center; gap: clamp(20px, 3vw, 36px);
            margin-top: 12px; width: 100%;
        }
        .fs-ctrl-btn { font-size: 22px; color: var(--text-secondary); cursor: pointer; transition: 0.25s; }
        .fs-ctrl-btn:hover { color: #fff; transform: scale(1.15); }
        .fs-play-btn-large {
            width: clamp(52px, 5.5vh, 62px); height: clamp(52px, 5.5vh, 62px);
            border-radius: 50%; background: #ffffff; color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(20px, 2.3vh, 26px); cursor: pointer; transition: transform 0.25s var(--ease-snappy);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }
        .fs-play-btn-large i { margin-left: 2px; }
        .fs-play-btn-large:hover { transform: scale(1.08); }

        /* Barra de volumen perfectamente centrada */
        .fs-volume-box {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; max-width: 250px; margin: 16px auto 0 auto; color: var(--text-tertiary); font-size: 16px;
        }
        .fs-vol-slider { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 100px; cursor: pointer; }
        .fs-vol-fill { width: 75%; height: 100%; background: #fff; border-radius: 100px; }

        /* Panel Derecho: Letras Apple Music Sincronizadas y ESPACIADAS */
        .fs-right-pane {
            width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center;
            overflow: hidden; position: relative;
            mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,1) 8%, rgba(0,0,0,1) 90%, transparent 100%);
        }
        .lyrics-scroll-area { position: relative; height: 100%; width: 100%; overflow: hidden; }
        #lyrics-content { width: 100%; height: 100%; }

        /* ==================================================================
           AMLL LYRICS ENGINE OVERRIDES (LÍNEAS DESPEGADAS Y ESPACIADAS)
           ================================================================== */
        #lyrics-content .amll-lyric-player {
            --amll-lp-font-size: clamp(26px, 2.7vw, 40px) !important;
            --amll-lp-line-height: 1.65 !important;
            --amll-lp-color: #ffffff !important;
            --amll-lp-hover-bg-color: rgba(255, 255, 255, 0.08) !important;
            font-weight: 700 !important;
            letter-spacing: -0.015em !important;
        }
        
        /* Selectores específicos de AMLL core para forzar un respiro vertical entre cada frase */
        #lyrics-content .amll-lyric-player div[class*="lyricLine"]:not([class*="lyricLineWrapper"]) {
            padding-top: clamp(16px, 2.4vh, 28px) !important;
            padding-bottom: clamp(16px, 2.4vh, 28px) !important;
            min-height: clamp(56px, 7vh, 84px) !important;
            line-height: 1.65 !important;
        }

        #lyrics-content .amll-lyric-player div[class*="lyricMainLine"] {
            line-height: 1.65 !important;
        }

        #lyrics-content .amll-lyric-player span {
            line-height: 1.65 !important;
        }

        /* ==================================================================
           RESPONSIVE MOBILE
           ================================================================== */
        @media (max-width: 900px) {
            .showcase-card { flex-direction: column; text-align: center; gap: 24px; }
            .showcase-art-wrap { width: 220px; height: 220px; }
            .showcase-actions { justify-content: center; }

            .pill-info { width: 65%; }
            .pill-controls { display: none; }
            .pill-actions { width: auto; }
            .pill-vol { display: none; }

            #np-fs { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
            .fs-layout { display: flex; flex-direction: column; padding: 75px 20px 32px; gap: 24px; height: auto; min-height: 100%; }
            .fs-left-pane { max-width: 100%; }
            .fs-art-wrap { width: min(240px, 55vw); height: min(240px, 55vw); }
            .fs-right-pane { width: 100%; height: 420px; min-height: 380px; }
            
            #lyrics-content .amll-lyric-player { --amll-lp-font-size: 24px !important; }
            #lyrics-content .amll-lyric-player div[class*="lyricLine"]:not([class*="lyricLineWrapper"]) {
                padding-top: 14px !important;
                padding-bottom: 14px !important;
                min-height: 48px !important;
            }
        }
    </style>
</head>
<body>

    <!-- FONDO AMBIENTAL DINÁMICO (FIEL AL TONO REAL DE LA PORTADA) -->
    <div id="ambient-bg">
        <div id="ambient-cover" class="ambient-cover-layer"></div>
        <div class="ambient-darken"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- UI 1: MAIN HOME SHOWCASE -->
    <div id="app-wrapper">
        <header class="home-topbar">
            <div class="brand"><i class="ph-fill ph-waveform"></i> VIVETMP</div>
            <div class="audio-quality-tag"><i class="ph-fill ph-music-notes"></i> LOSSLESS ALAC</div>
        </header>

        <main class="home-hero-container">
            <div class="showcase-card">
                <div class="showcase-art-wrap" onclick="togglePlay()">
                    <img src="https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_640x640.jpg" class="showcase-art" alt="Portada">
                </div>
                <div class="showcase-info">
                    <span class="meta-subtitle">Lanzamiento Oficial</span>
                    <h1 class="showcase-title">COSAS QUE NO TE DIJE</h1>
                    <h2 class="showcase-artist">SAIKO</h2>
                    <div class="showcase-actions">
                        <button class="btn-play-hero" onclick="togglePlay()">
                            <i class="ph-fill ph-play" id="hero-play-icon"></i> Reproducir
                        </button>
                        <button class="btn-lyrics-hero" onclick="toggleNP()">
                            <i class="ph-bold ph-quotes"></i> Letras en Vivo
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- PERSISTENT BOTTOM PLAYER -->
    <div class="player-wrapper">
        <div class="player-pill">
            <div class="pill-info" onclick="toggleNP()">
                <img src="https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_640x640.jpg" class="pill-img" alt="Thumbnail">
                <div class="pill-meta">
                    <span class="pill-title">COSAS QUE NO TE DIJE</span>
                    <span class="pill-artist">SAIKO</span>
                </div>
            </div>

            <div class="pill-controls">
                <div class="pill-buttons">
                    <i class="ph-fill ph-skip-back" onclick="replaySong()"></i>
                    <div class="pill-play-btn" onclick="togglePlay()">
                        <i class="ph-fill ph-play" id="pill-play-icon"></i>
                    </div>
                    <i class="ph-fill ph-skip-forward" onclick="replaySong()"></i>
                </div>
                <div class="scrubber-wrap">
                    <span id="pill-time-curr">0:00</span>
                    <div class="scrubber-bar" onclick="seek(event, this)">
                        <div class="scrubber-fill" id="pill-bar-fill"></div>
                    </div>
                    <span id="pill-time-tot">-0:00</span>
                </div>
            </div>

            <div class="pill-actions">
                <i class="ph-fill ph-speaker-low pill-vol"></i>
                <div class="vol-slider pill-vol" onclick="changeVolume(event, this)">
                    <div class="vol-fill" id="pill-vol-fill"></div>
                </div>
                <i class="ph-bold ph-arrows-out-simple btn-expand" onclick="toggleNP()" title="Abrir Pantalla Completa"></i>
            </div>
        </div>
    </div>

    <!-- UI 2: FULLSCREEN NOW PLAYING (APPLE MUSIC REPLICA) -->
    <div id="np-fs">
        <header class="np-header">
            <button class="btn-close-fs" onclick="toggleNP()" title="Cerrar (Esc)">
                <i class="ph-bold ph-caret-down"></i>
            </button>
            <div class="audio-quality-tag"><i class="ph-fill ph-waveform"></i> Hi-Res Lossless 24-bit/96kHz</div>
            <div style="width:42px;"></div>
        </header>

        <div class="fs-layout">
            <!-- Izquierda: Portada + Metadata + Controles de Apple Music -->
            <div class="fs-left-pane">
                <div class="fs-art-wrap" onclick="togglePlay()">
                    <img src="https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_640x640.jpg" class="fs-art" alt="Portada">
                </div>

                <div class="fs-info-block">
                    <div class="fs-title-row">
                        <div>
                            <h2 class="fs-title">COSAS QUE NO TE DIJE</h2>
                            <p class="fs-artist">SAIKO</p>
                        </div>
                        <i class="ph-fill ph-heart fs-heart-btn" onclick="toggleHeart(this)"></i>
                    </div>

                    <!-- Scrubber estilo Apple Music -->
                    <div class="fs-scrubber">
                        <div class="fs-progress-track" onclick="seek(event, this)">
                            <div class="fs-progress-fill" id="fs-bar-fill"></div>
                        </div>
                        <div class="fs-time-row">
                            <span id="fs-time-curr">0:00</span>
                            <span id="fs-time-tot">-0:00</span>
                        </div>
                    </div>

                    <!-- Controles clásicos de Apple Music -->
                    <div class="fs-controls">
                        <i class="ph-bold ph-shuffle fs-ctrl-btn"></i>
                        <i class="ph-fill ph-skip-back fs-ctrl-btn" onclick="replaySong()"></i>
                        <div class="fs-play-btn-large" onclick="togglePlay()">
                            <i class="ph-fill ph-play" id="fs-play-icon"></i>
                        </div>
                        <i class="ph-fill ph-skip-forward fs-ctrl-btn" onclick="replaySong()"></i>
                        <i class="ph-bold ph-repeat fs-ctrl-btn"></i>
                    </div>

                    <!-- Barra de volumen centrada -->
                    <div class="fs-volume-box">
                        <i class="ph-fill ph-speaker-low"></i>
                        <div class="fs-vol-slider" onclick="changeVolume(event, this)">
                            <div class="fs-vol-fill" id="fs-vol-fill"></div>
                        </div>
                        <i class="ph-fill ph-speaker-high"></i>
                    </div>
                </div>
            </div>

            <!-- Derecha: Letras Apple Music Sincronizadas (Con espacio holgado) -->
            <div class="fs-right-pane">
                <div class="lyrics-scroll-area">
                    <div id="lyrics-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ==================================================================
           DATOS OFICIALES DE LA CANCIÓN
           ================================================================== */
        const currentSong = {
            title: "COSAS QUE NO TE DIJE",
            artist: "SAIKO",
            url: "https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_spotdown.org.mp3",
            lrc: "https://file.garden/alq0ENqplE9QfqJV/SAIKO%20-%20COSAS%20QUE%20NO%20TE%20DIJE.ttml",
            cover: "https://file.garden/alq0ENqplE9QfqJV/COSAS%20QUE%20NO%20TE%20DIJE_640x640.jpg"
        };

        /* ==================================================================
           MOTOR DE AUDIO & ESTADO
           ================================================================== */
        let isNPOpen = false;
        let globalVolume = 0.75;
        let audio = new Audio();
        audio.crossOrigin = "anonymous";
        audio.src = currentSong.url;

        let audioCtx, masterGain;
        let _lyricLastFrameMs = null;

        function initAudioEngine() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            masterGain = audioCtx.createGain();
            masterGain.gain.value = globalVolume;

            const source = audioCtx.createMediaElementSource(audio);
            source.connect(masterGain);
            masterGain.connect(audioCtx.destination);
        }

        function ensureAudioContext() {
            initAudioEngine();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        function haptic() { if (navigator.vibrate) navigator.vibrate(10); }

        function togglePlay() {
            ensureAudioContext(); haptic();
            if (audio.paused) {
                audio.play().catch(() => {});
                setPlayIcons(true);
            } else {
                audio.pause();
                setPlayIcons(false);
            }
        }

        function replaySong() {
            haptic();
            audio.currentTime = 0;
            if (audio.paused) audio.play();
            setPlayIcons(true);
        }

        function setPlayIcons(isPlaying) {
            const icon = isPlaying ? "ph-fill ph-pause" : "ph-fill ph-play";
            document.getElementById('hero-play-icon').className = icon;
            document.getElementById('pill-play-icon').className = icon;
            document.getElementById('fs-play-icon').className = icon;
        }

        function toggleHeart(el) {
            haptic();
            el.classList.toggle('active');
        }

        function seek(e, el) {
            if (!audio.duration) return;
            const r = el.getBoundingClientRect();
            audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
        }

        function changeVolume(e, el) {
            const r = el.getBoundingClientRect();
            let vol = (e.clientX - r.left) / r.width;
            setVolumeLevel(vol);
        }

        function setVolumeLevel(vol) {
            if (vol < 0) vol = 0; if (vol > 1) vol = 1;
            globalVolume = vol;
            document.getElementById('pill-vol-fill').style.width = `${vol * 100}%`;
            document.getElementById('fs-vol-fill').style.width = `${vol * 100}%`;
            if (audioCtx && masterGain) {
                masterGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
            } else {
                audio.volume = vol;
            }
        }

        function toggleNP() {
            haptic();
            isNPOpen = !isNPOpen;
            const np = document.getElementById('np-fs');
            const app = document.getElementById('app-wrapper');

            if (isNPOpen) {
                _lyricLastFrameMs = null;
                document.body.classList.add('np-active');
                np.classList.add('active');
                app.classList.add('scaled');
                setTimeout(() => { if (lyricPlayer) lyricPlayer.calcLayout(true, true); }, 150);
            } else {
                document.body.classList.remove('np-active');
                np.classList.remove('active');
                app.classList.remove('scaled');
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isNPOpen) toggleNP();
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                togglePlay();
            }
        });

        /* ==================================================================
           LYRICS ENGINE — @applemusic-like-lyrics/core
           ================================================================== */
        let lyricPlayer = null;

        async function ensureLyricPlayer() {
            if (lyricPlayer) return lyricPlayer;
            const LyricPlayerCtor = await window.__AMLLReady;
            lyricPlayer = new LyricPlayerCtor();
            lyricPlayer.setEnableSpring(true);
            lyricPlayer.setEnableBlur(true);
            lyricPlayer.setEnableScale(true);

            document.getElementById('lyrics-content').appendChild(lyricPlayer.getElement());

            lyricPlayer.addEventListener('line-click', (evt) => {
                const lines = lyricPlayer.getLyricLines();
                const line = lines[evt.lineIndex];
                if (line) {
                    audio.currentTime = line.startTime / 1000;
                    audio.play();
                    setPlayIcons(true);
                }
            });

            window.addEventListener('resize', () => {
                if (lyricPlayer) lyricPlayer.calcLayout(true, true);
            });

            return lyricPlayer;
        }

        function parseTTMLTime(str) {
            if (!str) return 0;
            str = str.toString().trim();
            if (str.endsWith('ms')) return parseFloat(str.replace('ms', '')) / 1000;
            str = str.replace(/s$/, '');
            const parts = str.split(':');
            let sec = 0;
            if (parts.length === 3) sec = parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + parseFloat(parts[2].replace(',', '.'));
            else if (parts.length === 2) sec = parseInt(parts[0], 10) * 60 + parseFloat(parts[1].replace(',', '.'));
            else sec = parseFloat(str.replace(',', '.'));
            return sec || 0;
        }

        function parseToAMLLLines(text) {
            const rawLines = [];
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const pElements = Array.from(xmlDoc.getElementsByTagName('p'));

            pElements.forEach(p => {
                const beginAttr = p.getAttribute('begin') || p.getAttribute('t');
                if (!beginAttr) return;
                const pBegin = parseTTMLTime(beginAttr);
                const endAttr = p.getAttribute('end');
                const pEnd = endAttr ? parseTTMLTime(endAttr) : 0;

                let words = [];
                Array.from(p.childNodes).forEach(node => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        let val = node.nodeValue.replace(/[\r\n\t]+/g, ' ');
                        if (val.trim()) words.push({ time: pBegin, dur: 0, text: val });
                    } else if (node.nodeType === Node.ELEMENT_NODE && (node.localName === 'span' || node.localName === 's')) {
                        const sBegin = parseTTMLTime(node.getAttribute('begin') || node.getAttribute('t')) || pBegin;
                        const dur = parseTTMLTime(node.getAttribute('dur') || node.getAttribute('d')) || 0;
                        words.push({ time: sBegin, dur, text: node.textContent || "" });
                    }
                });

                if (words.length === 0 && p.textContent.trim()) {
                    words.push({ time: pBegin, dur: pEnd > pBegin ? pEnd - pBegin : 0, text: p.textContent.trim() });
                }

                if (words.length > 0) {
                    rawLines.push({ time: pBegin, words, dur: pEnd > pBegin ? pEnd - pBegin : 0 });
                }
            });

            rawLines.forEach((l, i) => {
                let nTime = (i < rawLines.length - 1) ? rawLines[i + 1].time : l.time + 6;
                if (!l.dur) l.dur = Math.max(0, nTime - l.time);
                for (let j = 0; j < l.words.length; j++) {
                    if (!l.words[j].dur || l.words[j].dur <= 0) {
                        l.words[j].dur = (j < l.words.length - 1) ? Math.max(0.05, l.words[j + 1].time - l.words[j].time) : Math.min(2.5, nTime - l.words[j].time);
                    }
                }
            });

            return rawLines.map(l => ({
                words: l.words.map(w => ({
                    startTime: Math.round(w.time * 1000),
                    endTime: Math.round((w.time + w.dur) * 1000),
                    word: w.text
                })),
                text: l.words.map(w => w.text).join('').trim(),
                translatedLyric: '',
                romanLyric: '',
                startTime: Math.round(l.time * 1000),
                endTime: Math.round((l.time + l.dur) * 1000),
                isBG: false,
                isDuet: false
            }));
        }

        async function loadLyrics() {
            try {
                const player = await ensureLyricPlayer();
                const res = await fetch(currentSong.lrc);
                const text = await res.text();
                const lines = parseToAMLLLines(text);
                player.setLyricLines(lines, 0);
                setTimeout(() => {
                    player.calcLayout(true, true);
                }, 200);
            } catch (e) {
                console.error("Error al cargar letras:", e);
            }
        }

        function fmt(s) {
            return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
        }

        function renderLoop(rafTime) {
            if (!rafTime) rafTime = performance.now();

            if (audio.duration && !isNaN(audio.duration)) {
                const cur = audio.currentTime;
                const dur = audio.duration;
                const pct = (cur / dur) * 100;

                document.getElementById('pill-bar-fill').style.width = `${pct}%`;
                document.getElementById('fs-bar-fill').style.width = `${pct}%`;

                document.getElementById('pill-time-curr').innerText = fmt(cur);
                document.getElementById('pill-time-tot').innerText = "-" + fmt(dur - cur);
                document.getElementById('fs-time-curr').innerText = fmt(cur);
                document.getElementById('fs-time-tot').innerText = "-" + fmt(dur - cur);

                if (isNPOpen && lyricPlayer) {
                    const deltaMs = _lyricLastFrameMs ? Math.min(100, rafTime - _lyricLastFrameMs) : (1000 / 60);
                    _lyricLastFrameMs = rafTime;
                    lyricPlayer.setCurrentTime((cur + 0.08) * 1000);
                    lyricPlayer.update(deltaMs);
                }
            }
            requestAnimationFrame(renderLoop);
        }

        /* Gesto de deslizamiento hacia abajo para cerrar Fullscreen */
        function setupGestures() {
            let sY = 0, cY = 0;
            const np = document.getElementById('np-fs');

            np.addEventListener('touchstart', e => {
                if (e.target.closest('#lyrics-content')) return;
                sY = e.touches[0].clientY; cY = sY;
                np.style.transition = 'none';
            }, { passive: true });

            np.addEventListener('touchmove', e => {
                if (!isNPOpen || sY === 0) return;
                cY = e.touches[0].clientY;
                let d = cY - sY;
                if (d > 0) np.style.transform = `translateY(${d}px)`;
            }, { passive: true });

            np.addEventListener('touchend', () => {
                if (!isNPOpen || sY === 0) return;
                let d = cY - sY; sY = 0;
                np.style.transition = '';
                if (d > 120) toggleNP();
                else np.style.transform = '';
            }, { passive: true });
        }

        /* Inicialización */
        async function init() {
            document.body.addEventListener('click', ensureAudioContext, { once: true });
            document.body.addEventListener('touchstart', ensureAudioContext, { once: true });

            // Aplicar la portada directamente como capa ambiental fiel al tono
            document.getElementById('ambient-cover').style.backgroundImage = `url("${currentSong.cover}")`;

            setVolumeLevel(globalVolume);
            loadLyrics();
            setupGestures();
            requestAnimationFrame(renderLoop);
        }

        window.onload = init;
    </script>
</body>
</html>
