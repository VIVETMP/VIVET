<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVETMP - Yan Block Update</title>
    
    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ========================
           APPLE GLASSMORPHISM THEME
           ======================== */
        :root {
            --bg-base: #000000;
            --text-main: #ffffff;
            --text-muted: #999999;
            
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-hover: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(30px) saturate(180%);
            
            --font-main: 'Inter', -apple-system, sans-serif;
            --spring: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body { 
            background-color: var(--bg-base); color: var(--text-main); 
            font-family: var(--font-main); height: 100vh; overflow: hidden; 
            position: relative;
        }

        /* --- FONDO AMBIENTAL --- */
        .ambient-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: #141414;}
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.5; animation: float 20s infinite alternate ease-in-out; }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #7F49B4; }
        .orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #CFCFCF; animation-delay: -5s;}
        .orb-3 { top: 40%; left: 50%; width: 40vw; height: 40vw; background: #7F49B4; opacity: 0.3; animation-delay: -10s;}
        
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(5%, 10%) scale(1.1); } }

        /* --- NAVEGACIÓN SUPERIOR --- */
        .top-nav {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 100px;
            display: flex; align-items: center; gap: 8px; padding: 8px; z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .nav-item {
            padding: 10px 24px; border-radius: 100px; font-size: 14px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; transition: 0.3s;
        }
        .nav-item:hover { color: var(--text-main); }
        .nav-item.active { background: rgba(255,255,255,0.15); color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.2);}

        /* --- CONTENIDO PRINCIPAL --- */
        .main-container {
            width: 100%; height: 100%; overflow-y: auto; scroll-behavior: smooth;
            padding: 140px 5vw 150px 5vw; display: flex; flex-direction: column; align-items: center;
        }
        .main-container::-webkit-scrollbar { display: none; }

        .view-section { display: none; width: 100%; max-width: 1400px; flex-direction: column; animation: fadeIn 0.4s ease; }
        .view-section.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .page-header { width: 100%; margin-bottom: 40px; text-align: left; }
        .page-header h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
        .page-header p { font-size: 16px; color: var(--text-muted); margin-top: 5px; }
        
        .section-title { font-size: 24px; font-weight: 700; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; width: 100%; text-align: left; }

        /* HEADER DE ARTISTA */
        .btn-back { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--text-muted); cursor: pointer; margin-bottom: 20px; transition: 0.3s; width: fit-content; }
        .btn-back:hover { color: #fff; transform: translateX(-5px); }
        
        .artist-header-profile { display: flex; align-items: center; gap: 30px; margin-bottom: 40px; }
        .artist-header-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.1); }
        
        /* GRID DE CARTAS */
        .card-grid {
            width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px;
        }
        
        .glass-card {
            background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 16px;
            cursor: pointer; transition: all 0.4s var(--spring); position: relative;
        }
        .glass-card:hover { transform: translateY(-8px) scale(1.02); background: var(--glass-hover); border-color: rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .glass-card.active { border-color: #fff; background: rgba(255,255,255,0.1); }
        
        .card-img-wrapper { position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 16px; overflow: hidden; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .card-img-wrapper.is-artist { border-radius: 50%; } 
        
        .card-img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s var(--spring); }
        .glass-card:hover .card-img { transform: scale(1.05); }
        
        .card-play-btn {
            position: absolute; bottom: 12px; right: 12px; width: 44px; height: 44px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff;
            opacity: 0; transform: translateY(10px); transition: all 0.3s var(--spring); border: 1px solid rgba(255,255,255,0.2);
        }
        .glass-card:hover .card-play-btn { opacity: 1; transform: translateY(0); }
        .card-play-btn:hover { background: #fff; color: #000; transform: scale(1.1) !important; }
        
        .card-info { display: flex; flex-direction: column; gap: 4px; padding: 0 4px; }
        .is-artist-info { text-align: center; } 
        .card-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-artist { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- PÍLDORA REPRODUCTORA INFERIOR --- */
        .player-pill-wrapper {
            position: fixed; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; z-index: 50;
            pointer-events: none; 
        }
        .player-pill {
            pointer-events: auto; width: 90%; max-width: 800px; height: 80px;
            background: rgba(20, 20, 20, 0.7); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 100px;
            display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 10px 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); transition: transform 0.3s var(--spring);
        }
        .player-pill:hover { transform: translateY(-5px); }

        .pill-info { display: flex; align-items: center; gap: 16px; width: 35%; cursor: pointer; }
        .pill-cover { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .pill-info:hover .pill-cover { transform: scale(1.05); }
        .pill-text { display: flex; flex-direction: column; justify-content: center; overflow: hidden; width: 100%;}
        .pill-text h4 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center;}
        .pill-text p { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .pill-controls { display: flex; align-items: center; gap: 24px; font-size: 24px; color: var(--text-main); }
        .pill-controls i { cursor: pointer; transition: 0.2s; color: var(--text-muted); }
        .pill-controls i:hover { color: #fff; transform: scale(1.1); }
        .btn-play-circle {
            width: 48px; height: 48px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000; transition: 0.2s; box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
        .btn-play-circle i { color: #000 !important; font-size: 22px; margin-left: 2px;}
        .btn-play-circle:hover { transform: scale(1.08); }

        .pill-right { display: flex; align-items: center; gap: 20px; width: 30%; justify-content: flex-end; }
        .pill-progress { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 150px;}
        .track-line { flex: 1; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; cursor: pointer; position: relative; }
        .fill-line { width: 0%; height: 100%; background: #fff; border-radius: 3px; transition: width 0.1s linear;}
        
        .btn-expand { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;}
        .btn-expand:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        /* --- AUTOMIX BADGE (NUEVO UI) --- */
        .automix-badge {
            font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
            background: linear-gradient(135deg, #FF2E93, #FF8036);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            padding: 2px 6px; border: 1px solid rgba(255, 46, 147, 0.4); border-radius: 6px;
            opacity: 0; transition: all 0.4s ease; display: inline-block; margin-left: 8px;
            visibility: hidden; transform: scale(0.9); white-space: nowrap;
        }
        .automix-badge.active { 
            opacity: 1; visibility: visible; transform: scale(1);
            animation: pulseMix 2s infinite cubic-bezier(0.4, 0, 0.2, 1); 
        }
        @keyframes pulseMix { 
            0% { box-shadow: 0 0 0 0 rgba(255,46,147,0.3); } 
            70% { box-shadow: 0 0 10px 4px rgba(255,46,147,0); } 
            100% { box-shadow: 0 0 0 0 rgba(255,46,147,0); } 
        }

        /* ========================
           APPLE MUSIC NOW PLAYING UI
           ======================== */
        .now-playing-fs {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column;
            transform: translateY(100%); opacity: 0; visibility: hidden;
            transition: transform 0.6s var(--spring), opacity 0.4s;
        }
        .now-playing-fs.active { transform: translateY(0); opacity: 1; visibility: visible; }

        .np-bg {
            position: absolute; inset: -10%; width: 120%; height: 120%;
            object-fit: cover; filter: blur(40px) brightness(0.3) saturate(180%);
            z-index: 0; transition: filter 0.5s ease;
        }
        .np-overlay {
            position: absolute; inset: 0; 
            background: linear-gradient(135deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%); 
            z-index: 1;
        }

        .btn-close-np {
            position: absolute; top: 40px; left: 40px; width: 44px; height: 44px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
            cursor: pointer; z-index: 10; border: 1px solid var(--glass-border); transition: 0.2s;
        }
        .btn-close-np:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }

        .np-content {
            position: relative; z-index: 2; display: flex; flex-direction: row; align-items: center; 
            height: 100%; width: 100%; padding: 80px 8vw; gap: 6vw;
        }

        /* --- Lado Izquierdo --- */
        .np-left {
            flex: 1; max-width: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .np-large-cover {
            width: 100%; aspect-ratio: 1; border-radius: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); 
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px; object-fit: cover;
        }

        .np-text-area { width: 100%; text-align: left; margin-bottom: 30px; }
        .np-text-area h2 { font-size: 28px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 12px;}
        .np-text-area p { font-size: 18px; color: rgba(255,255,255,0.7); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .np-progress-area { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .np-progress-bar { display: flex; align-items: center; width: 100%; }
        .np-times { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; font-weight: 500; }

        .np-controls { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 28px; color: rgba(255,255,255,0.8); margin-bottom: 40px;}
        .np-controls i { cursor: pointer; transition: 0.2s; }
        .np-controls i:hover { color: #fff; transform: scale(1.1); }
        .np-play { width: 72px; height: 72px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; transition: 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.3); cursor: pointer;}
        .np-play i { margin-left: 4px; }
        .np-play:hover { transform: scale(1.05); }

        .np-volume-area { display: flex; align-items: center; gap: 15px; width: 100%; color: rgba(255,255,255,0.6); font-size: 20px;}
        .np-volume-area i { cursor: pointer; transition: 0.2s; }
        .np-volume-area i:hover { color: #fff; transform: scale(1.1); }

        /* --- Lado Derecho (Letras) --- */
        .np-right {
            flex: 1.2; height: 85vh; display: flex; flex-direction: column; justify-content: center; position: relative;
        }

        .np-lyrics {
            height: 100%; overflow-y: auto; padding: 35vh 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            text-align: left; scroll-behavior: smooth;
        }
        .np-lyrics::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-size: 46px; font-weight: 800; line-height: 1.3; letter-spacing: -1.5px;
            margin-bottom: 30px; cursor: pointer; transform-origin: left center;
            transition: transform 0.5s var(--spring), filter 0.5s var(--spring), opacity 0.5s;
            opacity: 0.3; filter: blur(3px); transform: scale(0.95);
            
            --fill-pct: 0%;
            background: linear-gradient(to right, #ffffff var(--fill-pct), rgba(255, 255, 255, 0.3) var(--fill-pct));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .lyric-line.active { opacity: 1; filter: blur(0); transform: scale(1); }
        .lyric-line.passed { opacity: 0.15; filter: blur(1px); --fill-pct: 100%; transform: scale(0.95); }
        .lyric-line:hover { opacity: 0.8; filter: blur(0); }

    </style>
</head>
<body>

    <!-- Fondo de Esferas -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navegación Glass Superior -->
    <nav class="top-nav">
        <div class="nav-item active" id="nav-songs" onclick="switchTab('songs')">Songs</div>
        <div class="nav-item" id="nav-artists" onclick="switchTab('artists')">Artists</div>
        <div class="nav-item" id="nav-search">Search</div>
    </nav>

    <!-- Área Principal -->
    <main class="main-container">
        <!-- VISTA: CANCIONES -->
        <div id="view-songs" class="view-section active">
            <div class="page-header">
                <h1>Songs</h1>
                <p>All your favorite tracks in one place.</p>
            </div>
            <div class="card-grid" id="songs-grid"></div>
        </div>

        <!-- VISTA: ARTISTAS -->
        <div id="view-artists" class="view-section">
            <div class="page-header">
                <h1>Artists</h1>
                <p>Browse the catalog by top artists.</p>
            </div>
            <div class="card-grid" id="artists-grid"></div>
        </div>

        <!-- VISTA: DETALLE DE ARTISTA -->
        <div id="view-artist-detail" class="view-section">
            <div class="btn-back" onclick="switchTab('artists')"><i class="ph-bold ph-arrow-left"></i> Back</div>
            
            <div class="artist-header-profile">
                <img src="" id="detail-artist-img" class="artist-header-img">
                <div>
                    <h1 id="detail-artist-name" style="font-size: 52px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 5px;">Artist Name</h1>
                </div>
            </div>

            <h2 class="section-title">Top 10</h2>
            <div class="card-grid" id="artist-top-songs-grid" style="margin-bottom: 60px;"></div>
            
            <h2 class="section-title" id="latest-title">Latest Release</h2>
            <div class="card-grid" id="artist-latest-release-grid" style="margin-bottom: 60px;"></div>

            <h2 class="section-title">Singles</h2>
            <div class="card-grid" id="artist-singles-grid"></div>
        </div>
    </main>

    <!-- Píldora Reproductora Inferior -->
    <div class="player-pill-wrapper">
        <div class="player-pill">
            <div class="pill-info" onclick="toggleNP()">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="pill-cover" id="pill-cover">
                <div class="pill-text">
                    <h4>
                        <span id="pill-title">Not Playing</span>
                        <div class="automix-badge" id="badge-pill">AutoMix</div>
                    </h4>
                    <p id="pill-artist">Yan Block</p>
                </div>
            </div>

            <div class="pill-controls">
                <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                <div class="btn-play-circle" onclick="togglePlay()"><i class="ph-fill ph-play" id="pill-play-icon"></i></div>
                <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
            </div>

            <div class="pill-right">
                <div class="pill-progress">
                    <div class="track-line" onclick="seek(event, this)"><div class="fill-line" id="pill-fill"></div></div>
                </div>
                <div class="btn-expand" onclick="toggleNP()"><i class="ph-bold ph-arrows-out-simple" style="color: white; font-size: 16px;"></i></div>
            </div>
        </div>
    </div>

    <!-- APPLE MUSIC NOW PLAYING UI (FULLSCREEN) -->
    <div class="now-playing-fs" id="np-screen">
        <img src="" class="np-bg" id="fs-bg">
        <div class="np-overlay"></div>
        <div class="btn-close-np" onclick="toggleNP()"><i class="ph-bold ph-caret-down"></i></div>

        <div class="np-content">
            <div class="np-left">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="np-large-cover" id="fs-large-cover">
                
                <div class="np-text-area">
                    <h2>
                        <span id="fs-title">Not Playing</span>
                        <div class="automix-badge" id="badge-fs" style="font-size: 11px; padding: 4px 8px;">AutoMix</div>
                    </h2>
                    <p id="fs-artist">Yan Block</p>
                </div>

                <div class="np-progress-area">
                    <div class="np-progress-bar track-line" onclick="seek(event, this)">
                        <div class="fill-line" id="fs-fill"></div>
                    </div>
                    <div class="np-times">
                        <span id="fs-time-curr">0:00</span>
                        <span id="fs-time-tot">0:00</span>
                    </div>
                </div>

                <div class="np-controls">
                    <i class="ph-fill ph-shuffle" style="font-size: 24px;"></i>
                    <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                    <div class="np-play" onclick="togglePlay()"><i class="ph-fill ph-play" id="fs-play-icon"></i></div>
                    <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
                    <i class="ph-bold ph-repeat" style="font-size: 24px;"></i>
                </div>

                <div class="np-volume-area">
                    <i class="ph-fill ph-speaker-low" onclick="setVolumeLevel(0)"></i>
                    <div class="track-line" onclick="changeVolume(event, this)">
                        <div class="fill-line" id="volume-fill" style="width: 75%;"></div>
                    </div>
                    <i class="ph-fill ph-speaker-high" onclick="setVolumeLevel(1)"></i>
                </div>
            </div>

            <div class="np-right">
                <div class="np-lyrics" id="lyrics-scroll">
                    <div id="lyrics-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageArtistUrl = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg";
        const omarCourtzImg = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776097822/Omar_Courtz_k4ozll.jpg";
        const deiVImg = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776099774/Dei_V_yv1pop.jpg";
        const roaImg = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776106835/ROA_slzaj5.jpg";
        const rauwImg = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776204344/Rauw_Alejandro_c8vjwi.jpg";

        // Base de Datos

        // ============================================

        const trackAnalysis = {};

        function initBackgroundAnalysis() {

        async function runBackgroundAnalysis() {
            if(analysisQueue.length === 0) return;
            const song = analysisQueue.shift();
            
            if(!trackAnalysis[song.url]) {

            // Pequeña pausa para no bloquear el CPU ni la red del usuario mientras navega

        async function analyzeTrack(song) {
            if (trackAnalysis[song.url]) return trackAnalysis[song.url];
            console.log(`[AutoMix] Analyzing audio data for: ${song.title}...`);
            
            try {
                // Instancia local offline (o estándar) solo para decodificar y analizar rápido
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const tempCtx = new AudioContext(); 
                
                const response = await fetch(song.url);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await tempCtx.decodeAudioData(arrayBuffer);
                
                const channelData = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                const length = channelData.length;
                
                let totalEnergy = 0;
                const rmsChunks =[];
                const chunkSize = sampleRate; // Tramos de 1 segundo
                
                // 1. ANÁLISIS DE ENERGÍA RMS (Strided para extrema velocidad)
                for (let i = 0; i < length; i += chunkSize) {
                    let sum = 0;
                    let count = 0;
                    for (let j = 0; j < chunkSize && (i + j) < length; j += 100) {
                        sum += channelData[i + j] * channelData[i + j];
                        count++;
                    }
                    const rms = Math.sqrt(sum / count);
                    rmsChunks.push(rms);
                    totalEnergy += rms;
                }
                const avgEnergy = totalEnergy / rmsChunks.length;
                
                // 2. DETECCIÓN DE OUTRO SILENCIOSA O BAJÓN DE ENERGÍA
                let outroDuration = 6; 
                for (let i = rmsChunks.length - 1; i >= Math.max(0, rmsChunks.length - 30); i--) {
                    if (rmsChunks[i] > avgEnergy * 0.4) {
                        outroDuration = (rmsChunks.length - 1 - i);
                        break;
                    }
                }
                if(outroDuration < 4) outroDuration = 4;
                if(outroDuration > 15) outroDuration = 15;

                // 3. DETECCIÓN DE PEAKS / BPM ESTIMADO
                let maxVal = 0;
                for(let i=0; i<length; i+=500) if(Math.abs(channelData[i]) > maxVal) maxVal = Math.abs(channelData[i]);
                const threshold = maxVal * 0.75;
                
                let lastPeak = 0;
                let intervals = {};
                for(let i=0; i<length; i+=1000) {
                    if(Math.abs(channelData[i]) > threshold) {
                        if(lastPeak > 0) {
                            let diff = (i - lastPeak) / sampleRate;
                            if(diff > 0.3 && diff < 1.5) { // Rango 40 a 200 BPM
                                let bpm = Math.round(60 / diff);
                                intervals[bpm] = (intervals[bpm] || 0) + 1;
                            }
                        }
                        lastPeak = i;
                        i += sampleRate * 0.2; // Skip de 200ms para evitar falsos peaks del mismo kick
                    }
                }
                
                let estimatedBPM = 110;
                let maxCount = 0;
                for(let b in intervals) {
                    if(intervals[b] > maxCount) { maxCount = intervals[b]; estimatedBPM = parseInt(b); }
                }

                trackAnalysis[song.url] = {
                    bpm: estimatedBPM,
                    energy: avgEnergy,
                    outroDuration: outroDuration
                };
                
                console.log(`[AutoMix] Analyzed [${song.title}] -> BPM: ${estimatedBPM} | Energy: ${avgEnergy.toFixed(3)} | Outro: ${outroDuration}s`);
                tempCtx.close();
                return trackAnalysis[song.url];

            } catch(e) {
                console.error(`[AutoMix] Failed to analyze ${song.title} (CORS or Decode Error). Using fallbacks.`, e);
                trackAnalysis[song.url] = { bpm: 110, energy: 0.1, outroDuration: 8 };
                return trackAnalysis[song.url];
            }
        }


        // ============================================
        // NUEVO MOTOR WEB AUDIO API (Reproducción & Mezcla)
        // ============================================
        
        let audio1 = new Audio(); audio1.crossOrigin = "anonymous";
        let audio2 = new Audio(); audio2.crossOrigin = "anonymous";
        let activeAudio = audio1;
        let fadingAudio = null;
        let isCrossfading = false;
        let currentMixDuration = 0;
        let mixTimingHumanized = 0;
        
        let audioCtx, masterGain, masterCompressor;
        let deck1, deck2, activeDeck, fadingDeck;
        let globalVolume = 0.75; 

        function initAudioEngine() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            masterCompressor = audioCtx.createDynamicsCompressor();
            masterCompressor.threshold.value = -3;
            masterCompressor.knee.value = 10;
            masterCompressor.ratio.value = 5;
            masterCompressor.attack.value = 0.003;
            masterCompressor.release.value = 0.25;

            masterGain = audioCtx.createGain();
            masterGain.gain.value = globalVolume;
            
            masterCompressor.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            deck1 = createDeck(audio1);
            deck2 = createDeck(audio2);
            activeDeck = deck1;
        }

        function createDeck(audioEl) {
            const source = audioCtx.createMediaElementSource(audioEl);
            const highpass = audioCtx.createBiquadFilter(); highpass.type = 'highpass'; highpass.frequency.value = 0;
            const lowpass = audioCtx.createBiquadFilter(); lowpass.type = 'lowpass'; lowpass.frequency.value = 22000;
            const bass = audioCtx.createBiquadFilter(); bass.type = 'lowshelf'; bass.frequency.value = 200; bass.gain.value = 0;
            
            const delay = audioCtx.createDelay(5.0); delay.delayTime.value = 0.45; 
            const feedback = audioCtx.createGain(); feedback.gain.value = 0; 
            delay.connect(feedback); feedback.connect(delay);
            const delayOut = audioCtx.createGain(); delayOut.gain.value = 0;
            delay.connect(delayOut);
            
            const deckGain = audioCtx.createGain(); deckGain.gain.value = 1;
            
            source.connect(highpass); highpass.connect(lowpass); lowpass.connect(bass);
            bass.connect(deckGain); bass.connect(delay); 
            
            deckGain.connect(masterCompressor);
            delayOut.connect(masterCompressor);

            return { source, highpass, lowpass, bass, delay, feedback, delayOut, deckGain };
        }

        function resetDeckFX(deck) {
            if(!audioCtx) return;
            const now = audioCtx.currentTime;
            deck.highpass.frequency.cancelScheduledValues(now); deck.highpass.frequency.setValueAtTime(0, now);
            deck.lowpass.frequency.cancelScheduledValues(now); deck.lowpass.frequency.setValueAtTime(22000, now);
            deck.bass.gain.cancelScheduledValues(now); deck.bass.gain.setValueAtTime(0, now);
            deck.deckGain.gain.cancelScheduledValues(now); deck.deckGain.gain.setValueAtTime(1, now);
            deck.delayOut.gain.cancelScheduledValues(now); deck.delayOut.gain.setValueAtTime(0, now);
            deck.feedback.gain.cancelScheduledValues(now); deck.feedback.gain.setValueAtTime(0, now);
        }

        // ============================================
        // LÓGICA AUTOMIX (SUSTITUYE CROSSFADE ORIGINAL Y SELECCIÓN INTELIGENTE)
        // ============================================

        function getBestNextTrack(currIdx) {
            const currSong = cancionesData[currIdx];
            const currAnal = trackAnalysis[currSong.url] || {bpm: 110, energy: 0.1, outroDuration: 8};
            
            let bestIdx = (currIdx + 1) % cancionesData.length;
            let bestScore = -9999;

            for (let i = 0; i < cancionesData.length; i++) {
                if (i === currIdx) continue;
                if (recentHistory.includes(i)) continue; // Penaliza fuertemente repetidas

                const candidate = cancionesData[i];
                const candAnal = trackAnalysis[candidate.url] || {bpm: 110, energy: 0.1, outroDuration: 8};

                let score = 0;
                
                // Match de BPM (Hasta 50 pts)
                const bpmDiff = Math.abs(currAnal.bpm - candAnal.bpm);
                if (bpmDiff < 5) score += 50;
                else if (bpmDiff < 10) score += 30;
                else if (bpmDiff > 30) score -= 20;

                // Match de Energía y progresividad (+20 pts)
                const energyDiff = candAnal.energy - currAnal.energy;
                if (energyDiff > 0 && energyDiff < 0.05) score += 40; // Energía ligeramente superior (hype build)
                else if (energyDiff <= 0 && energyDiff > -0.05) score += 20; // Hype mantenido suave
                else score -= 10; // Cambios bruscos

                // Variedad de artista (evitar pegar al mismo artista muy seguido)
                if (candidate.artist !== currSong.artist) score += 30;
                else score -= 40; 

                if (score > bestScore) {
                    bestScore = score;
                    bestIdx = i;
                }
            }
            return bestIdx;
        }

        function startSmartAutoMix() {
            isCrossfading = true;
            initAudioEngine();
            
            fadingDeck = activeDeck;
            fadingAudio = activeAudio;
            activeAudio = (activeAudio === audio1) ? audio2 : audio1;
            activeDeck = (activeDeck === deck1) ? deck2 : deck1;
            
            // Selección musicalmente inteligente
            let nextIdx = getBestNextTrack(currentPlayingIndex);
            
            // Actualizar el historial de DJ
            recentHistory.push(currentPlayingIndex);
            if(recentHistory.length > 5) recentHistory.shift();

            const currProf = trackAnalysis[cancionesData[currentPlayingIndex].url] || {bpm: 110, energy: 0.1};
            const nextProf = trackAnalysis[cancionesData[nextIdx].url] || {bpm: 110, energy: 0.1};
            
            // Elegir transición con base a la diferencia
            let mixType, dur;
            const bpmDiff = Math.abs(currProf.bpm - nextProf.bpm);
            
            if (bpmDiff > 20) {
                mixType = "echoOut"; dur = 4;
            } else if (currProf.energy > 0.08 && nextProf.energy > 0.08 && bpmDiff <= 8) {
                mixType = "bassSwap"; dur = 6;
            } else if (currProf.energy > 0.1) {
                mixType = "filterRise"; dur = 8;
            } else if (currProf.energy < 0.05) {
                mixType = "smoothBlend"; dur = 10;
            } else {
                mixType = Math.random() > 0.5 ? "quickCutDrop" : "smoothBlend"; dur = 5;
            }
            
            // Humanización de mezcla (Timing)
            dur += (Math.random() - 0.5) * 0.8; 
            currentMixDuration = dur;
            
            console.log(`[AutoMix] Queuing: ${cancionesData[nextIdx].title}`);
            console.log(`[AutoMix] Mix Type: ${mixType} | BPM Diff: ${bpmDiff} | Mix Length: ${dur.toFixed(1)}s`);
            
            showAutoMixBadge(mixType);
            triggerUIForSong(nextIdx);
            
            activeAudio.src = cancionesData[nextIdx].url;
            activeAudio.play().then(() => {
                applyTransitionFX(mixType, dur);
            }).catch(e=>console.log("Audio Play Error:", e));

            // Limpiar deck muerto al finalizar la transición
            setTimeout(() => {
                if (isCrossfading && fadingAudio) {
                    fadingAudio.pause(); fadingAudio.src = "";
                    isCrossfading = false;
                    hideAutoMixBadge();
                }
            }, dur * 1000);
        }

        function applyTransitionFX(type, dur) {
            const now = audioCtx.currentTime;
            resetDeckFX(activeDeck);
            
            activeDeck.deckGain.gain.setValueAtTime(0.001, now); // Arranca inaudible
            
            if (type === "echoOut") {
                fadingDeck.delayOut.gain.setValueAtTime(0, now);
                fadingDeck.delayOut.gain.linearRampToValueAtTime(0.8, now + 1);
                fadingDeck.feedback.gain.setValueAtTime(0, now);
                fadingDeck.feedback.gain.linearRampToValueAtTime(0.6, now + 1);
                fadingDeck.deckGain.gain.setValueAtTime(1, now);
                fadingDeck.deckGain.gain.exponentialRampToValueAtTime(0.001, now + (dur * 0.5));
                
                activeDeck.deckGain.gain.linearRampToValueAtTime(1, now + 1.5);
                
            } else if (type === "filterRise") {
                fadingDeck.highpass.frequency.setValueAtTime(0, now);
                fadingDeck.highpass.frequency.exponentialRampToValueAtTime(10000, now + dur);
                fadingDeck.deckGain.gain.setValueAtTime(1, now);
                fadingDeck.deckGain.gain.linearRampToValueAtTime(0.001, now + dur);
                
                activeDeck.lowpass.frequency.setValueAtTime(400, now);
                activeDeck.lowpass.frequency.exponentialRampToValueAtTime(22000, now + dur);
                activeDeck.deckGain.gain.linearRampToValueAtTime(1, now + dur);
                
            } else if (type === "bassSwap") {
                const swapTime = now + (dur * 0.6);
                
                fadingDeck.deckGain.gain.setValueAtTime(1, now);
                fadingDeck.deckGain.gain.linearRampToValueAtTime(0.001, now + dur);
                fadingDeck.bass.gain.setValueAtTime(0, now);
                fadingDeck.bass.gain.setValueAtTime(0, swapTime - 0.1);
                fadingDeck.bass.gain.linearRampToValueAtTime(-24, swapTime);
                
                activeDeck.deckGain.gain.linearRampToValueAtTime(1, now + (dur * 0.8));
                activeDeck.bass.gain.setValueAtTime(-24, now);
                activeDeck.bass.gain.setValueAtTime(-24, swapTime - 0.1);
                activeDeck.bass.gain.linearRampToValueAtTime(0, swapTime + 0.1);
                
            } else if (type === "quickCutDrop") {
                fadingDeck.deckGain.gain.setValueAtTime(1, now);
                fadingDeck.deckGain.gain.linearRampToValueAtTime(0.001, now + 1.5);
                activeDeck.deckGain.gain.linearRampToValueAtTime(1, now + 1.5);
                
            } else { // smoothBlend
                fadingDeck.deckGain.gain.setValueAtTime(1, now);
                fadingDeck.deckGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                activeDeck.deckGain.gain.linearRampToValueAtTime(1, now + dur);
            }
        }

        // ============================================
        // VISUALES AUTOMIX
        // ============================================
        function showAutoMixBadge(text) {
            // Formateo visual
            let label = "MIX";
            if(text === "echoOut") label = "Echo Out";
            if(text === "bassSwap") label = "Bass Swap";
            if(text === "filterRise") label = "Filter Sweep";
            if(text === "quickCutDrop") label = "Quick Drop";
            if(text === "smoothBlend") label = "Smooth Blend";

            const badges = document.querySelectorAll('.automix-badge');
            badges.forEach(b => {
                b.innerText = `AutoMix: ${label}`;
                b.classList.add('active');
            });
        }
        
        function hideAutoMixBadge() {
            document.querySelectorAll('.automix-badge').forEach(b => b.classList.remove('active'));
        }

        // ============================================
        // LOOP PRINCIPAL OPTIMIZADO
        // ============================================
        
        function audioLoop() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                const curr = activeAudio.currentTime;
                const dur = activeAudio.duration;
                const remaining = dur - curr;
                
                // Calcula el dynamic mix window inteligente basado en la Outro
                const currProf = trackAnalysis[cancionesData[currentPlayingIndex]?.url];
                let dynamicMixWindow = currProf && currProf.outroDuration ? currProf.outroDuration : 8;
                
                // Pequeña humanización de la decisión
                if(mixTimingHumanized === 0) mixTimingHumanized = (Math.random() - 0.5) * 1.5;
                let actualTriggerTime = dynamicMixWindow + mixTimingHumanized;
                
                if (remaining <= actualTriggerTime && !isCrossfading && remaining > 0.5) {
                    startSmartAutoMix();
                    mixTimingHumanized = 0; // Reset para el siguiente track
                }
            }
        }

        function changeVolume(e, el) {
            const rect = el.getBoundingClientRect();
            let vol = (e.clientX - rect.left) / rect.width;
            setVolumeLevel(vol);
        }

        function setVolumeLevel(vol) {
            if(vol < 0) vol = 0; if(vol > 1) vol = 1;
            globalVolume = vol;
            document.getElementById('volume-fill').style.width = `${globalVolume * 100}%`;
            
            if(audioCtx && masterGain) {
                masterGain.gain.linearRampToValueAtTime(globalVolume, audioCtx.currentTime + 0.1);
            } else {
                activeAudio.volume = globalVolume; 
            }
        }

            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if(tabId === 'songs') { document.getElementById('view-songs').classList.add('active'); document.getElementById('nav-songs').classList.add('active'); } 
            else if(tabId === 'artists') { document.getElementById('view-artists').classList.add('active'); document.getElementById('nav-artists').classList.add('active'); }
        }

        function openArtistDetail(artistName, imgUrl) {
            document.getElementById('detail-artist-name').innerText = artistName;
            document.getElementById('detail-artist-img').src = imgUrl;
            const artistSongs = cancionesData.filter(s => s.artist.includes(artistName));
            let top10, latestRelease, singles;

            if (artistName === "Yan Block") {
                latestRelease =[artistSongs.find(s => s.title === "666")];
                const top10Titles =["YOGURCITO REMIX", "WYA REMIX RED", "444 - REMIX", "TALENTO", "EXPRESSO MARTINI", "111", "VACILE", "SECUESTRO", "YO SE", "444"];
                top10 = artistSongs.filter(s => top10Titles.includes(s.title));
                singles = artistSongs.filter(s => s.title !== "666");
            } else {
                top10 = artistSongs.slice(0, 10); latestRelease = artistSongs.slice(0, 1); singles = artistSongs.slice(1);
            }
            renderSongs(top10, 'artist-top-songs-grid'); renderSongs(latestRelease, 'artist-latest-release-grid'); renderSongs(singles, 'artist-singles-grid');
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-artist-detail').classList.add('active');
        }

        function renderSongs(songsArray, containerId) {
            const gridEl = document.getElementById(containerId); gridEl.innerHTML = '';
            if(!songsArray || songsArray.length === 0) return;
            songsArray.forEach((song) => {
                if(!song) return;
                const realIndex = cancionesData.findIndex(s => s.title === song.title); if(realIndex === -1) return;
                if(!song.cover) song.cover = imageArtistUrl;
                const card = document.createElement('div');
                card.className = `glass-card card-song-${realIndex}`; 
                if (currentPlayingIndex === realIndex) card.classList.add('active');
                card.onclick = () => playSong(realIndex);
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${song.cover}" class="card-img cover-song-${realIndex}">
                        <div class="card-play-btn"><i class="ph-fill ph-play"></i></div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${song.title}</div><div class="card-artist">${song.artist}</div>
                    </div>`;
                gridEl.appendChild(card);

                if(!song.coverLoaded && !song.coverLoading) {
                    song.coverLoading = true;
                    jsmediatags.read(song.url, { onSuccess: function(tag) { if (tag.tags.picture) {
                                let b64 = ""; for (let j = 0; j < tag.tags.picture.data.length; j++) b64 += String.fromCharCode(tag.tags.picture.data[j]);
                                const imgUrl = `data:${tag.tags.picture.format};base64,${window.btoa(b64)}`;
                                song.cover = imgUrl; song.coverLoaded = true;
                                document.querySelectorAll(`.cover-song-${realIndex}`).forEach(img => img.src = imgUrl);
                                if(currentPlayingIndex === realIndex) updateCovers(imgUrl);
                    }}});
                } else if(song.coverLoaded) { document.querySelectorAll(`.cover-song-${realIndex}`).forEach(img => img.src = song.cover); }
            });
        }

        function renderArtists() {
            const gridEl = document.getElementById('artists-grid'); gridEl.innerHTML = '';
            artistsData.forEach(artist => {
                const card = document.createElement('div'); card.className = 'glass-card'; card.onclick = () => openArtistDetail(artist.name, artist.img);
                card.innerHTML = `<div class="card-img-wrapper is-artist"><img src="${artist.img}" class="card-img"></div>
                                  <div class="card-info is-artist-info"><div class="card-title" style="font-size: 18px;">${artist.name}</div><div class="card-artist">Artist</div></div>`;
                gridEl.appendChild(card);
            });
        }

        function updateCovers(img) {
            document.getElementById('pill-cover').src = img;
            document.getElementById('fs-large-cover').src = img;
            document.getElementById('fs-bg').src = img;         
        }

        async function playSong(idx) {
            initAudioEngine();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            isCrossfading = false;
            hideAutoMixBadge();
            
            if(fadingAudio) { fadingAudio.pause(); fadingAudio.src = ""; fadingAudio = null; }
            activeAudio.pause();
            
            // Si el usuario da click, agregamos al historial
            if(currentPlayingIndex !== -1 && !recentHistory.includes(currentPlayingIndex)){
                recentHistory.push(currentPlayingIndex);
                if(recentHistory.length > 5) recentHistory.shift();
            }
            
            resetDeckFX(activeDeck);
            
            triggerUIForSong(idx);
            
            activeAudio.src = cancionesData[idx].url;
            activeAudio.play().catch(e=>console.log("Play err:", e));
            setPlayIcon(true);
        }

        function triggerUIForSong(idx) {
            document.querySelectorAll('.glass-card.active').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(`.card-song-${idx}`).forEach(el => el.classList.add('active'));
            
            currentPlayingIndex = idx; activeLyricIndex = -1;
            const song = cancionesData[idx];

            updateCovers(song.cover || imageArtistUrl);
            document.getElementById('pill-title').innerText = song.title;
            document.getElementById('pill-artist').innerText = song.artist;
            document.getElementById('fs-title').innerText = song.title;
            document.getElementById('fs-artist').innerText = song.artist;

            fetchLyrics(song.lrc);
        }

        // Loop Visual para animar progress bar independientemente
        function renderLoop() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                const curr = activeAudio.currentTime; const dur = activeAudio.duration;
                const pct = (curr / dur) * 100;
                document.getElementById('pill-fill').style.width = `${pct}%`;
                document.getElementById('fs-fill').style.width = `${pct}%`;
                document.getElementById('fs-time-curr').innerText = fmt(curr);
                document.getElementById('fs-time-tot').innerText = "-" + fmt(dur - curr);
                if(isNPOpen) updateKaraoke(curr);
            }
            requestAnimationFrame(renderLoop);
        }

        async function fetchLyrics(url) {
            const container = document.getElementById('lyrics-content'); parsedLyrics =[];
            if(!url) { container.innerHTML = "<div style='height:100%; display:flex; align-items:center;'><p style='color:rgba(255,255,255,0.4); font-size:24px; font-weight:600;'>Letras no disponibles.</p></div>"; return; }
            container.innerHTML = "<p style='color:rgba(255,255,255,0.4); font-size:24px; font-weight:600;'>Cargando letras...</p>";
            try {
                const res = await fetch(url); const text = await res.text(); const lines = text.split('\n');
                lines.forEach(line => {
                    const match = line.match(/\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/);
                    if(match) { parsedLyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim(), element: null, duration: 0 }); }
                });
                for(let i=0; i < parsedLyrics.length; i++) { parsedLyrics[i].duration = (i < parsedLyrics.length - 1) ? Math.min(6, parsedLyrics[i+1].time - parsedLyrics[i].time) : 6; }
                container.innerHTML = ""; if(parsedLyrics.length === 0) throw new Error();
                parsedLyrics.forEach(lyric => {
                    const div = document.createElement('div'); div.className = 'lyric-line'; div.innerText = lyric.text || "♪";
                    div.onclick = () => { activeAudio.currentTime = lyric.time; activeAudio.play(); setPlayIcon(true); };
                    lyric.element = div; container.appendChild(div);
                });
            } catch (e) { container.innerHTML = "<div style='height:100%; display:flex; align-items:center;'><p style='color:rgba(255,255,255,0.4); font-size:24px; font-weight:600;'>Letras no disponibles.</p></div>"; }
        }

        function updateKaraoke(currTime) {
            if(!parsedLyrics.length) return;
            let newIdx = -1; for(let i=0; i<parsedLyrics.length; i++) { if(currTime >= parsedLyrics[i].time) newIdx = i; else break; }
            if(newIdx !== activeLyricIndex) {
                parsedLyrics.forEach((lyric, i) => {
                    if(!lyric.element) return;
                    if(i < newIdx) { lyric.element.className = 'lyric-line passed'; lyric.element.style.setProperty('--fill-pct', '100%'); } 
                    else if(i > newIdx) { lyric.element.className = 'lyric-line'; lyric.element.style.setProperty('--fill-pct', '0%'); } 
                    else { lyric.element.className = 'lyric-line active';
                        const scrollEl = document.getElementById('lyrics-scroll');
                        scrollEl.scrollTo({ top: lyric.element.offsetTop - (scrollEl.clientHeight/2) + (lyric.element.clientHeight/2), behavior: 'smooth' });
                    }
                }); activeLyricIndex = newIdx;
            }
            if(newIdx !== -1 && parsedLyrics[newIdx].duration > 0) {
                const activeLyric = parsedLyrics[newIdx]; let pct = ((currTime - activeLyric.time) / activeLyric.duration) * 100;
                activeLyric.element.style.setProperty('--fill-pct', `${Math.max(0, Math.min(pct, 100))}%`);
            }
        }

        function togglePlay() {
            initAudioEngine();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if(!activeAudio.src) return playSong(0);
            if(activeAudio.paused) { activeAudio.play(); setPlayIcon(true); } 
            else { activeAudio.pause(); setPlayIcon(false); }
        }

        function nextSong() { playSong((currentPlayingIndex + 1) % cancionesData.length); }
        function prevSong() { playSong((currentPlayingIndex - 1 + cancionesData.length) % cancionesData.length); }

        function setPlayIcon(playing) {
            document.getElementById('pill-play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
            document.getElementById('fs-play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
        }

        function seek(e, el) {
            if(!activeAudio.duration) return;
            const rect = el.getBoundingClientRect();
            activeAudio.currentTime = ((e.clientX - rect.left) / rect.width) * activeAudio.duration;
        }

        function toggleNP() {
            isNPOpen = !isNPOpen;
            document.getElementById('np-screen').classList.toggle('active');
            if(isNPOpen && activeAudio.currentTime > 0) setTimeout(() => updateKaraoke(activeAudio.currentTime), 100);
        }

        function fmt(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        window.onload = init;
    </script>
</body>
</html>
