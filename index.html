<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apple Music - Sincronización AMLL 2026</title>
  
  <!-- Tipografía SF Pro / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
      --ease-apple: cubic-bezier(0.25, 1, 0.5, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
      
      --color-bg-fallback: #050508;
      --color-inactive-text: rgba(255, 255, 255, 0.28);
      --color-active-glow: rgba(255, 255, 255, 0.85);
      --glass-surface: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--color-bg-fallback);
      font-family: var(--font-display);
      color: #fff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================================================
       1. AMBIENT GLOW & FLUID BACKGROUND (CANVAS + GRAIN)
       ======================================================== */
    #ambient-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #ambient-canvas {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;
      filter: blur(80px) saturate(160%);
      transform: translateZ(0);
      will-change: transform;
    }

    /* Capa anti-banding con ruido estocástico */
    .grain-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      mix-blend-mode: overlay;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.65) 100%);
    }

    /* ========================================================
       ESTRUCTURA PRINCIPAL (SPLIT VIEW ESTILO MACOS/IPADOS)
       ======================================================== */
    .apple-music-app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1440px;
      height: 100%;
      display: grid;
      grid-template-columns: 420px 1fr;
      padding: clamp(24px, 4vh, 48px);
      gap: clamp(24px, 4vw, 64px);
    }

    /* Panel Izquierdo: Reproductor y Carátula */
    .player-deck {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      z-index: 2;
    }

    .album-cover-wrapper {
      position: relative;
      width: min(100%, 360px);
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--glass-border);
      transition: transform 0.5s var(--ease-apple);
    }

    .album-cover-wrapper:hover {
      transform: scale(1.02);
    }

    .album-cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-meta {
      width: 100%;
      max-width: 360px;
      margin-top: 28px;
    }

    .track-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 16px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 4px;
    }

    .playback-controls {
      width: 100%;
      max-width: 360px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .scrubber-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 3px;
      pointer-events: none;
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-text);
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      font-variant-numeric: tabular-nums;
    }

    .btn-play-pause {
      background: #fff;
      border: none;
      color: #000;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px auto 0;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
      transition: transform 0.2s var(--ease-spring);
    }

    .btn-play-pause:hover {
      transform: scale(1.08);
    }

    .btn-play-pause:active {
      transform: scale(0.94);
    }

    /* ========================================================
       2. CONTENEDOR AMLL (APPLE MUSIC LIKE LYRICS)
       ======================================================== */
    .lyrics-deck {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%);
    }

    .lyrics-scroll-container {
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      padding: 35vh 0 50vh 0; /* Permite centrado del primer y último verso */
      scroll-behavior: auto;
      scrollbar-width: none;
    }

    .lyrics-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .lyrics-content {
      display: flex;
      flex-direction: column;
      gap: clamp(24px, 4vh, 38px);
      width: 100%;
      will-change: transform;
    }

    /* Estilos de Línea */
    .amll-line {
      position: relative;
      font-size: clamp(32px, 3.8vw, 54px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.03em;
      color: var(--color-inactive-text);
      cursor: pointer;
      opacity: 0.35;
      filter: blur(2px);
      transform-origin: left center;
      transform: scale(0.94) translateZ(0);
      transition: 
        transform 0.6s var(--ease-apple), 
        filter 0.5s var(--ease-apple), 
        opacity 0.5s var(--ease-apple);
    }

    .amll-line:hover {
      opacity: 0.65;
      filter: blur(0px);
    }

    /* Estado Activo de Línea */
    .amll-line.active {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1) translateZ(0);
      color: #fff;
    }

    /* Soporte para Dueto */
    .amll-line[data-singer="duet-right"] {
      text-align: right;
      transform-origin: right center;
    }

    .amll-line[data-singer="duet-right"] .amll-word {
      background-position-x: right;
    }

    /* ========================================================
       BARIDO PROGRESIVO DE SÍLABAS/PALABRAS (SWIPE GRADIENT)
       ======================================================== */
    .amll-word {
      display: inline-block;
      white-space: pre-wrap;
      position: relative;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffffff var(--word-progress, 0%),
        rgba(255, 255, 255, 0.3) var(--word-progress, 0%),
        rgba(255, 255, 255, 0.3) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform-origin: center bottom;
      transition: transform 0.3s var(--ease-apple);
    }

    .amll-line.active .amll-word.current-word {
      transform: scale(1.03);
      filter: drop-shadow(0 0 16px var(--color-active-glow));
    }

    /* ========================================================
       ADAPTATIVIDAD (MOBILE VIEW)
       ======================================================== */
    @media (max-width: 900px) {
      .apple-music-app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        padding: 16px;
        gap: 16px;
      }

      .player-deck {
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        gap: 16px;
        padding: 12px;
        background: var(--glass-surface);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        height: auto;
      }

      .album-cover-wrapper {
        width: 56px;
        height: 56px;
        border-radius: 10px;
      }

      .track-meta {
        margin-top: 0;
        flex: 1;
      }

      .track-title { font-size: 16px; }
      .track-artist { font-size: 13px; }

      .playback-controls { display: none; }

      .amll-line {
        font-size: clamp(26px, 7vw, 36px);
      }
    }
  </style>
</head>
<body>

  <!-- Fondo Ambiental Reactivo -->
  <div id="ambient-container">
    <canvas id="ambient-canvas"></canvas>
    <div class="grain-overlay"></div>
    <div class="vignette-overlay"></div>
  </div>

  <!-- Interfaz de la Aplicación -->
  <div class="apple-music-app">
    
    <!-- Lado Izquierdo: Metadata y Controles -->
    <aside class="player-deck">
      <div class="album-cover-wrapper">
        <img id="cover-image" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=800&auto=format&fit=crop&q=80" alt="Album Cover" crossorigin="anonymous" />
      </div>

      <div class="track-meta">
        <h1 class="track-title">Starry Horizon</h1>
        <h2 class="track-artist">Celestial Wave & Lumina (Duet)</h2>
      </div>

      <div class="playback-controls">
        <div class="scrubber-container" id="scrubber">
          <div class="scrubber-fill" id="scrubber-fill"></div>
        </div>
        <div class="time-indicators">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
        <button class="btn-play-pause" id="btn-play-pause" aria-label="Play/Pause">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Lado Derecho: Renderizado de Letras AMLL -->
    <main class="lyrics-deck">
      <div class="lyrics-scroll-container" id="lyrics-scroller">
        <div class="lyrics-content" id="lyrics-mount"></div>
      </div>
    </main>

  </div>

  <script>
    /**
     * MÓDULO 1: Extractor de Color y Fondo Ambiental Reactivo
     * Genera orbes orgánicos basados en los colores dominantes de la carátula.
     */
    class AmbientBackground {
      constructor(canvasId, imageElement) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.img = imageElement;
        
        this.colors = ['#2D1F3D', '#5C2D91', '#1B1464', '#0F2027'];
        this.orbs = [];
        this.targetOrbs = [];
        this.time = 0;

        this.initCanvas();
        this.bindEvents();
      }

      initCanvas() {
        this.width = this.canvas.width = window.innerWidth * 0.5; // Resolución optimizada para blur
        this.height = this.canvas.height = window.innerHeight * 0.5;

        // Crear 4 orbes principales
        this.orbs = [
          { x: this.width * 0.2, y: this.height * 0.3, r: this.width * 0.45, vx: 0.002, vy: 0.003, color: this.colors[0] },
          { x: this.width * 0.8, y: this.height * 0.2, r: this.width * 0.5, vx: -0.003, vy: 0.002, color: this.colors[1] },
          { x: this.width * 0.3, y: this.height * 0.8, r: this.width * 0.4, vx: 0.002, vy: -0.004, color: this.colors[2] },
          { x: this.width * 0.7, y: this.height * 0.7, r: this.width * 0.55, vx: -0.002, vy: -0.003, color: this.colors[3] }
        ];

        this.extractColors();
      }

      extractColors() {
        if (!this.img.complete) {
          this.img.onload = () => this.extractColors();
          return;
        }

        try {
          const offCanvas = document.createElement('canvas');
          const offCtx = offCanvas.getContext('2d');
          offCanvas.width = 30;
          offCanvas.height = 30;
          offCtx.drawImage(this.img, 0, 0, 30, 30);
          
          const p1 = offCtx.getImageData(5, 5, 1, 1).data;
          const p2 = offCtx.getImageData(25, 5, 1, 1).data;
          const p3 = offCtx.getImageData(5, 25, 1, 1).data;
          const p4 = offCtx.getImageData(25, 25, 1, 1).data;

          const toRGB = (p) => `rgb(${p[0]}, ${p[1]}, ${p[2]})`;
          this.colors = [toRGB(p1), toRGB(p2), toRGB(p3), toRGB(p4)];

          this.orbs.forEach((orb, i) => orb.color = this.colors[i]);
        } catch (e) {
          console.warn("Extracción CORS no disponible, usando paleta fallback");
        }
      }

      bindEvents() {
        window.addEventListener('resize', () => {
          this.width = this.canvas.width = window.innerWidth * 0.5;
          this.height = this.canvas.height = window.innerHeight * 0.5;
        });
      }

      render() {
        this.time += 0.01;
        this.ctx.fillStyle = '#050508';
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.orbs.forEach((orb, i) => {
          // Movimiento elíptico continuo orgánico
          const offsetX = Math.sin(this.time * 20 * orb.vx + i) * (this.width * 0.15);
          const offsetY = Math.cos(this.time * 20 * orb.vy + i) * (this.height * 0.15);
          const currentX = orb.x + offsetX;
          const currentY = orb.y + offsetY;

          const grad = this.ctx.createRadialGradient(
            currentX, currentY, 0,
            currentX, currentY, orb.r
          );
          grad.addColorStop(0, orb.color);
          grad.addColorStop(1, 'rgba(5, 5, 8, 0)');

          this.ctx.globalCompositeOperation = 'screen';
          this.ctx.fillStyle = grad;
          this.ctx.beginPath();
          this.ctx.arc(currentX, currentY, orb.r, 0, Math.PI * 2);
          this.ctx.fill();
        });

        requestAnimationFrame(() => this.render());
      }
    }

    /**
     * MÓDULO 2: Dataset TTML y Parser de Sincronización AMLL
     */
    const TTML_DATA = `
    <tt xmlns="http://www.w3.org/ns/ttml">
      <body>
        <div>
          <p begin="00:01.000" end="00:04.500" singer="duet-left">
            <span begin="00:01.000" end="00:01.800">We </span>
            <span begin="00:01.800" end="00:02.500">ignite </span>
            <span begin="00:02.500" end="00:03.200">the </span>
            <span begin="00:03.200" end="00:04.500">atmosphere</span>
          </p>
          <p begin="00:05.000" end="00:08.800" singer="duet-right">
            <span begin="00:05.000" end="00:05.800">Chasing </span>
            <span begin="00:05.800" end="00:06.600">echoes </span>
            <span begin="00:06.600" end="00:07.400">through </span>
            <span begin="00:07.400" end="00:08.800">the night</span>
          </p>
          <p begin="00:09.200" end="00:13.600" singer="duet-left">
            <span begin="00:09.200" end="00:09.800">Every </span>
            <span begin="00:09.800" end="00:10.500">whisper </span>
            <span begin="00:10.500" end="00:11.400">drawn </span>
            <span begin="00:11.400" end="00:12.200">in </span>
            <span begin="00:12.200" end="00:13.600">starlight</span>
          </p>
          <p begin="00:14.200" end="00:18.500" singer="duet-right">
            <span begin="00:14.200" end="00:15.000">Floating </span>
            <span begin="00:15.000" end="00:15.800">weightless </span>
            <span begin="00:15.800" end="00:16.800">in </span>
            <span begin="00:16.800" end="00:18.500">the calm</span>
          </p>
          <p begin="00:19.000" end="00:24.000" singer="duet-left">
            <span begin="00:19.000" end="00:20.200">Forever </span>
            <span begin="00:20.200" end="00:21.400">aligned </span>
            <span begin="00:21.400" end="00:22.500">in </span>
            <span begin="00:22.500" end="00:24.000">motion</span>
          </p>
        </div>
      </body>
    </tt>`;

    function parseTime(timeStr) {
      const [min, sec] = timeStr.split(':');
      return parseFloat(min) * 60 + parseFloat(sec);
    }

    function parseTTML(xmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlString, "application/xml");
      const paragraphs = Array.from(doc.querySelectorAll('p'));

      return paragraphs.map((p, pIndex) => {
        const lineStart = parseTime(p.getAttribute('begin'));
        const lineEnd = parseTime(p.getAttribute('end'));
        const singer = p.getAttribute('singer') || 'solo';
        
        const words = Array.from(p.querySelectorAll('span')).map((span, wIndex) => ({
          id: `w-${pIndex}-${wIndex}`,
          text: span.textContent,
          start: parseTime(span.getAttribute('begin')),
          end: parseTime(span.getAttribute('end'))
        }));

        return {
          id: `l-${pIndex}`,
          start: lineStart,
          end: lineEnd,
          singer,
          words
        };
      });
    }

    /**
     * MÓDULO 3: Motor de Renderizado AMLL & Física de Scroll
     */
    class AMLLPlayer {
      constructor(lines, containerElement, scrollerElement) {
        this.lines = lines;
        this.container = containerElement;
        this.scroller = scrollerElement;
        
        this.activeLineIndex = -1;
        this.userScrolling = false;
        this.userScrollTimeout = null;

        // Física de resorte (Spring)
        this.targetScrollTop = 0;
        this.currentScrollTop = 0;
        this.springStiffness = 0.08;
        this.springDamping = 0.78;
        this.springVelocity = 0;

        this.onSeekCallback = null;

        this.buildDOM();
        this.bindEvents();
        this.startSpringLoop();
      }

      buildDOM() {
        this.container.innerHTML = '';
        this.lineElements = [];

        this.lines.forEach((line, lIndex) => {
          const lineDiv = document.createElement('div');
          lineDiv.className = 'amll-line';
          lineDiv.dataset.singer = line.singer;
          lineDiv.dataset.index = lIndex;

          line.words.forEach((w) => {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'amll-word';
            wordSpan.id = w.id;
            wordSpan.textContent = w.text;
            lineDiv.appendChild(wordSpan);
          });

          // Interacción: Click para hacer Seek
          lineDiv.addEventListener('click', () => {
            if (this.onSeekCallback) {
              this.onSeekCallback(line.start);
            }
          });

          this.container.appendChild(lineDiv);
          this.lineElements.push(lineDiv);
        });
      }

      bindEvents() {
        // Detección de Scroll Manual del Usuario
        const handleUserScroll = () => {
          this.userScrolling = true;
          this.currentScrollTop = this.scroller.scrollTop;
          this.targetScrollTop = this.scroller.scrollTop;

          clearTimeout(this.userScrollTimeout);
          // Reinicia el auto-scroll tras 3 segundos de inactividad
          this.userScrollTimeout = setTimeout(() => {
            this.userScrolling = false;
            this.scrollToActiveLine();
          }, 3000);
        };

        this.scroller.addEventListener('wheel', handleUserScroll, { passive: true });
        this.scroller.addEventListener('touchmove', handleUserScroll, { passive: true });
      }

      scrollToActiveLine() {
        if (this.activeLineIndex === -1 || this.userScrolling) return;

        const activeElement = this.lineElements[this.activeLineIndex];
        if (!activeElement) return;

        const scrollerRect = this.scroller.getBoundingClientRect();
        const elementRect = activeElement.getBoundingClientRect();

        // Centrado exacto vertical al estilo Apple Music (~38% de la pantalla)
        const targetOffset = (elementRect.top - scrollerRect.top) + this.scroller.scrollTop - (scrollerRect.height * 0.38);
        this.targetScrollTop = Math.max(0, targetOffset);
      }

      startSpringLoop() {
        const updatePhysics = () => {
          if (!this.userScrolling) {
            // Modelo de resorte amortiguado (Damped Spring)
            const force = (this.targetScrollTop - this.currentScrollTop) * this.springStiffness;
            this.springVelocity = (this.springVelocity + force) * this.springDamping;
            this.currentScrollTop += this.springVelocity;

            if (Math.abs(this.targetScrollTop - this.currentScrollTop) > 0.1 || Math.abs(this.springVelocity) > 0.05) {
              this.scroller.scrollTop = this.currentScrollTop;
            }
          }
          requestAnimationFrame(updatePhysics);
        };
        requestAnimationFrame(updatePhysics);
      }

      update(currentTime) {
        let currentLineIdx = -1;

        // 1. Detectar Línea Activa
        for (let i = 0; i < this.lines.length; i++) {
          const line = this.lines[i];
          if (currentTime >= line.start && currentTime <= line.end + 0.3) {
            currentLineIdx = i;
            break;
          } else if (currentTime > line.end && (i === this.lines.length - 1 || currentTime < this.lines[i+1].start)) {
            currentLineIdx = i; // Mantener activa hasta la siguiente
            break;
          }
        }

        // Si cambió la línea activa
        if (currentLineIdx !== this.activeLineIndex) {
          if (this.activeLineIndex !== -1 && this.lineElements[this.activeLineIndex]) {
            this.lineElements[this.activeLineIndex].classList.remove('active');
          }

          this.activeLineIndex = currentLineIdx;

          if (this.activeLineIndex !== -1) {
            const activeEl = this.lineElements[this.activeLineIndex];
            activeEl.classList.add('active');
            this.scrollToActiveLine();
          }
        }

        // 2. Animar Palabras / Sílabas de la Línea Activa (Swipe & Glow)
        if (this.activeLineIndex !== -1) {
          const lineData = this.lines[this.activeLineIndex];

          lineData.words.forEach(word => {
            const wordEl = document.getElementById(word.id);
            if (!wordEl) return;

            if (currentTime < word.start) {
              wordEl.style.setProperty('--word-progress', `0%`);
              wordEl.classList.remove('current-word');
            } else if (currentTime >= word.end) {
              wordEl.style.setProperty('--word-progress', `100%`);
              wordEl.classList.remove('current-word');
            } else {
              // Progreso lineal normalizado en el interior de la sílaba
              const progress = ((currentTime - word.start) / (word.end - word.start)) * 100;
              wordEl.style.setProperty('--word-progress', `${progress.toFixed(2)}%`);
              wordEl.classList.add('current-word');
            }
          });
        }
      }
    }

    /**
     * MÓDULO 4: Simulación de Audio y Enlace Global
     */
    class AudioEngineSimulation {
      constructor(totalDuration = 26) {
        this.duration = totalDuration;
        this.currentTime = 0;
        this.isPlaying = false;
        this.lastFrameTime = performance.now();
      }

      play() {
        this.isPlaying = true;
        this.lastFrameTime = performance.now();
      }

      pause() {
        this.isPlaying = false;
      }

      seek(time) {
        this.currentTime = Math.max(0, Math.min(this.duration, time));
      }

      tick() {
        const now = performance.now();
        const delta = (now - this.lastFrameTime) / 1000;
        this.lastFrameTime = now;

        if (this.isPlaying) {
          this.currentTime += delta;
          if (this.currentTime >= this.duration) {
            this.currentTime = 0; // Loop demo
          }
        }

        return {
          currentTime: this.currentTime,
          duration: this.duration,
          isPlaying: this.isPlaying
        };
      }
    }

    // Inicialización del Sistema
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Iniciar Canvas Fluido
      const bg = new AmbientBackground('ambient-canvas', document.getElementById('cover-image'));
      bg.render();

      // 2. Parsear TTML
      const parsedLyrics = parseTTML(TTML_DATA);

      // 3. Iniciar Motor AMLL
      const lyricsScroller = document.getElementById('lyrics-scroller');
      const lyricsMount = document.getElementById('lyrics-mount');
      const amll = new AMLLPlayer(parsedLyrics, lyricsMount, lyricsScroller);

      // 4. Controlador de Reproducción
      const audio = new AudioEngineSimulation(25);
      amll.onSeekCallback = (seekTime) => audio.seek(seekTime);

      const scrubber = document.getElementById('scrubber');
      const scrubberFill = document.getElementById('scrubber-fill');
      const timeCurrent = document.getElementById('time-current');
      const timeTotal = document.getElementById('time-total');
      const btnPlay = document.getElementById('btn-play-pause');
      const playIcon = document.getElementById('play-icon');

      const formatTime = (s) => {
        const mins = Math.floor(s / 60);
        const secs = Math.floor(s % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      btnPlay.addEventListener('click', () => {
        if (audio.isPlaying) {
          audio.pause();
          playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        } else {
          audio.play();
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }
      });

      scrubber.addEventListener('click', (e) => {
        const rect = scrubber.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audio.seek(pct * audio.duration);
      });

      // 5. Loop Maestro de Sincronización (60 FPS)
      function masterLoop() {
        const state = audio.tick();

        // Actualizar AMLL
        amll.update(state.currentTime);

        // Actualizar UI Controles
        const pct = (state.currentTime / state.duration) * 100;
        scrubberFill.style.width = `${pct}%`;
        timeCurrent.textContent = formatTime(state.currentTime);
        timeTotal.textContent = formatTime(state.duration);

        requestAnimationFrame(masterLoop);
      }

      requestAnimationFrame(masterLoop);
    });
  </script>
