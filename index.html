<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Block - Custom Flow UI</title>
    
    <!-- Tipografía moderna y geométrica -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <!-- Íconos minimalistas -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Librería para extraer portadas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ========================
           VARIABLES & TEMA PROPIO (NEON DARK)
           ======================== */
        :root {
            --bg-base: #050508;
            --bg-surface: #111116;
            --text-main: #ffffff;
            --text-muted: #8a8a93;
            --accent-gradient: linear-gradient(135deg, #7928CA 0%, #FF007A 100%);
            --accent-solid: #FF007A;
            --glass-panel: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.05);
            --font-custom: 'Outfit', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-custom); -webkit-font-smoothing: antialiased; }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            background-image: radial-gradient(circle at 15% 50%, rgba(121, 40, 202, 0.08), transparent 40%),
                              radial-gradient(circle at 85% 30%, rgba(255, 0, 122, 0.05), transparent 40%);
        }

        /* ========================
           UI PRINCIPAL (DISEÑO PROPIO)
           ======================== */
        
        /* Navegación Superior */
        .top-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 50px; background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border); z-index: 20; position: relative;
        }
        
        .brand { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .brand span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 15px; font-weight: 600; transition: 0.3s; cursor: pointer;}
        .nav-links a:hover, .nav-links a.active { color: var(--text-main); }
        
        .user-profile { width: 40px; height: 40px; border-radius: 12px; background: var(--glass-panel); display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--glass-border); transition: 0.3s;}
        .user-profile:hover { border-color: var(--accent-solid); }

        /* Contenedor desplazable */
        .main-scroll {
            flex: 1; overflow-y: auto; padding-bottom: 140px; scroll-behavior: smooth;
        }
        .main-scroll::-webkit-scrollbar { width: 8px; }
        .main-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Cabecera del Artista (Hero Banner) */
        .hero-banner {
            position: relative; height: 45vh; min-height: 350px;
            margin: 30px 50px; border-radius: 30px; overflow: hidden;
            display: flex; align-items: flex-end; padding: 50px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
        }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); transition: 0.5s; }
        .hero-banner:hover .hero-bg { transform: scale(1.05); filter: brightness(0.5); }
        
        /* Gradiente superpuesto para texto legible */
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg-base) 0%, rgba(5,5,8,0) 80%); }

        .hero-content { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        .hero-text h2 { font-size: 16px; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; font-weight: 600;}
        .hero-text h1 { font-size: 85px; font-weight: 900; line-height: 1; letter-spacing: -3px; margin-bottom: 20px; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        
        .hero-actions { display: flex; gap: 20px; }
        .btn-play-hero {
            background: var(--accent-gradient); color: #fff; border: none;
            padding: 18px 45px; border-radius: 100px; font-size: 18px; font-weight: 800;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            box-shadow: 0 15px 30px rgba(255, 0, 122, 0.3); transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-play-hero:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(121, 40, 202, 0.5); }
        
        /* Sección de Canciones (Paneles Neumórficos/Glass) */
        .tracklist-section { padding: 0 50px; margin-top: 40px; }
        .section-header { font-size: 24px; font-weight: 800; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        .section-header i { color: var(--accent-solid); }

        .custom-track-list { display: flex; flex-direction: column; gap: 12px; }
        
        .track-card {
            display: flex; align-items: center; padding: 15px 25px;
            background: var(--glass-panel); border: 1px solid var(--glass-border);
            border-radius: 20px; cursor: pointer; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        
        /* Efecto de luz al pasar el cursor */
        .track-card::before {
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background: var(--accent-gradient); opacity: 0; transition: 0.3s;
        }
        .track-card:hover { 
            background: rgba(255, 255, 255, 0.06); 
            transform: translateX(10px); 
            border-color: rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .track-card:hover::before { opacity: 1; }

        .track-card.active {
            background: rgba(121, 40, 202, 0.1); border-color: rgba(255, 0, 122, 0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .track-card.active::before { opacity: 1; width: 6px; }

        .t-num { width: 40px; font-size: 16px; font-weight: 800; color: var(--text-muted); }
        .track-card.active .t-num { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .t-art { width: 55px; height: 55px; border-radius: 12px; object-fit: cover; margin-right: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        .t-info { flex: 1; }
        .t-title { font-size: 17px; font-weight: 700; margin-bottom: 5px; color: var(--text-main); }
        .t-artist { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        
        .t-duration { font-size: 14px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 15px;}
        .t-action { opacity: 0; transition: 0.3s; font-size: 22px; color: var(--text-main); }
        .track-card:hover .t-action { opacity: 1; }

        /* ========================
           REPRODUCTOR FLOTANTE Y LETRAS (MANTENIDO INTACTO LÓGICAMENTE, ADAPTADO VISUALMENTE)
           ======================== */
        
        /* Píldora Reproductor (Flotante) */
        .player-pill {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 100px); max-width: 1000px; height: 90px; border-radius: 45px;
            background: rgba(17, 17, 22, 0.7);
            backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 100;
        }

        .player-info { display: flex; align-items: center; gap: 15px; width: 30%; }
        .player-cover { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.4); border: 2px solid transparent;}
        .player-cover:hover { transform: scale(1.1); border-color: var(--accent-solid); }
        .player-text h4 { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .player-text p { font-size: 13px; color: var(--text-muted); }

        .player-core { display: flex; flex-direction: column; align-items: center; width: 40%; gap: 8px; }
        .player-controls { display: flex; align-items: center; gap: 30px; color: var(--text-main); }
        .player-controls i { font-size: 24px; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .player-controls i:hover { color: #fff; transform: scale(1.1);}
        
        .play-btn {
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--text-main); color: var(--bg-base);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }
        .play-btn i { font-size: 24px; color: var(--bg-base) !important; }
        .play-btn:hover { transform: scale(1.1); background: var(--accent-gradient); color: #fff; }
        .play-btn:hover i { color: #fff !important; }

        /* Barra de progreso Custom */
        .progress-wrapper { display: flex; align-items: center; gap: 12px; width: 100%; font-size: 11px; color: var(--text-muted); font-weight: 700; }
        .progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; cursor: pointer; position: relative; overflow: hidden;}
        .progress-fill { width: 0%; height: 100%; background: var(--accent-gradient); border-radius: 3px; position: relative; transition: width 0.1s linear;}

        .player-tools { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 20px; color: var(--text-muted); }
        .tool-btn { font-size: 22px; cursor: pointer; transition: 0.2s; }
        .tool-btn:hover { color: #fff; }
        .tool-btn.active { color: var(--accent-solid); text-shadow: 0 0 10px var(--accent-solid); }

        /* Pantalla de Letras Inmersiva (Karaoke Progresivo) */
        .lyrics-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 90; display: flex;
            transform: translateY(100%); opacity: 0; visibility: hidden;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s;
        }
        .lyrics-screen.active { transform: translateY(0); opacity: 1; visibility: visible; }
        
        .lyrics-bg { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; object-fit: cover; filter: blur(100px) saturate(200%); opacity: 0.4; z-index: 0; }
        
        .lyrics-layout { position: relative; z-index: 1; width: 100%; display: flex; align-items: center; padding: 0 8vw; gap: 6vw; padding-bottom: 90px;}
        
        .lyrics-art-wrapper { flex: 0.8; display: flex; justify-content: flex-end; }
        .lyrics-art { width: 450px; height: 450px; border-radius: 30px; object-fit: cover; box-shadow: 0 40px 80px rgba(0,0,0,0.8); transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); transform: scale(0.8); opacity: 0; border: 1px solid rgba(255,255,255,0.1);}
        .lyrics-screen.active .lyrics-art { transform: scale(1); opacity: 1; }

        .lyrics-text-wrapper {
            flex: 1.2; height: 100vh; overflow-y: auto; scroll-behavior: smooth;
            padding: 45vh 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }
        .lyrics-text-wrapper::-webkit-scrollbar { display: none; }

        /* Fill progresivo de las letras */
        .lyric-line {
            font-size: 50px; font-weight: 900; line-height: 1.2; letter-spacing: -1px;
            margin-bottom: 30px; cursor: pointer; transform-origin: left center;
            filter: blur(3px); transition: transform 0.4s ease-out, filter 0.4s ease-out;
            
            --fill-pct: 0%;
            background: linear-gradient(to right, #ffffff var(--fill-pct), rgba(255, 255, 255, 0.2) var(--fill-pct));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .lyric-line.active { transform: scale(1.05); filter: blur(0px); text-shadow: 0 0 40px rgba(255,255,255,0.2); }
        .lyric-line.passed {
            background: linear-gradient(to right, #ffffff 100%, #ffffff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            opacity: 0.3; 
        }
        .lyric-line:hover { opacity: 1; transform: scale(1.02); }

        .close-lyrics {
            position: absolute; top: 40px; right: 50px;
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            color: #fff; cursor: pointer; font-size: 24px; z-index: 10; transition: 0.3s;
        }
        .close-lyrics:hover { background: rgba(255,255,255,0.2); transform: translateY(-5px); }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION PROPIA -->
    <nav class="top-nav">
        <div class="brand">
            <i class="ph-fill ph-waveform"></i>
            <span>FLOW</span>
        </div>
        <div class="nav-links">
            <a class="active">Discover</a>
            <a>Trending</a>
            <a>Playlists</a>
            <a>Radio</a>
        </div>
        <div class="user-profile">
            <i class="ph ph-user"></i>
        </div>
    </nav>

    <!-- AREA DE CONTENIDO -->
    <main class="main-scroll">
        
        <!-- HERO BANNER PROPIO -->
        <header class="hero-banner">
            <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" alt="Yan Block" class="hero-bg">
            <div class="hero-overlay"></div>
            
            <div class="hero-content">
                <div class="hero-text">
                    <h2>Verified Artist</h2>
                    <h1>YAN BLOCK</h1>
                </div>
                <div class="hero-actions">
                    <button class="btn-play-hero" onclick="playSong(0)">
                        <i class="ph-fill ph-play-circle"></i> PLAY ALL
                    </button>
                </div>
            </div>
        </header>

        <!-- LISTA DE CANCIONES ESTILO PANELES -->
        <section class="tracklist-section">
            <h3 class="section-header"><i class="ph-fill ph-fire"></i> Popular Tracks</h3>
            <div class="custom-track-list" id="track-list">
                <!-- Javascript Inyecta Aquí -->
            </div>
        </section>
    </main>

    <!-- PANTALLA DE LETRAS (ESTRUCTURA MANTENIDA) -->
    <div class="lyrics-screen" id="lyrics-screen">
        <img src="" class="lyrics-bg" id="lyrics-bg">
        <button class="close-lyrics" onclick="toggleLyrics()"><i class="ph ph-x"></i></button>
        
        <div class="lyrics-layout">
            <div class="lyrics-art-wrapper">
                <img src="" class="lyrics-art" id="lyrics-art">
            </div>
            <div class="lyrics-text-wrapper" id="lyrics-scroll">
                <div id="lyrics-content"></div>
            </div>
        </div>
    </div>

    <!-- PÍLDORA REPRODUCTOR (ESTRUCTURA MANTENIDA) -->
    <div class="player-pill">
        <div class="player-info">
            <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="player-cover" id="player-cover" onclick="toggleLyrics()" title="View Lyrics">
            <div class="player-text">
                <h4 id="player-title">Not Playing</h4>
                <p id="player-artist">Yan Block</p>
            </div>
        </div>

        <div class="player-core">
            <div class="player-controls">
                <i class="ph ph-shuffle"></i>
                <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                <div class="play-btn" onclick="togglePlay()">
                    <i class="ph-fill ph-play" id="play-icon"></i>
                </div>
                <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
                <i class="ph ph-repeat"></i>
            </div>
            
            <div class="progress-wrapper">
                <span id="time-current">0:00</span>
                <div class="progress-track" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="time-total">--:--</span>
            </div>
        </div>

        <div class="player-tools">
            <i class="ph ph-microphone-stage tool-btn" id="btn-lyrics" onclick="toggleLyrics()" title="Lyrics"></i>
            <i class="ph ph-speaker-high tool-btn"></i>
            <i class="ph ph-playlist tool-btn"></i>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        // Data proporcionada
        const imageArtistUrl = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg";
        const cancionesData =[
            { title: "YOGURCITO REMIX", artist: "Blessd, Anuel AA, Yan Block, Luar La L...", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007457/YOGURCITO_REMIX_Blessd_Anuel_AA_Yan_Block_Luar_La_L_Kris_R._ROA_ocxlgl.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/YOGURCITO_REMIX_wwua9w.lrc" },
            { title: "TALENTO", artist: "Yan Block, Panda Black", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007391/TALENTO_Yan_Block_Panda_Black_r4ugu2.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/TALENTO_s4qtf2.lrc" },
            { title: "444", artist: "Yan Block, Panda Black", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007376/444_Yan_Block_Panda_Black_upxnup.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/444_ie7e6d.lrc" },
            { title: "YO SE", artist: "Yan Block, TORRRES", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007440/YO_SE_Yan_Block_TORRRES_i8ianx.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/YO_SE_hiutok.lrc" },
            { title: "444 - REMIX", artist: "Yan Block, De La Rose, Hades66, Ñengo Flow", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007452/444_-_REMIX_Yan_Block_De_La_Rose_Hades66_%C3%91engo_Flow_lshzau.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/444_-_REMIX_t2qoid.lrc" },
            { title: "111", artist: "Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007415/111_Yan_Block_h3poua.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/111_adlg6f.lrc" },
            { title: "WYA REMIX RED", artist: "J Abdiel, De La Rose, Yan Block, iZaak, Jay Wheeler", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007447/WYA_REMIX_RED_J_Abdiel_De_La_Rose_Yan_Block_iZaak_Jay_Wheeler_mvfmrz.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/WYA_REMIX_RED_ic1sdd.lrc" },
            { title: "SECUESTRO", artist: "Slayter, Yan Block, NTG", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007396/SECUESTRO_Slayter_Yan_Block_NTG_bqszzh.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/SECUESTRO_m4absd.lrc" },
            { title: "VACILE", artist: "Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007402/VACILE_Yan_Block_ytkcf9.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/VACILE_qxdqxq.lrc" },
            { title: "EXPRESSO MARTINI", artist: "Rauw Alejandro, Marconi Impara, Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007397/EXPRESSO_MARTINI_Rauw_Alejandro_Marconi_Impara_Yan_Block_ac5x3j.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/EXPRESSO_MARTINI_nl8yas.lrc" }
        ];

        const audioPlayer = document.getElementById('audio-player');
        let currentPlayingIndex = -1;
        let isLyricsOpen = false;
        let parsedLyrics =[]; 
        let activeLyricIndex = -1;

        // 1. DIBUJAR PANELES DE CANCIONES
        function init() {
            const listEl = document.getElementById('track-list');
            cancionesData.forEach((song, i) => {
                song.cover = imageArtistUrl;
                const div = document.createElement('div');
                div.className = 'track-card';
                div.id = `track-${i}`;
                div.innerHTML = `
                    <div class="t-num">${(i + 1).toString().padStart(2, '0')}</div>
                    <img src="${imageArtistUrl}" id="art-${i}" class="t-art">
                    <div class="t-info">
                        <div class="t-title">${song.title}</div>
                        <div class="t-artist">${song.artist}</div>
                    </div>
                    <div class="t-duration">
                        <span id="dur-${i}">--:--</span>
                        <i class="ph-fill ph-play-circle t-action"></i>
                    </div>
                `;
                div.onclick = () => playSong(i);
                listEl.appendChild(div);

                // Portadas reales
                jsmediatags.read(song.url, {
                    onSuccess: function(tag) {
                        if (tag.tags.picture) {
                            let base64String = "";
                            for (let j = 0; j < tag.tags.picture.data.length; j++) base64String += String.fromCharCode(tag.tags.picture.data[j]);
                            const imgUrl = `data:${tag.tags.picture.format};base64,${window.btoa(base64String)}`;
                            song.cover = imgUrl;
                            document.getElementById(`art-${i}`).src = imgUrl;
                            if(currentPlayingIndex === i) updateCovers(imgUrl);
                        }
                    }
                });
            });

            requestAnimationFrame(engineLoop);
        }

        function updateCovers(img) {
            document.getElementById('player-cover').src = img;
            document.getElementById('lyrics-art').src = img;
            document.getElementById('lyrics-bg').src = img;
        }

        // 2. LOGICA REPRODUCTOR
        async function playSong(idx) {
            if(currentPlayingIndex !== -1) document.getElementById(`track-${currentPlayingIndex}`).classList.remove('active');
            document.getElementById(`track-${idx}`).classList.add('active');
            
            currentPlayingIndex = idx;
            activeLyricIndex = -1;
            const song = cancionesData[idx];

            updateCovers(song.cover);
            document.getElementById('player-title').innerText = song.title;
            document.getElementById('player-artist').innerText = song.artist;

            audioPlayer.src = song.url;
            audioPlayer.play();
            setPlayIcon(true);

            await fetchLyrics(song.lrc);
        }

        // 3. LETRAS (LOGICA INTACTA)
        async function fetchLyrics(url) {
            const container = document.getElementById('lyrics-content');
            container.innerHTML = "<p style='color:#8a8a93; font-size:24px'>Extrayendo letras...</p>";
            parsedLyrics =[];

            try {
                const res = await fetch(url);
                const text = await res.text();
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    const match = line.match(/\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/);
                    if(match) {
                        parsedLyrics.push({ 
                            time: (parseInt(match[1]) * 60) + parseFloat(match[2]), 
                            text: match[3].trim(), element: null, duration: 0 
                        });
                    }
                });

                for(let i=0; i<parsedLyrics.length; i++) {
                    parsedLyrics[i].duration = (i < parsedLyrics.length - 1) ? Math.min(6, parsedLyrics[i+1].time - parsedLyrics[i].time) : 6;
                }
                
                container.innerHTML = "";
                parsedLyrics.forEach(lyric => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.innerText = lyric.text || "♪";
                    div.onclick = () => { audioPlayer.currentTime = lyric.time; audioPlayer.play(); setPlayIcon(true); };
                    lyric.element = div;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<p style='color:#8a8a93; font-size:24px'>Letras no disponibles.</p>";
            }
        }

        // 4. MOTOR FLUIDO 60FPS (LOGICA INTACTA)
        function engineLoop() {
            if(audioPlayer.duration) {
                const curr = audioPlayer.currentTime;
                const dur = audioPlayer.duration;
                
                document.getElementById('progress-fill').style.width = `${(curr / dur) * 100}%`;
                document.getElementById('time-current').innerText = fmt(curr);
                document.getElementById('time-total').innerText = fmt(dur);
                document.getElementById(`dur-${currentPlayingIndex}`).innerText = fmt(dur);
                
                if(isLyricsOpen) updateKaraoke(curr);
            }
            requestAnimationFrame(engineLoop);
        }

        function updateKaraoke(currTime) {
            if(!parsedLyrics.length) return;

            let newIdx = -1;
            for(let i=0; i<parsedLyrics.length; i++) {
                if(currTime >= parsedLyrics[i].time) newIdx = i; else break;
            }

            if(newIdx !== activeLyricIndex) {
                parsedLyrics.forEach((lyric, i) => {
                    if(!lyric.element) return;
                    if(i < newIdx) {
                        lyric.element.className = 'lyric-line passed';
                        lyric.element.style.setProperty('--fill-pct', '100%');
                    } else if(i > newIdx) {
                        lyric.element.className = 'lyric-line';
                        lyric.element.style.setProperty('--fill-pct', '0%');
                    } else {
                        lyric.element.className = 'lyric-line active';
                        const scrollEl = document.getElementById('lyrics-scroll');
                        scrollEl.scrollTo({ top: lyric.element.offsetTop - (scrollEl.clientHeight/2) + 20, behavior: 'smooth' });
                    }
                });
                activeLyricIndex = newIdx;
            }

            if(newIdx !== -1 && parsedLyrics[newIdx].duration > 0) {
                const l = parsedLyrics[newIdx];
                let pct = ((currTime - l.time) / l.duration) * 100;
                l.element.style.setProperty('--fill-pct', `${Math.max(0, Math.min(pct, 100))}%`);
            }
        }

        // 5. EVENTOS GLOBALES
        audioPlayer.onended = nextSong;

        document.getElementById('progress-track').onclick = (e) => {
            if(!audioPlayer.duration) return;
            const rect = e.target.getBoundingClientRect();
            audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
        };

        function togglePlay() {
            if(!audioPlayer.src) return playSong(0);
            if(audioPlayer.paused) { audioPlayer.play(); setPlayIcon(true); } 
            else { audioPlayer.pause(); setPlayIcon(false); }
        }

        function nextSong() { playSong((currentPlayingIndex + 1) % cancionesData.length); }
        function prevSong() { playSong((currentPlayingIndex - 1 + cancionesData.length) % cancionesData.length); }

        function setPlayIcon(playing) {
            document.getElementById('play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
        }

        function toggleLyrics() {
            isLyricsOpen = !isLyricsOpen;
            document.getElementById('lyrics-screen').classList.toggle('active');
            document.getElementById('btn-lyrics').classList.toggle('active');
            if(isLyricsOpen && audioPlayer.currentTime > 0) setTimeout(() => updateKaraoke(audioPlayer.currentTime), 100);
        }

        function fmt(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        window.onload = init;
    </script>
</body>
</html>
