<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yan Block - SpotiApple UI</title>
    
    <!-- Tipografía Inter (Limpia y moderna, estilo Apple SF / Spotify Circular) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    
    <style>
        /* ========================
           APPLE + SPOTIFY THEME
           ======================== */
        :root {
            --bg-main: #000000;
            --bg-elevated: #121212;
            --bg-hover: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a7a7a7;
            --accent: #1ed760; /* Spotify Green for subtle highlights */
            
            --glass-bg: rgba(18, 18, 18, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            
            --font-main: 'Inter', sans-serif;
            --spring: cubic-bezier(0.32, 0.72, 0, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body { 
            background-color: var(--bg-main); color: var(--text-primary); 
            font-family: var(--font-main); height: 100vh; overflow: hidden; display: flex; 
        }

        /* --- SIDEBAR (Spotify Style) --- */
        .sidebar {
            width: 260px; background-color: var(--bg-main); padding: 24px 12px;
            display: flex; flex-direction: column; gap: 20px; flex-shrink: 0;
        }
        .nav-box { background: var(--bg-elevated); border-radius: 8px; padding: 12px 0; }
        .nav-item {
            display: flex; align-items: center; gap: 16px; padding: 12px 24px;
            font-size: 15px; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: 0.2s;
        }
        .nav-item i { font-size: 24px; }
        .nav-item:hover, .nav-item.active { color: var(--text-primary); }

        /* --- MAIN CONTENT --- */
        .main-wrapper {
            flex: 1; background: var(--bg-elevated); margin: 12px 12px 12px 0; border-radius: 8px;
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }
        .main-content {
            flex: 1; overflow-y: auto; padding-bottom: 120px; scroll-behavior: smooth;
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* Header / Hero */
        .hero {
            display: flex; align-items: flex-end; gap: 24px; padding: 60px 40px 40px 40px;
            background: linear-gradient(transparent, rgba(0,0,0,0.5));
            border-bottom: 1px solid var(--glass-border); position: relative;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0; background: inherit; filter: blur(50px); z-index: -1;
        }
        .hero-img { width: 232px; height: 232px; border-radius: 8px; object-fit: cover; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .hero-info { display: flex; flex-direction: column; gap: 10px; }
        .hero-label { font-size: 14px; font-weight: 500; text-transform: capitalize; display: flex; align-items: center; gap: 6px;}
        .hero-info h1 { font-size: 80px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
        
        .action-bar { padding: 24px 40px; display: flex; align-items: center; gap: 24px; }
        .btn-play-big {
            width: 56px; height: 56px; background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            color: #000; cursor: pointer; transition: transform 0.2s, background 0.2s;
        }
        .btn-play-big:hover { transform: scale(1.05); background: #33ff77; }

        /* Tracklist */
        .tracklist { padding: 0 40px; display: flex; flex-direction: column; }
        .track-header {
            display: flex; align-items: center; padding: 0 16px 10px 16px; border-bottom: 1px solid var(--glass-border);
            font-size: 13px; color: var(--text-secondary); text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
        }
        
        .track-row {
            display: flex; align-items: center; padding: 8px 16px; border-radius: 6px;
            cursor: pointer; transition: 0.2s; group; position: relative;
        }
        .track-row:hover { background: var(--bg-hover); }
        .track-row.active { background: rgba(255,255,255,0.1); }
        
        .t-num { width: 40px; font-size: 15px; color: var(--text-secondary); font-variant-numeric: tabular-nums; display: flex; align-items: center;}
        .t-icon-play { display: none; font-size: 18px; color: var(--text-primary); }
        .track-row:hover .t-num-text { display: none; }
        .track-row:hover .t-icon-play { display: block; }
        .track-row.active .t-num-text { color: var(--accent); }

        .t-art { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; margin-right: 16px; }
        .t-info { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .t-title { font-size: 16px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; transition: color 0.2s; }
        .track-row.active .t-title { color: var(--accent); }
        .t-artist { font-size: 14px; color: var(--text-secondary); }
        .t-time { font-size: 14px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

        /* --- BOTTOM PLAYER (Apple Glass Style) --- */
        .bottom-player {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
            background: var(--glass-bg); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%);
            border-top: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 50;
        }

        .player-left { display: flex; align-items: center; gap: 14px; width: 30%; cursor: pointer;}
        .player-cover { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .player-meta h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .player-meta p { font-size: 12px; color: var(--text-secondary); }

        .player-center { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 40%; }
        .controls { display: flex; align-items: center; gap: 24px; font-size: 20px; color: var(--text-secondary); margin-bottom: 8px;}
        .controls i { cursor: pointer; transition: 0.2s; }
        .controls i:hover { color: var(--text-primary); }
        .btn-play-small { width: 36px; height: 36px; background: var(--text-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 18px; transition: 0.2s; }
        .btn-play-small:hover { transform: scale(1.05); }

        .progress-bar { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 11px; color: var(--text-secondary); }
        .track-line { flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; position: relative; transition: 0.2s; }
        .track-line:hover { height: 6px; }
        .track-line:hover .fill-line { background: var(--accent); }
        .fill-line { width: 0%; height: 100%; background: var(--text-primary); border-radius: 2px; }

        .player-right { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 20px; font-size: 20px; color: var(--text-secondary); }
        .player-right i { cursor: pointer; transition: 0.2s; }
        .player-right i:hover, .player-right i.active { color: var(--text-primary); }
        .btn-lyrics { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; transition: 0.2s; }
        .btn-lyrics.active { background: var(--accent); color: #000; }

        /* ========================
           FULLSCREEN NOW PLAYING (SPLIT LAYOUT)
           ======================== */
        .now-playing-fs {
            position: fixed; inset: 0; z-index: 100;
            display: flex; transform: translateY(100%); opacity: 0; visibility: hidden;
            transition: transform 0.6s var(--spring), opacity 0.4s; overflow: hidden;
            background-color: var(--bg-main);
        }
        .now-playing-fs.active { transform: translateY(0); opacity: 1; visibility: visible; }

        /* Fondo borroso (Apple Style) */
        .np-bg {
            position: absolute; inset: -10%; width: 120%; height: 120%;
            object-fit: cover; filter: blur(90px) saturate(200%); opacity: 0.4; z-index: 0;
        }
        .np-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.2)); z-index: 1; }

        .btn-close-np {
            position: absolute; top: 40px; left: 40px; width: 44px; height: 44px;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
            cursor: pointer; z-index: 10; border: 1px solid var(--glass-border); transition: 0.2s;
        }
        .btn-close-np:hover { background: rgba(0,0,0,0.5); transform: scale(1.05); }

        /* Layout Dividido */
        .np-layout {
            position: relative; z-index: 2; width: 100%; height: 100vh;
            display: flex; padding: 60px; gap: 60px;
        }

        /* --- IZQUIERDA: PORTADA Y CONTROLES --- */
        .np-left {
            width: 45%; max-width: 500px; display: flex; flex-direction: column;
            justify-content: center; align-items: flex-start;
        }
        
        .np-cover {
            width: 100%; aspect-ratio: 1; border-radius: 12px; object-fit: cover;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); margin-bottom: 40px;
            transition: transform 0.5s var(--spring);
        }
        .now-playing-fs.active .np-cover { animation: scaleUp 0.8s var(--spring); }
        @keyframes scaleUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .np-meta { width: 100%; margin-bottom: 30px; }
        .np-meta h2 { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        .np-meta p { font-size: 18px; color: rgba(255,255,255,0.7); font-weight: 500; }

        .np-progress { width: 100%; margin-bottom: 30px; }
        .np-progress .track-line { height: 6px; background: rgba(255,255,255,0.2); }
        .np-progress .fill-line { background: #fff; }
        .np-progress .progress-bar { font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; }

        .np-controls {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; font-size: 28px; color: rgba(255,255,255,0.8);
        }
        .np-controls i { cursor: pointer; transition: 0.2s; }
        .np-controls i:hover { color: #fff; transform: scale(1.1); }
        .np-play {
            width: 72px; height: 72px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000; font-size: 32px; transition: 0.2s;
        }
        .np-play:hover { transform: scale(1.05); background: var(--accent); }

        /* --- DERECHA: LETRAS (APPLE STYLE) --- */
        .np-right {
            flex: 1; overflow-y: auto; scroll-behavior: smooth; padding: 20vh 0;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }
        .np-right::-webkit-scrollbar { display: none; }

        .lyric-line {
            font-size: 44px; font-weight: 800; line-height: 1.3; letter-spacing: -1px;
            margin-bottom: 24px; cursor: pointer; transition: all 0.5s var(--spring);
            opacity: 0.3; filter: blur(3px); transform: scale(0.95); transform-origin: left center;
        }
        .lyric-line.active {
            opacity: 1; filter: blur(0); transform: scale(1);
            background: linear-gradient(to right, #fff, rgba(255,255,255,0.8));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .lyric-line.passed { opacity: 0.15; filter: blur(1px); }
        .lyric-line:hover { opacity: 0.8; filter: blur(0); }
    </style>
</head>
<body>

    <!-- SIDEBAR (Navegación base) -->
    <aside class="sidebar">
        <div class="nav-box">
            <div class="nav-item active"><i class="ph-fill ph-house"></i> Home</div>
            <div class="nav-item"><i class="ph-light ph-magnifying-glass"></i> Search</div>
        </div>
        <div class="nav-box" style="flex:1;">
            <div class="nav-item"><i class="ph-light ph-books"></i> Your Library</div>
            <div class="nav-item" style="margin-top: 20px;"><i class="ph-fill ph-plus-square"></i> Create Playlist</div>
            <div class="nav-item"><i class="ph-fill ph-heart"></i> Liked Songs</div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-wrapper">
        <main class="main-content">
            <!-- Hero -->
            <div class="hero">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="hero-img">
                <div class="hero-info">
                    <div class="hero-label"><i class="ph-fill ph-check-circle" style="color:#4cb3ff;"></i> Verified Artist</div>
                    <h1>Yan Block</h1>
                    <p style="color: var(--text-secondary); font-weight:500;">1,240,500 monthly listeners</p>
                </div>
            </div>

            <!-- Controles de Lista -->
            <div class="action-bar">
                <div class="btn-play-big" onclick="playSong(0)"><i class="ph-fill ph-play"></i></div>
                <i class="ph-light ph-shuffle" style="font-size:32px; color:var(--text-secondary); cursor:pointer;"></i>
                <button style="border:1px solid var(--text-secondary); background:transparent; color:#fff; padding:6px 16px; border-radius:20px; font-family:inherit; font-weight:600; cursor:pointer;">Follow</button>
            </div>

            <!-- Tracks -->
            <div class="tracklist">
                <div class="track-header">
                    <div style="width:40px;">#</div>
                    <div style="flex:1;">Title</div>
                    <div style="width:50px; text-align:right;"><i class="ph-light ph-clock"></i></div>
                </div>
                <div id="track-list-container">
                    <!-- Tracks inyectados JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- BOTTOM PLAYER -->
    <div class="bottom-player">
        <div class="player-left" onclick="toggleNP()">
            <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="player-cover" id="btm-cover">
            <div class="player-meta">
                <h4 id="btm-title">Select Track</h4>
                <p id="btm-artist">Yan Block</p>
            </div>
        </div>

        <div class="player-center">
            <div class="controls">
                <i class="ph-light ph-shuffle"></i>
                <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                <div class="btn-play-small" onclick="togglePlay()"><i class="ph-fill ph-play" id="btm-play-icon"></i></div>
                <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
                <i class="ph-light ph-repeat"></i>
            </div>
            <div class="progress-bar">
                <span id="btm-time-curr">0:00</span>
                <div class="track-line" onclick="seek(event, this)"><div class="fill-line" id="btm-fill"></div></div>
                <span id="btm-time-tot">0:00</span>
            </div>
        </div>

        <div class="player-right">
            <div class="btn-lyrics" onclick="toggleNP()"><i class="ph-fill ph-microphone-stage" id="icon-lyrics"></i></div>
            <i class="ph-light ph-queue"></i>
            <i class="ph-light ph-speaker-high"></i>
        </div>
    </div>

    <!-- PANTALLA FULLSCREEN (NOW PLAYING / LYRICS) -->
    <div class="now-playing-fs" id="np-screen">
        <img src="" class="np-bg" id="fs-bg">
        <div class="np-overlay"></div>
        
        <div class="btn-close-np" onclick="toggleNP()"><i class="ph-bold ph-caret-down"></i></div>

        <div class="np-layout">
            <!-- Izquierda: Portada y Controles -->
            <div class="np-left">
                <img src="https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg" class="np-cover" id="fs-cover">
                
                <div class="np-meta">
                    <h2 id="fs-title">Not Playing</h2>
                    <p id="fs-artist">Yan Block</p>
                </div>

                <div class="np-progress">
                    <div class="progress-bar">
                        <span id="fs-time-curr">0:00</span>
                        <div class="track-line" onclick="seek(event, this)"><div class="fill-line" id="fs-fill"></div></div>
                        <span id="fs-time-tot">0:00</span>
                    </div>
                </div>

                <div class="np-controls">
                    <i class="ph-light ph-shuffle"></i>
                    <i class="ph-fill ph-skip-back" onclick="prevSong()"></i>
                    <div class="np-play" onclick="togglePlay()"><i class="ph-fill ph-play" id="fs-play-icon"></i></div>
                    <i class="ph-fill ph-skip-forward" onclick="nextSong()"></i>
                    <i class="ph-light ph-repeat"></i>
                </div>
            </div>

            <!-- Derecha: Letras -->
            <div class="np-right" id="lyrics-scroll">
                <div id="lyrics-content"></div>
            </div>
        </div>
    </div>

    <script>
        const imageArtistUrl = "https://res.cloudinary.com/ddcbl694n/image/upload/v1776007400/Yan_Block_u0inwd.jpg";
        const cancionesData =[
            { title: "YOGURCITO REMIX", artist: "Blessd, Anuel AA, Yan Block...", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007457/YOGURCITO_REMIX_Blessd_Anuel_AA_Yan_Block_Luar_La_L_Kris_R._ROA_ocxlgl.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/YOGURCITO_REMIX_wwua9w.lrc" },
            { title: "TALENTO", artist: "Yan Block, Panda Black", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007391/TALENTO_Yan_Block_Panda_Black_r4ugu2.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/TALENTO_s4qtf2.lrc" },
            { title: "444", artist: "Yan Block, Panda Black", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007376/444_Yan_Block_Panda_Black_upxnup.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/444_ie7e6d.lrc" },
            { title: "YO SE", artist: "Yan Block, TORRRES", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007440/YO_SE_Yan_Block_TORRRES_i8ianx.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/YO_SE_hiutok.lrc" },
            { title: "444 - REMIX", artist: "Yan Block, De La Rose, Hades66...", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007452/444_-_REMIX_Yan_Block_De_La_Rose_Hades66_%C3%91engo_Flow_lshzau.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/444_-_REMIX_t2qoid.lrc" },
            { title: "111", artist: "Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007415/111_Yan_Block_h3poua.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/111_adlg6f.lrc" },
            { title: "WYA REMIX RED", artist: "J Abdiel, De La Rose, Yan Block...", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007447/WYA_REMIX_RED_J_Abdiel_De_La_Rose_Yan_Block_iZaak_Jay_Wheeler_mvfmrz.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/WYA_REMIX_RED_ic1sdd.lrc" },
            { title: "SECUESTRO", artist: "Slayter, Yan Block, NTG", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007396/SECUESTRO_Slayter_Yan_Block_NTG_bqszzh.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/SECUESTRO_m4absd.lrc" },
            { title: "VACILE", artist: "Yan Block", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007402/VACILE_Yan_Block_ytkcf9.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009576/VACILE_qxdqxq.lrc" },
            { title: "EXPRESSO MARTINI", artist: "Rauw Alejandro, Marconi Impara...", url: "https://res.cloudinary.com/ddcbl694n/video/upload/v1776007397/EXPRESSO_MARTINI_Rauw_Alejandro_Marconi_Impara_Yan_Block_ac5x3j.mp3", lrc: "https://res.cloudinary.com/ddcbl694n/raw/upload/v1776009575/EXPRESSO_MARTINI_nl8yas.lrc" }
        ];

        let audio1 = new Audio();
        let audio2 = new Audio();
        let activeAudio = audio1;
        let fadingAudio = null;
        let isCrossfading = false;
        const CROSSFADE_DURATION = 12;

        let currentPlayingIndex = -1;
        let isNPOpen = false;
        let parsedLyrics =[]; 
        let activeLyricIndex = -1;

        function init() {
            const listEl = document.getElementById('track-list-container');
            cancionesData.forEach((song, i) => {
                song.cover = imageArtistUrl;
                const div = document.createElement('div');
                div.className = 'track-row';
                div.id = `track-${i}`;
                div.innerHTML = `
                    <div class="t-num">
                        <span class="t-num-text">${i + 1}</span>
                        <i class="ph-fill ph-play t-icon-play"></i>
                    </div>
                    <img src="${imageArtistUrl}" id="art-${i}" class="t-art">
                    <div class="t-info">
                        <div class="t-title">${song.title}</div>
                        <div class="t-artist">${song.artist}</div>
                    </div>
                    <div class="t-time" id="dur-${i}">--:--</div>
                `;
                div.onclick = () => playSong(i);
                listEl.appendChild(div);

                jsmediatags.read(song.url, {
                    onSuccess: function(tag) {
                        if (tag.tags.picture) {
                            let b64 = "";
                            for (let j = 0; j < tag.tags.picture.data.length; j++) b64 += String.fromCharCode(tag.tags.picture.data[j]);
                            const imgUrl = `data:${tag.tags.picture.format};base64,${window.btoa(b64)}`;
                            song.cover = imgUrl;
                            document.getElementById(`art-${i}`).src = imgUrl;
                            if(currentPlayingIndex === i) updateCovers(imgUrl);
                        }
                    }
                });
            });

            requestAnimationFrame(engineLoop);
        }

        function updateCovers(img) {
            document.getElementById('btm-cover').src = img;
            document.getElementById('fs-cover').src = img;
            document.getElementById('fs-bg').src = img;
        }

        async function playSong(idx) {
            isCrossfading = false;
            if(fadingAudio) { fadingAudio.pause(); fadingAudio.src = ""; fadingAudio = null; }
            activeAudio.pause();
            activeAudio.volume = 1;
            
            triggerUIForSong(idx);
            
            activeAudio.src = cancionesData[idx].url;
            activeAudio.play().catch(e=>console.log(e));
            setPlayIcon(true);
        }

        function triggerUIForSong(idx) {
            if(currentPlayingIndex !== -1) document.getElementById(`track-${currentPlayingIndex}`).classList.remove('active');
            document.getElementById(`track-${idx}`).classList.add('active');
            
            currentPlayingIndex = idx;
            activeLyricIndex = -1;
            const song = cancionesData[idx];

            updateCovers(song.cover);
            document.getElementById('btm-title').innerText = song.title;
            document.getElementById('btm-artist').innerText = song.artist;
            document.getElementById('fs-title').innerText = song.title;
            document.getElementById('fs-artist').innerText = song.artist;

            fetchLyrics(song.lrc);
        }

        function startCrossfade() {
            isCrossfading = true;
            fadingAudio = activeAudio;
            activeAudio = (activeAudio === audio1) ? audio2 : audio1;
            
            let nextIdx = (currentPlayingIndex + 1) % cancionesData.length;
            triggerUIForSong(nextIdx);
            
            activeAudio.src = cancionesData[nextIdx].url;
            activeAudio.volume = 0;
            activeAudio.play().catch(e=>console.log(e));
        }

        function engineLoop() {
            if(activeAudio.duration && !isNaN(activeAudio.duration)) {
                const curr = activeAudio.currentTime;
                const dur = activeAudio.duration;
                const remaining = dur - curr;
                
                if (remaining <= CROSSFADE_DURATION && !isCrossfading && remaining > 0.5) {
                    startCrossfade();
                }

                if (isCrossfading && fadingAudio && fadingAudio.duration) {
                    const fadeRemaining = fadingAudio.duration - fadingAudio.currentTime;
                    let ratio = fadeRemaining / CROSSFADE_DURATION;
                    if(ratio < 0) ratio = 0; if(ratio > 1) ratio = 1;
                    
                    fadingAudio.volume = ratio;         
                    activeAudio.volume = 1 - ratio;     

                    if (ratio <= 0 || fadingAudio.ended) {
                        fadingAudio.pause(); fadingAudio.src = "";
                        isCrossfading = false; activeAudio.volume = 1;
                    }
                }
                
                const pct = (curr / dur) * 100;
                document.getElementById('btm-fill').style.width = `${pct}%`;
                document.getElementById('fs-fill').style.width = `${pct}%`;
                
                let cStr = fmt(curr); let dStr = fmt(dur);
                document.getElementById('btm-time-curr').innerText = cStr;
                document.getElementById('btm-time-tot').innerText = dStr;
                document.getElementById('fs-time-curr').innerText = cStr;
                document.getElementById('fs-time-tot').innerText = dStr;
                if(document.getElementById(`dur-${currentPlayingIndex}`)) {
                    document.getElementById(`dur-${currentPlayingIndex}`).innerText = dStr;
                }
                
                if(isNPOpen) updateKaraoke(curr);
            }
            requestAnimationFrame(engineLoop);
        }

        async function fetchLyrics(url) {
            const container = document.getElementById('lyrics-content');
            container.innerHTML = "<p style='color:rgba(255,255,255,0.3); font-size:24px; font-weight:600;'>Loading lyrics...</p>";
            parsedLyrics =[];

            try {
                const res = await fetch(url);
                const text = await res.text();
                const lines = text.split('\n');
                
                lines.forEach(line => {
                    const match = line.match(/\[(\d{2,}):(\d{2}(?:\.\d{1,3})?)\](.*)/);
                    if(match) {
                        parsedLyrics.push({ 
                            time: (parseInt(match[1]) * 60) + parseFloat(match[2]), 
                            text: match[3].trim(), element: null 
                        });
                    }
                });
                
                container.innerHTML = "";
                if(parsedLyrics.length === 0) throw new Error();

                parsedLyrics.forEach(lyric => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line';
                    div.innerText = lyric.text || "♪";
                    div.onclick = () => { activeAudio.currentTime = lyric.time; activeAudio.play(); setPlayIcon(true); };
                    lyric.element = div;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<p style='color:rgba(255,255,255,0.3); font-size:24px; font-weight:600;'>Looks like we don't have the lyrics for this song.</p>";
            }
        }

        function updateKaraoke(currTime) {
            if(!parsedLyrics.length) return;

            let newIdx = -1;
            for(let i=0; i<parsedLyrics.length; i++) {
                if(currTime >= parsedLyrics[i].time) newIdx = i; else break;
            }

            if(newIdx !== activeLyricIndex) {
                parsedLyrics.forEach((lyric, i) => {
                    if(!lyric.element) return;
                    if(i < newIdx) {
                        lyric.element.className = 'lyric-line passed';
                    } else if(i > newIdx) {
                        lyric.element.className = 'lyric-line';
                    } else {
                        lyric.element.className = 'lyric-line active';
                        const scrollEl = document.getElementById('lyrics-scroll');
                        scrollEl.scrollTo({ top: lyric.element.offsetTop - (scrollEl.clientHeight/2) + (lyric.element.clientHeight/2), behavior: 'smooth' });
                    }
                });
                activeLyricIndex = newIdx;
            }
        }

        function togglePlay() {
            if(!activeAudio.src) return playSong(0);
            if(activeAudio.paused) { activeAudio.play(); setPlayIcon(true); } 
            else { activeAudio.pause(); setPlayIcon(false); }
        }

        function nextSong() { playSong((currentPlayingIndex + 1) % cancionesData.length); }
        function prevSong() { playSong((currentPlayingIndex - 1 + cancionesData.length) % cancionesData.length); }

        function setPlayIcon(playing) {
            document.getElementById('btm-play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
            document.getElementById('fs-play-icon').className = playing ? "ph-fill ph-pause" : "ph-fill ph-play";
        }

        function seek(e, el) {
            if(!activeAudio.duration) return;
            const rect = el.getBoundingClientRect();
            activeAudio.currentTime = ((e.clientX - rect.left) / rect.width) * activeAudio.duration;
        }

        function toggleNP() {
            isNPOpen = !isNPOpen;
            document.getElementById('np-screen').classList.toggle('active');
            
            // Botón de lyrics en el player de abajo
            const btn = document.querySelector('.btn-lyrics');
            if(isNPOpen) btn.classList.add('active'); else btn.classList.remove('active');

            if(isNPOpen && activeAudio.currentTime > 0) setTimeout(() => updateKaraoke(activeAudio.currentTime), 100);
        }

        function fmt(s) { return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

        window.onload = init;
    </script>
</body>
</html>
