<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Player</title>
    
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --bg-glass: rgba(0, 0, 0, 0.2);
            --track-color: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #050505;
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Efecto de cristal multicapa */
        .background-blur {
            position: absolute;
            top: -20%; left: -20%; right: -20%; bottom: -20%;
            background-image: url('https://4nemxki6k8.ucarecd.net/a2435185-eada-4f17-9a8b-41889c40fbe3/pieza.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(120px) saturate(250%) brightness(0.6);
            z-index: -2;
            transform: translateZ(0); 
            animation: pulseBg 15s infinite alternate ease-in-out;
        }

        @keyframes pulseBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .background-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 50%, transparent 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .player-container {
            display: flex;
            gap: 60px;
            width: 95%;
            max-width: 1400px;
            height: 88vh;
            padding: 50px;
            background: var(--bg-glass);
            border-radius: 40px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
        }

        /* --- SECCIÓN IZQUIERDA: REPRODUCTOR --- */
        .now-playing {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 450px;
        }

        .artwork-wrapper {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,255,255,0.1);
            margin-bottom: 35px;
            position: relative;
        }

        .artwork-wrapper img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: block;
        }

        .artwork-wrapper img:not(.playing) {
            transform: scale(0.9);
            filter: brightness(0.7);
        }

        .track-info h1 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .track-info h2 {
            font-size: 22px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Barras de progreso y volumen */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--track-color);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            transition: height 0.2s;
            margin-top: 30px;
        }

        input[type="range"]:hover { height: 8px; }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            height: 0;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            transition: width 0.2s, height 0.2s;
        }

        input[type="range"]:hover::-webkit-slider-thumb {
            width: 18px;
            height: 18px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 12px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* Controles */
        .controls-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn.secondary {
            font-size: 26px;
            color: var(--text-secondary);
        }

        .icon-btn:hover { color: #fff; transform: scale(1.1); }
        .icon-btn:active, .play-btn:active { transform: scale(0.85); }

        .play-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .play-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        /* --- SECCIÓN DERECHA: LETRAS ÚNICAS --- */
        .lyrics-container {
            flex: 1.5;
            position: relative;
            /* Máscara más fuerte para difuminar los bordes superior e inferior */
            mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
        }

        .lyrics-scroll {
            height: 100%;
            overflow-y: auto;
            padding: 45vh 60px; /* Mucho padding para centrar siempre la línea */
            scroll-behavior: smooth;
            perspective: 1200px; /* Profundidad 3D para las letras */
        }

        .lyrics-scroll::-webkit-scrollbar { display: none; }

        .lyric-line {
            position: relative;
            font-size: 42px;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 40px;
            /* Físicas de rebote (bounce) para la transición */
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left center;
            cursor: pointer;
            
            /* Estado inactivo: difuminado, pequeño e inclinado hacia atrás */
            filter: blur(5px);
            transform: scale(0.8) rotateX(25deg);
            line-height: 1.2;
            letter-spacing: -1px;
        }

        .lyric-line:hover {
            color: rgba(255, 255, 255, 0.4);
            filter: blur(2px);
            transform: scale(0.9) rotateX(10deg);
        }

        /* --- ESTADO ACTIVO (MAGIA VISUAL) --- */
        .lyric-line.active {
            color: #ffffff;
            /* Escala, se endereza y se mueve hacia la derecha */
            transform: scale(1.15) rotateX(0deg) translateX(25px);
            filter: blur(0px);
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.5); /* Resplandor */
        }

        /* Indicador visual luminoso para la línea activa */
        .lyric-line::before {
            content: '';
            position: absolute;
            left: -35px;
            top: 15%;
            height: 70%;
            width: 6px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px #fff;
            opacity: 0;
            transform: scaleY(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lyric-line.active::before {
            opacity: 1;
            transform: scaleY(1);
        }

        @media (max-width: 1000px) {
            .player-container { flex-direction: column; height: 100vh; overflow-y: auto; border-radius: 0; padding: 30px; gap: 40px;}
            .lyrics-container { min-height: 60vh; }
            .lyric-line { font-size: 32px; }
            .lyric-line.active { transform: scale(1.1) rotateX(0deg) translateX(15px); }
        }
    </style>
</head>
<body>

    <div class="background-blur" id="bgBlur"></div>
    <div class="background-overlay"></div>

    <main class="player-container">
        <!-- Reproductor -->
        <section class="now-playing">
            <div class="artwork-wrapper">
                <img id="artwork" src="https://4nemxki6k8.ucarecd.net/a2435185-eada-4f17-9a8b-41889c40fbe3/pieza.jpg" alt="Portada">
            </div>
            
            <div class="track-info">
                <h1 id="trackTitle">Pieza Exhibicion</h1>
                <h2 id="trackArtist">Luar La L, ROA & Blessd</h2>
            </div>

            <div class="progress-container">
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">-:--</span>
                </div>
            </div>

            <div class="controls-main">
                <button class="icon-btn secondary"><i class="ph ph-shuffle"></i></button>
                <button id="prevBtn" class="icon-btn"><i class="ph-fill ph-skip-back"></i></button>
                <button id="playPauseBtn" class="play-btn"><i class="ph-fill ph-play"></i></button>
                <button id="nextBtn" class="icon-btn"><i class="ph-fill ph-skip-forward"></i></button>
                <button class="icon-btn secondary"><i class="ph ph-repeat"></i></button>
            </div>
        </section>

        <!-- Letras Únicas -->
        <section class="lyrics-container">
            <div id="lyricsContent" class="lyrics-scroll">
                <!-- Letras inyectadas -->
            </div>
        </section>
    </main>

    <script>
        // Configuración Velvet Player
        const CROSSFADE_DURATION = 12; 
        const audioUrl = "https://4nemxki6k8.ucarecd.net/cc7f990d-914f-4836-b185-01d6bca0cc14/PiezaExhibicin_spotdownorg.mp3";
        const ttmlUrl = "https://4nemxki6k8.ucarecd.net/491cff52-7f8e-4971-acaa-c9f64d014686/PiezaExhibicin_spotdownorg.ttml";

        const audio = new Audio(audioUrl);
        let lyricsData = [];
        let isCrossfading = false;

        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const artwork = document.getElementById('artwork');
        const lyricsContent = document.getElementById('lyricsContent');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playPauseBtn.innerHTML = '<i class="ph-fill ph-pause"></i>';
                artwork.classList.add('playing');
            } else {
                audio.pause();
                playPauseBtn.innerHTML = '<i class="ph-fill ph-play"></i>';
                artwork.classList.remove('playing');
            }
        }

        function updateProgressBar(element, percentage) {
            element.value = percentage;
            element.style.background = `linear-gradient(to right, #fff ${percentage}%, rgba(255,255,255,0.2) ${percentage}%)`;
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        function handleCrossfade(currentTime, duration) {
            const timeLeft = duration - currentTime;
            if (timeLeft <= CROSSFADE_DURATION && timeLeft > 0) {
                isCrossfading = true;
                const fadeMultiplier = timeLeft / CROSSFADE_DURATION;
                audio.volume = Math.max(0, 1 * fadeMultiplier);
            } else if (isCrossfading && timeLeft > CROSSFADE_DURATION) {
                isCrossfading = false;
                audio.volume = 1;
            }
        }

        function parseTTMLTime(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':');
            if (parts.length === 3) return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
            if (parts.length === 2) return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
            return parseFloat(timeStr); 
        }

        async function fetchLyrics() {
            try {
                const response = await fetch(ttmlUrl);
                const text = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(text, "text/xml");
                const pTags = xmlDoc.getElementsByTagName("p");

                lyricsContent.innerHTML = "";
                lyricsData = Array.from(pTags).map((p, index) => {
                    const begin = parseTTMLTime(p.getAttribute("begin"));
                    const textContent = p.textContent.trim();
                    
                    if (textContent) {
                        const pElement = document.createElement("p");
                        pElement.className = "lyric-line";
                        pElement.id = `lyric-${index}`;
                        pElement.innerText = textContent;
                        
                        pElement.addEventListener("click", () => {
                            audio.currentTime = begin;
                            if(audio.paused) togglePlay();
                        });

                        lyricsContent.appendChild(pElement);
                        return { time: begin, index: index, element: pElement };
                    }
                    return null;
                }).filter(item => item !== null);

            } catch (error) {
                console.error("Error al cargar TTML:", error);
            }
        }

        function updateLyrics(currentTime) {
            let activeIndex = -1;
            for (let i = 0; i < lyricsData.length; i++) {
                if (currentTime + 0.3 >= lyricsData[i].time) activeIndex = i;
                else break;
            }

            if (activeIndex !== -1) {
                const activeItem = lyricsData[activeIndex];
                if (!activeItem.element.classList.contains('active')) {
                    document.querySelectorAll('.lyric-line.active').forEach(el => el.classList.remove('active'));
                    activeItem.element.classList.add('active');
                    
                    // Asegura que la línea siempre quede exactamente en el centro de la vista
                    activeItem.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        audio.addEventListener('loadedmetadata', () => {
            durationEl.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            updateProgressBar(progressBar, progress);
            currentTimeEl.innerText = formatTime(audio.currentTime);
            
            updateLyrics(audio.currentTime);
            handleCrossfade(audio.currentTime, audio.duration);
        });

        progressBar.addEventListener('input', (e) => {
            const seekTime = (e.target.value / 100) * audio.duration;
            audio.currentTime = seekTime;
            updateProgressBar(progressBar, e.target.value);
        });

        fetchLyrics();
    </script>
</body>
</html>
