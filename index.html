<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Apple Music — Modo Oculto (AMLL Engine Oficial)</title>

  <!-- Tipografía Apple SF Pro / Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Estilos oficiales de AMLL Core (Apple Music Like Lyrics) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@applemusic-like-lyrics/core@0.5.2/dist/style.css">

  <!-- Cargador de módulos AMLL Core -->
  <script>
    window.__AMLLResolver = null;
    window.__AMLLReady = new Promise((resolve) => {
      window.__AMLLResolver = resolve;
    });
  </script>
  <script type="module">
    try {
      const { LyricPlayer } = await import("https://esm.sh/@applemusic-like-lyrics/core@0.5.2");
      if (window.__AMLLResolver) window.__AMLLResolver(LyricPlayer);
      else window.__AMLLReady = Promise.resolve(LyricPlayer);
    } catch (e) {
      const { LyricPlayer } = await import("https://esm.sh/@applemusic-like-lyrics/core@0.5.1");
      if (window.__AMLLResolver) window.__AMLLResolver(LyricPlayer);
      else window.__AMLLReady = Promise.resolve(LyricPlayer);
    }
  </script>

  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", "Helvetica Neue", sans-serif;
      --text-main: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.70);
      --text-muted: rgba(255, 255, 255, 0.40);

      /* Colores extraídos dinámicamente de la portada (Valores iniciales calculados de la portada) */
      --cover-c1: rgb(24, 42, 68);
      --cover-c2: rgb(52, 84, 122);
      --cover-c3: rgb(15, 25, 42);
      --cover-c4: rgb(76, 110, 152);
      --cover-c5: rgb(35, 58, 86);
      --app-bg-dark: #080d14;
      --accent-color: var(--cover-c2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--app-bg-dark);
      font-family: var(--font-family);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      transition: background-color 1s ease;
    }

    /* ============================================================
       FONDO FLUIDO COMPUESTO EXCLUSIVAMENTE POR LA PORTADA
       ============================================================ */
    .beautifier-bg {
      position: fixed;
      inset: -30%;
      width: 160%;
      height: 160%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(95px) saturate(180%) brightness(0.65);
      transform-origin: center center;
      transition: opacity 1.2s ease;
    }

    .bg-layer-1 {
      animation: ambientDrift1 34s infinite alternate ease-in-out;
      opacity: 0.85;
    }

    .bg-layer-2 {
      animation: ambientDrift2 48s infinite alternate ease-in-out;
      mix-blend-mode: color-dodge;
      opacity: 0.45;
      filter: blur(130px) saturate(210%) brightness(0.7);
    }

    /* Orbes ambientales que usan ÚNICAMENTE los colores extraídos de la portada */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      filter: blur(85px);
      will-change: transform;
      transition: background 1.5s ease;
    }

    .bg-orb-1 {
      width: 60vw;
      height: 60vw;
      top: -10%;
      left: -5%;
      background: radial-gradient(circle, rgba(52, 84, 122, 0.45) 0%, transparent 70%);
      animation: orbFloat1 26s infinite alternate ease-in-out;
    }

    .bg-orb-2 {
      width: 65vw;
      height: 65vw;
      bottom: -15%;
      right: -10%;
      background: radial-gradient(circle, rgba(24, 42, 68, 0.55) 0%, transparent 70%);
      animation: orbFloat2 32s infinite alternate ease-in-out;
    }

    .bg-orb-3 {
      width: 50vw;
      height: 50vw;
      top: 30%;
      right: 25%;
      background: radial-gradient(circle, rgba(76, 110, 152, 0.35) 0%, transparent 70%);
      animation: orbFloat3 38s infinite alternate ease-in-out;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: 
        radial-gradient(circle at 45% 45%, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.78) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.3) 0%, transparent 45%, rgba(0,0,0,0.75) 100%);
    }

    body.is-paused .bg-layer,
    body.is-paused .bg-orb {
      animation-play-state: paused !important;
    }

    @keyframes ambientDrift1 {
      0% { transform: scale(1.2) translate(-3%, -2%) rotate(0deg); }
      50% { transform: scale(1.36) translate(4%, 3%) rotate(4deg); }
      100% { transform: scale(1.22) translate(-2%, 4%) rotate(-3deg); }
    }

    @keyframes ambientDrift2 {
      0% { transform: scale(1.38) translate(4%, 3%) rotate(0deg); }
      50% { transform: scale(1.18) translate(-4%, -3%) rotate(-5deg); }
      100% { transform: scale(1.35) translate(2%, -4%) rotate(3deg); }
    }

    @keyframes orbFloat1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(15vw, 12vh) scale(1.25); }
    }

    @keyframes orbFloat2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-18vw, -15vh) scale(1.2); }
    }

    @keyframes orbFloat3 {
      0% { transform: translate(0, 0) scale(0.9); }
      100% { transform: translate(-10vw, 18vh) scale(1.3); }
    }

    /* ============================================================
       CONTENEDOR APPLE MUSIC DESKTOP
       ============================================================ */
    .apple-player-app {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    /* Barra Superior macOS */
    .top-mac-bar {
      height: 52px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    .mac-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.15s;
    }
    .mac-dot:hover { opacity: 1; transform: scale(1.1); }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .now-playing-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(25px);
    }

    .apple-music-logo {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .icon-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ============================================================
       COLUMNA IZQ: PORTADA Y CONTROLES | COLUMNA DER: AMLL LYRICS
       ============================================================ */
    .player-main-content {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(360px, 460px) 1fr;
      height: calc(100vh - 52px);
      padding: clamp(24px, 3.5vh, 48px) clamp(32px, 4vw, 72px);
      gap: clamp(32px, 4vw, 70px);
      align-items: center;
      max-width: 1750px;
      margin: 0 auto;
      width: 100%;
      overflow: hidden;
    }

    .left-player-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
    }

    .cover-wrapper {
      position: relative;
      width: min(100%, 360px);
      aspect-ratio: 1 / 1;
      margin-bottom: 26px;
      border-radius: 20px;
      box-shadow: 
        0 24px 60px -10px rgba(0, 0, 0, 0.75),
        0 10px 25px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.16);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.45s ease;
      cursor: pointer;
      overflow: hidden;
    }

    .cover-wrapper:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 
        0 30px 75px -10px rgba(0, 0, 0, 0.85),
        0 14px 30px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.25);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .track-details {
      width: 100%;
      margin-bottom: 20px;
    }

    .track-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .track-title {
      font-size: clamp(22px, 2.2vw, 28px);
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lossless-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .track-artist {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* Barra de Progreso */
    .scrubber-container {
      width: 100%;
      margin-bottom: 18px;
    }

    .progress-bar-rail {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .progress-bar-rail:hover {
      height: 8px;
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: #ffffff;
      border-radius: 10px;
      pointer-events: none;
    }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) scale(0);
      width: 13px;
      height: 13px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .progress-bar-rail:hover .progress-thumb {
      transform: translateY(-50%) scale(1);
    }

    .time-indicators {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .playback-controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .play-pause-circle {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #ffffff;
      color: #0d0e12;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.18s cubic-bezier(0.2, 0, 0.1, 1), background-color 0.2s;
    }

    .play-pause-circle:hover {
      transform: scale(1.08);
      background: #f5f5f7;
    }

    .play-pause-circle svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .ctrl-secondary {
      color: rgba(255, 255, 255, 0.75);
    }
    .ctrl-secondary:hover {
      color: #ffffff;
    }
    .ctrl-secondary.active {
      color: #ffffff;
    }

    .bottom-accessories {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .volume-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .volume-rail {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .volume-rail:hover {
      height: 6px;
    }

    .volume-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 80%;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      pointer-events: none;
    }

    /* ============================================================
       MOTOR OFICIAL DE LETRAS AMLL (amll-dev / tool.amll.dev)
       ============================================================ */
    .right-lyrics-panel {
      position: relative;
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      /* Máscara de desvanecimiento Apple Music */
      mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 10%, 
        rgba(0, 0, 0, 1) 88%, 
        transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, 
        transparent 0%, 
        rgba(0, 0, 0, 1) 10%, 
        rgba(0, 0, 0, 1) 88%, 
        transparent 100%);
    }

    #lyricsStage {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Ajustes Oficiales de Tipografía y Relleno AMLL */
    #lyricsStage .amll-lyric-player {
      --amll-lp-color: rgba(255, 255, 255, 0.38) !important;
      --amll-lp-active-color: #ffffff !important;
      --amll-lp-font-size: clamp(28px, 2.7vw, 48px) !important;
      --amll-lp-hover-bg-color: rgba(255, 255, 255, 0.08);
      --amll-lp-bg-color: transparent !important;
      font-weight: 800 !important;
      letter-spacing: -0.025em;
      line-height: 1.38;
      width: 100%;
      height: 100%;
    }

    /* Relleno blanco brillante en las palabras activas */
    #lyricsStage .amll-lyric-player .amll-lyric-word {
      color: inherit;
      transition: color 0.12s ease, text-shadow 0.2s ease;
    }

    #lyricsStage .amll-lyric-player .amll-lyric-word.active,
    #lyricsStage .amll-lyric-player .amll-lyric-word[data-active="true"],
    #lyricsStage .amll-lyric-player .amll-lyric-line.active {
      color: #ffffff !important;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.65);
    }

    #lyricsStage .amll-lyric-player .amll-lyric-line {
      margin-bottom: clamp(18px, 2.4vh, 32px) !important;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease, filter 0.35s ease;
    }

    .lyrics-loader-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 20px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 950px) {
      .player-main-content {
        grid-template-columns: 1fr;
        height: auto;
        overflow-y: auto;
        padding: 24px;
        gap: 28px;
      }
      .left-player-panel {
        max-width: 100%;
      }
      .cover-wrapper {
        max-width: 240px;
        margin-bottom: 20px;
      }
      .right-lyrics-panel {
        height: 60vh;
      }
      #lyricsStage .amll-lyric-player {
        --amll-lp-font-size: 24px !important;
      }
    }
  </style>
</head>
<body>

  <!-- ELEMENTO DE AUDIO NATIVO -->
  <audio id="audioElement" preload="metadata" crossorigin="anonymous">
    <source src="https://file.garden/aqbkhK4DJSCL_vig/Yan%20Block%20-%20Modo%20Oculto%20(Video%20Oficial)%20-%20Yan%20Block%20(youtube).mp3" type="audio/mpeg">
  </audio>

  <!-- FONDO CONFORMADO 100% POR LA PORTADA -->
  <div class="beautifier-bg" id="beautifierBg">
    <div class="bg-layer bg-layer-1" id="bgLayer1" style="background-image: url('https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg');"></div>
    <div class="bg-layer bg-layer-2" id="bgLayer2" style="background-image: url('https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg');"></div>
    <div class="bg-orb bg-orb-1" id="bgOrb1"></div>
    <div class="bg-orb bg-orb-2" id="bgOrb2"></div>
    <div class="bg-orb bg-orb-3" id="bgOrb3"></div>
  </div>
  <div class="vignette-overlay"></div>

  <!-- APLICACIÓN APPLE MUSIC DESKTOP -->
  <div class="apple-player-app">

    <header class="top-mac-bar">
      <div class="mac-dots">
        <div class="mac-dot dot-red" title="Cerrar"></div>
        <div class="mac-dot dot-yellow" title="Minimizar"></div>
        <div class="mac-dot dot-green" id="zoomToggle" title="Pantalla Completa"></div>
      </div>

      <div class="now-playing-badge">
        <svg class="apple-music-logo" viewBox="0 0 170 170">
          <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.69-7.85-12-14.44-6.19-9.45-11-20.28-14.42-32.51-3.42-12.22-5.13-23.77-5.13-34.64 0-14.78 3.59-27.18 10.77-37.21 7.18-10.02 16.32-15.17 27.42-15.44 5.33 0 10.89 1.34 16.68 4.02 5.79 2.68 9.53 4.08 11.22 4.2 1.48-.13 5.43-1.6 11.85-4.42 6.42-2.82 12.02-4.14 16.8-3.95 12.7.74 22.84 5.4 30.42 13.98-11.08 6.72-16.51 16.03-16.29 27.93.22 9.57 3.96 17.58 11.22 24.03 7.26 6.45 15.79 10.08 25.59 10.89-2.12 6.52-4.68 13.11-7.69 19.78zM119.22 31.05c0-7.39 2.66-14.38 7.98-20.97 5.32-6.59 11.93-10.42 19.83-11.48.21 1.06.32 2.01.32 2.85 0 7.39-2.77 14.59-8.31 21.6-5.54 7.01-12.24 11.03-20.1 12.06-.21-1.38-.32-2.74-.32-4.06z"/>
        </svg>
        <span>Modo Oculto — Yan Block</span>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="fullScreenBtn" title="Pantalla completa (F)">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </header>

    <main class="player-main-content">

      <!-- PORTADA Y CONTROLES (IZQUIERDA) -->
      <section class="left-player-panel">
        <div class="cover-wrapper" id="coverContainer">
          <img class="cover-img" id="trackCover" src="https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg" alt="Portada" crossorigin="anonymous">
        </div>

        <div class="track-details">
          <div class="track-title-row">
            <h1 class="track-title">Modo Oculto</h1>
            <span class="lossless-pill">Lossless</span>
          </div>
          <div class="track-artist">Yan Block</div>
        </div>

        <div class="scrubber-container">
          <div class="progress-bar-rail" id="progressRail">
            <div class="progress-bar-fill" id="progressFill">
              <div class="progress-thumb"></div>
            </div>
          </div>
          <div class="time-indicators">
            <span id="currentTime">0:00</span>
            <span id="remainingTime">-0:00</span>
          </div>
        </div>

        <div class="playback-controls">
          <button class="icon-btn ctrl-secondary" id="shuffleBtn" title="Aleatorio">
            <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary" id="prevBtn" title="Retroceder 10s">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>

          <button class="play-pause-circle" id="playPauseBtn" title="Reproducir / Pausa (Espacio)">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary" id="nextBtn" title="Adelantar 10s">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>

          <button class="icon-btn ctrl-secondary active" id="repeatBtn" title="Repetir">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
          </button>
        </div>

        <div class="bottom-accessories">
          <div class="volume-box">
            <button class="icon-btn" id="volumeMuteBtn" title="Silenciar">
              <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <div class="volume-rail" id="volumeRail">
              <div class="volume-fill" id="volumeFill"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- LYRICS ENGINE OFICIAL AMLL (DERECHA) -->
      <section class="right-lyrics-panel" id="lyricsContainer">
        <div id="lyricsStage">
          <div class="lyrics-loader-msg">Cargando letras con motor AMLL...</div>
        </div>
      </section>

    </main>
  </div>

  <script>
    // URL DEL ARCHIVO TTML DE LA CANCIÓN
    const TTML_URL = "https://file.garden/aqbkhK4DJSCL_vig/Modo%20Oculto.ttml";
    const COVER_URL = "https://file.garden/aqbkhK4DJSCL_vig/MODO%20OCULTO.jpg";

    // Elementos del DOM
    const audio = document.getElementById('audioElement');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressRail = document.getElementById('progressRail');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const remainingTimeEl = document.getElementById('remainingTime');
    const lyricsStage = document.getElementById('lyricsStage');
    const fullScreenBtn = document.getElementById('fullScreenBtn');
    const zoomToggle = document.getElementById('zoomToggle');
    const volumeRail = document.getElementById('volumeRail');
    const volumeFill = document.getElementById('volumeFill');
    const volumeMuteBtn = document.getElementById('volumeMuteBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let isPlaying = false;
    let duration = 0;
    let lyricPlayer = null;
    let lastFrameMs = null;

    // ============================================================
    // 1. EXTRACTOR DINÁMICO DE COLORES EXCLUSIVO DE LA PORTADA
    // ============================================================
    function extractCoverPalette(imgUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const size = 64;
            canvas.width = size;
            canvas.height = size;
            ctx.drawImage(img, 0, 0, size, size);
            const data = ctx.getImageData(0, 0, size, size).data;

            const bins = new Map();
            for (let i = 0; i < data.length; i += 16) {
              const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
              if (a < 128) continue;
              
              const qr = (r >> 4) << 4;
              const qg = (g >> 4) << 4;
              const qb = (b >> 4) << 4;
              const key = (qr << 16) | (qg << 8) | qb;

              let bin = bins.get(key);
              if (!bin) {
                bin = { r: 0, g: 0, b: 0, count: 0 };
                bins.set(key, bin);
              }
              bin.r += r;
              bin.g += g;
              bin.b += b;
              bin.count++;
            }

            const clusters = Array.from(bins.values()).map(b => ({
              r: Math.round(b.r / b.count),
              g: Math.round(b.g / b.count),
              b: Math.round(b.b / b.count),
              count: b.count
            })).sort((a, b) => b.count - a.count);

            const palette = [clusters[0]];
            for (let i = 1; i < clusters.length && palette.length < 5; i++) {
              const c = clusters[i];
              const isDistinct = palette.every(p => Math.hypot(c.r - p.r, c.g - p.g, c.b - p.b) > 28);
              if (isDistinct) palette.push(c);
            }
            while (palette.length < 5) {
              palette.push(palette[palette.length - 1] || { r: 15, g: 25, b: 40 });
            }
            resolve(palette);
          } catch (e) {
            resolve([
              { r: 24, g: 42, b: 68 },
              { r: 52, g: 84, b: 122 },
              { r: 15, g: 25, b: 42 },
              { r: 76, g: 110, b: 152 },
              { r: 35, g: 58, b: 86 }
            ]);
          }
        };
        img.onerror = () => {
          resolve([
            { r: 24, g: 42, b: 68 },
            { r: 52, g: 84, b: 122 },
            { r: 15, g: 25, b: 42 },
            { r: 76, g: 110, b: 152 },
            { r: 35, g: 58, b: 86 }
          ]);
        };
        img.src = imgUrl;
      });
    }

    function applyCoverColors(palette) {
      const root = document.documentElement;
      const c1 = palette[0];
      const c2 = palette[1];
      const c3 = palette[2];
      const c4 = palette[3];
      const c5 = palette[4];

      root.style.setProperty('--cover-c1', `rgb(${c1.r}, ${c1.g}, ${c1.b})`);
      root.style.setProperty('--cover-c2', `rgb(${c2.r}, ${c2.g}, ${c2.b})`);
      root.style.setProperty('--cover-c3', `rgb(${c3.r}, ${c3.g}, ${c3.b})`);
      root.style.setProperty('--cover-c4', `rgb(${c4.r}, ${c4.g}, ${c4.b})`);
      root.style.setProperty('--cover-c5', `rgb(${c5.r}, ${c5.g}, ${c5.b})`);

      // Tono de fondo oscuro derivado matemáticamente de la portada
      const darkR = Math.max(5, Math.min(18, Math.round(c1.r * 0.08)));
      const darkG = Math.max(6, Math.min(20, Math.round(c1.g * 0.09)));
      const darkB = Math.max(8, Math.min(26, Math.round(c1.b * 0.12)));
      root.style.setProperty('--app-bg-dark', `rgb(${darkR}, ${darkG}, ${darkB})`);

      // Orbes animados alimentados exclusivamente por los colores extraídos
      document.getElementById('bgOrb1').style.background = `radial-gradient(circle, rgba(${c1.r}, ${c1.g}, ${c1.b}, 0.52) 0%, transparent 70%)`;
      document.getElementById('bgOrb2').style.background = `radial-gradient(circle, rgba(${c2.r}, ${c2.g}, ${c2.b}, 0.45) 0%, transparent 70%)`;
      document.getElementById('bgOrb3').style.background = `radial-gradient(circle, rgba(${c4.r}, ${c4.g}, ${c4.b}, 0.38) 0%, transparent 70%)`;
    }

    // ============================================================
    // 2. PARSER TTML CON ESPACIADO INTELIGENTE (AMLL SPEC)
    // ============================================================
    function parseTTMLTime(str) {
      if (!str) return 0;
      str = str.toString().trim();
      if (str.endsWith('ms')) return parseFloat(str.replace('ms', '')) / 1000;
      str = str.replace(/s$/, '');
      const parts = str.split(':');
      if (parts.length === 3) return parseInt(parts[0], 10) * 3600 + parseInt(parts[1], 10) * 60 + parseFloat(parts[2].replace(',', '.'));
      if (parts.length === 2) return parseInt(parts[0], 10) * 60 + parseFloat(parts[1].replace(',', '.'));
      return parseFloat(str.replace(',', '.')) || 0;
    }

    function parseTTMLToAMLL(xmlText) {
      const rawLines = [];
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");

      let pTags = xmlDoc.getElementsByTagNameNS ? xmlDoc.getElementsByTagNameNS('*', 'p') : [];
      if (pTags.length === 0) pTags = xmlDoc.getElementsByTagName('p');

      Array.from(pTags).forEach(p => {
        const beginAttr = p.getAttribute('begin') || p.getAttribute('itunes:begin') || p.getAttribute('t');
        if (!beginAttr) return;

        const pBegin = parseTTMLTime(beginAttr);
        const pEnd = p.getAttribute('end') || p.getAttribute('itunes:end') ? parseTTMLTime(p.getAttribute('end') || p.getAttribute('itunes:end')) : 0;

        let rawWords = [];
        Array.from(p.childNodes).forEach(node => {
          const localName = node.localName ? node.localName.toLowerCase() : (node.nodeName ? node.nodeName.toLowerCase() : '');

          if (node.nodeType === Node.TEXT_NODE) {
            let val = node.nodeValue || '';
            val = val.replace(/[\r\n\t]+/g, ' ');
            if (val.trim() !== '') {
              rawWords.push({ time: pBegin, dur: 0, text: val });
            }
          } else if (node.nodeType === Node.ELEMENT_NODE && (localName === 'span' || localName === 's' || localName.endsWith(':span') || localName.endsWith(':s'))) {
            const sBegin = node.getAttribute('begin') ? parseTTMLTime(node.getAttribute('begin')) : pBegin;
            const sEnd = node.getAttribute('end') ? parseTTMLTime(node.getAttribute('end')) : 0;
            const sDur = node.getAttribute('dur') ? parseTTMLTime(node.getAttribute('dur')) : (sEnd > sBegin ? sEnd - sBegin : 0);
            
            let spanText = node.textContent || '';
            if (spanText) {
              rawWords.push({ time: sBegin, dur: sDur, text: spanText });
            }
          }
        });

        if (rawWords.length === 0) {
          const clean = (p.textContent || '').trim();
          if (clean) {
            const splitWords = clean.split(/\s+/);
            const step = (pEnd > pBegin && splitWords.length > 1) ? (pEnd - pBegin) / splitWords.length : 0.35;
            splitWords.forEach((sw, idx) => {
              rawWords.push({ time: pBegin + idx * step, dur: step, text: sw });
            });
          }
        }

        if (rawWords.length > 0) {
          // Corrección de espaciado para que no se peguen las palabras ("vamos a escribir")
          for (let i = 0; i < rawWords.length - 1; i++) {
            let cur = rawWords[i];
            let next = rawWords[i + 1];

            if (!/\s$/.test(cur.text)) {
              if (!/^\s/.test(next.text) && !/^[.,!?:;)’'\]}]/.test(next.text.trim())) {
                cur.text = cur.text + " ";
              }
            }
          }

          rawLines.push({ time: pBegin, words: rawWords, dur: pEnd > pBegin ? pEnd - pBegin : 0 });
        }
      });

      rawLines.forEach((l, i) => {
        const nTime = (i < rawLines.length - 1) ? rawLines[i + 1].time : l.time + 6;
        if (!l.dur) l.dur = Math.max(0, nTime - l.time);
        for (let j = 0; j < l.words.length; j++) {
          if (!l.words[j].dur || l.words[j].dur <= 0) {
            l.words[j].dur = (j < l.words.length - 1) ? Math.max(0.05, l.words[j + 1].time - l.words[j].time) : Math.min(2.0, nTime - l.words[j].time);
          }
        }
      });

      return rawLines.map(l => ({
        words: l.words.map(w => ({
          startTime: Math.round(w.time * 1000),
          endTime: Math.round((w.time + w.dur) * 1000),
          word: w.text
        })),
        text: l.words.map(w => w.text).join('').trim(),
        translatedLyric: '',
        romanLyric: '',
        startTime: Math.round(l.time * 1000),
        endTime: Math.round((l.time + l.dur) * 1000),
        isBG: false,
        isDuet: false
      }));
    }

    // ============================================================
    // 3. INICIALIZACIÓN DEL MOTOR AMLL CORE (tool.amll.dev)
    // ============================================================
    async function initAMLLPlayer() {
      const LyricPlayerCtor = await window.__AMLLReady;
      if (!LyricPlayerCtor) return null;

      lyricPlayer = new LyricPlayerCtor();
      lyricPlayer.setEnableSpring(true);
      lyricPlayer.setEnableBlur(true);
      lyricPlayer.setEnableScale(true);

      if (typeof lyricPlayer.setWordFadeWidth === 'function') {
        lyricPlayer.setWordFadeWidth(0.5);
      }

      lyricsStage.innerHTML = '';
      lyricsStage.appendChild(lyricPlayer.getElement());

      // Seek al hacer clic en cualquier línea
      lyricPlayer.addEventListener('line-click', (evt) => {
        const lines = lyricPlayer.getLyricLines();
        const line = lines[evt.lineIndex];
        if (line) {
          audio.currentTime = line.startTime / 1000;
          if (audio.paused) togglePlay();
        }
      });

      window.addEventListener('resize', () => {
        if (lyricPlayer) lyricPlayer.calcLayout(true, true);
      });

      return lyricPlayer;
    }

    async function loadLyrics() {
      let xmlText = '';
      try {
        const response = await fetch(TTML_URL);
        xmlText = await response.text();
      } catch (e) {
        // Fallback CORS seguro si se prueba desde archivo local
        const proxyRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(TTML_URL)}`);
        xmlText = await proxyRes.text();
      }

      const parsedLines = parseTTMLToAMLL(xmlText);
      const player = await initAMLLPlayer();
      if (player) {
        player.setLyricLines(parsedLines, audio.currentTime * 1000);
        player.calcLayout(true, true);
      }
    }

    // ============================================================
    // 4. CONTROLADOR DE AUDIO Y LOOP DE ANIMACIÓN A 60 FPS
    // ============================================================
    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          document.body.classList.remove('is-paused');
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        }).catch(() => {});
      } else {
        audio.pause();
        isPlaying = false;
        document.body.classList.add('is-paused');
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    document.getElementById('coverContainer').addEventListener('click', togglePlay);

    prevBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    nextBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(duration, audio.currentTime + 10);
    });

    audio.addEventListener('loadedmetadata', () => {
      if (audio.duration && !isNaN(audio.duration)) {
        duration = audio.duration;
        remainingTimeEl.textContent = `-${formatTime(duration)}`;
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (duration > 0) {
        const pct = (audio.currentTime / duration) * 100;
        progressFill.style.width = `${Math.min(pct, 100)}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        const remSec = Math.max(0, duration - audio.currentTime);
        remainingTimeEl.textContent = `-${formatTime(remSec)}`;
      }
    });

    audio.addEventListener('ended', () => {
      audio.currentTime = 0;
      audio.play();
    });

    // Scrubber
    function handleScrub(e) {
      const rect = progressRail.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const offsetX = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const percentage = offsetX / rect.width;
      audio.currentTime = percentage * duration;
    }

    progressRail.addEventListener('mousedown', (e) => {
      handleScrub(e);
      window.addEventListener('mousemove', handleScrub);
      window.addEventListener('mouseup', () => {
        window.removeEventListener('mousemove', handleScrub);
      }, { once: true });
    });

    // Volumen
    function setVolume(pct) {
      pct = Math.max(0, Math.min(1, pct));
      audio.volume = pct;
      volumeFill.style.width = `${pct * 100}%`;
    }

    volumeRail.addEventListener('click', (e) => {
      const rect = volumeRail.getBoundingClientRect();
      setVolume((e.clientX - rect.left) / rect.width);
    });

    volumeMuteBtn.addEventListener('click', () => {
      if (audio.volume > 0) {
        audio.dataset.prevVol = audio.volume;
        setVolume(0);
      } else {
        setVolume(parseFloat(audio.dataset.prevVol || 0.8));
      }
    });

    // Pantalla completa
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    fullScreenBtn.addEventListener('click', toggleFullScreen);
    zoomToggle.addEventListener('click', toggleFullScreen);

    // Atajos de teclado
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        toggleFullScreen();
      } else if (e.code === 'ArrowRight') {
        audio.currentTime = Math.min(duration, audio.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      } else if (e.code === 'ArrowUp') {
        setVolume(audio.volume + 0.05);
      } else if (e.code === 'ArrowDown') {
        setVolume(audio.volume - 0.05);
      }
    });

    // Loop a 60 FPS coordinando AMLL con el Audio
    function animationLoop(now) {
      if (!lastFrameMs) lastFrameMs = now;
      const deltaMs = Math.min(100, now - lastFrameMs);
      lastFrameMs = now;

      if (lyricPlayer && !audio.paused) {
        const curMs = audio.currentTime * 1000;
        lyricPlayer.setCurrentTime(curMs + 70); // Compensación de latencia visual
        lyricPlayer.update(deltaMs);
      }

      requestAnimationFrame(animationLoop);
    }

    // Inicialización general
    async function init() {
      document.body.classList.add('is-paused');
      
      // 1. Extraer y aplicar colores exclusivamente de la portada
      const palette = await extractCoverPalette(COVER_URL);
      applyCoverColors(palette);

      // 2. Cargar letras TTML con AMLL Core
      await loadLyrics();

      // 3. Iniciar loop visual
      requestAnimationFrame(animationLoop);
    }

    window.onload = init;
  </script>
</body>
